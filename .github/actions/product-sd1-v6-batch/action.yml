    - id: finish
      name: Confirm terminal 1B or genuine RTL serial service-login early stop
      shell: bash
      run: |
        set -euo pipefail
        [[ -n "${V6_LAST_ARTIFACT_ID:-}" && -n "${V6_LAST_ARTIFACT_DIGEST:-}" &&
           -n "${V6_LAST_ARTIFACT_NAME:-}" && -n "${V6_LAST_HOST_SHA:-}" &&
           -n "${V6_LAST_RTL_SHA:-}" && -n "${V6_LAST_CARD_SHA:-}" ]] || exit 16
        [[ "$V6_CURRENT_M" == "$V6_BATCH_END_M" || "${V6_STOP:-0}" == 1 ]] || exit 16
        if [[ "${V6_STOP:-0}" == 1 ]]; then
          [[ -f "$V6_SOURCE_DIR/serial-proof.json" ]] || exit 16
          jq -e '.ordered_service_login_verified==true and .debian_login_claim==false' "$V6_SOURCE_DIR/serial-proof.json" >/dev/null
        fi
        {
          echo "artifact_id=$V6_LAST_ARTIFACT_ID"
          echo "artifact_digest=$V6_LAST_ARTIFACT_DIGEST"
          echo "artifact_name=$V6_LAST_ARTIFACT_NAME"
          echo "host_sha=$V6_LAST_HOST_SHA"
          echo "rtl_sha=$V6_LAST_RTL_SHA"
