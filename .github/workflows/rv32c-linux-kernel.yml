name: RV32C Linux Kernel Qualification

on:
  pull_request:
    paths:
      - Makefile.l32-linux-boot
      - sim/opensbi_boot_main.cpp
      - src/main/scala/aethercore/ElaborateOpenSbiC.scala
      - src/main/scala/aethercore/sim/AetherCoreOpenSbiCSimTop.scala
      - software/l32/**
      - tools/ci/l32_rv32c_kernel_build.sh
      - tools/ci/make_l32_dtb.py
      - tools/ensure_l32_riscv32_linux_gcc.sh
      - tests_py/test_rv32c_linux_kernel_contract.py
      - tests_py/test_rv32c_linux_runtime_contract.py
      - .github/workflows/rv32c-linux-kernel.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv32c-linux-kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: OpenSBI 1.6 + Linux 6.6.143 RV32IMAC
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 90

    steps:
      - name: Checkout without deleting persistent source caches
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Validate RV32C Linux kernel contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/l32_rv32c_kernel_build.sh
          python3 -m py_compile tools/ci/make_l32_dtb.py
          python3 -m unittest \
            tests_py.test_rv32c_linux_kernel_contract \
            tests_py.test_rv32c_linux_runtime_contract -v

      - name: Provision pinned Bootlin RV32 Linux GCC
        shell: bash
        run: bash tools/ensure_l32_riscv32_linux_gcc.sh

      - name: Build unchanged OpenSBI and Linux with C
        shell: bash
        env:
          L32_LINUX_JOBS: "6"
        run: |
          set -euo pipefail
          chmod +x tools/ci/l32_rv32c_kernel_build.sh
          tools/ci/l32_rv32c_kernel_build.sh

      - name: Show exact static qualification result
        shell: bash
        run: |
          set -euo pipefail
          cat build/l32-linux-rv32imac/result.txt
          cat build/l32-linux-rv32imac/evidence/aethercore-rv32imac-dtb.txt
          cat build/l32-linux-rv32imac/evidence/sha256.txt

      - name: Provision fixed Verilator for runtime qualification
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Run real OpenSBI and Linux C execution
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-boot \
            BUILD_DIR=build/l32-linux-rv32imac-probe \
            TOP=AetherCoreOpenSbiCSimTop \
            ELABORATE_MAIN=aethercore.ElaborateOpenSbiC \
            SIM_CXXFLAGS="-std=c++20 -O3 -march=native -DAETHERCORE_L32_C_TOP" \
            FW_BIN=build/l32-linux-rv32imac/opensbi/platform/generic/firmware/fw_payload.bin \
            MAX_CYCLES=50000000 \
            MILESTONE="Linux version 6.6.143" \
            REQUIRE_LAYERED_COMPRESSED=1 \
            JOBS=6 run-local

      - name: Symbolize failed Linux C frontier
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          log=build/l32-linux-rv32imac-probe/logs/boot-probe.log
          elf=build/l32-linux-rv32imac/obj/vmlinux
          out=build/l32-linux-rv32imac-probe/logs/frontier-symbols.txt
          addr2line="${AETHERCORE_L32_LINUX_GCC_ROOT}/bin/riscv32-buildroot-linux-gnu-addr2line"
          objdump="${AETHERCORE_L32_LINUX_GCC_ROOT}/bin/riscv32-buildroot-linux-gnu-objdump"
          mkdir -p "$(dirname "$out")"
          : > "$out"
          timeout_line="$(grep 'L32_OPENSBI_TIMEOUT' "$log" | tail -n 1 || true)"
          {
            echo 'RV32C_LINUX_FRONTIER_SYMBOLS'
            echo "$timeout_line"
          } | tee -a "$out"
          pcs="${timeout_line##*recent-pcs=}"
          if [[ -n "$timeout_line" && "$pcs" != "$timeout_line" && -n "$pcs" ]]; then
            IFS=',' read -r -a pc_array <<< "$pcs"
            for pc in "${pc_array[@]}"; do
              printf '%s ' "$pc" | tee -a "$out"
              "$addr2line" -f -C -e "$elf" "$pc" 2>&1 | tr '\n' ' ' | tee -a "$out" || true
              echo | tee -a "$out"
            done
            last_pc="${pc_array[${#pc_array[@]}-1]}"
            start=$((last_pc & 0xffffff00))
            stop=$((start + 0x200))
            {
              printf 'RV32C_LINUX_FRONTIER_DISASSEMBLY start=0x%x stop=0x%x\n' "$start" "$stop"
              "$objdump" -d --start-address="$start" --stop-address="$stop" "$elf"
            } 2>&1 | tee -a "$out" || true
          else
            echo 'No recent-pcs frontier was present in the runtime log.' | tee -a "$out"
          fi
          exception_pc="$(sed -n 's/.*last-exception-pc=\([^ ]*\).*/\1/p' <<< "$timeout_line")"
          if [[ -n "$exception_pc" ]]; then
            {
              echo "RV32C_LINUX_LAST_EXCEPTION_SYMBOL pc=$exception_pc"
              "$addr2line" -f -C -e "$elf" "$exception_pc"
            } 2>&1 | tee -a "$out" || true
          fi

      - name: Show dynamic C evidence
        shell: bash
        run: |
          set -euo pipefail
          grep 'L32_FIRST_OPENSBI_COMPRESSED' build/l32-linux-rv32imac-probe/logs/boot-probe.log
          grep 'L32_FIRST_LINUX_COMPRESSED' build/l32-linux-rv32imac-probe/logs/boot-probe.log
          grep 'L32_LAYERED_COMPRESSED_PASS' build/l32-linux-rv32imac-probe/logs/boot-probe.log
          grep 'L32_RUNTIME_MILESTONE_PASS' build/l32-linux-rv32imac-probe/logs/boot-probe.log

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32c-linux-kernel-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            build/l32-linux-rv32imac/result.txt
            build/l32-linux-rv32imac/evidence/**
            build/l32-linux-rv32imac/linux-config.log
            build/l32-linux-rv32imac-probe/firmware.sha256
            build/l32-linux-rv32imac-probe/logs/**
