name: Shared Load Translation SoC Area

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/core/v2/TinySharedTranslationLoadUnit.scala'
      - 'src/main/scala/aethercore/core/v2/TinyLoadQueueMemoryBackend.scala'
      - '.github/workflows/shared-load-translation-area.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-load-translation-area-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synth:
    name: Measure target Full SoC LUT4
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys jq
          yosys -V

      - name: Elaborate target Full SoC
        run: |
          set -euo pipefail
          chmod +x mill
          rm -rf build/shared-load-translation-area
          ./mill aethercore.runMain aethercore.ElaborateV2FpgaSoCRV64             --target-dir build/shared-load-translation-area
          find build/shared-load-translation-area -maxdepth 1 -name '*.sv' -print -quit | grep -q .

      - name: Map target Full SoC
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/shared-load-translation-area"
          rm -rf "$out"
          mkdir -p "$out"

          mapfile -t svs < <(find build/shared-load-translation-area -maxdepth 1 -name '*.sv' -print | sort)
          read_cmd="read_verilog -sv -DSYNTHESIS"
          for sv in "${svs[@]}"; do
            read_cmd+=" $sv"
          done

          yosys -Q -p "$read_cmd; hierarchy -check -top AetherCoreV2FpgaSoC; synth_ecp5 -top AetherCoreV2FpgaSoC -json $out/fpga.json; stat -top AetherCoreV2FpgaSoC"             2>&1 | tee "$out/yosys.log"

          jq '[.modules["AetherCoreV2FpgaSoC"].cells[]] | length' "$out/fpga.json" > "$out/cells"
          jq '[.modules["AetherCoreV2FpgaSoC"].cells[] | select(.type == "LUT4")] | length' "$out/fpga.json" > "$out/lut4"
          jq '[.modules["AetherCoreV2FpgaSoC"].cells[] | select(.type == "TRELLIS_FF")] | length' "$out/fpga.json" > "$out/ff"
          jq '[.modules["AetherCoreV2FpgaSoC"].cells[] | select(.type == "DPR16X4")] | length' "$out/fpga.json" > "$out/dpr"
          jq '[.modules["AetherCoreV2FpgaSoC"].cells[] | select(.type == "MULT18X18D")] | length' "$out/fpga.json" > "$out/mult"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "shared-load-translation-area"
          def n(name): return int((root / name).read_text().strip())
          baseline = 64490
          target = n("lut4")
          summary = {
              "baseline_head": "15f8a754acb7b6b3bd7ebf9b85a6dfa14002d8be",
              "baseline_lut4": baseline,
              "target_lut4": target,
              "delta_lut4": target - baseline,
              "delta_percent": (target - baseline) * 100.0 / baseline,
              "cells": n("cells"),
              "ff": n("ff"),
              "distributed_ram_dpr16x4": n("dpr"),
              "mult18x18d": n("mult"),
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Shared Load Translation Full SoC Area\n\n")
              f.write(f"- baseline LUT4: {baseline}\n")
              f.write(f"- target LUT4: {target}\n")
              f.write(f"- delta LUT4: {target-baseline}\n")
              f.write(f"- delta: {summary['delta_percent']:.3f}%\n")
          PY

      - name: Upload area evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-load-translation-area-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/shared-load-translation-area/summary.json
            ${{ runner.temp }}/shared-load-translation-area/yosys.log
