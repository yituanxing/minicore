name: G5 real QEMU DDR unilateral RTL retire window (NOT DiffTest)

on:
  push:
    branches: [experiment/c1-arch-handoff-20261108]
    paths:
      - '.github/workflows/product-c1-g5-real-qemu-ram-retire-window.yml'
      - 'sim/product_c1_g5_qemu_ram_retire_window_main.cpp'
      - 'sim/product_c1_g5_qemu_ram_first_retire_main.cpp'
      - 'tests_py/test_product_c1_g5_qemu_ram_retire_window.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-c1-g5-qemu-ram-retire-window-${{ github.ref }}
  cancel-in-progress: false

jobs:
  genuine-g5-rtl-64-retire-dut-only-observation:
    if: github.ref == 'refs/heads/experiment/c1-arch-handoff-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_VERSION: '5.054'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      VERILATOR_THREADS: '1'
      JOBS: '4'
      OUT: build/product-c1-g5-real-qemu-ram-retire-window
      SOURCE_RUN: '42489471408'
      SOURCE_SHA: 712ad2abbcf825a4d848f8481a8bf4057d493446
      SOURCE_JOB: 'exact-binary-qemu-export / sv39-no-h'
      SOURCE_ARTIFACT_ID: '13621196662'
      SOURCE_ARTIFACT_NAME: product-c1-qemu-fast-arch-source-sv39-no-h-42489471408
      SOURCE_ZIP_SHA256: 2d7be8a7f4440868961c82039fb33be7dc4808655130b6db13de4f5c3e499afb
      SOURCE_RAM_SHA256: 42129f32725e43c1db5bb38b400bb7d593bd92936271d0250e0d5273547810f2

    steps:
      - name: Checkout reviewed experiment commit only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Authenticate original QEMU H-off source run/job/artifact
        run: |
          set -euo pipefail
          mkdir -p "$OUT/logs" "$OUT/source"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/logs/source-run.json"
          jq -e --arg sha "$SOURCE_SHA" --argjson id "$SOURCE_RUN" '
            .id == $id and .run_attempt == 1 and .head_sha == $sha and
            .head_branch == "experiment/c1-arch-handoff-20261108" and
            .event == "push" and .status == "completed" and
            .conclusion == "success" and
            .path == ".github/workflows/product-c1-qemu-fast-export.yml"
          ' "$OUT/logs/source-run.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" > "$OUT/logs/source-jobs.json"
          jq -e --arg job "$SOURCE_JOB" '
            [.jobs[] | select(.name == $job and .conclusion == "success" and
              .status == "completed")] | length == 1
          ' "$OUT/logs/source-jobs.json" > /dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" > "$OUT/logs/source-artifact.json"
          jq -e --arg name "$SOURCE_ARTIFACT_NAME" \
            --arg sha "sha256:$SOURCE_ZIP_SHA256" --argjson id "$SOURCE_ARTIFACT_ID" \
            --argjson run "$SOURCE_RUN" '
            .id == $id and .name == $name and .digest == $sha and
            .expired == false and .workflow_run.id == $run
          ' "$OUT/logs/source-artifact.json" > /dev/null

      - name: Download sealed ZIP and validate exact QEMU RAM plus XPR header
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            -o "$OUT/source.zip"
          test "$(sha256sum "$OUT/source.zip" | cut -d' ' -f1)" == "$SOURCE_ZIP_SHA256"
          unzip -qq "$OUT/source.zip" -d "$OUT/source"
          test "$(stat -c%s "$OUT/source/export/ram-0x80000000-0x10000000.bin")" -eq 268435456
          test "$(sha256sum "$OUT/source/export/ram-0x80000000-0x10000000.bin" | cut -d' ' -f1)" == "$SOURCE_RAM_SHA256"
          python3 tools/ci/product_c1_arch_relay/qemu_ram_first_retire_source.py \
            --source "$OUT/source" --report "$OUT/logs/source-review.json" \
            --gpr-header "$OUT/logs/qemu_captured_gprs.h" \
            2>&1 | tee "$OUT/logs/source-validation.log"

      - name: Restore Scala Mill and Verilator toolchain caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
            ~/.cache/aethercore/toolchains/verilator-5.054
            ~/.cache/aethercore/toolchains/src/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
            ~/.cache/aethercore/toolchains/build/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-g5-qemu-ram-trace-v1-${{ hashFiles('build.mill', 'mill', 'tools/ensure_verilator_5_054.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-g5-qemu-ram-trace-
            aethercore-${{ runner.os }}-${{ runner.arch }}-

      - name: Install hardware compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless python3 bison flex libfl-dev \
            libgmp-dev git curl make zlib1g-dev autoconf cmake ninja-build \
            libssl-dev libelf-dev libreadline-dev pkg-config build-essential unzip

      - name: Ensure exact Verilator version
        run: bash tools/ensure_verilator_5_054.sh

      - name: Elaborate true Product SmallOoO opt-in warm-seed RTL
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-boot \
            BUILD_DIR="$OUT/rtl-seed" \
            TOP=AetherCoreProductDebianWarmSeedRV64SimTop \
            ELABORATE_MAIN=aethercore.sim.ElaborateProductDebianWarmSeedRV64SimTop \
            JOBS=4 rtl
          test -n "$(find "$OUT/rtl-seed/rtl" -maxdepth 1 -name '*.sv' -print -quit)"

      - name: Build genuine G5 Verilator and independent DUT-only window host
        run: |
          set -euo pipefail
          mkdir -p "$OUT/obj"
          verilator --cc --exe --build -O3 -Wall -Wno-fatal \
            --top-module AetherCoreProductDebianWarmSeedRV64SimTop \
            -Mdir "$OUT/obj" \
            -CFLAGS "-std=c++20 -O3 -I$GITHUB_WORKSPACE/sim -I$GITHUB_WORKSPACE/$OUT/logs" \
            -LDFLAGS '-ldl' \
            "$OUT"/rtl-seed/rtl/*.sv \
            "$GITHUB_WORKSPACE/sim/product_c1_g5_qemu_ram_retire_window_main.cpp" \
            -j 4 2>&1 | tee "$OUT/logs/verilator-build.log"

      - name: Observe max 64 RTL retirements (first has QEMU oracle only)
        run: |
          set -euo pipefail
          printf '%s\n' 'ONLY_FIRST_RETIRE_HAS_QEMU_ORACLE; NEXT_63_ARE_DUT_ONLY; NO_FULL_CSR_OR_DEVICE_STATE' \
            > "$OUT/logs/proof-scope.txt"
          timeout --signal=TERM --kill-after=10s 300s \
            "$OUT/obj/VAetherCoreProductDebianWarmSeedRV64SimTop" \
            "$OUT/source/export/ram-0x80000000-0x10000000.bin" 100000 64 \
            2>&1 | tee "$OUT/logs/g5-real-qemu-ram-dut-only-64-retire.log"
          grep -Fq 'G5_REAL_QEMU_RAM_DUT_ONLY_RETIRE_WINDOW_OBSERVED_NOT_DIFFTEST retirements=64' \
            "$OUT/logs/g5-real-qemu-ram-dut-only-64-retire.log"

      - name: Archive bounded logs without copying guest DDR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-c1-g5-real-qemu-ram-dut-only-window-${{ github.run_id }}
          path: |
            build/product-c1-g5-real-qemu-ram-retire-window/logs/**
            build/product-c1-g5-real-qemu-ram-retire-window/rtl-seed/logs/**
          if-no-files-found: warn
          retention-days: 14
