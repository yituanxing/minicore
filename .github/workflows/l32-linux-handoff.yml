name: L32 OpenSBI to Linux Handoff

on:
  pull_request:
    paths:
      - software/l32/linux-freeze.env
      - software/l32/manifest.env
      - tools/ci/l32_linux_build.sh
      - tools/ci/l32_linux_handoff_build.sh
      - tools/ci/l32_linux_cache_key.sh
      - tools/ci/make_l32_dtb.py
      - tools/ensure_l32_riscv32_linux_gcc.sh
      - tools/ensure_verilator_5_024.sh
      - tests_py/test_l32_linux_build_contract.py
      - tests_py/test_l32_linux_handoff_contract.py
      - sim/linux_handoff_main.cpp
      - Makefile.l32-linux-handoff
      - .github/workflows/l32-linux-build.yml
      - .github/workflows/l32-linux-handoff.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l32-linux-handoff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-software:
    name: Produce or restore exact L32 Linux input
    uses: ./.github/workflows/l32-linux-build.yml

  handoff:
    name: Validated OpenSBI to Linux 6.6.143 physical entry
    needs: linux-software
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AETHERCORE_MILL_NO_DAEMON: "1"
      AETHERCORE_VERILATOR_FAST_VERIFY: "1"
      AETHERCORE_TOOLCHAIN_JOBS: "4"

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true

      - name: Install hosted-runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev \
            bison flex bc libssl-dev libelf-dev build-essential \
            libreadline-dev pkg-config curl xz-utils git python3 \
            openjdk-17-jdk-headless device-tree-compiler

      - name: Restore pinned RV32 Linux GCC cache
        id: rv32-gcc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/riscv32-ilp32d--glibc--stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv32-ilp32d--glibc--stable-2024.05-1.tar.xz
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-l32-linux-gcc-v1-${{ hashFiles('tools/ensure_l32_riscv32_linux_gcc.sh', 'software/l32/manifest.env') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-l32-linux-gcc-v1-
            aethercore-${{ runner.os }}-${{ runner.arch }}-toolchains-v1-

      - name: Restore fixed Verilator cache
        id: verilator-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-
            aethercore-${{ runner.os }}-${{ runner.arch }}-toolchains-v1-

      - name: Restore Scala dependency cache
        id: scala-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore pinned OpenSBI source cache
        id: opensbi-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/aethercore/l32/opensbi
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-l32-opensbi-source-v1-${{ hashFiles('software/l32/manifest.env') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-l32-opensbi-source-v1-

      - name: Restore qualified canonical L32 Linux output
        id: linux-cache
        uses: actions/cache@v4
        with:
          path: build/l32-linux
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-l32-linux-qualified-v2-${{ hashFiles('software/l32/manifest.env', 'software/l32/linux-freeze.env', 'tools/ci/l32_linux_build.sh', 'tools/ci/l32_linux_cache_key.sh', 'tools/ensure_l32_riscv32_linux_gcc.sh') }}
          fail-on-cache-miss: true

      - name: Restore exact-head handoff simulation build
        id: handoff-sim-cache
        uses: actions/cache/restore@v4
        with:
          path: build/l32-linux-handoff-probe
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-l32-handoff-sim-v1-${{ env.TARGET_SHA }}-${{ hashFiles('src/main/scala/aethercore/**', 'sim/linux_handoff_main.cpp', 'Makefile.l32-linux-handoff', 'build.mill') }}

      - name: Validate L32-D contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/l32_linux_build.sh
          bash -n tools/ci/l32_linux_handoff_build.sh
          bash -n tools/ci/l32_linux_cache_key.sh
          python3 -m unittest \
            tests_py.test_l32_linux_build_contract \
            tests_py.test_l32_linux_handoff_contract -v

      - name: Provision pinned Bootlin RV32 Linux GCC
        shell: bash
        run: bash tools/ensure_l32_riscv32_linux_gcc.sh

      - name: Save validated RV32 Linux GCC immediately
        if: steps.rv32-gcc-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/riscv32-ilp32d--glibc--stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv32-ilp32d--glibc--stable-2024.05-1.tar.xz
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-l32-linux-gcc-v1-${{ hashFiles('tools/ensure_l32_riscv32_linux_gcc.sh', 'software/l32/manifest.env') }}

      - name: Restore or verify canonical Linux software image
        shell: bash
        run: |
          set -euo pipefail
          tools/ci/l32_linux_cache_key.sh check build/l32-linux
          source software/l32/linux-freeze.env
          echo "${L32_LINUX_IMAGE_SHA256}  build/l32-linux/obj/arch/riscv/boot/Image" | sha256sum -c -
          echo "${L32_LINUX_VMLINUX_SHA256}  build/l32-linux/obj/vmlinux" | sha256sum -c -
          echo "${L32_LINUX_CONFIG_SHA256}  build/l32-linux/evidence/resolved.config" | sha256sum -c -

      - name: Build Linux-bearing OpenSBI payload
        id: payload_build
        continue-on-error: true
        shell: bash
        env:
          L32_HANDOFF_JOBS: "4"
        run: |
          set -euo pipefail
          bash tools/ci/l32_linux_handoff_build.sh

      - name: Validate reusable OpenSBI source
        id: opensbi_source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          source software/l32/manifest.env
          source_dir="$HOME/.cache/aethercore/l32/opensbi/${OPENSBI_COMMIT}"
          valid=false
          if [[ -d "$source_dir/.git" ]] \
             && [[ "$(git -C "$source_dir" rev-parse HEAD 2>/dev/null || true)" == "$OPENSBI_COMMIT" ]] \
             && git -C "$source_dir" diff --quiet --ignore-submodules --; then
            valid=true
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          echo "validated_opensbi_source=$valid"

      - name: Save validated OpenSBI source immediately
        if: always() && steps.opensbi_source.outputs.valid == 'true' && steps.opensbi-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/aethercore/l32/opensbi
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-l32-opensbi-source-v1-${{ hashFiles('software/l32/manifest.env') }}

      - name: Provision fixed Verilator
        if: steps.payload_build.outcome == 'success'
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Save fixed Verilator immediately
        if: steps.payload_build.outcome == 'success' && steps.verilator-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}

      - name: Run real OpenSBI to Linux handoff probe
        id: handoff_probe
        if: steps.payload_build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-handoff JOBS="$(nproc)" MAX_CYCLES=12000000 run-local

      - name: Save Scala dependencies after handoff elaboration
        if: always() && steps.handoff_probe.outcome != 'skipped' && steps.scala-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}

      - name: Save exact-head handoff simulation build
        if: always() && steps.handoff_probe.outcome != 'skipped' && steps.handoff-sim-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/l32-linux-handoff-probe
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-l32-handoff-sim-v1-${{ env.TARGET_SHA }}-${{ hashFiles('src/main/scala/aethercore/**', 'sim/linux_handoff_main.cpp', 'Makefile.l32-linux-handoff', 'build.mill') }}

      - name: Write hosted-cache summary
        if: always()
        shell: bash
        run: |
          {
            echo '## L32 OpenSBI/Linux hosted handoff cache'
            echo
            echo "- RV32 GCC exact cache hit: \`${{ steps.rv32-gcc-cache.outputs.cache-hit }}\`"
            echo "- fixed Verilator exact cache hit: \`${{ steps.verilator-cache.outputs.cache-hit }}\`"
            echo "- Scala dependency cache hit: \`${{ steps.scala-cache.outputs.cache-hit }}\`"
            echo "- OpenSBI source cache hit: \`${{ steps.opensbi-cache.outputs.cache-hit }}\`"
            echo "- canonical Linux qualified cache hit: \`${{ steps.linux-cache.outputs.cache-hit }}\`"
            echo "- exact-head simulation cache hit: \`${{ steps.handoff-sim-cache.outputs.cache-hit }}\`"
            echo "- OpenSBI payload build: \`${{ steps.payload_build.outcome }}\`"
            echo "- real handoff probe: \`${{ steps.handoff_probe.outcome }}\`"
            echo '- canonical Linux production is owned by the reusable L32 Linux workflow; this consumer only accepts its exact frozen output hashes'
            echo '- restored OpenSBI, GCC and Verilator payloads are revalidated by repository-owned commit/version/SHA contracts before use'
            echo '- exact-head simulation cache is only a build accelerator; the real OpenSBI to Linux physical-entry probe still executes every qualification run'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload L32-D handoff evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-l32-linux-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/l32-linux/result.txt
            build/l32-linux/evidence/
            build/l32-linux-handoff/result.txt
            build/l32-linux-handoff/opensbi-linux-build.log
            build/l32-linux-handoff/aethercore-rv32.dtb
            build/l32-linux-handoff/evidence/
            build/l32-linux-handoff/opensbi/platform/generic/firmware/fw_payload.elf
            build/l32-linux-handoff/opensbi/platform/generic/firmware/fw_payload.bin
            build/l32-linux-handoff-probe/firmware.sha256
            build/l32-linux-handoff-probe/logs/*.log

      - name: Propagate OpenSBI payload build failure after preserving caches
        if: steps.payload_build.outcome == 'failure'
        shell: bash
        run: |
          echo 'ERROR: L32 OpenSBI/Linux payload build failed after validated prerequisite caches were preserved.' >&2
          exit 1

      - name: Propagate real handoff probe failure after preserving simulator cache
        if: steps.handoff_probe.outcome == 'failure'
        shell: bash
        run: |
          echo 'ERROR: real L32 OpenSBI to Linux handoff proof failed; exact-head simulator build was preserved only as an accelerator.' >&2
          exit 1
