name: Verified archive integrated agent sweep (2026-11-04)
on:
  push:
    branches:
      - maintenance/verified-branch-prune-20261104
    paths:
      - .github/workflows/verified-archive-integrated-agent-sweep-20261104.yml
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: verified-agent-sweep-20261104
  cancel-in-progress: false
jobs:
  exact-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fully preflight then archive exact five integrated branch tips
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const maint='maintenance/verified-branch-prune-20261104';
            if(owner!=='yituanxing'||repo!=='minicore'||context.ref!=='refs/heads/'+maint)
              throw new Error('Unexpected execution context');
            const main='7ff35c6acdc3068754292bba814e4ec52ba4ec50';
            const product='087a3ed9588cfe4ff99b682957f3adbe70230aa';
            const prefix='branch-archive/2026-11-04/integrated-agent-sweep-01/';
            const targets=[
              ['agent/l32-clean-rebuild','b0ae419f97abfc6654b2963c669a97b36973f16d'],
              ['agent/l32-csr-fast-tests','810474bc841d0889eefc67e4fa02ccb0aeb25a4d'],
              ['agent/l32-mstatush','f451bc4ff5c5ad26faa2d061f314abe0b1dfe4d5'],
              ['agent/l32-scounteren','7c5f9da539e7f4d0bf1d153f045a071a3ffd6a34'],
              ['agent/n5-sstc-integration','06cad804a916fee5c916cc575d3e91726c01a35e']
            ];
            const retry=async(name,fn)=>{
              for(let attempt=0;attempt<5;attempt++){
                try{return await fn();}
                catch(e){
                  const transient=e.status===429||e.status>=500||/fetch failed|ECONNRESET|ETIMEDOUT|socket hang up/i.test(String(e.message||''));
                  if(!transient||attempt===4)throw e;
                  await new Promise(resolve=>setTimeout(resolve,400*(2**attempt)));
                }
              }
            };
            const ref=async x=>(await retry('ref '+x,()=>github.rest.git.getRef({owner,repo,ref:x}))).data;
            const pin=async()=>{
              const actualMain=(await ref('heads/main')).object.sha;
              const actualProduct=(await ref('heads/design/rv64gc-product-architecture-20261103')).object.sha;
              console.log('PIN_SNAPSHOT','main='+actualMain,'Product='+actualProduct);
              if(actualMain!==main||actualProduct!==product)
                throw new Error('Protected main or Product moved: '+actualMain+' / '+actualProduct);
            };
            await pin();
            const open=await retry('open PRs',()=>github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100}));
            const active=[];
            for(const status of ['queued','in_progress','waiting','pending','requested']){
              const runs=await retry('active '+status,()=>github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,status,per_page:100}));
              active.push(...runs);
            }
            for(const [name,sha] of targets){
              const branch=(await retry('branch '+name,()=>github.rest.repos.getBranch({owner,repo,branch:name}))).data;
              if(branch.protected||branch.commit.sha!==sha)throw new Error('Tip/protection mismatch '+name);
              if(open.some(p=>p.head.ref===name||p.base.ref===name))
                throw new Error('Open PR depends on '+name);
              const cmp=(await retry('compare '+name,()=>github.rest.repos.compareCommits({owner,repo,base:sha,head:main}))).data;
              if(!['ahead','identical'].includes(cmp.status)||cmp.behind_by!==0)
                throw new Error('Branch not fully present in main '+name);
              if(active.some(r=>r.head_branch===name||(r.pull_requests||[]).some(p=>p.head?.ref===name)))
                throw new Error('Active CI on '+name);
              try{
                const tag=await ref('tags/'+prefix+name);
                if(tag.object.sha!==sha)throw new Error('Conflicting archive '+name);
              }catch(e){if(e.status!==404)throw e;}
              console.log('SAFE_PREFLIGHT',name,sha,'in_main',cmp.status);
            }
            console.log('PREFLIGHT_ALL_PASS',targets.length);
            await pin();
            let created=0,previous=0;
            for(const [name,sha] of targets){
              await pin();
              if((await ref('heads/'+name)).object.sha!==sha)throw new Error('Branch moved '+name);
              const tagName='tags/'+prefix+name;
              let exists=false;
              try{const x=await ref(tagName);if(x.object.sha!==sha)throw new Error('Archive changed '+name);exists=true;}
              catch(e){if(e.status!==404)throw e;}
              if(!exists){
                await github.rest.git.createRef({owner,repo,ref:'refs/'+tagName,sha});
                created++;
              }else previous++;
              if((await ref(tagName)).object.sha!==sha)throw new Error('Archive verification failed '+name);
              console.log('ARCHIVE_VERIFIED',name,sha);
            }
            console.log('AGENT_SWEEP_ARCHIVE_DONE','verified='+targets.length,'new_tags='+created,'existing='+previous,'branches_deleted=0');
