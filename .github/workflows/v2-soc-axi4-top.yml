name: AetherSoC AXI4 Top Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/soc/AetherCoreV2Axi4SoC.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2UnifiedMemorySoC.scala'
      - 'src/main/scala/aethercore/soc/AetherSoCBootRom.scala'
      - 'src/main/scala/aethercore/soc/AetherSoCPlatformFabric.scala'
      - 'src/main/scala/aethercore/ElaborateV2Axi4SoC.scala'
      - 'tests_py/test_v2_soc_axi4_top.py'
      - '.github/workflows/v2-soc-axi4-top.yml'

permissions:
  contents: read

concurrency:
  group: aethersoc-axi4-top-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  elaborate:
    name: Elaborate FPGA-facing AXI4 AetherSoC
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Check AXI4 SoC source contract
        run: |
          python3 -m unittest tests_py.test_v2_soc_axi4_bridge -v
          python3 -m unittest tests_py.test_v2_soc_axi4_top -v

      - name: Elaborate AXI4 SoC
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          rm -rf build/soc-axi4-top
          ./mill aethercore.runMain aethercore.ElaborateV2Axi4SoCRV64             --target-dir build/soc-axi4-top
          find build/soc-axi4-top -maxdepth 1 -name '*.sv' -print -quit | grep -q .
