name: AetherSoC AXI4 Linux Path Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/sim/AetherSoCAxi4HostMemoryAdapter.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2Axi4CompatSimTop.scala'
      - 'src/main/scala/aethercore/ElaborateV2Axi4LinuxCompatRV64.scala'
      - 'tests_py/test_v2_soc_axi4_linux_path.py'
      - '.github/workflows/v2-soc-axi4-linux-path.yml'

permissions:
  contents: read

concurrency:
  group: aethersoc-axi4-linux-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  elaborate:
    name: Elaborate Linux top through AXI4 AetherSoC
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Check AXI4 Linux path contracts
        run: |
          python3 -m unittest tests_py.test_v2_soc_axi4_bridge -v
          python3 -m unittest tests_py.test_v2_soc_axi4_top -v
          python3 -m unittest tests_py.test_v2_soc_axi4_linux_path -v

      - name: Elaborate AXI4 Linux compatibility top
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          rm -rf build/soc-axi4-linux-path
          ./mill aethercore.runMain aethercore.ElaborateV2Axi4LinuxCompatRV64             --target-dir build/soc-axi4-linux-path
          find build/soc-axi4-linux-path -maxdepth 1 -name '*.sv' -print -quit | grep -q .
