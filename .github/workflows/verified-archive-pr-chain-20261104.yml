            const getRef=async ref=>(await github.rest.git.getRef({owner,repo,ref})).data;
            const expectPins=async()=>{
              const main=(await getRef('heads/main')).object.sha;
              const productSHA=(await getRef('heads/'+product)).object.sha;
              if(main!==expectedMain||productSHA!==expectedProduct)
                throw new Error('Main or Product moved: '+main+' / '+productSHA);
              return main;
            };
            const main=await expectPins();
            const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const prsByNum=new Map(prs.map(p=>[p.number,p]));
            const existing=new Set();
            for(let i=0;i<plan.length;i++){
              const [number,name,sha]=plan[i];
              const p=prsByNum.get(number);
              const expectedBase=i+1<plan.length?plan[i+1][1]:'test/l32-linux-real-programs';
              if(!p||p.state!=='open'||p.head.ref!==name||p.head.sha!==sha||
                 !p.head.repo||p.head.repo.full_name!==owner+'/'+repo||p.base.ref!==expectedBase)
                throw new Error('Changed PR identity/head/base: #'+number+' '+name);
              const b=(await github.rest.repos.getBranch({owner,repo,branch:name})).data;
              if(b.commit.sha!==sha)throw new Error('Head moved: '+name);
              const cmp=(await github.rest.repos.compareCommits({owner,repo,base:sha,head:main})).data;
              if(!['ahead','identical'].includes(cmp.status)||cmp.behind_by!==0)
                throw new Error('Commit not in main ancestry: '+number);
              const tag=prefix+name;
              try{
                const old=await getRef('tags/'+tag);
                if(old.object.sha!==sha)throw new Error('Archive SHA collision: '+tag);
                existing.add(tag);
              }catch(e){if(e.status!==404)throw e;}
              console.log('PREFLIGHT_PASS',number,name,sha,'base',expectedBase,
                          existing.has(tag)?'tag-exists':'tag-new');
            }
            console.log('PREFLIGHT_ALL_PASS',plan.length,'openPRs',prs.length,'existing',existing.size);
            await expectPins();
            let created=0;
            for(const [number,name,sha] of plan){
              const tag=prefix+name;
              const current=(await getRef('heads/'+name)).object.sha;
              if(current!==sha)throw new Error('Branch moved before archive: '+name);
              const pr=(await github.rest.pulls.get({owner,repo,pull_number:number})).data;
              if(pr.state!=='open'||pr.head.sha!==sha||pr.head.ref!==name)
                throw new Error('PR changed before archive: '+number);
              if(!existing.has(tag)){
                await github.rest.git.createRef({owner,repo,ref:'refs/tags/'+tag,sha});
                created++;
              }
              const stored=(await getRef('tags/'+tag)).object.sha;
              if(stored!==sha)throw new Error('Archive verification failed: '+name);
              console.log('ARCHIVE_VERIFIED',number,tag,sha);
            }
            await expectPins();
            console.log('CHAIN_ARCHIVE_DONE', 'verified='+plan.length,'new_tags='+created,
                        'previous_tags='+existing.size,'PRs_closed=0','branches_deleted=0');
