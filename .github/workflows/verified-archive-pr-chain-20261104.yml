name: Archive 44 integrated PR chain tips without modifying PRs (2026-11-04)
on:
  push:
    branches:
      - maintenance/verified-branch-prune-20261104
    paths:
      - .github/workflows/verified-archive-pr-chain-20261104.yml
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: archive-pr-chain-125-74-20261104
  cancel-in-progress: false
jobs:
  archive-only:
    name: Verify and archive exact tips of 44 linked PRs
