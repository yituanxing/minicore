name: L32 Linux First Boot

on:
  pull_request:
    paths:
      - software/l32/linux-runtime.env
      - software/l32/manifest.env
      - tools/ci/l32_linux_fw_payload.sh
      - tools/ci/l32_linux_build.sh
      - tools/ci/l32_linux_cache_key.sh
      - tools/ci/l32_opensbi_build.sh
      - tools/ci/make_l32_dtb.py
      - tools/ensure_l32_riscv32_linux_gcc.sh
      - tools/ensure_verilator_5_024.sh
      - tests_py/test_l32_linux_boot_contract.py
      - Makefile.l32-linux-probe
      - sim/linux_boot_main.cpp
      - src/main/scala/aethercore/ElaborateOpenSbi.scala
      - src/main/scala/aethercore/sim/AetherCoreOpenSbiSimTop.scala
      - src/main/scala/aethercore/sim/AetherCoreSimTop.scala
      - src/main/scala/aethercore/config/CoreConfig.scala
      - src/main/scala/aethercore/core/**
      - .github/workflows/l32-linux-boot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l32-linux-boot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-first-boot:
    name: Frozen OpenSBI plus Linux 6.6.143 first execution
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 30

    steps:
      - name: Checkout without deleting persistent outputs
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Validate Linux first-boot contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/l32_opensbi_build.sh
          bash -n tools/ci/l32_linux_fw_payload.sh
          bash -n tools/ci/l32_linux_build.sh
          bash -n tools/ci/l32_linux_cache_key.sh
          python3 -m unittest tests_py.test_l32_linux_boot_contract -v

      - name: Provision pinned Bootlin RV32 Linux GCC
        shell: bash
        run: bash tools/ensure_l32_riscv32_linux_gcc.sh

      - name: Prepare exact OpenSBI plus frozen Linux payload
        shell: bash
        env:
          L32_JOBS: "6"
        run: |
          set -euo pipefail
          chmod +x tools/ci/l32_opensbi_build.sh
          chmod +x tools/ci/l32_linux_fw_payload.sh
          bash tools/ci/l32_linux_fw_payload.sh

      - name: Provision fixed Verilator for Linux execution
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Run real Linux 6.6.143 first-boot probe
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-probe \
            JOBS="$(nproc)" MAX_CYCLES=100000000 run-local

      - name: Upload L32 Linux first-boot evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-l32-linux-boot-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/l32-linux-opensbi/result.txt
            build/l32-linux-opensbi/linux-payload-result.txt
            build/l32-linux-opensbi/opensbi-build.log
            build/l32-linux-opensbi/aethercore-rv32.dtb
            build/l32-linux-opensbi/evidence/
            build/l32-linux-opensbi/build/platform/generic/firmware/fw_payload.elf
            build/l32-linux-opensbi/build/platform/generic/firmware/fw_payload.bin
            build/l32-linux-probe/firmware.sha256
            build/l32-linux-probe/logs/
