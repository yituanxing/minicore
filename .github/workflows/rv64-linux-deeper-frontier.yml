name: RV64 Linux Deeper Frontier

on:
  push:
    branches:
      - explore/rv64-linux-deeper-v1
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rv64-linux-deeper-frontier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontier:
    name: Unchanged Linux post-timer retirement frontier
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Checkout exact head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ -d .git ]]; then
            git clean -fdx || true
          else
            git init .
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags --prune --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$TARGET_SHA" ]] || {
            echo "ERROR: exact-head checkout mismatch: expected=$TARGET_SHA actual=$actual" >&2
            exit 1
          }
          chmod +x ./mill
          echo "exact_head=$actual"

      - name: Publish pending frontier status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(printf '{\"state\":\"pending\",\"context\":\"rv64-linux-deeper-frontier/qualification\",\"description\":\"Hosted RV64 Linux deeper frontier running\",\"target_url\":\"%s/%s/actions/runs/%s\"}' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "$payload"

      - name: Install hosted-runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev \
            bison flex bc libssl-dev libelf-dev build-essential \
            curl xz-utils git python3 openjdk-17-jdk-headless \
            device-tree-compiler dwarves

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Provision pinned RV64 Linux-target GCC
        shell: bash
        run: bash tools/ensure_riscv64_linux_gcc_13_3.sh

      - name: Build unchanged Linux 6.6.143 and unchanged OpenSBI 1.6
        shell: bash
        env:
          RV64_LINUX_JOBS: '4'
        run: |
          set -euo pipefail
          bash tools/ci/rv64_linux_early_build.sh
          grep -q '^RV64_LINUX_EARLY_BUILD_RESULT: status=PASS$' build/rv64-linux-early/result.txt

      - name: Discover post-timer Linux retirement frontier
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-boot \
            BUILD_DIR=build/rv64-linux-deeper-frontier \
            TOP=AetherCoreOpenSbiRV64SimTop \
            ELABORATE_MAIN=aethercore.ElaborateOpenSbiRV64 \
            FW_BIN=build/rv64-linux-early/opensbi/platform/generic/firmware/fw_payload.bin \
            MAX_CYCLES=120000000 \
            MILESTONE='Linux version 6.6.143' \
            MIN_INTERRUPTS=1 \
            MIN_STIP=1 \
            MIN_POST_MILESTONE_COMMITS=30000000 \
            PROGRESS_INTERVAL_CYCLES=10000000 \
            VERILATOR='verilator -LDFLAGS -ldl' \
            SIM_CXXFLAGS="-std=c++20 -O3 -march=native -I$GITHUB_WORKSPACE/sim/rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim" \
            JOBS=4 \
            run-local

          log=build/rv64-linux-deeper-frontier/logs/boot-probe.log
          grep -Fq 'OpenSBI v1.6' "$log"
          grep -Fq '[    0.000000] Linux version 6.6.143' "$log"
          grep -Fq 'L32_FIRST_SUPERVISOR_TIMER_INTERRUPT' "$log"
          grep -Eq 'L32_RUNTIME_MILESTONE_PASS .*min-post-milestone-commits=30000000 .*post-milestone-commits=30000000' "$log"

          echo '--- deepest Linux UART lines ---'
          grep -E '^\[[[:space:]]*[0-9]+\.[0-9]+\]' "$log" | tail -n 80 || true
          echo '--- runtime markers ---'
          grep -E '^L32_|L32_' "$log" | tail -n 40 || true

      - name: Publish successful frontier status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(printf '{\"state\":\"success\",\"context\":\"rv64-linux-deeper-frontier/qualification\",\"description\":\"Hosted RV64 Linux deeper frontier passed\",\"target_url\":\"%s/%s/actions/runs/%s\"}' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "$payload"

      - name: Publish failed frontier status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(printf '{\"state\":\"failure\",\"context\":\"rv64-linux-deeper-frontier/qualification\",\"description\":\"Hosted RV64 Linux deeper frontier failed\",\"target_url\":\"%s/%s/actions/runs/%s\"}' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "$payload" || true

      - name: Write frontier summary
        if: always()
        shell: bash
        run: |
          {
            echo '## RV64 Linux Deeper Frontier'
            echo
            echo "- exact head: \`${TARGET_SHA}\`"
            echo '- execution: GitHub-hosted Ubuntu 24.04, independent of the self-hosted backlog'
            echo '- real software: unchanged OpenSBI 1.6 + unchanged Linux 6.6.143'
            echo '- baseline: Linux banner + at least one retired Supervisor timer interrupt'
            echo '- frontier requirement: 30,000,000 additional retired instructions after the Linux banner'
            echo '- no PR regression fan-out is attached to this exploration branch'
          } >> "$GITHUB_STEP_SUMMARY"
