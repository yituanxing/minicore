name: AetherCore V2 Yosys Logic-Depth A/B

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/core/v2/**'
      - 'src/main/scala/aethercore/ElaborateV2CoreSynthesisRV64.scala'
      - '.github/workflows/v2-yosys-depth-ab.yml'
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Exact baseline commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aethercore-v2-yosys-depth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure-base:
    name: Measure exact PR base
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASELINE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseline_sha }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout target with baseline history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          clean: true

      - name: Verify exact baseline identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git merge-base --is-ancestor "$BASELINE_SHA" "$TARGET_SHA"

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install synthesis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys jq
          yosys -V
          yosys -Q -p 'help ltp' | grep -q -- '-noff'

      - name: Elaborate and measure exact baseline
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aethercore-v2-depth-base"
          out="$GITHUB_WORKSPACE/build/v2-yosys-depth/base"
          rm -rf "$work" "$out"
          mkdir -p "$out/rtl" "$out/mill"

          git worktree add --detach "$work" "$BASELINE_SHA"
          cp src/main/scala/aethercore/ElaborateV2CoreSynthesisRV64.scala              "$work/src/main/scala/aethercore/ElaborateV2CoreSynthesisRV64.scala"
          chmod +x "$work/mill"

          (
            cd "$work"
            MILL_OUTPUT_DIR="$out/mill" ./mill aethercore.runMain               aethercore.ElaborateV2CoreSynthesisRV64 --target-dir "$out/rtl"
          )

          mapfile -t svs < <(find "$out/rtl" -maxdepth 1 -name '*.sv' -print | sort)
          test "${#svs[@]}" -gt 0
          read_cmd="read_verilog -sv -DSYNTHESIS"
          for sv in "${svs[@]}"; do read_cmd+=" $sv"; done

          yosys -Q -p "$read_cmd; hierarchy -check -top TinyPagedCore; synth_ecp5 -top TinyPagedCore -json $out/netlist.json; stat -top TinyPagedCore; flatten; ltp -noff TinyPagedCore"             2>&1 | tee "$out/yosys.log"

          grep -E 'Longest topological path|Executing LTP|Warning.*loop' "$out/yosys.log" > "$out/ltp.log" || true
          depth=$(sed -n 's/.*Longest topological path in TinyPagedCore (length=\([0-9][0-9]*\)).*/\1/p' "$out/yosys.log" | tail -1)
          test -n "$depth"
          printf '%s\n' "$depth" > "$out/depth"
          jq '[.modules["TinyPagedCore"].cells[]] | length' "$out/netlist.json" > "$out/cells"
          jq '[.modules["TinyPagedCore"].cells[] | select(.type == "LUT4")] | length' "$out/netlist.json" > "$out/lut4"
          jq '[.modules["TinyPagedCore"].cells[] | select(.type == "TRELLIS_FF")] | length' "$out/netlist.json" > "$out/ff"

      - name: Upload exact baseline structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-v2-yosys-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/v2-yosys-depth/base/depth
            build/v2-yosys-depth/base/cells
            build/v2-yosys-depth/base/lut4
            build/v2-yosys-depth/base/ff
            build/v2-yosys-depth/base/yosys.log
            build/v2-yosys-depth/base/ltp.log
          if-no-files-found: error

  measure-target:
    name: Measure exact target
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true

      - name: Verify exact target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install synthesis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys jq
          yosys -V
          yosys -Q -p 'help ltp' | grep -q -- '-noff'

      - name: Elaborate and measure exact target
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/build/v2-yosys-depth/target"
          rm -rf "$out"
          mkdir -p "$out/rtl" "$out/mill"
          chmod +x ./mill

          MILL_OUTPUT_DIR="$out/mill" ./mill aethercore.runMain             aethercore.ElaborateV2CoreSynthesisRV64 --target-dir "$out/rtl"

          mapfile -t svs < <(find "$out/rtl" -maxdepth 1 -name '*.sv' -print | sort)
          test "${#svs[@]}" -gt 0
          read_cmd="read_verilog -sv -DSYNTHESIS"
          for sv in "${svs[@]}"; do read_cmd+=" $sv"; done

          yosys -Q -p "$read_cmd; hierarchy -check -top TinyPagedCore; synth_ecp5 -top TinyPagedCore -json $out/netlist.json; stat -top TinyPagedCore; flatten; ltp -noff TinyPagedCore"             2>&1 | tee "$out/yosys.log"

          grep -E 'Longest topological path|Executing LTP|Warning.*loop' "$out/yosys.log" > "$out/ltp.log" || true
          depth=$(sed -n 's/.*Longest topological path in TinyPagedCore (length=\([0-9][0-9]*\)).*/\1/p' "$out/yosys.log" | tail -1)
          test -n "$depth"
          printf '%s\n' "$depth" > "$out/depth"
          jq '[.modules["TinyPagedCore"].cells[]] | length' "$out/netlist.json" > "$out/cells"
          jq '[.modules["TinyPagedCore"].cells[] | select(.type == "LUT4")] | length' "$out/netlist.json" > "$out/lut4"
          jq '[.modules["TinyPagedCore"].cells[] | select(.type == "TRELLIS_FF")] | length' "$out/netlist.json" > "$out/ff"

      - name: Upload exact target structural evidence
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-v2-yosys-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/v2-yosys-depth/target/depth
            build/v2-yosys-depth/target/cells
            build/v2-yosys-depth/target/lut4
            build/v2-yosys-depth/target/ff
            build/v2-yosys-depth/target/yosys.log
            build/v2-yosys-depth/target/ltp.log
          if-no-files-found: error

  aggregate:
    name: Aggregate exact structural-cost A/B
    needs: [measure-base, measure-target]
    runs-on: ubuntu-24.04
    env:
      BASELINE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseline_sha }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Download baseline evidence
        uses: actions/download-artifact@v4
        with:
          name: aethercore-v2-yosys-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/v2-yosys-depth/base

      - name: Download target evidence
        uses: actions/download-artifact@v4
        with:
          name: aethercore-v2-yosys-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/v2-yosys-depth/target

      - name: Summarize exact structural-cost A/B
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('build/v2-yosys-depth')
          def integer(side, name):
              return int((root / side / name).read_text().strip())
          def pct(new, old):
              return ((new / old) - 1.0) * 100.0 if old else None

          base_depth = integer('base', 'depth')
          target_depth = integer('target', 'depth')
          base_cells = integer('base', 'cells')
          target_cells = integer('target', 'cells')
          base_lut = integer('base', 'lut4')
          target_lut = integer('target', 'lut4')
          base_ff = integer('base', 'ff')
          target_ff = integer('target', 'ff')

          summary = {
              'baseline_sha': os.environ['BASELINE_SHA'],
              'target_sha': os.environ['TARGET_SHA'],
              'proxy': 'Yosys synth_ecp5 mapped netlist + flatten + ltp -noff',
              'base_logic_depth': base_depth,
              'target_logic_depth': target_depth,
              'logic_depth_delta': target_depth - base_depth,
              'logic_depth_delta_pct': pct(target_depth, base_depth),
              'base_cells': base_cells,
              'target_cells': target_cells,
              'cells_delta_pct': pct(target_cells, base_cells),
              'base_lut4': base_lut,
              'target_lut4': target_lut,
              'lut4_delta_pct': pct(target_lut, base_lut),
              'base_ff': base_ff,
              'target_ff': target_ff,
              'ff_delta_pct': pct(target_ff, base_ff),
              'note': (
                  'Structural-cost evidence only. Performance speedup and break-even '
                  'frequency must come from the matching Architecture A/B result.'
              ),
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## AetherCore v2 exact PR-base -> target structural-cost A/B\n\n')
              f.write(f"Baseline \`{summary['baseline_sha']}\` -> target \`{summary['target_sha']}\`\n\n")
              f.write(f"- mapped combinational depth: {base_depth} -> {target_depth} ({target_depth-base_depth:+d} levels, {summary['logic_depth_delta_pct']:+.3f}%)\n")
              f.write(f"- cells: {base_cells} -> {target_cells} ({summary['cells_delta_pct']:+.3f}%)\n")
              f.write(f"- LUT4: {base_lut} -> {target_lut} ({summary['lut4_delta_pct']:+.3f}%)\n")
              f.write(f"- FF: {base_ff} -> {target_ff} ({summary['ff_delta_pct']:+.3f}%)\n")
              f.write('- Structural proxy only; do not convert logic-depth delta directly into Fmax.\n')
              f.write('- Combine this result with the matching Architecture A/B speedup when making GO/NO-GO decisions.\n')
          PY

      - name: Upload aggregate structural-cost evidence
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-v2-yosys-depth-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/v2-yosys-depth/summary.json
            build/v2-yosys-depth/base/yosys.log
            build/v2-yosys-depth/base/ltp.log
            build/v2-yosys-depth/target/yosys.log
            build/v2-yosys-depth/target/ltp.log
          if-no-files-found: error
