name: AetherCore V2 Yosys Logic-Depth A/B

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/core/v2/**'
      - 'src/main/scala/aethercore/ElaborateV2CoreSynthesisRV64.scala'
      - '.github/workflows/v2-yosys-depth-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-v2-yosys-depth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yosys-depth-ab:
    name: Exact-parent Yosys logic-depth proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASELINE_SHA: ${{ github.event.pull_request.base.sha || 'ed3580ba59b8c8238f4123bd8f139054b53dde9c' }}
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          clean: true

      - name: Verify exact comparison identity
        shell: bash
        run: |
          set -euo pipefail
          echo "baseline=$BASELINE_SHA"
          echo "target=$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git merge-base --is-ancestor "$BASELINE_SHA" "$TARGET_SHA"

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install synthesis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys jq
          yosys -V
          yosys -Q -p 'help ltp' | grep -q -- '-noff'

      - name: Create exact baseline worktree
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/aethercore-v2-depth-base"
          rm -rf "$base"
          git worktree add --detach "$base" "$BASELINE_SHA"
          cp src/main/scala/aethercore/ElaborateV2CoreSynthesisRV64.scala \
             "$base/src/main/scala/aethercore/ElaborateV2CoreSynthesisRV64.scala"
          chmod +x mill "$base/mill"
          echo "BASE_DIR=$base" >> "$GITHUB_ENV"

      - name: Elaborate exact baseline and target cores
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/aethercore-v2-yosys-depth"
          rm -rf "$out"
          mkdir -p "$out/base-rtl" "$out/target-rtl" "$out/base-mill" "$out/target-mill"
          echo "DEPTH_OUT=$out" >> "$GITHUB_ENV"

          (
            cd "$BASE_DIR"
            MILL_OUTPUT_DIR="$out/base-mill" ./mill aethercore.runMain \
              aethercore.ElaborateV2CoreSynthesisRV64 --target-dir "$out/base-rtl"
          )
          MILL_OUTPUT_DIR="$out/target-mill" ./mill aethercore.runMain \
            aethercore.ElaborateV2CoreSynthesisRV64 --target-dir "$out/target-rtl"

          find "$out/base-rtl" -maxdepth 1 -name '*.sv' -print -quit | grep -q .
          find "$out/target-rtl" -maxdepth 1 -name '*.sv' -print -quit | grep -q .

      - name: Synthesize and measure combinational depth
        shell: bash
        run: |
          set -euo pipefail

          measure_one() {
            label="$1"
            rtl="$DEPTH_OUT/$label-rtl"
            json="$DEPTH_OUT/$label.json"
            ylog="$DEPTH_OUT/$label-yosys.log"
            llog="$DEPTH_OUT/$label-ltp.log"

            mapfile -t svs < <(find "$rtl" -maxdepth 1 -name '*.sv' -print | sort)
            test "${#svs[@]}" -gt 0
            read_cmd="read_verilog -sv -DSYNTHESIS"
            for sv in "${svs[@]}"; do
              read_cmd+=" $sv"
            done

            # Keep the mapped design in the same Yosys process for ltp.  Yosys
            # 0.33 cannot reliably read back synth_ecp5 JSON containing the
            # technology primitive LUT4.INIT parameter schema.
            yosys -Q -p "$read_cmd; hierarchy -check -top TinyPagedCore; synth_ecp5 -top TinyPagedCore -json $json; stat -top TinyPagedCore; flatten; ltp -noff TinyPagedCore" \
              2>&1 | tee "$ylog"

            # Preserve a compact ltp-specific evidence file while parsing the
            # authoritative same-process synthesis log.
            grep -E 'Longest topological path|Executing LTP|Warning.*loop' "$ylog" > "$llog" || true
            depth=$(sed -n 's/.*Longest topological path in TinyPagedCore (length=\([0-9][0-9]*\)).*/\1/p' "$ylog" | tail -1)
            test -n "$depth"
            printf '%s\n' "$depth" > "$DEPTH_OUT/$label-depth"

            jq '[.modules["TinyPagedCore"].cells[]] | length' "$json" > "$DEPTH_OUT/$label-cells"
            jq '[.modules["TinyPagedCore"].cells[] | select(.type == "LUT4")] | length' "$json" > "$DEPTH_OUT/$label-lut4"
            jq '[.modules["TinyPagedCore"].cells[] | select(.type == "TRELLIS_FF")] | length' "$json" > "$DEPTH_OUT/$label-ff"
          }

          measure_one base
          measure_one target

      - name: Summarize exact logic-depth A/B
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['DEPTH_OUT'])
          def integer(name):
              return int((root / name).read_text().strip())
          def pct(new, old):
              return ((new / old) - 1.0) * 100.0 if old else None

          base_depth = integer('base-depth')
          target_depth = integer('target-depth')
          base_cells = integer('base-cells')
          target_cells = integer('target-cells')
          base_lut = integer('base-lut4')
          target_lut = integer('target-lut4')
          base_ff = integer('base-ff')
          target_ff = integer('target-ff')

          summary = {
              'baseline_sha': os.environ['BASELINE_SHA'],
              'target_sha': os.environ['TARGET_SHA'],
              'proxy': 'Yosys synth_ecp5 mapped netlist + flatten + ltp -noff (single process)',
              'base_logic_depth': base_depth,
              'target_logic_depth': target_depth,
              'logic_depth_delta': target_depth - base_depth,
              'logic_depth_delta_pct': pct(target_depth, base_depth),
              'base_cells': base_cells,
              'target_cells': target_cells,
              'cells_delta_pct': pct(target_cells, base_cells),
              'base_lut4': base_lut,
              'target_lut4': target_lut,
              'lut4_delta_pct': pct(target_lut, base_lut),
              'base_ff': base_ff,
              'target_ff': target_ff,
              'ff_delta_pct': pct(target_ff, base_ff),
              'architectural_speedup': 1.019417,
              'note': 'Logic-depth count is a structural proxy and must not be converted directly into Fmax percentage.'
          }
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## AetherCore v2 Yosys logic-depth A/B\n\n')
              f.write(f"Baseline `{summary['baseline_sha']}` → target `{summary['target_sha']}`\n\n")
              f.write(f"- mapped combinational depth: {base_depth} → {target_depth} ({target_depth-base_depth:+d} levels, {summary['logic_depth_delta_pct']:+.3f}%)\n")
              f.write(f"- cells: {base_cells} → {target_cells} ({summary['cells_delta_pct']:+.3f}%)\n")
              f.write(f"- LUT4: {base_lut} → {target_lut} ({summary['lut4_delta_pct']:+.3f}%)\n")
              f.write(f"- FF: {base_ff} → {target_ff} ({summary['ff_delta_pct']:+.3f}%)\n")
              f.write('- #163 exact architectural speedup: +1.9417%.\n')
              f.write('- Logic depth is a structural proxy, not a direct Fmax percentage.\n')
          PY

      - name: Upload Yosys depth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-v2-yosys-depth-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aethercore-v2-yosys-depth/summary.json
            ${{ runner.temp }}/aethercore-v2-yosys-depth/*-yosys.log
            ${{ runner.temp }}/aethercore-v2-yosys-depth/*-ltp.log
          if-no-files-found: warn
