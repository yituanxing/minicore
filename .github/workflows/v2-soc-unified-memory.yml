name: AetherSoC Unified Memory Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/soc/peripheral/**'
      - 'src/main/scala/aethercore/soc/AetherCoreV2Complex.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2LinuxSoC.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2UnifiedMemorySoC.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2OpenSbiRV64SimTop.scala'
      - 'src/main/scala/aethercore/ElaborateV2UnifiedMemorySoC.scala'
      - 'tests_py/test_v2_platform_ownership.py'
      - 'tests_py/test_v2_soc_unified_memory.py'
      - '.github/workflows/v2-soc-unified-memory.yml'

permissions:
  contents: read

concurrency:
  group: aethersoc-unified-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  elaborate:
    name: Elaborate unified-memory AetherSoC
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Check unified-memory source contracts
        run: |
          python3 -m unittest tests_py.test_v2_platform_ownership -v
          python3 -m unittest tests_py.test_v2_soc_memory_hub -v
          python3 -m unittest tests_py.test_v2_soc_memory_adapters -v
          python3 -m unittest tests_py.test_v2_soc_unified_memory -v

      - name: Elaborate unified-memory SoC
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          rm -rf build/soc-unified-memory
          ./mill aethercore.runMain aethercore.ElaborateV2UnifiedMemorySoCRV64             --target-dir build/soc-unified-memory
          find build/soc-unified-memory -maxdepth 1 -name '*.sv' -print -quit | grep -q .
