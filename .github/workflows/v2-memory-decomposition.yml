name: AetherCore V2 Memory Decomposition

on:
  pull_request:
    paths:
      - '.github/workflows/v2-memory-decomposition.yml'
      - 'src/main/scala/aethercore/ElaborateV2MemoryDecomposition.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2MemoryDecomposition.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2HostPerformance.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2Performance.scala'
      - 'src/main/scala/aethercore/core/v2/**'
      - 'src/test/scala/aethercore/V2MemoryDecompositionChecks.scala'
      - 'sim/opensbi_boot_main.cpp'
      - 'sim/v2_rv64_opensbi_shim/**'
      - 'sim/v2_memory_decomp_shim/**'
      - 'software/rv64/linux_early.env'
      - 'software/rv64/opensbi_first_exec.env'
      - 'software/rv64_userspace/minimal_init.S'
      - 'tools/ci/rv64_linux_early_build.sh'
      - 'tools/ci/rv64_minimal_initramfs_build.sh'
      - 'tools/ci/rv64_minimal_init_payload_build.sh'
      - 'tools/ensure_verilator_5_024.sh'
      - 'tools/ensure_riscv64_linux_gcc_13_3.sh'
      - 'Makefile.l32-linux-boot'
      - 'build.mill'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-v2-memory-decomposition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verilator-tool:
    name: Produce or verify hosted Verilator
    uses: ./.github/workflows/hosted-verilator-cache.yml

  measure:
    name: Unchanged Linux PID1 memory decomposition on frozen-v2 stack
    needs: verilator-tool
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      RV64_LINUX_JOBS: '4'

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true

      - name: Verify measurement-only source contracts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          grep -q 'class AetherCoreV2MemoryDecompositionTop' src/main/scala/aethercore/sim/AetherCoreV2MemoryDecomposition.scala
          grep -q 'readyYoungerLoadComputeFrontier' src/main/scala/aethercore/sim/AetherCoreV2MemoryDecomposition.scala
          grep -q 'readyYoungerLoadBehindMemoryHead' src/main/scala/aethercore/sim/AetherCoreV2MemoryDecomposition.scala
          grep -q 'ElaborateV2MemoryDecomposition' src/main/scala/aethercore/ElaborateV2MemoryDecomposition.scala
          grep -q 'AETHERCORE_V2_MEMORY' sim/v2_memory_decomp_shim/v2_memory_decomp_host_hook.h
          grep -q 'RV64 USER UART IRQ OK' software/rv64_userspace/minimal_init.S
          bash -n tools/ci/rv64_linux_early_build.sh
          bash -n tools/ci/rv64_minimal_initramfs_build.sh
          bash -n tools/ci/rv64_minimal_init_payload_build.sh

      - name: Install hosted prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev bison flex bc \
            libssl-dev libelf-dev build-essential libreadline-dev pkg-config \
            curl xz-utils git python3 openjdk-17-jdk-headless device-tree-compiler dwarves

      - name: Restore fixed Verilator cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-

      - name: Restore RV64 Linux GCC cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/bootlin-riscv64-lp64d-glibc-stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv64-lp64d--glibc--stable-2024.05-1.tar.xz
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-v1-${{ hashFiles('tools/ensure_riscv64_linux_gcc_13_3.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-v1-

      - name: Restore Scala dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore qualified RV64 software cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/rv64/linux
            ~/.cache/aethercore/rv64/linux-build
            ~/.cache/aethercore/l32/opensbi
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v2-${{ hashFiles('software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env', 'tools/ci/rv64_linux_early_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v2-
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v1-

      - name: Restore exact-head memory-decomposition simulation cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/aethercore/v2-memory-decomposition/${{ env.TARGET_SHA }}
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-v2-memory-decomposition-v1-${{ env.TARGET_SHA }}-${{ hashFiles('src/main/scala/aethercore/**', 'sim/**', 'Makefile.l32-linux-boot', 'build.mill') }}

      - name: Validate fixed tools
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ensure_verilator_5_024.sh
          bash tools/ensure_riscv64_linux_gcc_13_3.sh

      - name: Freeze focused memory-decomposition counter semantics
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./mill
          ./mill aethercore.test.testOnly aethercore.V2MemoryDecompositionSpec

      - name: Reuse or build unchanged Linux 6.6.143 baseline
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/rv64_linux_early_build.sh
          grep -q '^RV64_LINUX_EARLY_BUILD_RESULT: status=PASS$' build/rv64-linux-early/result.txt
          grep -q '^linux_version=6.6.143$' build/rv64-linux-early/result.txt

      - name: Build unchanged deterministic PID1 initramfs
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/rv64_minimal_initramfs_build.sh
          timeout --signal=TERM --kill-after=10s 180s bash tools/ci/rv64_minimal_init_payload_build.sh

      - name: Record exact workload identity
        shell: bash
        run: |
          set -euo pipefail
          dst="$GITHUB_WORKSPACE/build/v2-memory-decomposition"
          mkdir -p "$dst"
          {
            echo "target_sha=$TARGET_SHA"
            sha256sum \
              build/rv64-linux-initramfs/minimal-init/init \
              build/rv64-linux-initramfs/obj/arch/riscv/boot/Image \
              build/rv64-minimal-init-boot/opensbi/platform/generic/firmware/fw_payload.bin
          } | tee "$dst/workload-identity.txt"

      - name: Execute real PID1 proof with memory decomposition
        shell: bash
        run: |
          set -euo pipefail
          dst="$GITHUB_WORKSPACE/build/v2-memory-decomposition"
          mkdir -p "$dst"
          make -f Makefile.l32-linux-boot \
            BUILD_DIR="$HOME/.cache/aethercore/v2-memory-decomposition/$TARGET_SHA" \
            TOP=AetherCoreV2OpenSbiRV64SimTop \
            ELABORATE_MAIN=aethercore.ElaborateV2MemoryDecomposition \
            FW_BIN=build/rv64-minimal-init-boot/opensbi/platform/generic/firmware/fw_payload.bin \
            JOBS="$(nproc)" \
            MAX_CYCLES=850000000 \
            MILESTONE='RV64 USER UART IRQ OK' \
            MIN_INTERRUPTS=1 MIN_STIP=1 MIN_SEIP=1 \
            PROGRESS_INTERVAL_CYCLES=10000000 \
            VERILATOR='verilator -LDFLAGS -ldl' \
            SIM_CXXFLAGS="-std=c++20 -O3 -march=native -DAETHERCORE_V2_PERF -I$GITHUB_WORKSPACE/sim/v2_memory_decomp_shim -I$GITHUB_WORKSPACE/sim/v2_rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim" \
            run-local 2>&1 | tee "$dst/execute.log"

      - name: Validate memory decomposition runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('build/v2-memory-decomposition/execute.log').read_text(errors='replace')
          if 'AETHERCORE_V2_PERF reason=marker' not in text:
              raise SystemExit('missing frozen P8 marker snapshot')
          if 'AETHERCORE_V2_MEMORY reason=marker' not in text:
              raise SystemExit('missing memory-decomposition marker snapshot')

          def collect(prefix):
              values = {}
              for line in text.splitlines():
                  if prefix not in line:
                      continue
                  for key, raw in re.findall(r'([a-z0-9_]+)=\s*([0-9]+)', line):
                      values[key] = int(raw)
              return values

          base = collect('AETHERCORE_V2_PERF')
          mem = collect('AETHERCORE_V2_MEMORY')
          base_required = {'cycles', 'commits', 'memory_head', 'issue_mem', 'lsu_busy', 'ptw_active'}
          mem_required = {
              'mem_head_load', 'mem_head_store', 'mem_head_atomic',
              'mem_issue_load', 'mem_issue_store', 'mem_issue_atomic',
              'mem_head_lsu_busy', 'mem_head_ptw_active',
              'younger_ready_load', 'younger_ready_load_age1',
              'younger_ready_load_age2', 'younger_ready_load_age3',
              'younger_ready_load_lsu_idle',
              'younger_ready_load_compute_frontier',
              'younger_ready_load_compute_frontier_lsu_idle',
              'younger_ready_load_behind_memory_head',
              'younger_ready_load_behind_memory_head_lsu_busy',
          }
          missing_base = sorted(base_required - base.keys())
          missing_mem = sorted(mem_required - mem.keys())
          if missing_base or missing_mem:
              raise SystemExit(f'incomplete snapshots base={missing_base} memory={missing_mem}')

          assert base['cycles'] > 0 and base['commits'] > 0
          assert mem['mem_head_load'] + mem['mem_head_store'] + mem['mem_head_atomic'] == base['memory_head']
          assert mem['mem_issue_load'] + mem['mem_issue_store'] + mem['mem_issue_atomic'] == base['issue_mem']
          assert mem['mem_head_lsu_busy'] <= base['memory_head']
          assert mem['mem_head_lsu_busy'] <= base['lsu_busy']
          assert mem['mem_head_ptw_active'] <= base['memory_head']
          assert mem['mem_head_ptw_active'] <= base['ptw_active']
          assert mem['younger_ready_load_lsu_idle'] <= mem['younger_ready_load']
          assert mem['younger_ready_load_compute_frontier'] <= mem['younger_ready_load']
          assert mem['younger_ready_load_compute_frontier_lsu_idle'] <= mem['younger_ready_load_compute_frontier']
          assert mem['younger_ready_load_behind_memory_head'] <= mem['younger_ready_load']
          assert mem['younger_ready_load_behind_memory_head_lsu_busy'] <= mem['younger_ready_load_behind_memory_head']
          for key in mem_required:
              assert mem[key] <= base['cycles'], (key, mem[key], base['cycles'])

          out = Path('build/v2-memory-decomposition/memory-snapshot.txt')
          rows = [f'cycles={base["cycles"]}', f'commits={base["commits"]}',
                  f'memory_head={base["memory_head"]}', f'issue_mem={base["issue_mem"]}',
                  f'lsu_busy={base["lsu_busy"]}', f'ptw_active={base["ptw_active"]}']
          rows += [f'{key}={mem[key]}' for key in sorted(mem_required)]
          out.write_text('\n'.join(rows) + '\n')

          cycles = base['cycles']
          pct = lambda value: 100.0 * value / cycles
          print(
              'AETHERCORE_V2_MEMORY_SANITY_PASS '
              f'cycles={cycles} commits={base["commits"]} '
              f'load_head_pct={pct(mem["mem_head_load"]):.3f} '
              f'store_head_pct={pct(mem["mem_head_store"]):.3f} '
              f'atomic_head_pct={pct(mem["mem_head_atomic"]):.3f} '
              f'younger_ready_pct={pct(mem["younger_ready_load"]):.3f} '
              f'compute_frontier_pct={pct(mem["younger_ready_load_compute_frontier"]):.3f} '
              f'compute_frontier_idle_pct={pct(mem["younger_ready_load_compute_frontier_lsu_idle"]):.3f} '
              f'behind_memory_pct={pct(mem["younger_ready_load_behind_memory_head"]):.3f}'
          )
          PY

      - name: Preserve exact-head measurement cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/aethercore/v2-memory-decomposition/${{ env.TARGET_SHA }}
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-v2-memory-decomposition-v1-${{ env.TARGET_SHA }}-${{ hashFiles('src/main/scala/aethercore/**', 'sim/**', 'Makefile.l32-linux-boot', 'build.mill') }}

      - name: Upload memory decomposition evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-v2-memory-decomposition-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/rv64-linux-early/result.txt
            build/rv64-linux-initramfs/result.txt
            build/rv64-minimal-init-boot/result.txt
            build/v2-memory-decomposition/
