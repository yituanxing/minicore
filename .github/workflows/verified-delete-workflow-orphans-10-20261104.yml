name: Verified CAS retire ten archived workflow-only orphan refs (2026-11-04)
on:
  push:
    branches:
      - maintenance/verified-branch-prune-20261104
    paths:
      - .github/workflows/verified-delete-workflow-orphans-10-20261104.yml
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: verified-workflow-orphans-delete-10-20261104
  cancel-in-progress: false
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout maintenance ref for exact SHA lease push
        uses: actions/checkout@v4
        with:
          ref: maintenance/verified-branch-prune-20261104
          fetch-depth: 1
          persist-credentials: true
      - name: Revalidate all closed PRs, tags, CI, and CAS-delete ten tips
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            if(owner!=='yituanxing'||repo!=='minicore'||context.ref!=='refs/heads/maintenance/verified-branch-prune-20261104')
              throw new Error('Unexpected context');
            const main="7ff35c6acdc3068754292bba814e4ec52ba4ec50",product="087a3ed9588c8fe4ff99b682957f3adbe70230aa";
            const prefix='branch-archive/2026-11-04/workflow-orphans-10/';
            const targets=[["area/dcache-bytevalid-synth-qualification","30ba0a07c4c86beb4ae5bf1610593bebf4108cf9",1,339,"area/dcache-bytevalid-single-write-ab"],["ci/aethercore-v2-save-qualified-linux-cache","696e2b1ca524c33d43bd7b63690ee248fb282e13",1,null,null],["measure/post-46k-backend-hotspots","75fe25cbcf4e9e643bd82002b0cf0be856a829d3",1,344,"main"],["measure/shared-pmp-depth-ab","a5a7962a355b6c108b55f78b568729f8a1a58eb5",1,279,"main"],["measure/shared-pmp-perf-ab","d2f749044ca35e9b76833e6149e80f19e5f8c607",1,278,"main"],["measure/unified-data-pmp-depth-ab","9df4cf9d7d05358618c808adf44ac603e7261573",1,285,"main"],["measure/unified-data-pmp-perf-ab","656a10bbfdb5fc13989332596447b36921b66fa4",1,284,"main"],["measure/post-45k-area-ranking","30df02ac9b232c5370306e13e1b0fb77c388a502",2,346,"main"],["measure/post-dcache-46k-area-ranking","44052d5c7ca02405fe4076e4807b474324224f37",2,341,"main"],["measure/unified-data-pmp-xc7-ab","6f68c6e9f83559a4fd9161a3e715ef35e56fea97",2,286,"main"]];
            const cp=require('child_process');
            const retry=async(label,fn)=>{
              for(let i=0;i<5;i++){
                try{return await fn();}
                catch(e){
                  const transient=e.status===429||e.status>=500||/fetch failed|ECONNRESET|ETIMEDOUT|socket hang up/i.test(String(e.message||''));
                  if(!transient||i===4)throw e;
                  console.log('READ_RETRY',label,i+1);
                  await new Promise(resolve=>setTimeout(resolve,450*(2**i)));
                }
              }
            };
            const ref=async s=>(await retry('ref '+s,()=>github.rest.git.getRef({owner,repo,ref:s}))).data;
            const pin=async()=>{
              const m=(await ref('heads/main')).object.sha,p=(await ref('heads/design/rv64gc-product-architecture-20261103')).object.sha;
              if(m!==main||p!==product)throw new Error('Main/Product moved '+m+'/'+p);
            };
            const openPRs=async()=>retry('openPRs',()=>github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100}));
            const verifyNoOpen=async name=>{
              if((await openPRs()).some(p=>p.head.ref===name||p.base.ref===name))
                throw new Error('Open PR depends on '+name);
            };
            const verifyNoActive=async name=>{
              for(const status of ['queued','in_progress','waiting','pending','requested']){
                const runs=await retry('runs '+status,()=>github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,status,per_page:100}));
                if(runs.some(r=>r.head_branch===name))
                  throw new Error('Active CI '+name+' '+status);
              }
            };
            const archiveSHA=async name=>(await ref('tags/'+prefix+name)).object.sha;
            const validate=async(name,sha,unique,n,base)=>{
              if(await archiveSHA(name)!==sha)throw new Error('Archive missing/wrong '+name);
              await verifyNoOpen(name);
              await verifyNoActive(name);
              const cmp=(await retry('compare '+name,()=>github.rest.repos.compareCommits({owner,repo,base:main,head:sha}))).data;
              if(cmp.ahead_by!==unique||!['ahead','diverged'].includes(cmp.status))
                throw new Error('Unique history unexpected '+name);
              if(n!==null){
                const pr=(await retry('PR '+n,()=>github.rest.pulls.get({owner,repo,pull_number:n}))).data;
                if(pr.state!=='closed'||pr.merged_at||pr.head.ref!==name||pr.head.sha!==sha||pr.base.ref!==base)
                  throw new Error('Historical closed PR changed #'+n);
                const files=await retry('files '+n,()=>github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:n,per_page:100}));
                if(!files.length||files.length>3||files.some(f=>!f.filename.startsWith('.github/workflows/')))
                  throw new Error('PR source diff changed #'+n);
              }else{
                const c=(await retry('commit '+sha,()=>github.rest.repos.getCommit({owner,repo,ref:sha}))).data;
                if(!c.files?.length||c.files.some(f=>!f.filename.startsWith('.github/workflows/')))
                  throw new Error('Non-workflow head '+name);
              }
              try{
                const b=(await retry('branch '+name,()=>github.rest.repos.getBranch({owner,repo,branch:name}))).data;
                if(b.protected||b.commit.sha!==sha)throw new Error('Tip moved or protected '+name);
                return true;
              }catch(e){if(e.status!==404)throw e;return false;}
            };
            await pin();
            let present=0;
            for(const [name,sha,unique,n,base] of targets){
              const alive=await validate(name,sha,unique,n,base);
              if(alive)present++;
              console.log('ORPHAN_DELETE_PREFLIGHT',name,sha,alive?'live':'already_absent');
            }
            console.log('ORPHAN_DELETE_PREFLIGHT_ALL_PASS',targets.length,'live='+present);
            await pin();
            let deleted=0,previous=0;
            for(const [name,sha,unique,n,base] of targets){
              await pin();
              const alive=await validate(name,sha,unique,n,base);
              if(!alive){previous++;console.log('ORPHAN_ALREADY_DELETED',name);continue;}
              if((await ref('heads/'+name)).object.sha!==sha)throw new Error('Ref moved '+name);
              const args=['push','--force-with-lease=refs/heads/'+name+':'+sha,'origin',':refs/heads/'+name];
              try{cp.execFileSync('git',args,{cwd:process.env.GITHUB_WORKSPACE,encoding:'utf8',timeout:60000});}
              catch(e){throw new Error('CAS refused '+name+' '+String(e.stderr||e.message).slice(0,500));}
              let gone=false;
              for(let i=0;i<8;i++){
                try{await ref('heads/'+name);}
                catch(e){if(e.status!==404)throw e;gone=true;break;}
                if(i<7)await new Promise(resolve=>setTimeout(resolve,1500));
              }
              if(!gone)throw new Error('Not deleted '+name);
              if(await archiveSHA(name)!==sha)throw new Error('Archive moved after deletion '+name);
              deleted++;console.log('ORPHAN_CAS_DELETED',name,sha);
            }
            await pin();
            if(deleted+previous!==targets.length)throw new Error('Delete count mismatch');
            console.log('WORKFLOW_ORPHAN_DELETE_DONE','deleted='+deleted,'previous='+previous,'archives_verified='+targets.length);
