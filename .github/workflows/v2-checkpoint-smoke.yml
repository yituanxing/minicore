name: V2 Checkpoint Forkserver Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - diag/v2-f7-pid1-checkpoint
    paths:
      - 'sim/v2_checkpoint_forkserver_main.cpp'
      - 'sim/l32_opensbi_runtime.h'
      - 'Makefile.v2-checkpoint'
      - '.github/workflows/v2-checkpoint-smoke.yml'
  pull_request:
    branches:
      - feature/aethercore-v2-f7-software-parity
    paths:
      - 'sim/v2_checkpoint_forkserver_main.cpp'
      - 'sim/l32_opensbi_runtime.h'
      - 'Makefile.v2-checkpoint'
      - '.github/workflows/v2-checkpoint-smoke.yml'

permissions:
  contents: read

concurrency:
  group: aethercore-v2-checkpoint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Compile and clone v2 checkpoint forkserver
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      RV64_OPENSBI_JOBS: '4'
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore fixed Verilator cache
        id: verilator-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-

      - name: Restore pinned RV64 GCC cache
        id: rv64-toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/bootlin-riscv64-lp64d-glibc-stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv64-lp64d--glibc--stable-2024.05-1.tar.xz
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-13.3-v1-${{ hashFiles('tools/ensure_riscv64_linux_gcc_13_3.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-13.3-v1-
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-v1-

      - name: Restore pinned OpenSBI source cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/aethercore/rv64-opensbi/opensbi/bd613dd92113f683052acfb23d9dc8ba60029e0a
          key: aethercore-opensbi-1.6-bd613dd92113f683052acfb23d9dc8ba60029e0a-v1

      - name: Install tool prerequisites on cache miss
        if: steps.verilator-cache.outputs.cache-hit != 'true' || steps.rv64-toolchain-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev build-essential git curl xz-utils

      - name: Validate fixed tools
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ensure_verilator_5_024.sh
          bash tools/ensure_riscv64_linux_gcc_13_3.sh

      - name: Compile checkpoint model and host harness
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.v2-checkpoint \
            BUILD_DIR="$RUNNER_TEMP/v2-checkpoint" \
            JOBS="$(nproc)" \
            VERILATOR='verilator -LDFLAGS -ldl' \
            sim
          test -x "$RUNNER_TEMP/v2-checkpoint/obj/VAetherCoreV2OpenSbiRV64SimTop"

      - name: Build pinned unchanged OpenSBI 1.6 S-mode payload
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/v2-checkpoint-opensbi"
          rm -rf "$build"
          mkdir -p "$build"
          bash tools/ci/rv64_opensbi_first_exec.sh "$build"
          grep -q '^RV64_OPENSBI_FIRST_EXEC_BUILD: status=PASS$' "$build/result.txt"
          test -s "$build/opensbi/platform/generic/firmware/fw_payload.bin"
          echo "CHECKPOINT_OPENSBI_BUILD=$build" >> "$GITHUB_ENV"

      - name: Clone twice from one OpenSBI checkpoint
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.v2-checkpoint \
            BUILD_DIR="$RUNNER_TEMP/v2-checkpoint" \
            FW_BIN="$CHECKPOINT_OPENSBI_BUILD/opensbi/platform/generic/firmware/fw_payload.bin" \
            CHECKPOINT_TRIGGER='OpenSBI v1.6' \
            CHILD_SUCCESS_MARKER='RV64 OpenSBI S-mode payload PASS' \
            CHILD_COUNT=2 \
            BOOT_MAX_CYCLES=20000000 \
            CHILD_MAX_CYCLES=20000000 \
            PROGRESS_INTERVAL_CYCLES=1000000 \
            REQUIRE_POST_CHECKPOINT_SEIP=0 \
            run-existing
          log="$RUNNER_TEMP/v2-checkpoint/logs/checkpoint.log"
          grep -q '^V2_CHECKPOINT_READY ' "$log"
          [[ "$(grep -c '^V2_CHECKPOINT_CHILD_PASS ' "$log")" -eq 2 ]]
          grep -q '^V2_CHECKPOINT_PASS children=2 ' "$log"

      - name: Upload checkpoint evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: v2-checkpoint-smoke-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/v2-checkpoint/logs/rtl-build.log
            ${{ runner.temp }}/v2-checkpoint/logs/verilator-build.log
            ${{ runner.temp }}/v2-checkpoint/logs/checkpoint.log
            ${{ runner.temp }}/v2-checkpoint/firmware.sha256
            ${{ runner.temp }}/v2-checkpoint-opensbi/result.txt
