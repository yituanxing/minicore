name: RV32IM littlefs Basic

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv32im-littlefs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  littlefs:
    name: Pinned littlefs on RV32IM RAM flash
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8
        with:
          job: rv32im-littlefs

      - name: Install Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 bison flex \
            libreadline-dev libsdl2-dev zstd libzstd-dev \
            file binutils verilator \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
          java -version
          verilator --version
          riscv64-unknown-elf-gcc --version

      - name: Prepare Mill launcher
        run: |
          chmod +x mill
          ./mill --version

      - name: Build exact frozen RV32 NEMU reference
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          NEMU_SINGLE_STEP=1 bash tools/probe_rv32_nemu_historical.sh \
            "$(pwd)/build/rv32-nemu-probe" \
            2>&1 | tee build/rv32-nemu-probe.log
          grep -q '^reference_sha256=1dc17e1d2c8d27959fc3fa30163a350a57c688e102c64372e396f350699db577$' \
            build/rv32-nemu-probe/evidence/result.txt
          reference_so="$(find build/rv32-nemu-probe/nemu/build -maxdepth 1 -type f \
            -name 'riscv32-nemu-interpreter-so*' -print -quit)"
          test -n "$reference_so"
          echo "RV32_NEMU_SO=$reference_so" >> "$GITHUB_ENV"

      - name: Build pinned littlefs workload
        shell: bash
        run: |
          make -f Makefile.rv32im-littlefs workload
          manifest=build/rv32im-littlefs/software/manifest.txt
          grep -q '^source=littlefs@6cb4e86540eca0d9ba62500a298385c9d863c8be$' "$manifest"
          grep -q '^march=rv32im$' "$manifest"
          grep -q '^mabi=ilp32$' "$manifest"
          grep -q '^lfs_no_malloc=1$' "$manifest"
          grep -q '^flash_bytes=32768$' "$manifest"
          grep -q '^inline_files=disabled$' "$manifest"

      - name: Run littlefs DiffTest
        shell: bash
        run: |
          set -o pipefail
          make -f Makefile.rv32im-littlefs run RV32_NEMU_SO="$RV32_NEMU_SO" \
            2>&1 | tee build/rv32im-littlefs/littlefs-ci.log
          grep -q '^LFS_PASS ' build/rv32im-littlefs/littlefs.log
          grep -q 'PASS: self-check exit=0' build/rv32im-littlefs/littlefs.log

      - name: Upload littlefs evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32im-littlefs-basic-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/rv32-nemu-probe.log
            build/rv32-nemu-probe/evidence/
            build/rv32im-littlefs/
            build/upstream-src/littlefs-*/LICENSE.md
