name: L32 OpenSBI Bring-up

on:
  pull_request:
    paths:
      - software/l32/**
      - tools/ci/l32_opensbi_build.sh
      - tools/ci/make_l32_dtb.py
      - tests_py/test_l32_opensbi_contract.py
      - tests_py/test_l32_opensbi_exec_contract.py
      - tools/ensure_l32_riscv32_linux_gcc.sh
      - src/main/scala/aethercore/ElaborateOpenSbi.scala
      - src/main/scala/aethercore/sim/AetherCoreOpenSbiSimTop.scala
      - src/main/scala/aethercore/config/CoreConfig.scala
      - src/main/scala/aethercore/core/**
      - src/main/scala/aethercore/sim/AetherCoreSimTop.scala
      - sim/opensbi_boot_main.cpp
      - Makefile.l32-opensbi-probe
      - .github/workflows/l32-opensbi.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l32-opensbi-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  opensbi-rv32:
    name: Pinned RV32 OpenSBI build and first execution
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 30

    steps:
      - name: Checkout without deleting persistent outputs
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Validate L32 contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/l32_opensbi_build.sh
          bash -n tools/ensure_l32_riscv32_linux_gcc.sh
          python3 -m py_compile tools/ci/make_l32_dtb.py
          python3 -m unittest \
            tests_py.test_l32_opensbi_contract \
            tests_py.test_l32_opensbi_exec_contract -v

      - name: Provision pinned Bootlin RV32 Linux GCC
        shell: bash
        run: bash tools/ensure_l32_riscv32_linux_gcc.sh

      - name: Build pinned RV32 OpenSBI executable payload
        shell: bash
        env:
          L32_JOBS: "6"
          L32_TOOLCHAIN_MODE: gcc
        run: |
          set -euo pipefail
          chmod +x tools/ci/l32_opensbi_build.sh
          bash tools/ci/l32_opensbi_build.sh

      - name: Provision fixed Verilator for L32 execution
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Run real OpenSBI first-execution probe
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.l32-opensbi-probe \
            JOBS="$(nproc)" MAX_CYCLES=10000000 run-local

      - name: Upload L32 OpenSBI evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-l32-opensbi-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/l32-opensbi/result.txt
            build/l32-opensbi/opensbi-build.log
            build/l32-opensbi/aethercore-rv32.dtb
            build/l32-opensbi/evidence/
            build/l32-opensbi/build/platform/generic/firmware/fw_payload.elf
            build/l32-opensbi/build/platform/generic/firmware/fw_payload.bin
            build/l32-opensbi-probe/firmware.sha256
            build/l32-opensbi-probe/logs/*.log
