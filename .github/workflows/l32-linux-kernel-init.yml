name: L32 Linux Kernel Init

on:
  pull_request:
    paths:
      - .github/workflows/l32-linux-kernel-init.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l32-linux-kernel-init-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-kernel-init:
    name: Linux 6.6.143 complete kernel init to rootfs boundary
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 30

    steps:
      - name: Checkout without deleting persistent outputs
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Validate frozen L32 contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/l32_linux_build.sh
          bash -n tools/ci/l32_linux_cache_key.sh
          bash -n tools/ci/l32_linux_payload_build.sh
          bash -n tools/ensure_l32_riscv32_linux_gcc.sh
          python3 -m py_compile tools/ci/make_l32_dtb.py
          python3 -m unittest \
            tests_py.test_l32_opensbi_contract \
            tests_py.test_l32_opensbi_exec_contract \
            tests_py.test_l32_linux_build_contract \
            tests_py.test_l32_linux_boot_contract -v

      - name: Provision pinned Bootlin RV32 Linux GCC
        shell: bash
        run: bash tools/ensure_l32_riscv32_linux_gcc.sh

      - name: Reuse exact frozen Linux Image
        shell: bash
        env:
          L32_LINUX_JOBS: "6"
        run: |
          set -euo pipefail
          chmod +x tools/ci/l32_linux_cache_key.sh tools/ci/l32_linux_build.sh
          if ! tools/ci/l32_linux_cache_key.sh check build/l32-linux; then
            tools/ci/l32_linux_build.sh
            tools/ci/l32_linux_cache_key.sh mark build/l32-linux
          fi
          tools/ci/l32_linux_cache_key.sh check build/l32-linux

      - name: Build OpenSBI with exact frozen Linux payload
        shell: bash
        env:
          L32_JOBS: "6"
        run: |
          set -euo pipefail
          chmod +x tools/ci/l32_linux_payload_build.sh
          tools/ci/l32_linux_payload_build.sh

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Drive Linux to expected no-rootfs boundary
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-boot \
            JOBS="$(nproc)" \
            MAX_CYCLES=500000000 \
            MILESTONE="VFS: Unable to mount root fs" \
            MIN_INTERRUPTS=1 \
            run-local

      - name: Upload bounded kernel-init evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-l32-linux-kernel-init-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/l32-linux/result.txt
            build/l32-linux/evidence/
            build/l32-linux-boot/result.txt
            build/l32-linux-boot/evidence/
            build/l32-linux-probe/firmware.sha256
            build/l32-linux-probe/logs/*.log
