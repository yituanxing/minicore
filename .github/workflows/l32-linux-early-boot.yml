name: L32 Linux 6.6.143 Early Boot

on:
  pull_request:
    paths:
      - software/l32/linux-freeze.env
      - software/l32/manifest.env
      - tools/ci/make_l32_dtb.py
      - tools/ci/l32_linux_early_boot_build.sh
      - tools/ci/l32_linux_cache_key.sh
      - tools/ensure_l32_riscv32_linux_gcc.sh
      - tests_py/test_l32_linux_early_boot_contract.py
      - src/main/scala/aethercore/config/CoreConfig.scala
      - src/main/scala/aethercore/core/**
      - src/main/scala/aethercore/ElaborateOpenSbi.scala
      - src/main/scala/aethercore/sim/AetherCoreOpenSbiSimTop.scala
      - sim/linux_early_boot_main.cpp
      - Makefile.l32-linux-early-boot
      - .github/workflows/l32-linux-early-boot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l32-linux-early-boot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  early-boot:
    name: Frozen Linux 6.6.143 Sv32 and early console
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 30

    steps:
      - name: Checkout without deleting persistent outputs
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Validate L32-E contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/l32_linux_early_boot_build.sh
          python3 -m py_compile tools/ci/make_l32_dtb.py
          python3 -m unittest tests_py.test_l32_linux_early_boot_contract -v

      - name: Provision pinned Bootlin RV32 Linux GCC
        shell: bash
        run: bash tools/ensure_l32_riscv32_linux_gcc.sh

      - name: Verify exact frozen Linux software image
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/l32_linux_cache_key.sh check build/l32-linux
          source software/l32/linux-freeze.env
          echo "${L32_LINUX_IMAGE_SHA256}  build/l32-linux/obj/arch/riscv/boot/Image" | sha256sum -c -

      - name: Build observable Linux-bearing OpenSBI payload
        shell: bash
        env:
          L32_EARLY_BOOT_JOBS: "6"
        run: bash tools/ci/l32_linux_early_boot_build.sh

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Run Linux Sv32 and early-console probe
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-early-boot JOBS="$(nproc)" MAX_CYCLES=40000000 run-local

      - name: Upload L32-E evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-l32-linux-early-boot-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/l32-linux-early-boot/result.txt
            build/l32-linux-early-boot/opensbi-linux-build.log
            build/l32-linux-early-boot/evidence/
            build/l32-linux-early-boot/opensbi/platform/generic/firmware/fw_payload.elf
            build/l32-linux-early-boot/opensbi/platform/generic/firmware/fw_payload.bin
            build/l32-linux-early-boot-probe/firmware.sha256
            build/l32-linux-early-boot-probe/logs/*.log
