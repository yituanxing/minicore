name: Reviewed SD1 Host-v3 D real Product RTL 8092M to 8172M

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: product-sd1-host-v3-D-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  D_real_product_rtl_four_stages:
    if: >-
      github.repository == 'yituanxing/minicore' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'product-sd1-v3-reviewed-8092-to-8172-four-stages' &&
      github.event.pull_request.number == 379 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'design/rv64gc-product-architecture-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
      D_SOURCE_SHA: 4f82d2c7b5dc01f564972ff4d4bc82b465583838
      C_RUN: '42496075997'
      C_HEAD: fdd8a3867877d19a8a7b9e7cc2920b2868b323af
      C_8092_ID: '13624245295'
      C_8092_ZIP: c4b0d27a785941dcd01b98067ee46d91bac167b43c982df3b7ee0df7c511eeae
      C_HOST: e575046e572bfe55a8bff307780c61275923f92bcb6993dc2ec397729ec02e1e
      C_RTL: cb5125d542bb438ef73ac155b962bf9890160103d43eedbd82182fffea591d72
      C_CARD: c1d901818898167198ef0c548a30a3882bd8e8e72f3d456f05f63b627ca293d5
      V3_RUN: '42498142872'
      V3_HEAD: ca71830647b424aedb4064ca85a6c07d9ec6ff1f
      V3_ID: '13623808277'
      V3_ZIP: fc94571aa000e1c959782bae8f78680e74dca8ebba33189ec79f150f35b98e3d
      AETHERCORE_SD1_V3_REVIEWED_MODEL_SHA: 04e671f2dfae8aa6d7c5b17a93c688cb7b30005de9a2a329f983b909f4fa1be6
      AETHERCORE_SD1_V3_D_8092_HOST_SHA: 1c79e49d459d4aa635b49c886eb3490a0b2d5212242a10da6d576398381d15fe
      AETHERCORE_SD1_V3_D_8092_RTL_SHA: cb5125d542bb438ef73ac155b962bf9890160103d43eedbd82182fffea591d72
      AETHERCORE_SD1_V3_D_8092_CARD_SHA: c1d901818898167198ef0c548a30a3882bd8e8e72f3d456f05f63b627ca293d5
      AETHERCORE_SD1_V3_D_RELAY_EXECUTE: REVIEWED_C_8092M_AND_V3_QUALIFIED_20M_PASS
      AETHERCORE_SD1_RELAY_CONFIRM: SD1_FULL_DEBIAN_SIGNED_RELAY_V4_MIGRATED_8P5B
      AETHERCORE_VERILATOR_VERSION: '5.054'
      SIM_SETTLE_MODE: reference
      VERILATOR_THREADS: '1'
      AETHERCORE_DATA_MEM_WAIT_CYCLES: '0'
      OUT: build/product-sd1-migrated-v3-8p5b-followon

    steps:
      - name: Fail closed until exact D source is independently approved
        shell: bash
        run: |
          set -euo pipefail
          [[ "$D_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 16
          for spec in "$C_RUN:$C_HEAD:$C_8092_ID:$C_8092_ZIP" "$V3_RUN:$V3_HEAD:$V3_ID:$V3_ZIP"; do
            [[ "$spec" =~ ^[0-9]{10,13}:[a-f0-9]{40}:[0-9]{8,13}:[a-f0-9]{64}$ ]] || exit 16
          done
      - name: Authenticate both real RTL C and v3 qualification successful source jobs
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$C_RUN" > "$RUNNER_TEMP/c.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V3_RUN" > "$RUNNER_TEMP/v3.json"
          jq -e --argjson id "$C_RUN" --arg h "$C_HEAD" '
            .id==$id and .run_attempt==1 and .status=="completed" and .conclusion=="success" and
            .head_sha==$h and .event=="pull_request" and .head_branch=="design/rv64gc-product-architecture-20261103" and
            .path==".github/workflows/product-sd1-migrated-v2-8p1b-followon.yml"' "$RUNNER_TEMP/c.json"
          jq -e --argjson id "$V3_RUN" --arg h "$V3_HEAD" '
            .id==$id and .run_attempt==1 and .status=="completed" and .conclusion=="success" and
            .head_sha==$h and .event=="pull_request" and .head_branch=="design/rv64gc-product-architecture-20261103" and
            .path==".github/workflows/product-sd1-host-v3-8p5b-qualification.yml"' "$RUNNER_TEMP/v3.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$C_RUN/jobs?per_page=100" > "$RUNNER_TEMP/c-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V3_RUN/jobs?per_page=100" > "$RUNNER_TEMP/v3-jobs.json"
          jq -e '[.jobs[]|select(.name=="followon_four_real_product_rtl_stages" and .conclusion=="success" and
            ([.steps[]|select((.name|startswith("Advance real Product RTL ")) and .conclusion=="success")]|length==4) and
            ([.steps[]|select((.name|startswith("Upload complete ")) and .conclusion=="success")]|length==4))]|length==1' "$RUNNER_TEMP/c-jobs.json"
          jq -e '[.jobs[]|select(.name=="qualify_v3_host_only_8072_to_8092" and .conclusion=="success" and
            ([.steps[]|select(.name=="Zero-cycle migrate C 8072M and run one real RTL 20M exact differential" and .conclusion=="success")]|length==1) and
            ([.steps[]|select(.name=="Preserve v3 Host-only qualification and usable 8092M state" and .conclusion=="success")]|length==1))]|length==1' "$RUNNER_TEMP/v3-jobs.json"
          for v in c v3; do
            if [[ "$v" == c ]]; then id="$C_8092_ID"; run="$C_RUN"; digest="$C_8092_ZIP"; name="product-sd1-migrated-v2-8092m-$C_RUN"
            else id="$V3_ID"; run="$V3_RUN"; digest="$V3_ZIP"; name="product-sd1-model-migrate-v3-qual-8072-8092-$V3_RUN"; fi
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$RUNNER_TEMP/$v-art.json"
            jq -e --argjson id "$id" --argjson run "$run" --arg name "$name" --arg sha "sha256:$digest" '
              .id==$id and .workflow_run.id==$run and .name==$name and .digest==$sha and .expired==false and .size_in_bytes>1000000' "$RUNNER_TEMP/$v-art.json"
          done

      - name: Checkout and static-check exact D source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.D_SOURCE_SHA }}
          persist-credentials: false
      - name: Validate D no-clock plan
        run: |
          [[ "$(git rev-parse HEAD)" == "$D_SOURCE_SHA" ]] || exit 16
          bash -n tools/ci/product_sd1_migrated_v3_followon_20m.sh
          bash tools/ci/product_sd1_migrated_v3_followon_20m.sh --plan
      - name: Restore signed Debian seed
        id: seed
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rv64-debian-rootfs/result.txt
            build/rv64-debian-linux/result.txt
            build/rv64-debian-linux/obj/.config
            build/rv64-debian-linux/obj/arch/riscv/boot/Image
            build/rv64-debian-boot
            build/rv64-debian-sd1-sd
            build/product-sd1-official-seed
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v2-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'build.mill', 'tools/ci/rv64_debian_sd1_official_full_rootfs_prepare.sh', 'tools/ci/rv64_debian_sd1_sd_image_build.sh', 'tools/ci/rv64_debian_payload_build.sh', 'tools/ci/rv64_debian_linux_build.sh', 'tools/ci/rv64_debian_rootfs_build.sh', 'tools/ci/rv64_debian_sd1_tree_digest.py', 'tools/ci/rv64_linux_early_build.sh', 'tools/ci/rv64_minimal_init_payload_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0
      - name: Restore GPIO-CS kernel Image
        id: diag
        uses: actions/cache/restore@v4
        with:
          path: |
            build/product-sd1-gpio-cs-diagnostic/linux/result.txt
            build/product-sd1-gpio-cs-diagnostic/linux/obj/.config
            build/product-sd1-gpio-cs-diagnostic/linux/obj/arch/riscv/boot/Image
            build/product-sd1-gpio-cs-diagnostic/linux/evidence
            build/product-sd1-gpio-cs-diagnostic/boot
            build/product-sd1-gpio-cs-diagnostic/diagnostic-manifest.txt
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-sd1-gpio-cs-diagnostic-image-v1-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'tools/ci/product_sd1_gpio_cs_diag_build.sh', 'tools/ci/patches/linux-6.6.143-mmc-spi-gpio-cs-off.patch', 'tools/ci/rv64_minimal_init_payload_build.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
      - name: Verify frozen signed media caches
        run: |
          set -euo pipefail
          [[ '${{ steps.diag.outputs.cache-hit }}' == true &&
            ( '${{ steps.seed.outputs.cache-hit }}' == true || '${{ steps.seed.outputs.cache-matched-key }}' == 'aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0' ) ]] || exit 16
          python3 tools/ci/product_sd1_official_seed.py verify
      - name: Restore frozen polling firmware and DTB
        uses: actions/download-artifact@v4
        with:
          run-id: 42338584047
          name: product-sd1-spi-polling-build-42338584047
          github-token: ${{ github.token }}
          path: build/product-sd1-spi-polling-import
      - name: Import SHA-authenticated v3 qualification and original C8092
        run: |
          set -euo pipefail
          mkdir -p build/product-sd1-model-migration-v3-8p5b-draft build/product-sd1-v3-d-source/8092m build/product-sd1-v3-d-source/auth
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V3_ID/zip" -o build/product-sd1-v3-d-source/auth/v3.zip
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$C_8092_ID/zip" -o build/product-sd1-v3-d-source/auth/c.zip
          [[ "$(sha256sum build/product-sd1-v3-d-source/auth/v3.zip | cut -d' ' -f1)" == "$V3_ZIP" &&
             "$(sha256sum build/product-sd1-v3-d-source/auth/c.zip | cut -d' ' -f1)" == "$C_8092_ZIP" ]] || exit 16
          unzip -qq build/product-sd1-v3-d-source/auth/v3.zip -d build/product-sd1-model-migration-v3-8p5b-draft
          unzip -qq build/product-sd1-v3-d-source/auth/c.zip -d build/product-sd1-v3-d-source/8092m
          v=build/product-sd1-model-migration-v3-8p5b-draft/qualified/8092m
          c=build/product-sd1-v3-d-source/8092m
          q=build/product-sd1-model-migration-v3-8p5b-draft/qualification-manifest.txt
          model=build/product-sd1-model-migration-v3-8p5b-draft/candidate-savable-model/obj/VAetherCoreProductDebianSdRV64SimTop
          [[ -f "$model" && "$(sha256sum "$model" | cut -d' ' -f1)" == "$AETHERCORE_SD1_V3_REVIEWED_MODEL_SHA" ]] || exit 16
          chmod 755 "$model"
          grep -Fxq 'full_rtl_identical=1' "$q"
          grep -Fxq 'full_host_except_model_sha_identical=1' "$q"
          grep -Fxq 'replay_cycles=20000000' "$q"
          grep -Fxq 'candidate_model_sha256=04e671f2dfae8aa6d7c5b17a93c688cb7b30005de9a2a329f983b909f4fa1be6' "$q"
          [[ "$(sha256sum "$c/persistent.pre.host" | cut -d' ' -f1)" == "$C_HOST" &&
             "$(sha256sum "$c/persistent.pre.rtl" | cut -d' ' -f1)" == "$C_RTL" &&
             "$(sha256sum "$c/card-progress.json" | cut -d' ' -f1)" == "$C_CARD" &&
             "$(sha256sum "$v/persistent.pre.host" | cut -d' ' -f1)" == "$AETHERCORE_SD1_V3_D_8092_HOST_SHA" &&
             "$(sha256sum "$v/persistent.pre.rtl" | cut -d' ' -f1)" == "$C_RTL" &&
             "$(sha256sum "$v/card-progress.json" | cut -d' ' -f1)" == "$C_CARD" ]] || exit 16
          cmp -s "$c/persistent.pre.rtl" "$v/persistent.pre.rtl"
          cmp -s "$c/card-progress.json" "$v/card-progress.json"
          cmp -s -n 24 "$c/persistent.pre.host" "$v/persistent.pre.host"
          cmp -s -i 88:88 "$c/persistent.pre.host" "$v/persistent.pre.host"
          echo 'D_HOST_V3_AUTHENTIC_C_8092_MIGRATED_SOURCE_NO_GUEST_CLOCK'
      - name: Advance genuine RTL Host-v3 8092M to 8112M
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v3_followon_20m.sh --execute-reviewed-20m "$GITHUB_WORKSPACE/build/product-sd1-model-migration-v3-8p5b-draft/qualified/8092m" 8112
      - name: Upload complete 8112M before next guest RTL cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v3-8112m-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-followon/8112m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Advance genuine RTL Host-v3 8112M to 8132M
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v3_followon_20m.sh --execute-reviewed-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v3-8p5b-followon/8112m" 8132
      - name: Upload complete 8132M before next guest RTL cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v3-8132m-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-followon/8132m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Advance genuine RTL Host-v3 8132M to 8152M
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v3_followon_20m.sh --execute-reviewed-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v3-8p5b-followon/8132m" 8152
      - name: Upload complete 8152M before next guest RTL cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v3-8152m-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-followon/8152m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Advance genuine RTL Host-v3 8152M to 8172M
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v3_followon_20m.sh --execute-reviewed-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v3-8p5b-followon/8152m" 8172
      - name: Upload complete 8172M before terminal report
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v3-8172m-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-followon/8172m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Verify four full savable checkpoints and no false Debian PASS
        run: |
          set -euo pipefail
          for m in 8112 8132 8152 8172; do
            d="$OUT/$m"m
            [[ -s "$d/.migration-ready" && -s "$d/persistent.pre.host" && -s "$d/persistent.pre.rtl" && -s "$d/card-progress.json" ]] || exit 16
            grep -Fxq 'debian_login_claim=0' "$d/.migration-ready"
          done
          echo 'PRODUCT_SD1_V3_D_REAL_RTL_8172M_COMPLETE_NOT_DEBIAN_PASS'
      - name: Preserve D diagnostics even if a later stage fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-v3-D-diagnostics-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-followon/logs/**
          retention-days: 90
          if-no-files-found: warn
