name: AetherSoC BootROM Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/soc/AetherSoCAddressMap.scala'
      - 'src/main/scala/aethercore/soc/AetherSoCBootRom.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2LinuxSoC.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2UnifiedMemorySoC.scala'
      - 'src/test/scala/aethercore/AetherSoCBootRomSpec.scala'
      - 'tests_py/test_v2_soc_bootrom.py'
      - '.github/workflows/v2-soc-bootrom.yml'

permissions:
  contents: read

concurrency:
  group: aethersoc-bootrom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootrom:
    name: Prove reset BootROM handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Install Verilator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Check BootROM ownership and reset contract
        run: python3 -m unittest tests_py.test_v2_soc_bootrom -v

      - name: Run BootROM AetherMem behavior proof
        run: |
          chmod +x mill
          ./mill aethercore.test.testOnly aethercore.AetherSoCBootRomSpec

      - name: Elaborate unified SoC with reset ROM
        run: |
          rm -rf build/soc-bootrom
          ./mill aethercore.runMain aethercore.ElaborateV2UnifiedMemorySoCRV64             --target-dir build/soc-bootrom
          find build/soc-bootrom -maxdepth 1 -name '*.sv' -print -quit | grep -q .
