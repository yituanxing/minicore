name: Product SD1 polling 952M-to-1152M ten-stage warm relay

# Isolated new firmware cold start, same qualified Verilator 5.054 RTL binary.
# NEVER restores the previous IRQ-based 572M Product DDR checkpoint.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: product-sd1-spi-polling-ten5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  polling-12m:
    if: >-
      github.event.label.name == 'product-sd1-spi-polling-advance-1152m' &&
      github.event.pull_request.number == 379 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'design/rv64gc-product-architecture-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      AETHERCORE_ALLOW_PRODUCT_SD1_PERSISTENT_CHECKPOINT: '1'
      AETHERCORE_SD1_SPI_POLLING_SHORT: '1'
      AETHERCORE_SD1_RELAY_CONFIRM: SD1_FULL_DEBIAN_SIGNED_RELAY
      AETHERCORE_VERILATOR_VERSION: '5.054'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      SIM_SETTLE_MODE: reference
      VERILATOR_THREADS: '1'
      AETHERCORE_DATA_MEM_WAIT_CYCLES: '0'
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Cheap short-mode syntax checks, no guest cycles
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          bash -n tools/ci/product_sd1_spi_polling_relay.sh
          python3 -m unittest tests_py.test_product_sd1_spi_polling_dts tests_py.test_product_sd1_card_snapshot -v
      - name: Restore full unchanged official signed Debian SD image
        id: seed
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rv64-debian-rootfs/result.txt
            build/rv64-debian-linux/result.txt
            build/rv64-debian-linux/obj/.config
            build/rv64-debian-linux/obj/arch/riscv/boot/Image
            build/rv64-debian-boot
            build/rv64-debian-sd1-sd
            build/product-sd1-official-seed
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v2-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'build.mill', 'tools/ci/rv64_debian_sd1_official_full_rootfs_prepare.sh', 'tools/ci/rv64_debian_sd1_sd_image_build.sh', 'tools/ci/rv64_debian_payload_build.sh', 'tools/ci/rv64_debian_linux_build.sh', 'tools/ci/rv64_debian_rootfs_build.sh', 'tools/ci/rv64_debian_sd1_tree_digest.py', 'tools/ci/rv64_linux_early_build.sh', 'tools/ci/rv64_minimal_init_payload_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0
      - name: Reject missing or altered official media
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.seed.outputs.cache-hit }}' == true ||
             '${{ steps.seed.outputs.cache-matched-key }}' == \
               'aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0' ]] || exit 16
          python3 tools/ci/product_sd1_official_seed.py verify
      - name: Restore original GPIO-CS fixed Linux Image, not rebuilding kernel
        id: diag
        uses: actions/cache/restore@v4
        with:
          path: |
            build/product-sd1-gpio-cs-diagnostic/linux/result.txt
            build/product-sd1-gpio-cs-diagnostic/linux/obj/.config
            build/product-sd1-gpio-cs-diagnostic/linux/obj/arch/riscv/boot/Image
            build/product-sd1-gpio-cs-diagnostic/linux/evidence
            build/product-sd1-gpio-cs-diagnostic/boot
            build/product-sd1-gpio-cs-diagnostic/diagnostic-manifest.txt
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-sd1-gpio-cs-diagnostic-image-v1-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'tools/ci/product_sd1_gpio_cs_diag_build.sh', 'tools/ci/patches/linux-6.6.143-mmc-spi-gpio-cs-off.patch', 'tools/ci/rv64_minimal_init_payload_build.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
      - name: Reject missing fixed Linux candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.diag.outputs.cache-hit }}' == true ]] || exit 16
          grep -Fxq 'PRODUCT_SD1_GPIO_CS_DIAG_ARTIFACTS: status=READY_FOR_SHORT_RTL_ONLY' \
            build/product-sd1-gpio-cs-diagnostic/diagnostic-manifest.txt
      - name: Import exact distinct polling firmware build evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 42338584047
          name: product-sd1-spi-polling-build-42338584047
          github-token: ${{ github.token }}
          path: build/product-sd1-spi-polling-import
      - name: Import exact 12M polling full state from replay-qualified run
        uses: actions/download-artifact@v4
        with:
          run-id: 42344795877
          name: product-sd1-spi-polling-952m-42344795877
          github-token: ${{ github.token }}
          path: build/product-sd1-spi-polling-952m-import
      - name: Restore pinned 5.054 native Verilator cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.054
            ~/.cache/aethercore/toolchains/src/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
            ~/.cache/aethercore/toolchains/build/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-product-gsim-g3-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh', 'tools/ensure_verilator_5_054.sh') }}
      - name: Fingerprint portable host compiler ABI
        id: portable-abi
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(c++ --version | head -1 | sha256sum | cut -c1-20)"
          echo "signature=$(uname -m)-$compiler" >> "$GITHUB_OUTPUT"
      - name: Restore original portable savable Product RTL model
        id: model
        uses: actions/cache/restore@v4
        with:
          path: build/product-sd1-persistent-checkpoint/savable-model
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-savable-portable-v1-${{ steps.portable-abi.outputs.signature }}-${{ hashFiles('build.mill', 'src/main/scala/**/*.scala', 'sim/l32_opensbi_runtime.h', 'sim/l32_sd_spi_card.h', 'sim/l32_sd_spi_snapshot_codec.h', 'sim/product_rv64_checkpoint_sd1_main.cpp', 'tools/ci/product_checkpoint_sd1_short.sh', 'tools/ci/product_sim_cache.sh', 'tools/ensure_verilator_5_024.sh') }}
      - name: Reject simulator rebuild/mismatch before guest cycles
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.model.outputs.cache-hit }}' == true ]] || {
            echo 'PRODUCT_SD1_POLLING_SHORT_REJECTED: portable model cache miss; do not rebuild' >&2
            exit 16
          }
          [[ -x build/product-sd1-persistent-checkpoint/savable-model/obj/VAetherCoreProductDebianSdRV64SimTop ]] || exit 16
      - name: Verify exactly one 952M full polling source, no prior IRQ state
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' ready < <(find build/product-sd1-spi-polling-952m-import -type f -name .polling-ready -print0)
          [[ "${#ready[@]}" == 1 ]] || exit 16
          source="$(dirname "${ready[0]}")"
          grep -Fxq 'boot_cycles=952000000' "$source/.polling-ready"
          grep -Fxq 'qualification=PRODUCT_SD1_SPI_POLLING_WARM_NOT_DEBIAN_PASS' "$source/.polling-ready"
          echo "POLLING_SOURCE=$source" >> "$GITHUB_ENV"
      - name: Execute authentic polling Product RTL 952M to 972M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh "$POLLING_SOURCE" 972000000
          grep -Fxq 'boot_cycles=972000000' build/product-sd1-spi-polling-relay/972m/.polling-ready
      - name: Upload authenticated 972M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-972m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/972m/
      - name: Execute authentic polling Product RTL 972M to 992M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/972m 992000000
          grep -Fxq 'boot_cycles=992000000' build/product-sd1-spi-polling-relay/992m/.polling-ready
      - name: Upload authenticated 992M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-992m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/992m/
      - name: Execute authentic polling Product RTL 992M to 1012M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/992m 1012000000
          grep -Fxq 'boot_cycles=1012000000' build/product-sd1-spi-polling-relay/1012m/.polling-ready
      - name: Upload authenticated 1012M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1012m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1012m/
      - name: Execute authentic polling Product RTL 1012M to 1032M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1012m 1032000000
          grep -Fxq 'boot_cycles=1032000000' build/product-sd1-spi-polling-relay/1032m/.polling-ready
      - name: Upload authenticated 1032M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1032m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1032m/
      - name: Execute authentic polling Product RTL 1032M to 1052M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1032m 1052000000
          grep -Fxq 'boot_cycles=1052000000' build/product-sd1-spi-polling-relay/1052m/.polling-ready
      - name: Upload authenticated 1052M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1052m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1052m/
      - name: Execute authentic polling Product RTL 1052M to 1072M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1052m 1072000000
          grep -Fxq 'boot_cycles=1072000000' build/product-sd1-spi-polling-relay/1072m/.polling-ready
      - name: Upload authenticated 1072M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1072m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1072m/
      - name: Execute authentic polling Product RTL 1072M to 1092M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1072m 1092000000
          grep -Fxq 'boot_cycles=1092000000' build/product-sd1-spi-polling-relay/1092m/.polling-ready
      - name: Upload authenticated 1092M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1092m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1092m/
      - name: Execute authentic polling Product RTL 1092M to 1112M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1092m 1112000000
          grep -Fxq 'boot_cycles=1112000000' build/product-sd1-spi-polling-relay/1112m/.polling-ready
      - name: Upload authenticated 1112M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1112m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1112m/
      - name: Execute authentic polling Product RTL 1112M to 1132M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1112m 1132000000
          grep -Fxq 'boot_cycles=1132000000' build/product-sd1-spi-polling-relay/1132m/.polling-ready
      - name: Upload authenticated 1132M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1132m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1132m/
      - name: Execute authentic polling Product RTL 1132M to 1152M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1132m 1152000000
          grep -Fxq 'boot_cycles=1152000000' build/product-sd1-spi-polling-relay/1152m/.polling-ready
      - name: Upload authenticated 1152M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1152m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1152m/
      - name: Preserve every completed polling stage log and SD counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-952m-to-1152m-evidence-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/product-sd1-spi-polling-relay/972m/.polling-ready
            build/product-sd1-spi-polling-relay/972m/card-progress.json
            build/product-sd1-spi-polling-relay/972m/save.log
            build/product-sd1-spi-polling-relay/992m/.polling-ready
            build/product-sd1-spi-polling-relay/992m/card-progress.json
            build/product-sd1-spi-polling-relay/992m/save.log
            build/product-sd1-spi-polling-relay/1012m/.polling-ready
            build/product-sd1-spi-polling-relay/1012m/card-progress.json
            build/product-sd1-spi-polling-relay/1012m/save.log
            build/product-sd1-spi-polling-relay/1032m/.polling-ready
            build/product-sd1-spi-polling-relay/1032m/card-progress.json
            build/product-sd1-spi-polling-relay/1032m/save.log
            build/product-sd1-spi-polling-relay/1052m/.polling-ready
            build/product-sd1-spi-polling-relay/1052m/card-progress.json
            build/product-sd1-spi-polling-relay/1052m/save.log
            build/product-sd1-spi-polling-relay/1072m/.polling-ready
