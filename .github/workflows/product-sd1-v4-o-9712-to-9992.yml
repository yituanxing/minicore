        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v4-o-9732m-${{ github.run_id }}
          path: build/product-sd1-migrated-v4-10b-postcross-o/9732m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Advance genuine v4 Product RTL 9732M to 9752M postcross
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v4_postcross_20m.sh --execute-reviewed-postcross-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v4-10b-postcross-o/9732m" 9752
      - name: Upload complete v4 9752M before any further guest RTL cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v4-o-9752m-${{ github.run_id }}
          path: build/product-sd1-migrated-v4-10b-postcross-o/9752m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      # Retention is bounded: prior snapshot was independently uploaded in its own
      # successful action; new current snapshot was just uploaded successfully.
      - name: Retire local 9732M snapshots after 9752M complete artifact upload
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OUT" == build/product-sd1-migrated-v4-10b-postcross-o ]] || exit 16
          current="$OUT/9752m"
          prior="$OUT/9732m"
          [[ -s "$current/.migration-ready" && -s "$current/card-progress.json" &&
             -s "$prior/.migration-ready" && -s "$prior/card-progress.json" ]] || exit 16
          grep -Fxq "boot_cycles=9752000000" "$current/.migration-ready"
          grep -Fxq "boot_cycles=9732000000" "$prior/.migration-ready"
          for kind in host rtl; do
            for d in "$prior" "$current"; do
              f="$d/persistent.pre.$kind"
              [[ -s "$f" && ! -L "$f" ]] || exit 16
              sha="$(sha256sum "$f" | cut -d' ' -f1)"
              grep -Fxq "snapshot_${kind}_sha256=$sha" "$d/.migration-ready" || exit 16
            done
          done
          rm -- "$prior/persistent.pre.host" "$prior/persistent.pre.rtl"
          [[ ! -e "$prior/persistent.pre.host" && ! -e "$prior/persistent.pre.rtl" ]] || exit 16
      - name: Advance genuine v4 Product RTL 9752M to 9772M postcross
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v4_postcross_20m.sh --execute-reviewed-postcross-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v4-10b-postcross-o/9752m" 9772
