        run: bash tools/ci/product_sd1_migrated_v4_postcross_20m.sh --execute-reviewed-postcross-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v4-10b-postcross-o/9772m" 9792
      - name: Upload complete v4 9792M before any further guest RTL cycle
