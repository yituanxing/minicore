        run: bash tools/ci/product_sd1_migrated_v4_postcross_20m.sh --execute-reviewed-postcross-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v4-10b-postcross-o/9792m" 9812
      - name: Upload complete v4 9812M before any further guest RTL cycle
