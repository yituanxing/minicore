name: Verified one-shot branch pruning (2026-11-04 batch 4)

on:
  push:
    branches:
      - maintenance/verified-branch-prune-20261104
    paths:
      - .github/workflows/verified-branch-prune-20261104.yml

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: one-shot-branch-prune-20261104
  cancel-in-progress: false

jobs:
  prune:
    name: Archive and prune thirty branches of merged PRs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify every target, archive exact SHAs, then prune
        uses: actions/github-script@v7
        with:
          script: |
            // One-shot housekeeping. Never change main, Product, or a PR dependency.
            const { owner, repo } = context.repo;
            if (owner !== 'yituanxing' || repo !== 'minicore') {
              throw new Error('Unexpected repository');
            }
            if (context.ref !== 'refs/heads/maintenance/verified-branch-prune-20261104') {
              throw new Error('Unexpected workflow branch');
            }
            const mainExpected = '7ff35c6acdc3068754292bba814e4ec52ba4ec50';
            const product = 'design/rv64gc-product-architecture-20261103';
            const archivePrefix = 'branch-archive/2026-11-04/batch4/';
            const targets = [
              ['agent/config-datapath-widths', '2dd399f44f32e6af22a31fc6ba00824af971b4b3', 14],
              ['agent/config-rv32-decode', '17219e99da1a2cabb8af8bb56099c9118e8afd3e', 15],
              ['agent/config-rv64-skeleton', '82f396f7af2742a73b9f43138a49af968c15f9b1', 13],
              ['agent/machine-csr-zicsr', '977b66c0fa8974c97b068626a1e2c0f65909d123', 25],
              ['agent/machine-trap-entry', '128a2bcbe68ec328c26fdce0309bf149a18d271f', 26],
              ['agent/machine-trap-return', '36cf7b495ce9cfa07e227457bfc61b5b10c5a2eb', 27],
              ['agent/rv32-commit-difftest', 'ff079cf10fe4009a06cc72c6aac369690b43a302', 20],
              ['agent/rv32-gcc-difftest', '30dfa1ff9a9c944dcd5a9fc57de89fcd1ff304ec', 17],
              ['agent/rv32-load-store', '664ee1f8a75529d1de27c33732c299012a80d852', 16],
              ['agent/rv32-nemu-abi-probe', '08809b1f74ee7d009f5ed46da774d02dd5f5b17e', 18],
              ['agent/rv32im-coremark', '213b4f7c14910ced1a54d7d0bd26d27d501c473f', 21],
              ['agent/rv32im-embench-batch1', '8f08a2c37ed7307c7ae88efcd01f4c975ec661ed', 22],
              ['agent/rv32im-embench-batch2', '6f7f1d4ca7e01246f5204f0f197098dc39e5ffa0', 23],
              ['agent/rv32im-littlefs-basic', 'a2c76030a5b28872706200c7f7c41ccf5c0e9287', 24],
              ['agent/rv32im-machine-timer-interrupt', '789472cbdd6b4bf768d0f86bee086e0773ac1b4b', 28],
              ['agent/rv32im-preemptive-scheduler-main', 'dc5c95821d1ce48182a13948ecccad2acf544deb', 33],
              ['agent/rv32imu-pmp-isolation', 'ee462a9c6b88853f09033f3d77c679b4bdef7c4f', 36],
              ['agent/s0-bringup', '718e59185d43ac0761e660ac00df8c063d2e3903', 1],
              ['agent/s0-difftest-foundation', '8f4c9313b93df49d27557f3d8ca88522a9db76d3', 6],
              ['agent/s0-generated-difftest', 'bdd9a70cee4686ce585a16441e38cc3c1ec41fe5', 7],
              ['agent/s0-precise-faults', '7d9dbf13b110da0d9db0d0e0a66a5d1a18a04e99', 5],
              ['agent/s0-rv64i-complete', 'a00eaa5a97ef4d9a5e3cebd359271c19ec923151', 4],
              ['agent/s0-rv64i-matrix', 'dce0034ce051084c05ecfa85bff2cf5acf754f06', 3],
              ['agent/s0-rv64i-regression', '13f6b490e33e3867a8fc404ccbf8592b9aacbaca', 2],
              ['agent/s1-compiled-workloads', 'd7d8b69a95d6cf0001b7773b09d1bed3843832a6', 9],
              ['agent/s1-real-corpus', 'ef13c01d491ea08a8226d1614464dfbdf005f0c7', 10],
              ['agent/s1-rv64m', '01cb11188c9096f74398a616255ddb57322ab1dc', 8],
              ['agent/s1-upstream-software', '4ab9cfaa20d80baa3416d2eabe6535214c27038a', 11],
              ['fix/fast-host-data-multislot-clean', '855b2bbc2c2eb94ca803feb09568497cb15bcaec', 372],
              ['perf/shared-fast-adaptive-settle', '09cafa7509c8a49675d1e88a74a74f3b1a94d0cb', 363],
            ];
            const getRef = async ref => (await github.rest.git.getRef({owner, repo, ref})).data;
            const getOpenPRs = async () => github.paginate(github.rest.pulls.list, {owner, repo, state:'open', per_page:100});
            const prRefs = prs => {
              const reserved = new Set(['main', product, 'maintenance/verified-branch-prune-20261104']);
              for (const pr of prs) {
                reserved.add(pr.base.ref);
                if (pr.head.repo && pr.head.repo.full_name === owner + '/' + repo) {
                  reserved.add(pr.head.ref);
                }
              }
              return reserved;
            };
            const activeRuns = async () => {
              const branches = new Set();
              for (const status of ['queued', 'in_progress']) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                  {owner, repo, status, per_page:100});
                for (const run of runs) if (run.head_branch) branches.add(run.head_branch);
              }
              return branches;
            };
            const main = (await getRef('heads/main')).object.sha;
            if (main !== mainExpected) {
              throw new Error('main changed; refuse to prune: ' + main);
            }
            const prs = await getOpenPRs();
            const reserved = prRefs(prs);
            const running = await activeRuns();
            const alreadyDeleted = new Set();
            for (const [name, sha, prNumber] of targets) {
              if (reserved.has(name) || running.has(name)) {
                throw new Error('Target now in use: ' + name);
              }
              try {
                const branch = (await github.rest.repos.getBranch({owner,repo,branch:name})).data;
                if (branch.protected || branch.commit.sha !== sha) {
                  throw new Error('Protected/changed target ' + name + ' got ' + branch.commit.sha);
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                // Only permit resuming an earlier verified deletion when its archive exists.
                const archive = await getRef('tags/' + archivePrefix + name);
                if (archive.object.sha !== sha) throw new Error('Deleted ref archive mismatch: ' + name);
                alreadyDeleted.add(name);
              }
              const pr = (await github.rest.pulls.get({owner,repo,pull_number:prNumber})).data;
              if (pr.state !== 'closed' || !pr.merged_at || pr.base.ref !== 'main' ||
                  pr.head.ref !== name || (!alreadyDeleted.has(name) && pr.head.sha !== sha)) {
                throw new Error('Original merged PR metadata changed: #' + prNumber);
              }
              const compare = (await github.rest.repos.compareCommits({owner,repo,
                base:pr.merge_commit_sha,head:main})).data;
              if (!['ahead','identical'].includes(compare.status)) {
                throw new Error('Merged PR commit no longer in main: #' + prNumber);
              }
              console.log('PREFLIGHT PASS', name, sha, 'merged_pr', prNumber,
                alreadyDeleted.has(name) ? 'archived-already-deleted' : 'live');
            }
            console.log('PREFLIGHT_ALL_PASS', targets.length, 'open_prs', prs.length);

            // Create immutable recovery names before any target branch deletion.
            for (const [name, sha] of targets) {
              const tagName = archivePrefix + name;
              const ref = 'tags/' + tagName;
              try {
                const existing = await getRef(ref);
                if (existing.object.sha !== sha) {
                  throw new Error('Archive tag collision: ' + tagName);
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({owner,repo,ref:'refs/' + ref,sha});
              }
              const recorded = await getRef(ref);
              if (recorded.object.sha !== sha) throw new Error('Archive verification failed: ' + name);
              console.log('ARCHIVE_VERIFIED', tagName, sha);
            }
            console.log('ARCHIVE_ALL_PASS', targets.length);

            let deleted = 0;
            for (const [name, sha] of targets) {
              if (alreadyDeleted.has(name)) {
                console.log('ALREADY_DELETED', name, sha, 'archive', archivePrefix + name);
                continue;
              }
              const latest = await getRef('heads/' + name);
              if (latest.object.sha !== sha) throw new Error('STOP changed ref: ' + name);
              const nowPRs = prRefs(await getOpenPRs());
              if (nowPRs.has(name)) {
                throw new Error('STOP PR relationship changed: ' + name);
              }
              if ((await getRef('tags/' + archivePrefix + name)).object.sha !== sha) {
                throw new Error('STOP archive tag changed: ' + name);
              }
              const nowRunning = await activeRuns();
              if (nowRunning.has(name)) throw new Error('STOP active CI: ' + name);
              await github.rest.git.deleteRef({owner,repo,ref:'heads/' + name});
              let confirmedGone = false;
              for (let attempt = 0; attempt < 8; attempt++) {
                if (attempt) await new Promise(resolve => setTimeout(resolve, 2000));
                try {
                  await getRef('heads/' + name);
                } catch (error) {
                  if (error.status !== 404) throw error;
                  confirmedGone = true;
                  break;
                }
              }
              if (!confirmedGone) throw new Error('Deleted ref not yet verified absent: ' + name);
              deleted++;
              console.log('DELETED', name, sha, 'archive', archivePrefix + name);
            }
            console.log('BRANCH_PRUNE_DONE', 'newly_deleted=' + deleted,
              'already_deleted=' + alreadyDeleted.size, 'archived=' + targets.length);
            if (deleted + alreadyDeleted.size !== targets.length) throw new Error('Unexpected deletion count');
