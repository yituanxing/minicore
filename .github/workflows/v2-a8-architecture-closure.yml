name: AetherCore V2 A8 Architecture Closure

on:
  pull_request:
    paths:
      - docs/AETHERCORE_V2_SUPPORTED_ARCHITECTURAL_PROFILES.md
      - src/main/scala/aethercore/config/**
      - src/main/scala/aethercore/core/Rv32CDecompressor.scala
      - src/main/scala/aethercore/core/Rv32CParcelController.scala
      - src/main/scala/aethercore/core/v2/TinyPagedCore.scala
      - src/test/scala/aethercore/V2ArchitecturalProfileMatrixSpec.scala
      - src/test/scala/aethercore/V2A8CommonRvcProductionSpec.scala
      - tools/ensure_verilator_5_024.sh
      - .github/workflows/v2-a8-architecture-closure.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-v2-a8-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-matrix:
    name: Execute architecture/common-RVC contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AETHERCORE_MILL_NO_DAEMON: "1"
      AETHERCORE_VERILATOR_FAST_VERIFY: "1"
      AETHERCORE_TOOLCHAIN_JOBS: "4"

    steps:
      - name: Checkout exact architecture head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore exact fixed Verilator cache
        id: verilator-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-

      - name: Install Verilator build prerequisites on cache miss
        if: steps.verilator-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev build-essential git

      - name: Validate or build exact Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Save exact validated Verilator on cache miss
        if: success() && steps.verilator-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}

      - name: Execute A8 supported-profile and production common-RVC contracts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./mill
          ./mill aethercore.test.testOnly \
            aethercore.V2ArchitecturalProfileMatrixSpec \
            aethercore.V2A8CommonRvcProductionSpec

      - name: Record exact architecture closure identity
        if: always()
        shell: bash
        run: |
          {
            echo '## AetherCore v2 A8 architecture/common-RVC closure'
            echo
            echo '- exact head: `${{ github.event.pull_request.head.sha || github.sha }}`'
            echo '- exact base: `${{ github.event.pull_request.base.sha || 'workflow-dispatch' }}`'
            echo '- executed contracts: `V2ArchitecturalProfileMatrixSpec` + `V2A8CommonRvcProductionSpec`'
            echo '- RV64C implementation capability is exercised on the production TinyPagedCore path.'
            echo '- Published RV64 compressed machine profile: `CoreProfiles.rv64imcSoftware` (`rv64imc_zicsr / lp64`).'
            echo '- RV64 application profile remains C-free pending privileged/VM/PMP cross-product qualification.'
          } >> "$GITHUB_STEP_SUMMARY"
