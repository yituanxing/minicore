name: RV32IM CoreMark

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv32im-coremark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coremark:
    name: Pinned CoreMark on RV32IM
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8
        with:
          job: rv32im-coremark

      - name: Install Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 bison flex \
            libreadline-dev libsdl2-dev zstd libzstd-dev \
            file binutils verilator \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
          java -version
          verilator --version
          riscv64-unknown-elf-gcc --version

      - name: Prepare Mill launcher
        run: |
          chmod +x mill
          ./mill --version

      - name: Build exact frozen RV32 NEMU reference
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          NEMU_SINGLE_STEP=1 bash tools/probe_rv32_nemu_historical.sh \
            "$(pwd)/build/rv32-nemu-probe" \
            2>&1 | tee build/rv32-nemu-probe.log
          grep -q '^reference_sha256=1dc17e1d2c8d27959fc3fa30163a350a57c688e102c64372e396f350699db577$' \
            build/rv32-nemu-probe/evidence/result.txt
          reference_so="$(find build/rv32-nemu-probe/nemu/build -maxdepth 1 -type f \
            -name 'riscv32-nemu-interpreter-so*' -print -quit)"
          test -n "$reference_so"
          echo "RV32_NEMU_SO=$reference_so" >> "$GITHUB_ENV"

      - name: Build pinned RV32IM CoreMark
        shell: bash
        run: |
          make -f Makefile.rv32im-coremark workload
          manifest=build/rv32im-coremark/software/manifest.txt
          disassembly=build/rv32im-coremark/software/coremark_rv32im_O2.dis
          grep -q '^source=coremark@1f483d5b8316753a742cbf5590caf5bd0a4e4777$' "$manifest"
          grep -q '^march=rv32im$' "$manifest"
          grep -q '^mabi=ilp32$' "$manifest"
          grep -q '^bytes=10244$' "$manifest"
          grep -q '^sha256=6e094fad601d16ca8279065ab01083583749d2fb654e4a75bf4d0427df8c5c59$' "$manifest"

          mul_count="$(awk '$3 == "mul" { count++ } END { print count + 0 }' "$disassembly")"
          divu_count="$(awk '$3 == "divu" { count++ } END { print count + 0 }' "$disassembly")"
          test "$mul_count" -eq 12
          test "$divu_count" -eq 5
          if grep -Eq '\<(mulh|mulhu|mulhsu|div|rem|remu)\>' "$disassembly"; then
            echo 'ERROR: unexpected RV32IM M-opcode mix changed' >&2
            exit 1
          fi
          printf 'mul=%s\ndivu=%s\n' "$mul_count" "$divu_count" \
            | tee build/rv32im-coremark/software/m-opcode-counts.txt

      - name: Run RV32IM CoreMark DiffTest
        shell: bash
        run: |
          set -o pipefail
          make -f Makefile.rv32im-coremark run RV32_NEMU_SO="$RV32_NEMU_SO" \
            2>&1 | tee build/rv32im-coremark/coremark-rv32im.log
          grep -Fq \
            'PASS: self-check exit=0 after 883272 cycles, 646301 committed instructions, stall-period=5, difftest=646301' \
            build/rv32im-coremark/coremark-rv32im.log

      - name: Upload RV32IM CoreMark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32im-coremark-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/rv32-nemu-probe.log
            build/rv32-nemu-probe/evidence/
            build/rv32im-coremark/
            build/upstream-src/coremark-*/LICENSE.md
