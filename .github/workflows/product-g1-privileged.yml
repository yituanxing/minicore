name: AetherCore Product G1 Paged and Privileged Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/core/product/**'
      - 'src/main/scala/aethercore/core/semantic/**'
      - 'src/main/scala/aethercore/core/v2/**'
      - 'src/main/scala/aethercore/core/MachineCsrFile.scala'
      - 'src/main/scala/aethercore/ElaborateProductSmallPagedCore.scala'
      - 'src/test/scala/aethercore/SystemSemanticEvaluatorSpec.scala'
      - 'src/test/scala/aethercore/ProductSystemCoreSpec.scala'
      - 'src/test/scala/aethercore/ProductSmallPagedCoreSpec.scala'
      - 'src/test/scala/aethercore/FloatingCsrFileSpec.scala'
      - '.github/workflows/product-g1-privileged.yml'

permissions:
  contents: read

concurrency:
  group: aethercore-product-g1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product-g1:
    name: Product shared SYSTEM, paged frontend and RTL
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      AETHERCORE_VERILATOR_FAST_VERIFY: "1"
      AETHERCORE_TOOLCHAIN_JOBS: "4"
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore exact fixed Verilator cache
        id: verilator-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-

      - name: Install Verilator build prerequisites on cache miss
        if: steps.verilator-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev build-essential git

      - name: Configure G1 build directory
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          root="$RUNNER_TEMP/aethercore-product-g1"
          mkdir -p "$root/mill-out"
          echo "MILL_OUTPUT_DIR=$root/mill-out" >> "$GITHUB_ENV"

      - name: Restore previous G1 Mill output accelerator
        id: mill-output-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/aethercore-product-g1/mill-out
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-g1-millout-v1-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-product-g1-millout-v1-
            aethercore-${{ runner.os }}-${{ runner.arch }}-v2-f7-millout-v1-

      - name: Validate or build exact Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Save exact validated Verilator on cache miss
        if: success() && steps.verilator-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}

      - name: Run Product G1 directed Chisel simulations
        shell: bash
        run: |
          ./mill aethercore.test.testOnly \
            aethercore.SystemSemanticEvaluatorSpec \
            aethercore.FloatingCsrFileSpec \
            aethercore.ProductSystemCoreSpec \
            aethercore.ProductSmallPagedCoreSpec

      - name: Elaborate Product SmallPagedCore RTL
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/aethercore-product-g1/paged-rtl"
          mkdir -p "$target"
          ./mill aethercore.runMain aethercore.ElaborateProductSmallPagedCore --target-dir "$target"
          find "$target" -maxdepth 1 -name '*.sv' -print -quit | grep -q .

      - name: Save validated G1 Mill output accelerator
        if: success() && steps.mill-output-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/aethercore-product-g1/mill-out
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-g1-millout-v1-${{ github.event.pull_request.head.sha || github.sha }}
