name: Post-46k Backend Hotspot Split

on:
  pull_request:
    paths:
      - '.github/workflows/post-46k-backend-hotspots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys jq
          yosys -V

      - name: Elaborate exact current product CPU
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          out="$RUNNER_TEMP/post-46k-backend-hotspots"
          rm -rf "$out"
          mkdir -p "$out/core" "$out/mapped"
          ./mill aethercore.runMain aethercore.ElaborateV2CoreSynthesisRV64 --target-dir "$out/core"
          echo "AREA_OUT=$out" >> "$GITHUB_ENV"

      - name: Map backend sub-cones
        shell: bash
        run: |
          set -euo pipefail

          map_top() {
            local top="$1"
            local tag="$2"
            if ! grep -Rqs "^module $top[ (]" "$AREA_OUT/core"; then
              echo "SKIP $top: emitted module not present" | tee "$AREA_OUT/mapped/$tag.skip"
              return 0
            fi
            mapfile -t svs < <(find "$AREA_OUT/core" -maxdepth 1 -name '*.sv' -print | sort)
            local read_cmd="read_verilog -sv -DSYNTHESIS"
            for sv in "${svs[@]}"; do read_cmd+=" $sv"; done
            yosys -Q -p "$read_cmd; hierarchy -check -top $top; synth_ecp5 -top $top -json $AREA_OUT/mapped/$tag.json; stat -top $top" \
              2>&1 | tee "$AREA_OUT/mapped/$tag.log"
            printf '%s\n' "$top" > "$AREA_OUT/mapped/$tag.top"
          }

          # Context owners.
          map_top TinyLoadQueueMemoryBackend memory_backend
          map_top TinyDependencyBackend dependency_backend
          map_top TinyDualReplaySafeLoadUnit loadq2_unit
          map_top TinyBlockingLsu blocking_lsu
          map_top TinySelectiveExecutionCluster execution_cluster

          # Dependency / scheduling split.
          map_top TinyDependencyState dependency_state
          map_top TinyPhysicalLoadQueueIssue load_issue
          map_top TinyPhysicalSelectiveComputeIssue compute_issue
          map_top TinySelectiveComputeIssue legacy_compute_issue
          map_top RegisterFile register_file
          map_top TinyRob rob

          # Execution split.
          map_top V2IntegerUnit integer_unit
          map_top V2MulUnit mul_unit
          map_top V2IterativeDivider divider
          map_top V2BranchUnit branch_unit
          map_top TinySystemCompletion system_completion

          # Translation / protection context.
          map_top TranslationUnit translation_unit
          map_top TranslationTlb translation_tlb
          map_top DataPathAdapter data_path_adapter
          map_top PmpChecker pmp_checker
          map_top MachineCsrFile csr

      - name: Summarize split
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["AREA_OUT"]) / "mapped"
          rows = []
          for path in sorted(root.glob("*.json")):
              top = path.with_suffix(".top").read_text().strip()
              net = json.loads(path.read_text())
              types = Counter(c["type"] for c in net["modules"][top]["cells"].values())
              rows.append({
                  "tag": path.stem,
                  "top": top,
                  "cells": sum(types.values()),
                  "lut4": types["LUT4"],
                  "ff": types["TRELLIS_FF"],
                  "dpr16x4": types["TRELLIS_DPR16X4"],
                  "mult": types["MULT18X18D"],
                  "ccu2c": types["CCU2C"],
                  "pfumx": types["PFUMX"],
                  "l6mux21": types["L6MUX21"],
              })
          rows.sort(key=lambda r: r["lut4"], reverse=True)
          out = {
              "baseline_sha": os.environ.get("GITHUB_SHA"),
              "formal_full_soc_lut4": 46444,
              "ranking": rows,
              "skipped": [p.stem for p in sorted(root.glob("*.skip"))],
          }
          (root / "hotspots.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          print("\nLUT4 ranking:")
          for r in rows:
              print(f"{r['lut4']:>7}  {r['ff']:>7} FF  {r['pfumx']:>5} PFUMX  {r['l6mux21']:>5} L6MUX  {r['tag']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-46k-backend-hotspots-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.AREA_OUT }}/mapped/hotspots.json
            ${{ env.AREA_OUT }}/mapped/*.log
            ${{ env.AREA_OUT }}/mapped/*.top
            ${{ env.AREA_OUT }}/mapped/*.skip
