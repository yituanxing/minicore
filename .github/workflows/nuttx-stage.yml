name: NuttX Staged Bring-up

on:
  push:
    branches:
      - agent/nuttx-**
    paths:
      - software/nuttx/**
      - tests_py/test_nuttx_*.py
      - tools/ci/nuttx_*.sh
      - .github/workflows/nuttx-stage.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: nuttx-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n1:
    name: N1 pinned RV32IM host build
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 45

    steps:
      - name: Publish pending NuttX stage status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'nuttx/stage',
              description: 'NuttX N1 pinned RV32IM build is running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Checkout AetherCore
        uses: actions/checkout@v4

      - name: Validate NuttX stage contracts
        run: python3 -m unittest tests_py.test_nuttx_n1_contract -v

      - name: Inspect persistent pinned source cache
        id: source_cache
        shell: bash
        run: |
          set -euo pipefail
          source software/nuttx/manifest.env
          cache_root="${AETHERCORE_CACHE_ROOT:-${HOME}/.cache/aethercore}/nuttx"
          archive_dir="${cache_root}/archives"
          nuttx_archive="${archive_dir}/nuttx-${NUTTX_COMMIT}.tar.gz"
          apps_archive="${archive_dir}/nuttx-apps-${NUTTX_APPS_COMMIT}.tar.gz"
          mkdir -p "${archive_dir}"
          rm -f "${archive_dir}/"*.tmp

          validate_archive() {
            local archive="$1"
            if [[ -s "${archive}" ]] && tar -tzf "${archive}" >/dev/null 2>&1; then
              printf true
            else
              rm -f "${archive}"
              printf false
            fi
          }

          nuttx_hit="$(validate_archive "${nuttx_archive}")"
          apps_hit="$(validate_archive "${apps_archive}")"
          echo "nuttx_hit=${nuttx_hit}" >> "${GITHUB_OUTPUT}"
          echo "apps_hit=${apps_hit}" >> "${GITHUB_OUTPUT}"
          if [[ "${nuttx_hit}" == true && "${apps_hit}" == true ]]; then
            echo "hit=true" >> "${GITHUB_OUTPUT}"
            echo "N1: persistent pinned source cache hit"
          else
            echo "hit=false" >> "${GITHUB_OUTPUT}"
            echo "N1: source cache miss nuttx=${nuttx_hit} apps=${apps_hit}"
          fi

      - name: Configure reliable Git transport
        if: steps.source_cache.outputs.hit != 'true'
        shell: bash
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      - name: Checkout pinned Apache NuttX
        if: steps.source_cache.outputs.nuttx_hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: apache/nuttx
          ref: 273c77128b6698f0c95f0d7cde1d0bb803782021
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          path: build/upstream/nuttx

      - name: Persist pinned Apache NuttX source
        if: steps.source_cache.outputs.nuttx_hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source software/nuttx/manifest.env
          test "$(git -C build/upstream/nuttx rev-parse HEAD)" = "${NUTTX_COMMIT}"
          archive_dir="${AETHERCORE_CACHE_ROOT:-${HOME}/.cache/aethercore}/nuttx/archives"
          archive="${archive_dir}/nuttx-${NUTTX_COMMIT}.tar.gz"
          temporary="${archive}.tmp"
          mkdir -p "${archive_dir}"
          rm -f "${temporary}"
          tar --exclude=.git -czf "${temporary}" -C build/upstream nuttx
          tar -tzf "${temporary}" >/dev/null
          mv "${temporary}" "${archive}"
          echo "N1: persisted ${archive}"

      - name: Checkout pinned Apache NuttX Apps
        if: steps.source_cache.outputs.apps_hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: apache/nuttx-apps
          ref: 20ffb1a3a3b590d52890ee865a28442390e5d16c
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          path: build/upstream/nuttx-apps

      - name: Persist pinned Apache NuttX Apps source
        if: steps.source_cache.outputs.apps_hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source software/nuttx/manifest.env
          test "$(git -C build/upstream/nuttx-apps rev-parse HEAD)" = "${NUTTX_APPS_COMMIT}"
          archive_dir="${AETHERCORE_CACHE_ROOT:-${HOME}/.cache/aethercore}/nuttx/archives"
          archive="${archive_dir}/nuttx-apps-${NUTTX_APPS_COMMIT}.tar.gz"
          temporary="${archive}.tmp"
          mkdir -p "${archive_dir}"
          rm -f "${temporary}"
          tar --exclude=.git -czf "${temporary}" -C build/upstream nuttx-apps
          tar -tzf "${temporary}" >/dev/null
          mv "${temporary}" "${archive}"
          echo "N1: persisted ${archive}"

      - name: Verify complete persistent source cache
        shell: bash
        run: |
          set -euo pipefail
          source software/nuttx/manifest.env
          archive_dir="${AETHERCORE_CACHE_ROOT:-${HOME}/.cache/aethercore}/nuttx/archives"
          tar -tzf "${archive_dir}/nuttx-${NUTTX_COMMIT}.tar.gz" >/dev/null
          tar -tzf "${archive_dir}/nuttx-apps-${NUTTX_APPS_COMMIT}.tar.gz" >/dev/null

      - name: Build pinned NuttX N1 image
        shell: bash
        env:
          NUTTX_JOBS: "6"
        run: |
          chmod +x tools/ci/nuttx_n1_build.sh
          bash tools/ci/nuttx_n1_build.sh

      - name: Upload NuttX N1 evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-nuttx-n1-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/nuttx-n1/nuttx.elf
            build/nuttx-n1/nuttx.bin
            build/nuttx-n1/nuttx.hex
            build/nuttx-n1/nuttx.map
            build/nuttx-n1/nuttx.config
            build/nuttx-n1/build.log
            build/nuttx-n1/evidence/

      - name: Publish final NuttX stage status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}';
            const state = result === 'success' ? 'success' : (result === 'cancelled' ? 'error' : 'failure');
            const description = state === 'success'
              ? 'NuttX N1 pinned RV32IM build passed'
              : `NuttX N1 build ${result}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'nuttx/stage',
              description,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
