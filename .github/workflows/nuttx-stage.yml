name: NuttX Staged Bring-up

on:
  push:
    branches:
      - agent/nuttx-**
    paths:
      - software/nuttx/**
      - tests_py/test_nuttx_*.py
      - tools/ci/nuttx_*.sh
      - tools/fetch_range_archive.py
      - tests_py/test_range_archive_fetcher.py
      - .github/workflows/nuttx-stage.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: nuttx-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  n1:
    name: N1 pinned RV32IM host build
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 45

    steps:
      - name: Publish pending NuttX stage status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'nuttx/stage',
              description: 'NuttX N1 pinned RV32IM build is running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Checkout AetherCore
        uses: actions/checkout@v4

      - name: Validate NuttX stage contracts
        run: |
          python3 -m unittest \
            tests_py.test_nuttx_n1_contract \
            tests_py.test_range_archive_fetcher -v

      - name: Fetch verified pinned NuttX release sources
        shell: bash
        run: |
          set -euo pipefail
          source software/nuttx/manifest.env
          cache_root="${AETHERCORE_CACHE_ROOT:-${HOME}/.cache/aethercore}/nuttx"
          archive_dir="${cache_root}/archives"
          mkdir -p "${archive_dir}" build

          fetch_release() {
            local release_name="$1"
            local output_name="$2"
            python3 tools/fetch_range_archive.py \
              --url "https://archive.apache.org/dist/nuttx/${NUTTX_VERSION}/${release_name}" \
              --url "https://downloads.apache.org/nuttx/${NUTTX_VERSION}/${release_name}" \
              --sha512-url "https://downloads.apache.org/nuttx/${NUTTX_VERSION}/${release_name}.sha512" \
              --output "${archive_dir}/${output_name}" \
              --chunk-size 1048576 \
              --jobs 6 \
              --retries 5 \
              --max-time 180
            tar -tzf "${archive_dir}/${output_name}" >/dev/null
          }

          {
            fetch_release \
              "apache-nuttx-${NUTTX_VERSION}.tar.gz" \
              "nuttx-${NUTTX_COMMIT}.tar.gz"
            fetch_release \
              "apache-nuttx-apps-${NUTTX_VERSION}.tar.gz" \
              "nuttx-apps-${NUTTX_APPS_COMMIT}.tar.gz"
          } 2>&1 | tee build/nuttx-source-fetch.log

      - name: Build pinned NuttX N1 image
        shell: bash
        env:
          NUTTX_JOBS: "6"
        run: |
          chmod +x tools/ci/nuttx_n1_build.sh
          bash tools/ci/nuttx_n1_build.sh
          cp build/nuttx-source-fetch.log build/nuttx-n1/evidence/source-fetch-range.log

      - name: Upload NuttX N1 evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-nuttx-n1-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/nuttx-source-fetch.log
            build/nuttx-n1/nuttx.elf
            build/nuttx-n1/nuttx.bin
            build/nuttx-n1/nuttx.hex
            build/nuttx-n1/nuttx.map
            build/nuttx-n1/nuttx.config
            build/nuttx-n1/build.log
            build/nuttx-n1/evidence/

      - name: Publish final NuttX stage status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}';
            const state = result === 'success' ? 'success' : (result === 'cancelled' ? 'error' : 'failure');
            const description = state === 'success'
              ? 'NuttX N1 pinned RV32IM build passed'
              : `NuttX N1 build ${result}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'nuttx/stage',
              description,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
