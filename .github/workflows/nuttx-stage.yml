name: NuttX Staged Bring-up

on:
  push:
    branches:
      - agent/nuttx-**
    paths:
      - software/nuttx/**
      - tests_py/test_nuttx_*.py
      - tools/ci/nuttx_*.sh
      - .github/workflows/nuttx-stage.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: nuttx-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: N1 pinned source bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Publish pending source status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'nuttx/source',
              description: 'Pinned NuttX source bootstrap is running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Checkout AetherCore manifest
        uses: actions/checkout@v4
        with:
          path: aethercore

      - name: Checkout pinned Apache NuttX
        uses: actions/checkout@v4
        with:
          repository: apache/nuttx
          ref: 273c77128b6698f0c95f0d7cde1d0bb803782021
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          path: upstream/nuttx

      - name: Checkout pinned Apache NuttX Apps
        uses: actions/checkout@v4
        with:
          repository: apache/nuttx-apps
          ref: 20ffb1a3a3b590d52890ee865a28442390e5d16c
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          path: upstream/nuttx-apps

      - name: Verify and package pinned sources
        shell: bash
        run: |
          set -euo pipefail
          source aethercore/software/nuttx/manifest.env
          test "$(git -C upstream/nuttx rev-parse HEAD)" = "${NUTTX_COMMIT}"
          test "$(git -C upstream/nuttx-apps rev-parse HEAD)" = "${NUTTX_APPS_COMMIT}"

          output="${PWD}/source-artifact"
          mkdir -p "${output}"
          tar --exclude=.git -czf "${output}/nuttx-${NUTTX_COMMIT}.tar.gz" \
            -C upstream nuttx
          tar --exclude=.git -czf "${output}/nuttx-apps-${NUTTX_APPS_COMMIT}.tar.gz" \
            -C upstream nuttx-apps
          tar -tzf "${output}/nuttx-${NUTTX_COMMIT}.tar.gz" >/dev/null
          tar -tzf "${output}/nuttx-apps-${NUTTX_APPS_COMMIT}.tar.gz" >/dev/null
          (cd "${output}" && sha256sum ./*.tar.gz > source-archives.sha256)

      - name: Upload pinned source bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-nuttx-source-${{ github.run_id }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: source-artifact/

      - name: Publish final source status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}';
            const state = result === 'success' ? 'success' : (result === 'cancelled' ? 'error' : 'failure');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'nuttx/source',
              description: state === 'success' ? 'Pinned NuttX source bootstrap passed' : `NuttX source bootstrap ${result}`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

  n1:
    name: N1 pinned RV32IM host build
    needs: source
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 45

    steps:
      - name: Publish pending NuttX stage status
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'nuttx/stage',
              description: 'NuttX N1 pinned RV32IM build is running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

      - name: Checkout AetherCore
        uses: actions/checkout@v4

      - name: Download pinned source bootstrap
        uses: actions/download-artifact@v4
        with:
          name: aethercore-nuttx-source-${{ github.run_id }}
          path: build/nuttx-source

      - name: Seed persistent self-hosted source cache
        shell: bash
        run: |
          set -euo pipefail
          source software/nuttx/manifest.env
          source_dir="${PWD}/build/nuttx-source"
          cache_root="${AETHERCORE_CACHE_ROOT:-${HOME}/.cache/aethercore}/nuttx"
          archive_dir="${cache_root}/archives"
          mkdir -p "${archive_dir}"
          (cd "${source_dir}" && sha256sum -c source-archives.sha256)

          install_archive() {
            local source_archive="$1"
            local destination="$2"
            local temporary="${destination}.tmp"
            rm -f "${temporary}"
            cp "${source_archive}" "${temporary}"
            tar -tzf "${temporary}" >/dev/null
            mv "${temporary}" "${destination}"
          }

          install_archive \
            "${source_dir}/nuttx-${NUTTX_COMMIT}.tar.gz" \
            "${archive_dir}/nuttx-${NUTTX_COMMIT}.tar.gz"
          install_archive \
            "${source_dir}/nuttx-apps-${NUTTX_APPS_COMMIT}.tar.gz" \
            "${archive_dir}/nuttx-apps-${NUTTX_APPS_COMMIT}.tar.gz"

      - name: Validate NuttX stage contracts
        run: python3 -m unittest tests_py.test_nuttx_n1_contract -v

      - name: Build pinned NuttX N1 image
        shell: bash
        env:
          NUTTX_JOBS: "6"
        run: |
          chmod +x tools/ci/nuttx_n1_build.sh
          bash tools/ci/nuttx_n1_build.sh

      - name: Upload NuttX N1 evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-nuttx-n1-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/nuttx-n1/nuttx.elf
            build/nuttx-n1/nuttx.bin
            build/nuttx-n1/nuttx.hex
            build/nuttx-n1/nuttx.map
            build/nuttx-n1/nuttx.config
            build/nuttx-n1/build.log
            build/nuttx-n1/evidence/

      - name: Publish final NuttX stage status
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const result = '${{ job.status }}';
            const state = result === 'success' ? 'success' : (result === 'cancelled' ? 'error' : 'failure');
            const description = state === 'success'
              ? 'NuttX N1 pinned RV32IM build passed'
              : `NuttX N1 build ${result}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'nuttx/stage',
              description,
              target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });
