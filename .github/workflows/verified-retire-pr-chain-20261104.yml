name: Verified retire PR chain batch 13 (2026-11-04)
on:
  push:
    branches:
      - maintenance/verified-branch-prune-20261104
    paths:
      - .github/workflows/verified-retire-pr-chain-20261104.yml
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: verified-retire-pr-chain-20261104
  cancel-in-progress: false
jobs:
  retire-exact-chain:
    name: Close 11 integrated PRs child-first and CAS-delete archived heads
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout only maintenance branch for CAS remote ref deletion
        uses: actions/checkout@v4
        with:
          ref: maintenance/verified-branch-prune-20261104
          fetch-depth: 1
          persist-credentials: true
      - name: Validate all, close 11 child-first, then lease-delete only exact tips
        uses: actions/github-script@v7
        with:
          script: |
            // Batch 13: close 11 child-to-parent PRs, then CAS-delete exact archived heads.
            const {owner,repo}=context.repo;
            const maintenance='maintenance/verified-branch-prune-20261104';
            if(owner!=='yituanxing'||repo!=='minicore'||context.ref!=='refs/heads/'+maintenance)
              throw new Error('Unexpected owner/repository/branch');
            const mainExpected='7ff35c6acdc3068754292bba814e4ec52ba4ec50';
            const product='design/rv64gc-product-architecture-20261103';
            const productExpected='087a3ed9588c8fe4ff99b682957f3adbe70230aa';
            const archivePrefix='branch-archive/2026-11-04/chain-125-74/';
            const targets=[
              [
                103,
                "refactor/rv32c-fetch-fault-address",
                "56d88ecb8a80f2ca28a2af41261d574448ece751"
              ],
              [
                102,
                "refactor/rv32c-retire-length",
                "f4da0d703b10c7746a3d116b54c8b86b432f4a36"
              ],
              [
                101,
                "refactor/rv32c-instruction-transaction-width",
                "1c8bdfef0b58e5d7600785535ff15a939e943c0c"
              ],
              [
                100,
                "refactor/rv32c-instruction-length",
                "35aa3b0a4f68ab861fa13f806cc1589dd7398c7c"
              ],
              [
                99,
                "ci/l32-transactional-linux-cache",
                "fac1d322a9d4c40a9bfef8c22baa0e6b6c54f19b"
              ],
              [
                98,
                "frontier/sv32-pmp-linux",
                "19ead0c9bb5b8562871f263e072f4a19c16b9319"
              ],
              [
                97,
                "refactor/sv32-pmp-vertical-composition",
                "996ab09eb728c38afa7ce3421b03354ad02e9464"
              ],
              [
                96,
                "refactor/physical-fetch-request-valid",
                "2c1fc6deff8f5212911b49beaa740391b70dcfe9"
              ],
              [
                95,
                "refactor/pmp-production-pa-geometry",
                "6582777bb8734ad46411b28881cbeacf86874d9a"
              ],
              [
                89,
                "agent/umode-pmp16-surface",
                "990497c35db94a715a8cea4a9e08d900dbee4166"
              ],
              [
                88,
                "refactor/pmp-physical-address-geometry",
                "080627b915f966bc3c947794f115155e82083323"
              ]
            ];
            const nextBase='fix/data-address-misaligned-v2'; // PR #87 head, NOT touched in this batch
            const staleRunIds=new Set([32217536226,32216610620]);
            const staleEvidence=new Map([
             [32217536226,['2c708adc07d770e583cc9667a6f6a586416147f7','2026-08-19T04:55:52Z',32224026646]],
             [32216610620,['c9478de262e56dea2f8c9e75590e5f61c3f4ae56','2026-08-19T04:40:26Z',32224026615]]
            ]);
            const git=require('child_process');
            // Retry only transient read failures. Never silently retry destructive writes.
            const retry=async(label,fn)=>{
              for(let n=0;n<5;n++){
                try{return await fn();}
                catch(e){
                  const transient=e.status===429||e.status>=500||
                    /fetch failed|ECONNRESET|ETIMEDOUT|socket hang up/i.test(String(e.message||''));
                  if(!transient||n===4)throw e;
                  const ms=500*Math.pow(2,n);
                  console.log('TRANSIENT_READ_RETRY',label,n+1,ms,String(e.message).slice(0,140));
                  await new Promise(resolve=>setTimeout(resolve,ms));
                }
              }
            };
            const getRef=async ref=>(await retry('getRef '+ref,()=>github.rest.git.getRef({owner,repo,ref}))).data;
            const getPR=async num=>(await retry('getPR '+num,()=>github.rest.pulls.get({owner,repo,pull_number:num}))).data;
            const openPRs=async()=>retry('openPRs',()=>github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100}));
            const pin=async()=>{
              const main=(await getRef('heads/main')).object.sha;
              const productSHA=(await getRef('heads/'+product)).object.sha;
              if(main!==mainExpected||productSHA!==productExpected)
                throw new Error('Main/Product moved: '+main+' / '+productSHA);
            };
            const referencesOther=(prs,name,number)=>prs.some(p=>p.number!==number&&
              (p.base.ref===name||(p.head.repo&&p.head.repo.full_name===owner+'/'+repo&&p.head.ref===name)));
            const refsExternal=(prs,name,number)=>prs.some(p=>p.number!==number&&
              !targets.some(t=>t[0]===p.number)&&
              (p.base.ref===name||(p.head.repo&&p.head.repo.full_name===owner+'/'+repo&&p.head.ref===name)));
            const checkZombie=async run=>{
              if(!staleRunIds.has(run.id)||run.status!=='queued')return false;
              const [sha,created,successor]=staleEvidence.get(run.id);
              const now=(await retry('getRun '+run.id,()=>github.rest.actions.getWorkflowRun({owner,repo,run_id:run.id}))).data;
              if(now.status!=='queued'||now.head_branch!=='explore/rv64a-v1'||
                 now.head_sha!==sha||now.created_at!==created||now.updated_at!==created||
                 Date.now()-Date.parse(created)<35*86400000)return false;
              const jobs=(await retry('listJobs '+run.id,()=>github.rest.actions.listJobsForWorkflowRun({owner,repo,run_id:run.id,per_page:100}))).data;
              if(jobs.total_count!==0)return false;
              const later=(await retry('getRun '+successor,()=>github.rest.actions.getWorkflowRun({owner,repo,run_id:successor}))).data;
              if(later.status!=='completed'||later.conclusion!=='success'||
                 later.workflow_id!==now.workflow_id||
                 later.head_sha!=='2c708adc07d770e583cc9667a6f6a586416147f7')return false;
              return true;
            };
            const activeFor=async(name,number)=>{
              for(const status of ['queued','in_progress','waiting','pending','requested']){
                const runs=await retry('activeRuns '+status,()=>github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                  {owner,repo,status,per_page:100}));
                for(const run of runs){
                  const applies=run.head_branch===name||
                    (run.pull_requests||[]).some(p=>p.number===number);
                  if(!applies)continue;
                  if(await checkZombie(run)){
                    console.log('EXACT_STUCK_CI_EXCEPTION',run.id,'still queued/no jobs since Aug19');
                    continue;
                  }
                  throw new Error('STOP real CI on #'+number+' run='+run.id+' status='+run.status);
                }
              }
            };
            const targetOrder=new Map(targets.map((t,i)=>[t[0],i]));
            const archiveSHA=async(name)=>(await getRef('tags/'+archivePrefix+name)).object.sha;
            await pin();
            const prs=await openPRs();
            let initiallyClosed=0;
            for(let i=0;i<targets.length;i++){
              const [number,name,sha]=targets[i];
              const expectedBase=i+1<targets.length?targets[i+1][1]:nextBase;
              const p=await getPR(number);
              if(!['open','closed'].includes(p.state)||p.merged_at||
                 p.head.ref!==name||p.head.sha!==sha||p.base.ref!==expectedBase||
                 !p.head.repo||p.head.repo.full_name!==owner+'/'+repo)
                throw new Error('PR state/ref/SHA/base changed: #'+number);
              if(refsExternal(prs,name,number))
                throw new Error('External open PR references target: '+name);
              const badInternal=prs.some(q=>q.number!==number&&targetOrder.has(q.number)&&
                (q.base.ref===name||
                  (q.head.repo&&q.head.repo.full_name===owner+'/'+repo&&q.head.ref===name))&&
                targetOrder.get(q.number)>=i);
              if(badInternal)throw new Error('Child-first order violated at #'+number);
              if(await archiveSHA(name)!==sha)throw new Error('Exact archive SHA mismatch: '+name);
              try{
                const b=(await retry('getBranch '+name,()=>github.rest.repos.getBranch({owner,repo,branch:name}))).data;
                if(b.protected||b.commit.sha!==sha)throw new Error('Protected/changed branch: '+name);
              }catch(e){
                if(e.status!==404||p.state!=='closed')throw e;
              }
              const cmp=(await retry('compare '+name,()=>github.rest.repos.compareCommits({owner,repo,base:sha,head:mainExpected}))).data;
              if(!['ahead','identical'].includes(cmp.status)||cmp.behind_by!==0)
                throw new Error('Not included in main: '+name);
              await activeFor(name,number);
              if(p.state==='closed')initiallyClosed++;
              console.log('PREFLIGHT_PASS',number,name,sha,p.state,'base',expectedBase);
            }
            console.log('PREFLIGHT_ALL_PASS',targets.length,'openPRs',prs.length,'alreadyClosed',initiallyClosed);
            await pin();
            let newlyClosed=0;
            for(const [number,name,sha] of targets){
              const p=await getPR(number);
              if(p.state==='closed'){
                if(p.merged_at)throw new Error('Unexpected merged PR: #'+number);
                console.log('ALREADY_CLOSED',number);continue;
              }
              if(p.state!=='open'||p.head.ref!==name||p.head.sha!==sha)
                throw new Error('PR changed before close: #'+number);
              if(referencesOther(await openPRs(),name,number))
                throw new Error('STOP another open PR depends on '+name);
              if((await getRef('heads/'+name)).object.sha!==sha||await archiveSHA(name)!==sha)
                throw new Error('STOP head/archive moved: '+name);
              await activeFor(name,number);
              await pin();
              await github.rest.pulls.update({owner,repo,pull_number:number,state:'closed'});
              const closed=await getPR(number);
              if(closed.state!=='closed'||closed.merged_at)
                throw new Error('Closure not verified: #'+number);
              newlyClosed++;
              console.log('CLOSED_UNMERGED',number,name,sha);
            }
            console.log('CLOSE_ALL_PASS',newlyClosed,'previous',initiallyClosed);
            await pin();
            let deleted=0,alreadyDeleted=0;
            for(const [number,name,sha] of targets){
              const p=await getPR(number);
              if(p.state!=='closed'||p.merged_at)throw new Error('PR reopened/merged: #'+number);
              if(referencesOther(await openPRs(),name,number))
                throw new Error('STOP open PR references '+name);
              if(await archiveSHA(name)!==sha)throw new Error('Archive changed: '+name);
              await activeFor(name,number);
              await pin();
              try{
                const b=(await retry('getBranch '+name,()=>github.rest.repos.getBranch({owner,repo,branch:name}))).data;
                if(b.protected||b.commit.sha!==sha)throw new Error('Branch protected/moved: '+name);
              }catch(e){
                if(e.status!==404)throw e;
                alreadyDeleted++;console.log('ALREADY_DELETED',number,name);continue;
              }
              // This explicit expected-SHA lease is an atomic server-side compare-and-delete.
              const args=['push','--force-with-lease=refs/heads/'+name+':'+sha,
                'origin',':refs/heads/'+name];
              try{
                git.execFileSync('git',args,{cwd:process.env.GITHUB_WORKSPACE,encoding:'utf8',timeout:60000});
              }catch(error){throw new Error('CAS git push delete refused: '+name+' '+String(error.stderr||error.message).slice(0,500));}
              let gone=false;
              for(let attempt=0;attempt<8;attempt++){
                try{await getRef('heads/'+name);}
                catch(e){if(e.status!==404)throw e;gone=true;break;}
                if(attempt<7)await new Promise(resolve=>setTimeout(resolve,1500));
              }
              if(!gone)throw new Error('Delete not yet verified: '+name);
              deleted++;
              console.log('CAS_DELETED',number,name,sha,'archive',archivePrefix+name);
            }
            await pin();
            console.log('CHAIN_BATCH_DONE','closed='+newlyClosed,
              'deleted='+deleted,'previous_closed='+initiallyClosed,
              'previous_deleted='+alreadyDeleted,'archive_verified='+targets.length);
            if(newlyClosed+initiallyClosed!==targets.length||
               deleted+alreadyDeleted!==targets.length)
              throw new Error('Final count mismatch');
