name: Zephyr Host Gate

on:
  push:
    branches:
      - agent/zephyr-**
    paths:
      - zephyr/module.yml
      - software/zephyr/**
      - docs/zephyr/**
      - tests_py/test_zephyr_*.py
      - .github/workflows/zephyr-host-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zephyr-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Zephyr platform contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Zephyr stage contracts
        run: python3 -m unittest discover -s tests_py -p 'test_zephyr_*.py' -v
