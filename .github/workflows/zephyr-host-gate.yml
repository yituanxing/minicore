name: Zephyr Host Gate

on:
  push:
    branches:
      - agent/zephyr-**
    paths:
      - zephyr/module.yml
      - software/zephyr/**
      - docs/zephyr/**
      - tests_py/test_zephyr_*.py
      - tools/ci/zephyr_host_build.sh
      - .github/workflows/zephyr-host-gate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zephyr-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Zephyr platform and host build contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Zephyr stage contracts
        run: python3 -m unittest discover -s tests_py -p 'test_zephyr_*.py' -v

      - name: Set up pinned Zephyr workspace and RISC-V SDK
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: software/zephyr
          sdk-version: 0.16.9
          toolchains: riscv64-zephyr-elf
          west-version: 1.3.0
          ccache-cache-key: zephyr-v3.7.2-aethercore-rv32
          west-group-filter: -hal,-tools,-bootloader,-babblesim

      - name: Build AetherCore Zephyr kernel smoke image
        shell: bash
        run: |
          chmod +x tools/ci/zephyr_host_build.sh
          bash tools/ci/zephyr_host_build.sh

      - name: Upload Zephyr host-build evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-zephyr-host-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/zephyr-host/zephyr/zephyr.elf
            build/zephyr-host/zephyr/zephyr.bin
            build/zephyr-host/zephyr/zephyr.map
            build/zephyr-host/zephyr/zephyr.dts
            build/zephyr-host/zephyr/.config
            build/zephyr-host/zephyr/include/generated/zephyr/devicetree_generated.h
            build/zephyr-host/CMakeCache.txt
            build/zephyr-host/evidence/
            build/zephyr-host/elf-file.txt
