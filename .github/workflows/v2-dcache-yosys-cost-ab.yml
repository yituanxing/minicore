name: AetherCore V2 D-cache Yosys Cost A/B

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/ElaborateV2OpenSbiSynthesisRV64.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2OpenSbiRV64SimTop.scala'
      - 'src/main/scala/aethercore/memory/**'
      - '.github/workflows/v2-dcache-yosys-cost-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-v2-dcache-yosys-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASELINE_SHA: ec73c0ceeccbf25e9e1618a703964b6d10ececdf
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  synthesize:
    name: Yosys ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, target]

    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          clean: true

      - name: Verify exact comparison identity
        shell: bash
        run: |
          set -euo pipefail
          echo "variant=${{ matrix.variant }}"
          echo "baseline=$BASELINE_SHA"
          echo "target=$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git merge-base --is-ancestor "$BASELINE_SHA" "$TARGET_SHA"

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install synthesis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys
          yosys -V
          yosys -Q -p 'help ltp' | grep -q -- '-noff'

      - name: Select exact source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.variant }}" == "baseline" ]]; then
            src="$RUNNER_TEMP/aethercore-v2-dcache-base"
            rm -rf "$src"
            git worktree add --detach "$src" "$BASELINE_SHA"
            cp src/main/scala/aethercore/ElaborateV2OpenSbiSynthesisRV64.scala \
               "$src/src/main/scala/aethercore/ElaborateV2OpenSbiSynthesisRV64.scala"
          else
            src="$GITHUB_WORKSPACE"
          fi
          chmod +x "$src/mill"
          echo "SRC_DIR=$src" >> "$GITHUB_ENV"

      - name: Elaborate one exact core-complex shell
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/aethercore-v2-dcache-${{ matrix.variant }}"
          rm -rf "$out"
          mkdir -p "$out/rtl" "$out/mill"
          echo "COST_OUT=$out" >> "$GITHUB_ENV"
          (
            cd "$SRC_DIR"
            MILL_OUTPUT_DIR="$out/mill" ./mill aethercore.runMain \
              aethercore.ElaborateV2OpenSbiSynthesisRV64 --target-dir "$out/rtl"
          )
          find "$out/rtl" -maxdepth 1 -name '*.sv' -print -quit | grep -q .

      - name: Synthesize and measure one structural cost
        shell: bash
        run: |
          set -euo pipefail
          rtl="$COST_OUT/rtl"
          ylog="$COST_OUT/yosys.log"

          mapfile -t svs < <(find "$rtl" -maxdepth 1 -name '*.sv' -print | sort)
          test "${#svs[@]}" -gt 0
          read_cmd="read_verilog -sv -DSYNTHESIS"
          for sv in "${svs[@]}"; do
            read_cmd+=" $sv"
          done

          # Do not request synth_ecp5 -json here. The previous serial run spent
          # ~24% of Yosys time in autoname solely to serialize JSON. We only need
          # mapped cell counts plus ltp, so parse stat directly from the same
          # mapped process and preserve the qualified structural proxy.
          yosys -Q -p "$read_cmd; hierarchy -check -top AetherCoreV2OpenSbiSynthesisTop; synth_ecp5 -top AetherCoreV2OpenSbiSynthesisTop; stat -top AetherCoreV2OpenSbiSynthesisTop; flatten; ltp -noff AetherCoreV2OpenSbiSynthesisTop" \
            2>&1 | tee "$ylog"

          python3 - "$ylog" "$COST_OUT/metrics.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors='replace')

          def last(pattern, label):
              matches = re.findall(pattern, text, flags=re.MULTILINE)
              if not matches:
                  raise SystemExit(f"missing {label} in Yosys log")
              return int(matches[-1])

          metrics = {
              "logic_depth": last(
                  r"Longest topological path in AetherCoreV2OpenSbiSynthesisTop \(length=([0-9]+)\)",
                  "logic depth",
              ),
              "cells": last(r"^\s*Number of cells:\s+([0-9]+)\s*$", "cell count"),
              "lut4": last(r"^\s*LUT4\s+([0-9]+)\s*$", "LUT4 count"),
              "ff": last(r"^\s*TRELLIS_FF\s+([0-9]+)\s*$", "TRELLIS_FF count"),
          }
          Path(sys.argv[2]).write_text(json.dumps(metrics, indent=2) + "\n")
          print(json.dumps(metrics, indent=2))
          PY

      - name: Upload one structural-cost result
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-v2-dcache-yosys-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aethercore-v2-dcache-${{ matrix.variant }}/metrics.json
            ${{ runner.temp }}/aethercore-v2-dcache-${{ matrix.variant }}/yosys.log
          if-no-files-found: error

  summarize:
    name: D-cache performance/cost decision
    needs: synthesize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download baseline metrics
        uses: actions/download-artifact@v4
        with:
          name: aethercore-v2-dcache-yosys-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics/baseline

      - name: Download target metrics
        uses: actions/download-artifact@v4
        with:
          name: aethercore-v2-dcache-yosys-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics/target

      - name: Summarize D-cache performance/cost A/B
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          base = json.loads(Path("metrics/baseline/metrics.json").read_text())
          target = json.loads(Path("metrics/target/metrics.json").read_text())

          def pct(new, old):
              return ((new / old) - 1.0) * 100.0 if old else None

          architectural_speedup = 1.162159
          break_even_frequency_ratio = 1.0 / architectural_speedup

          summary = {
              "baseline_sha": os.environ["BASELINE_SHA"],
              "target_sha": os.environ["TARGET_SHA"],
              "boundary": "AetherCoreV2OpenSbiSynthesisTop (functional shell, host-only D-cache counters omitted)",
              "proxy": "Yosys synth_ecp5 mapped netlist + stat + flatten + ltp -noff",
              "base_logic_depth": base["logic_depth"],
              "target_logic_depth": target["logic_depth"],
              "logic_depth_delta": target["logic_depth"] - base["logic_depth"],
              "logic_depth_delta_pct": pct(target["logic_depth"], base["logic_depth"]),
              "base_cells": base["cells"],
              "target_cells": target["cells"],
              "cells_delta_pct": pct(target["cells"], base["cells"]),
              "base_lut4": base["lut4"],
              "target_lut4": target["lut4"],
              "lut4_delta_pct": pct(target["lut4"], base["lut4"]),
              "base_ff": base["ff"],
              "target_ff": target["ff"],
              "ff_delta_pct": pct(target["ff"], base["ff"]),
              "qualified_10cycle_baseline_cycles": 106122254,
              "qualified_10cycle_target_cycles": 91314732,
              "architectural_cycle_reduction_pct": 13.953268,
              "architectural_speedup": architectural_speedup,
              "break_even_frequency_ratio": break_even_frequency_ratio,
              "break_even_frequency_loss_pct": (1.0 - break_even_frequency_ratio) * 100.0,
              "dcache_hit": 1630715,
              "dcache_miss": 1271230,
              "dcache_bypass": 4298448,
          }

          Path("summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## AetherCore v2 D-cache structural-cost A/B\n\n")
              f.write(f"- 10-cycle Linux cycles: 106,122,254 -> 91,314,732 (-13.953268%, speedup {architectural_speedup:.6f}x)\n")
              f.write(f"- mapped combinational depth: {base['logic_depth']} -> {target['logic_depth']} ({summary['logic_depth_delta']:+d}, {summary['logic_depth_delta_pct']:+.3f}%)\n")
              f.write(f"- cells: {base['cells']} -> {target['cells']} ({summary['cells_delta_pct']:+.3f}%)\n")
              f.write(f"- LUT4: {base['lut4']} -> {target['lut4']} ({summary['lut4_delta_pct']:+.3f}%)\n")
              f.write(f"- FF: {base['ff']} -> {target['ff']} ({summary['ff_delta_pct']:+.3f}%)\n")
              f.write(f"- break-even frequency loss budget: {summary['break_even_frequency_loss_pct']:.3f}%\n")
              f.write("- baseline and target synthesis ran in parallel; JSON/autoname serialization was removed.\n")
          PY

      - name: Upload combined decision evidence
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-v2-dcache-yosys-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: summary.json
          if-no-files-found: error
