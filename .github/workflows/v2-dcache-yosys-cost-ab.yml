name: AetherCore V2 D-cache Fast Cost

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/ElaborateV2DCacheSynthesisRV64.scala'
      - 'src/main/scala/aethercore/memory/AetherDirectMappedReadCache.scala'
      - '.github/workflows/v2-dcache-yosys-cost-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-v2-dcache-fast-cost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dcache-cost:
    name: D-cache incremental structural cost
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install Yosys
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys
          yosys -V
          chmod +x mill

      - name: Elaborate D-cache only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/aethercore-v2-dcache-fast"
          rm -rf "$out"
          mkdir -p "$out/rtl" "$out/mill"
          echo "COST_OUT=$out" >> "$GITHUB_ENV"
          MILL_OUTPUT_DIR="$out/mill" ./mill aethercore.runMain \
            aethercore.ElaborateV2DCacheSynthesisRV64 --target-dir "$out/rtl"
          find "$out/rtl" -maxdepth 1 -name '*.sv' -print -quit | grep -q .

      - name: Synthesize incremental D-cache cost
        shell: bash
        run: |
          set -euo pipefail
          rtl="$COST_OUT/rtl"
          ylog="$COST_OUT/yosys.log"

          mapfile -t svs < <(find "$rtl" -maxdepth 1 -name '*.sv' -print | sort)
          test "${#svs[@]}" -gt 0
          read_cmd="read_verilog -sv -DSYNTHESIS"
          for sv in "${svs[@]}"; do
            read_cmd+=" $sv"
          done

          yosys -Q -p "$read_cmd; hierarchy -check -top AetherDCacheSynthesisTop; synth_ecp5 -top AetherDCacheSynthesisTop; stat -top AetherDCacheSynthesisTop; flatten; ltp -noff AetherDCacheSynthesisTop" \
            2>&1 | tee "$ylog"

          python3 - "$ylog" "$COST_OUT/summary.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(errors='replace')

          def last(pattern, label):
              xs = re.findall(pattern, text, flags=re.MULTILINE)
              if not xs:
                  raise SystemExit(f"missing {label}")
              return int(xs[-1])

          dcache = {
              "logic_depth": last(
                  r"Longest topological path in AetherDCacheSynthesisTop \(length=([0-9]+)\)",
                  "logic depth",
              ),
              "cells": last(r"^\s*Number of cells:\s+([0-9]+)\s*$", "cell count"),
              "lut4": last(r"^\s*LUT4\s+([0-9]+)\s*$", "LUT4 count"),
              "ff": last(r"^\s*TRELLIS_FF\s+([0-9]+)\s*$", "TRELLIS_FF count"),
          }

          baseline = {
              "logic_depth": 5453,
              "cells": 150009,
              "lut4": 84714,
              "ff": 16449,
          }

          summary = {
              "measurement": "fast incremental D-cache synthesis; full-shell baseline taken from qualified #210 artifact",
              "qualified_10cycle_cycle_reduction_pct": 13.953268,
              "qualified_10cycle_speedup": 1.162159,
              "baseline_full_shell": baseline,
              "dcache_incremental": dcache,
              "dcache_lut4_vs_baseline_pct": dcache["lut4"] / baseline["lut4"] * 100.0,
              "dcache_ff_vs_baseline_pct": dcache["ff"] / baseline["ff"] * 100.0,
              "dcache_cells_vs_baseline_pct": dcache["cells"] / baseline["cells"] * 100.0,
              "note": "Incremental proxy intentionally excludes the pre-existing 2-entry pending queue and host-only cache counters. Full-shell PPA is archival, not a blocker for the GO decision."
          }

          Path(sys.argv[2]).write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Publish fast cost summary
        shell: bash
        run: |
          set -euo pipefail
          cat "$COST_OUT/summary.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fast D-cache cost evidence
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-v2-dcache-fast-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aethercore-v2-dcache-fast/summary.json
            ${{ runner.temp }}/aethercore-v2-dcache-fast/yosys.log
          if-no-files-found: error
