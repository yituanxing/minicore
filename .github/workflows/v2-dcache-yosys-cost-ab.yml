name: AetherCore V2 D-cache Yosys Cost A/B

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/ElaborateV2OpenSbiSynthesisRV64.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2OpenSbiRV64SimTop.scala'
      - 'src/main/scala/aethercore/memory/**'
      - '.github/workflows/v2-dcache-yosys-cost-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-v2-dcache-yosys-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yosys-cost-ab:
    name: Exact #210 no-D$ -> D-cache structural-cost proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASELINE_SHA: ec73c0ceeccbf25e9e1618a703964b6d10ececdf
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          clean: true

      - name: Verify exact comparison identity
        shell: bash
        run: |
          set -euo pipefail
          echo "baseline=$BASELINE_SHA"
          echo "target=$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git merge-base --is-ancestor "$BASELINE_SHA" "$TARGET_SHA"

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install synthesis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys jq
          yosys -V
          yosys -Q -p 'help ltp' | grep -q -- '-noff'

      - name: Create exact frozen #210 worktree
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/aethercore-v2-dcache-base"
          rm -rf "$base"
          git worktree add --detach "$base" "$BASELINE_SHA"
          cp src/main/scala/aethercore/ElaborateV2OpenSbiSynthesisRV64.scala \
             "$base/src/main/scala/aethercore/ElaborateV2OpenSbiSynthesisRV64.scala"
          chmod +x mill "$base/mill"
          echo "BASE_DIR=$base" >> "$GITHUB_ENV"

      - name: Elaborate exact no-D$ and D-cache core-complex shells
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/aethercore-v2-dcache-yosys"
          rm -rf "$out"
          mkdir -p "$out/base-rtl" "$out/target-rtl" "$out/base-mill" "$out/target-mill"
          echo "COST_OUT=$out" >> "$GITHUB_ENV"

          (
            cd "$BASE_DIR"
            MILL_OUTPUT_DIR="$out/base-mill" ./mill aethercore.runMain \
              aethercore.ElaborateV2OpenSbiSynthesisRV64 --target-dir "$out/base-rtl"
          )
          MILL_OUTPUT_DIR="$out/target-mill" ./mill aethercore.runMain \
            aethercore.ElaborateV2OpenSbiSynthesisRV64 --target-dir "$out/target-rtl"

          find "$out/base-rtl" -maxdepth 1 -name '*.sv' -print -quit | grep -q .
          find "$out/target-rtl" -maxdepth 1 -name '*.sv' -print -quit | grep -q .

      - name: Synthesize and measure structural cost
        shell: bash
        run: |
          set -euo pipefail

          measure_one() {
            label="$1"
            rtl="$COST_OUT/$label-rtl"
            json="$COST_OUT/$label.json"
            ylog="$COST_OUT/$label-yosys.log"

            mapfile -t svs < <(find "$rtl" -maxdepth 1 -name '*.sv' -print | sort)
            test "${#svs[@]}" -gt 0
            read_cmd="read_verilog -sv -DSYNTHESIS"
            for sv in "${svs[@]}"; do
              read_cmd+=" $sv"
            done

            yosys -Q -p "$read_cmd; hierarchy -check -top AetherCoreV2OpenSbiSynthesisTop; synth_ecp5 -top AetherCoreV2OpenSbiSynthesisTop -json $json; stat -top AetherCoreV2OpenSbiSynthesisTop; flatten; ltp -noff AetherCoreV2OpenSbiSynthesisTop" \
              2>&1 | tee "$ylog"

            depth=$(sed -n 's/.*Longest topological path in AetherCoreV2OpenSbiSynthesisTop (length=\([0-9][0-9]*\)).*/\1/p' "$ylog" | tail -1)
            test -n "$depth"
            printf '%s\n' "$depth" > "$COST_OUT/$label-depth"

            jq '[.modules["AetherCoreV2OpenSbiSynthesisTop"].cells[]] | length' "$json" > "$COST_OUT/$label-cells"
            jq '[.modules["AetherCoreV2OpenSbiSynthesisTop"].cells[] | select(.type == "LUT4")] | length' "$json" > "$COST_OUT/$label-lut4"
            jq '[.modules["AetherCoreV2OpenSbiSynthesisTop"].cells[] | select(.type == "TRELLIS_FF")] | length' "$json" > "$COST_OUT/$label-ff"
          }

          measure_one base
          measure_one target

      - name: Summarize D-cache performance/cost A/B
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['COST_OUT'])

          def integer(name):
              return int((root / name).read_text().strip())

          def pct(new, old):
              return ((new / old) - 1.0) * 100.0 if old else None

          base_depth = integer('base-depth')
          target_depth = integer('target-depth')
          base_cells = integer('base-cells')
          target_cells = integer('target-cells')
          base_lut = integer('base-lut4')
          target_lut = integer('target-lut4')
          base_ff = integer('base-ff')
          target_ff = integer('target-ff')

          architectural_speedup = 1.162159
          break_even_frequency_ratio = 1.0 / architectural_speedup

          summary = {
              'baseline_sha': os.environ['BASELINE_SHA'],
              'target_sha': os.environ['TARGET_SHA'],
              'boundary': 'AetherCoreV2OpenSbiSynthesisTop (functional shell, host-only D-cache counters omitted)',
              'proxy': 'Yosys synth_ecp5 mapped netlist + flatten + ltp -noff',
              'base_logic_depth': base_depth,
              'target_logic_depth': target_depth,
              'logic_depth_delta': target_depth - base_depth,
              'logic_depth_delta_pct': pct(target_depth, base_depth),
              'base_cells': base_cells,
              'target_cells': target_cells,
              'cells_delta_pct': pct(target_cells, base_cells),
              'base_lut4': base_lut,
              'target_lut4': target_lut,
              'lut4_delta_pct': pct(target_lut, base_lut),
              'base_ff': base_ff,
              'target_ff': target_ff,
              'ff_delta_pct': pct(target_ff, base_ff),
              'qualified_10cycle_baseline_cycles': 106122254,
              'qualified_10cycle_target_cycles': 91314732,
              'architectural_cycle_reduction_pct': 13.953268,
              'architectural_speedup': architectural_speedup,
              'break_even_frequency_ratio': break_even_frequency_ratio,
              'break_even_frequency_loss_pct': (1.0 - break_even_frequency_ratio) * 100.0,
              'dcache_hit': 1630715,
              'dcache_miss': 1271230,
              'dcache_bypass': 4298448,
              'note': 'Logic depth is a structural proxy, not direct Fmax. The wrapper omits host-only D-cache observation counters so measurement instrumentation does not inflate the cost.'
          }

          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## AetherCore v2 D-cache structural-cost A/B\n\n')
              f.write(f"Frozen #210 `{summary['baseline_sha']}` -> D-cache `{summary['target_sha']}`\n\n")
              f.write(f"- 10-cycle Linux cycles: 106,122,254 -> 91,314,732 (-13.953268%, speedup {architectural_speedup:.6f}x)\n")
              f.write(f"- mapped combinational depth: {base_depth} -> {target_depth} ({target_depth-base_depth:+d}, {summary['logic_depth_delta_pct']:+.3f}%)\n")
              f.write(f"- cells: {base_cells} -> {target_cells} ({summary['cells_delta_pct']:+.3f}%)\n")
              f.write(f"- LUT4: {base_lut} -> {target_lut} ({summary['lut4_delta_pct']:+.3f}%)\n")
              f.write(f"- FF: {base_ff} -> {target_ff} ({summary['ff_delta_pct']:+.3f}%)\n")
              f.write(f"- break-even frequency loss budget: {summary['break_even_frequency_loss_pct']:.3f}%\n")
              f.write('- D-cache host-only hit/miss/bypass counters are intentionally omitted from this synthesis boundary.\n')
          PY

      - name: Upload D-cache structural-cost evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-v2-dcache-yosys-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aethercore-v2-dcache-yosys/summary.json
            ${{ runner.temp }}/aethercore-v2-dcache-yosys/*-yosys.log
          if-no-files-found: warn
