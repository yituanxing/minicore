name: AetherCore Product G5 D2 native Debian QEMU system oracle

# Human opt-in only; this job has NO Verilator, GSIM, Product RTL or SD1 longrun.
# QEMU virt's firmware/DTB differ from the Product board, but this boots the
# exact D2 Linux Image (with embedded native Debian LP64D initramfs) to PID1.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: product-g5-qemu-d2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  debian-d2-qemu-system-oracle:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'product-g5-qemu-d2-oracle')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RV64_DEBIAN_STAGE: d2
      RV64_LINUX_JOBS: '4'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      AETHERCORE_ALLOW_G5_QEMU_SYSTEM_ORACLE: '1'
      AETHERCORE_G5_QEMU_WALL_SECONDS: '180'

    steps:
      - name: Checkout exact Product D2 commit without mutating other branches
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          persist-credentials: false

      - name: Validate explicit QEMU-system-only scope and log parser
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          [[ "$RV64_DEBIAN_STAGE" == d2 &&
             -z "${AETHERCORE_PRODUCT_SD_IMAGE:-}" &&
             -z "${AETHERCORE_PRODUCT_DTB_IMAGE:-}" ]] || exit 2
          bash -n tools/ci/product_g5_qemu_oracle.sh tools/ci/product_g5_qemu_oracle_selftest.sh
          bash tools/ci/product_g5_qemu_oracle_selftest.sh
          echo 'D2 native Debian QEMU **system** oracle only; Product RTL/DTB/F7/SD1/PID1 timing remain unqualified' >> "$GITHUB_STEP_SUMMARY"

      - name: Restore frozen RV64 GCC 13.3 toolchain from G4/G5
        id: gcc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/bootlin-riscv64-lp64d-glibc-stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv64-lp64d--glibc--stable-2024.05-1.tar.xz
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-13.3-v1-${{ hashFiles('tools/ensure_riscv64_linux_gcc_13_3.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-13.3-v1-

      - name: Restore upstream Linux 6.6.143 source and baseline build
        id: linux-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/rv64/linux
            ~/.cache/aethercore/rv64/linux-build
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v2-${{ hashFiles('software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env', 'tools/ci/rv64_linux_early_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v2-

      - name: Install native Debian, kernel and QEMU system emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev bison flex bc \
            libssl-dev libelf-dev build-essential libreadline-dev pkg-config \
            curl xz-utils git python3 device-tree-compiler dwarves \
            qemu-system-misc
          command -v qemu-system-riscv64
          qemu-system-riscv64 --version | head -1
          docker version

      - name: Provision frozen RISC-V cross compiler (no Verilator)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ensure_riscv64_linux_gcc_13_3.sh

      - name: Build and verify unchanged RV64 Linux baseline
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/rv64_linux_early_build.sh
          grep -Fxq 'RV64_LINUX_EARLY_BUILD_RESULT: status=PASS' build/rv64-linux-early/result.txt

      - name: Cache frozen RV64 compiler for next oracle
        if: success() && steps.gcc-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/bootlin-riscv64-lp64d-glibc-stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv64-lp64d--glibc--stable-2024.05-1.tar.xz
          key: ${{ steps.gcc-cache.outputs.cache-primary-key }}

      - name: Cache unchanged Linux 6.6.143 source and objects
        if: success() && steps.linux-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/aethercore/rv64/linux
            ~/.cache/aethercore/rv64/linux-build
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}

      - name: Stage exact native Debian riscv64 D2 rootfs and F/D probe
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/rv64_debian_rootfs_build.sh
          grep -Fxq 'RV64_DEBIAN_ROOTFS_BUILD_RESULT: status=PASS' build/rv64-debian-rootfs/result.txt
          grep -Fxq 'stage=d2' build/rv64-debian-rootfs/result.txt

      - name: Compile identical D2 Linux Image with embedded native rootfs
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/rv64_debian_linux_build.sh
          grep -Fxq 'RV64_DEBIAN_LINUX_BUILD_RESULT: status=PASS' build/rv64-debian-linux/result.txt
          grep -Fxq 'stage=d2' build/rv64-debian-linux/result.txt
          sha256sum --check --status build/rv64-debian-linux/evidence/sha256.txt

      - name: Run bounded 180-second RISC-V virt native Debian PID1 oracle
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/product_g5_qemu_oracle.sh run
          grep -Fxq 'qualification=QEMU_SYSTEM_DEBIAN_D2_ORACLE_NOT_PRODUCT_RTL_PASS' \
            build/product-g5-qemu-system-oracle/result.txt
          cat build/product-g5-qemu-system-oracle/result.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve kernel SHA, native rootfs identity, QEMU firmware boundary and serial trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-g5-qemu-d2-oracle-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/rv64-linux-early/result.txt
            build/rv64-debian-rootfs/result.txt
            build/rv64-debian-rootfs/evidence/sha256.txt
            build/rv64-debian-linux/result.txt
            build/rv64-debian-linux/evidence/sha256.txt
            build/rv64-debian-linux/evidence/resolved.config
            build/product-g5-qemu-system-oracle/d2-serial.log
            build/product-g5-qemu-system-oracle/result.txt
