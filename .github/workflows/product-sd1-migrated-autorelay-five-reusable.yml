name: Product SD1 reusable five-stage 20M authenticated RTL continuation

# One shared implementation for every signed checkpoint batch. Callers only
# supply the exact previously sealed run, ZIP and snapshot pins, plus five
# contiguous 20M milestones. No cold boot, RTL regenerate, or old-cache touch.
on:
  workflow_call:
    inputs:
      start_m:
        required: true
        type: string
      stage1:
        required: true
        type: string
      stage2:
        required: true
        type: string
      stage3:
        required: true
        type: string
      stage4:
        required: true
        type: string
      stage5:
        required: true
        type: string
      source_run:
        required: true
        type: string
      source_head_sha:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_job:
        required: true
        type: string
      source_completed_step:
        required: true
        type: string
      source_artifact_id:
        required: true
        type: string
      source_artifact_name:
        required: true
        type: string
      source_artifact_digest:
        required: true
        type: string
      source_host_sha:
        required: true
        type: string
      source_rtl_sha:
        required: true
        type: string
      source_mode:
        required: false
        type: string
        default: cross_run
      require_2pow32_crossing:
        required: false
        type: boolean
        default: false
    outputs:
      terminal_artifact_id:
        description: Immutable uploaded terminal 100M-stage artifact numeric ID
        value: ${{ jobs.relay_five.outputs.terminal_artifact_id }}
      terminal_artifact_digest:
        description: Exact sha256 hex digest of uploaded terminal artifact ZIP
        value: ${{ jobs.relay_five.outputs.terminal_artifact_digest }}
      terminal_host_sha:
        description: Complete final Host DDR and SD checkpoint SHA256
        value: ${{ jobs.relay_five.outputs.terminal_host_sha }}
      terminal_rtl_sha:
        description: Complete final savable RTL checkpoint SHA256
        value: ${{ jobs.relay_five.outputs.terminal_rtl_sha }}

permissions:
  contents: read
  actions: read

jobs:
  relay_five:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.pull_request.number == 379 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'design/rv64gc-product-architecture-20261103'
    outputs:
      terminal_artifact_id: ${{ steps.publish_terminal.outputs.artifact_id }}
      terminal_artifact_digest: ${{ steps.publish_terminal.outputs.artifact_digest }}
      terminal_host_sha: ${{ steps.publish_terminal.outputs.host_sha }}
      terminal_rtl_sha: ${{ steps.publish_terminal.outputs.rtl_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      AETHERCORE_SD1_RELAY_CONFIRM: SD1_FULL_DEBIAN_SIGNED_RELAY_V2_MIGRATED
      AETHERCORE_VERILATOR_VERSION: '5.054'
      SIM_SETTLE_MODE: reference
      VERILATOR_THREADS: '1'
      AETHERCORE_DATA_MEM_WAIT_CYCLES: '0'
      AETHERCORE_SD1_AUTORELAY_START_M: ${{ inputs.start_m }}
      AETHERCORE_SD1_AUTORELAY_START_HOST_SHA256: ${{ inputs.source_host_sha }}
      AETHERCORE_SD1_AUTORELAY_START_RTL_SHA256: ${{ inputs.source_rtl_sha }}
    steps:
      - name: Authenticate qualified model, exact source run and five strict milestones
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          START: ${{ inputs.start_m }}
          STAGE1: ${{ inputs.stage1 }}
          STAGE2: ${{ inputs.stage2 }}
          STAGE3: ${{ inputs.stage3 }}
          STAGE4: ${{ inputs.stage4 }}
          STAGE5: ${{ inputs.stage5 }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_HEAD: ${{ inputs.source_head_sha }}
          SOURCE_WORKFLOW: ${{ inputs.source_workflow_path }}
          SOURCE_JOB: ${{ inputs.source_job }}
          SOURCE_STEP: ${{ inputs.source_completed_step }}
          SOURCE_ID: ${{ inputs.source_artifact_id }}
          SOURCE_NAME: ${{ inputs.source_artifact_name }}
          SOURCE_DIGEST: ${{ inputs.source_artifact_digest }}
          SOURCE_MODE: ${{ inputs.source_mode }}
        run: |
          set -euo pipefail
          [[ "$START" =~ ^[0-9]{4}$ && "$START" -ge 4012 &&
             "$(((START-4012)%100))" -eq 0 && "$((START+100))" -le 8000 &&
             "$STAGE1" == "$((START+20))" && "$STAGE2" == "$((START+40))" &&
             "$STAGE3" == "$((START+60))" && "$STAGE4" == "$((START+80))" &&
             "$STAGE5" == "$((START+100))" &&
             "$SOURCE_RUN" =~ ^[0-9]{8,12}$ && "$SOURCE_ID" =~ ^[0-9]+$ &&
             "$SOURCE_HEAD" =~ ^[a-f0-9]{40}$ &&
             "$SOURCE_DIGEST" =~ ^[a-f0-9]{64}$ &&
             ( "$SOURCE_MODE" == cross_run || "$SOURCE_MODE" == intra_run ) &&
             "$SOURCE_NAME" == "product-sd1-migrated-${START}m-${SOURCE_RUN}" &&
             "$SOURCE_WORKFLOW" == .github/workflows/product-sd1-migrated-*.yml &&
             -n "$SOURCE_JOB" && -n "$SOURCE_STEP" &&
             "$AETHERCORE_SD1_AUTORELAY_START_HOST_SHA256" =~ ^[a-f0-9]{64}$ &&
             "$AETHERCORE_SD1_AUTORELAY_START_RTL_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 16
          repo="$GITHUB_REPOSITORY"
          verify() {
            local run="$1" sha="$2" path="$3" job="$4" step="$5" art_id="$6" name="$7" digest="$8" mode="${9:-cross_run}"
            if [[ "$mode" == intra_run ]]; then
              [[ "$run" == "$GITHUB_RUN_ID" && "$sha" == "$TARGET_SHA" ]] || {
                echo 'MIGRATED_AUTORUN_REJECTED: intra-run ID or branch HEAD mismatch' >&2
                exit 16
              }
            fi
            gh api "repos/$repo/actions/runs/$run" > "$RUNNER_TEMP/run-$run.json"
            jq -e --arg repo "$repo" --arg sha "$sha" --arg path "$path" --arg mode "$mode" \
              --argjson run "$run" '
              .id == $run and .run_attempt == 1 and .event == "pull_request" and
              .repository.full_name == $repo and .head_repository.full_name == $repo and
              .head_branch == "design/rv64gc-product-architecture-20261103" and
              .head_sha == $sha and
              (if $mode == "intra_run" then
                .status == "in_progress" and .conclusion == null
               else .status == "completed" and .conclusion == "success" end) and
              (.path | contains($path))
            ' "$RUNNER_TEMP/run-$run.json" >/dev/null || exit 16
            gh api "repos/$repo/actions/runs/$run/jobs?per_page=100" > "$RUNNER_TEMP/jobs-$run.json"
            jq -e --arg job "$job" --arg step "$step" --arg mode "$mode" '
              [.jobs[] | select(.name == $job and .status == "completed" and
                .conclusion == "success" and
                ([.steps[] | select(.name == $step and .conclusion == "success")] | length == 1) and
                (if $mode == "intra_run" then
                   ([.steps[] | select((.name | startswith("Advance genuine RTL segment ")) and
                     .status == "completed" and .conclusion == "success")] | length == 5) and
                   ([.steps[] | select((.name | startswith("Upload complete stage ")) and
                     .status == "completed" and .conclusion == "success")] | length == 5)
                 else true end))] | length == 1
            ' "$RUNNER_TEMP/jobs-$run.json" >/dev/null || exit 16
            gh api "repos/$repo/actions/runs/$run/artifacts?per_page=100" > "$RUNNER_TEMP/art-$run.json"
            jq -e --arg sha "$sha" --arg name "$name" --arg digest "sha256:$digest" \
              --argjson id "$art_id" '
              [.artifacts[] | select(.id == $id and .name == $name and
                .digest == $digest and .workflow_run.head_sha == $sha and
                .expired == false and .size_in_bytes > 1000000)] | length == 1
            ' "$RUNNER_TEMP/art-$run.json" >/dev/null || exit 16
          }
          verify 42384463475 dc8ab72669000c19e0494afbd0e28d4f82ee3374 \
            '.github/workflows/product-sd1-model-migrate-v1-differential.yml' \
            migrate_and_diff 'Archive new candidate executable and authenticated 3992M result' \
            13578644295 product-sd1-model-migrate-v1-qualified-42384463475 \
            e511af2854a110bc0998a0c8a6de7e36378e8a1a68d90568e811577c931e7ee9
          verify "$SOURCE_RUN" "$SOURCE_HEAD" "$SOURCE_WORKFLOW" "$SOURCE_JOB" \
            "$SOURCE_STEP" "$SOURCE_ID" "$SOURCE_NAME" "$SOURCE_DIGEST" "$SOURCE_MODE"
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify exact five-segment script
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]] || exit 16
          bash -n tools/ci/product_sd1_migrated_autorelay_20m.sh
      - name: Restore signed original Debian SD/rootfs media
        id: seed
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rv64-debian-rootfs/result.txt
            build/rv64-debian-linux/result.txt
            build/rv64-debian-linux/obj/.config
            build/rv64-debian-linux/obj/arch/riscv/boot/Image
            build/rv64-debian-boot
            build/rv64-debian-sd1-sd
            build/product-sd1-official-seed
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v2-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'build.mill', 'tools/ci/rv64_debian_sd1_official_full_rootfs_prepare.sh', 'tools/ci/rv64_debian_sd1_sd_image_build.sh', 'tools/ci/rv64_debian_payload_build.sh', 'tools/ci/rv64_debian_linux_build.sh', 'tools/ci/rv64_debian_rootfs_build.sh', 'tools/ci/rv64_debian_sd1_tree_digest.py', 'tools/ci/rv64_linux_early_build.sh', 'tools/ci/rv64_minimal_init_payload_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0
      - name: Verify the immutable original signed Debian seed
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.seed.outputs.cache-hit }}' == true ||
             '${{ steps.seed.outputs.cache-matched-key }}' == \
               'aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0' ]] || exit 16
          python3 tools/ci/product_sd1_official_seed.py verify
      - name: Restore exact GPIO-CS Linux Image
        id: diag
        uses: actions/cache/restore@v4
        with:
          path: |
            build/product-sd1-gpio-cs-diagnostic/linux/result.txt
            build/product-sd1-gpio-cs-diagnostic/linux/obj/.config
            build/product-sd1-gpio-cs-diagnostic/linux/obj/arch/riscv/boot/Image
            build/product-sd1-gpio-cs-diagnostic/linux/evidence
            build/product-sd1-gpio-cs-diagnostic/boot
            build/product-sd1-gpio-cs-diagnostic/diagnostic-manifest.txt
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-sd1-gpio-cs-diagnostic-image-v1-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'tools/ci/product_sd1_gpio_cs_diag_build.sh', 'tools/ci/patches/linux-6.6.143-mmc-spi-gpio-cs-off.patch', 'tools/ci/rv64_minimal_init_payload_build.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
      - name: Reject missing exact GPIO-CS Image
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.diag.outputs.cache-hit }}' == true ]] || exit 16
          grep -Fxq 'PRODUCT_SD1_GPIO_CS_DIAG_ARTIFACTS: status=READY_FOR_SHORT_RTL_ONLY' \
            build/product-sd1-gpio-cs-diagnostic/diagnostic-manifest.txt
      - name: Import signed original polling firmware and DTB
        uses: actions/download-artifact@v4
        with:
          run-id: 42338584047
          name: product-sd1-spi-polling-build-42338584047
          github-token: ${{ github.token }}
          path: build/product-sd1-spi-polling-import
      - name: Restore exact QUALIFIED executable (no generated RTL build)
        uses: actions/download-artifact@v4
        with:
          run-id: 42384463475
          name: product-sd1-model-migrate-v1-qualified-42384463475
          github-token: ${{ github.token }}
          path: build/product-sd1-model-migration-v1
      - name: Import authenticated complete initial checkpoint
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run }}
          name: ${{ inputs.source_artifact_name }}
          github-token: ${{ github.token }}
          path: build/product-sd1-autorelay-import/${{ inputs.start_m }}m
      - name: Verify source Host and RTL digest plus candidate ELF ABI
        shell: bash
        env:
          SOURCE_HOST_SHA: ${{ inputs.source_host_sha }}
          SOURCE_RTL_SHA: ${{ inputs.source_rtl_sha }}
          START: ${{ inputs.start_m }}
        run: |
          set -euo pipefail
          model=build/product-sd1-model-migration-v1/candidate-savable-model/obj/VAetherCoreProductDebianSdRV64SimTop
          initial="build/product-sd1-autorelay-import/${START}m"
          [[ "$(sha256sum "$model" | cut -d' ' -f1)" == b9a651a3ba3aa50c7e0b15405d24a3d3ab56dd25fa2df7fb20f5654cdda80461 &&
             "$(sha256sum "$initial/persistent.pre.host" | cut -d' ' -f1)" == "$SOURCE_HOST_SHA" &&
             "$(sha256sum "$initial/persistent.pre.rtl" | cut -d' ' -f1)" == "$SOURCE_RTL_SHA" ]] || exit 16
          [[ "$(uname -m)" == x86_64 ]] || exit 16
          readelf -h "$model" | grep -Eq 'Class:[[:space:]]+ELF64' || exit 16
          readelf -h "$model" | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' || exit 16
          chmod 755 "$model"
          [[ "$(sha256sum "$model" | cut -d' ' -f1)" == b9a651a3ba3aa50c7e0b15405d24a3d3ab56dd25fa2df7fb20f5654cdda80461 ]] || exit 16
          ldd "$model" > "$RUNNER_TEMP/model-dynamic-abi.txt"
          ! grep -Fq 'not found' "$RUNNER_TEMP/model-dynamic-abi.txt" || exit 16
      - name: Advance genuine RTL segment one
        timeout-minutes: 25
        shell: bash
        run: bash tools/ci/product_sd1_migrated_autorelay_20m.sh build/product-sd1-autorelay-import/${{ inputs.start_m }}m ${{ inputs.stage1 }}
      - name: Upload complete stage one before any next cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-${{ inputs.stage1 }}m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-migrated-autorelay/${{ inputs.stage1 }}m
      - name: Advance genuine RTL segment two
        timeout-minutes: 25
        shell: bash
        run: bash tools/ci/product_sd1_migrated_autorelay_20m.sh build/product-sd1-migrated-autorelay/${{ inputs.stage1 }}m ${{ inputs.stage2 }}
      - name: Upload complete stage two before any next cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-${{ inputs.stage2 }}m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-migrated-autorelay/${{ inputs.stage2 }}m
      - name: Advance genuine RTL segment three
        timeout-minutes: 25
        shell: bash
        run: bash tools/ci/product_sd1_migrated_autorelay_20m.sh build/product-sd1-migrated-autorelay/${{ inputs.stage2 }}m ${{ inputs.stage3 }}
      - name: Upload complete stage three before any next cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-${{ inputs.stage3 }}m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-migrated-autorelay/${{ inputs.stage3 }}m
      - name: Advance genuine RTL segment four
        timeout-minutes: 25
        shell: bash
        run: bash tools/ci/product_sd1_migrated_autorelay_20m.sh build/product-sd1-migrated-autorelay/${{ inputs.stage3 }}m ${{ inputs.stage4 }}
      - name: Upload complete stage four before any next cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-${{ inputs.stage4 }}m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-migrated-autorelay/${{ inputs.stage4 }}m
      - name: Advance genuine RTL segment five
        timeout-minutes: 25
        shell: bash
        run: bash tools/ci/product_sd1_migrated_autorelay_20m.sh build/product-sd1-migrated-autorelay/${{ inputs.stage4 }}m ${{ inputs.stage5 }}
      - name: Prove host plus Verilator 64-bit time traversed the real 2^32 edge
        if: inputs.require_2pow32_crossing
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.stage4 }}' == 4292 && '${{ inputs.stage5 }}' == 4312 ]] || exit 16
          jq -e '
            .from_cycles == 4292000000 and .to_cycles == 4312000000 and
            .verilator_context_time_before == 4292000000 and
            .verilator_context_time_after == 4312000000 and
            .crossed_2pow32_boundary_verified == true and
            .retired_delta > 0 and .guest_failure == null
          ' build/product-sd1-migrated-autorelay/4312m/card-progress.json >/dev/null || exit 16
      - name: Upload complete stage five before completion
        id: upload_terminal
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-${{ inputs.stage5 }}m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-migrated-autorelay/${{ inputs.stage5 }}m
      - name: Distinguish five complete stages from Debian guest service login
        shell: bash
        env:
          STAGE1: ${{ inputs.stage1 }}
          STAGE2: ${{ inputs.stage2 }}
          STAGE3: ${{ inputs.stage3 }}
          STAGE4: ${{ inputs.stage4 }}
          STAGE5: ${{ inputs.stage5 }}
        run: |
          set -euo pipefail
          for mark in "$STAGE1" "$STAGE2" "$STAGE3" "$STAGE4" "$STAGE5"; do
            ready="build/product-sd1-migrated-autorelay/${mark}m/.migration-ready"
            grep -Fxq 'qualification=PRODUCT_SD1_MIGRATED_WARM_RTL_NOT_DEBIAN_PASS' "$ready"
            printf 'Product RTL %sM sealed/uploaded; Debian service/login not yet proved.\n' "$mark" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Publish authenticated terminal artifact ID digest and full Host RTL SHA outputs
        id: publish_terminal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TERMINAL: ${{ inputs.stage5 }}
          ARTIFACT_ID: ${{ steps.upload_terminal.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload_terminal.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          ready="build/product-sd1-migrated-autorelay/${TERMINAL}m/.migration-ready"
          progress="build/product-sd1-migrated-autorelay/${TERMINAL}m/card-progress.json"
          field() { sed -n "s/^$1=//p" "$2" | head -1; }
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          host="$(field snapshot_host_sha256 "$ready")"
          rtl="$(field snapshot_rtl_sha256 "$ready")"
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ &&
             "$ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ &&
             "$host" =~ ^[a-f0-9]{64}$ && "$rtl" =~ ^[a-f0-9]{64}$ &&
             "$(sha "build/product-sd1-migrated-autorelay/${TERMINAL}m/persistent.pre.host")" == "$host" &&
             "$(sha "build/product-sd1-migrated-autorelay/${TERMINAL}m/persistent.pre.rtl")" == "$rtl" &&
             "$(field model_sha256 "$ready")" == b9a651a3ba3aa50c7e0b15405d24a3d3ab56dd25fa2df7fb20f5654cdda80461 ]] || exit 16
          jq -e --argjson terminal "$((TERMINAL*1000000))" '
            .qualification == "MIGRATED_REAL_PRODUCT_RTL_20M_NOT_DEBIAN_PASS" and
            .to_cycles == $terminal and .from_cycles == ($terminal - 20000000) and
            .retired_delta > 0 and .guest_failure == null
          ' "$progress" >/dev/null || exit 16
          artifact_name="product-sd1-migrated-${TERMINAL}m-${GITHUB_RUN_ID}"
          # upload-artifact@v4 has already succeeded, but GitHub REST metadata
          # may become visible slightly later. Never fabricate an artifact ID.
          published=0
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/terminal-artifacts.json" &&
               jq -e --arg name "$artifact_name" --arg digest "$ARTIFACT_DIGEST" \
                 --arg sha "$TARGET_SHA" --argjson id "$ARTIFACT_ID" '
                   [.artifacts[] | select(.id == $id and .name == $name and
                     .digest == $digest and .workflow_run.head_sha == $sha and
                     .expired == false and .size_in_bytes > 1000000)] | length == 1
                 ' "$RUNNER_TEMP/terminal-artifacts.json" >/dev/null; then
              published=1
              break
            fi
            sleep 3
          done
          [[ "$published" == 1 ]] || exit 16
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=${ARTIFACT_DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          echo "host_sha=$host" >> "$GITHUB_OUTPUT"
          echo "rtl_sha=$rtl" >> "$GITHUB_OUTPUT"
          echo "PRODUCT_SD1_MIGRATED_AUTORUN_TERMINAL_AUTHENTICATED stage=${TERMINAL}m artifact_id=$ARTIFACT_ID host_sha=$host rtl_sha=$rtl"
      - name: Always archive diagnostic logs after failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-autorelay-logs-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/product-sd1-migrated-autorelay/logs
            build/product-sd1-migrated-autorelay/.stage-*
