name: AetherSoC UART PHY Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/soc/AetherSoCAddressMap.scala'
      - 'src/main/scala/aethercore/soc/peripheral/AetherUart16550.scala'
      - 'src/main/scala/aethercore/soc/phy/AetherUart8N1Phy.scala'
      - 'src/main/scala/aethercore/soc/AetherSoCPlatformFabric.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2LinuxSoC.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2UnifiedMemorySoC.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2Axi4SoC.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2FpgaSoC.scala'
      - 'src/main/scala/aethercore/ElaborateV2FpgaSoC.scala'
      - 'src/test/scala/aethercore/AetherUart8N1PhySpec.scala'
      - 'src/test/scala/aethercore/AetherUart16550Spec.scala'
      - 'src/test/scala/aethercore/AetherSoCDtsSpec.scala'
      - 'tests_py/test_v2_soc_uart_phy.py'
      - '.github/workflows/v2-soc-uart-phy.yml'

permissions:
  contents: read

concurrency:
  group: aethersoc-uart-phy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Prove divisor-driven UART PHY and FPGA top
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Check UART PHY source contract
        run: python3 -m unittest tests_py.test_v2_soc_uart_phy -v

      - name: Prove physical UART behavior
        run: |
          chmod +x mill
          ./mill aethercore.test.testOnly aethercore.AetherUart8N1PhySpec
          ./mill aethercore.test.testOnly aethercore.AetherUart16550Spec
          ./mill aethercore.test.testOnly aethercore.AetherSoCDtsSpec

      - name: Elaborate board-neutral FPGA SoC
        run: |
          rm -rf build/fpga-soc-uart-phy
          ./mill aethercore.runMain aethercore.ElaborateV2FpgaSoCRV64 \
            --target-dir build/fpga-soc-uart-phy
          find build/fpga-soc-uart-phy -maxdepth 1 -name '*.sv' -print -quit | grep -q .
