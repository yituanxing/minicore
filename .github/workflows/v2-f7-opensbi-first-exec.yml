name: AetherCore V2 F7 OpenSBI First Execution

on:
  workflow_dispatch:
  push:
    branches:
      - feature/aethercore-v2-f7-software-parity
    paths:
      - '.github/v2-f7-opensbi-request'

permissions:
  contents: read
  statuses: write

concurrency:
  group: aethercore-v2-f7-opensbi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-exec:
    name: Unchanged OpenSBI 1.6 on F7 v2 RV64
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 45
    env:
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      TARGET_SHA: ${{ github.sha }}
      OPENSBI_STATUS_CONTEXT: AetherCore V2 F7 OpenSBI First Execution

    steps:
      - name: Publish pending exact-head status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"$OPENSBI_STATUS_CONTEXT\",\"description\":\"Pinned unchanged OpenSBI 1.6 executing on F7 v2\",\"target_url\":\"$target_url\"}"

      - name: Checkout exact head without deleting persistent caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          if [[ -d .git ]]; then
            git clean -fd -- src/main/scala src/test/scala software/rv64 sim tools/ci tests_py .github/workflows || true
          else
            git init .
          fi

          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags --prune --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$TARGET_SHA" ]] || {
            echo "ERROR: exact-head checkout mismatch: expected=$TARGET_SHA actual=$actual" >&2
            exit 1
          }
          chmod +x ./mill tools/ci/rv64_opensbi_first_exec.sh tools/ensure_riscv64_linux_gcc_13_3.sh
          echo "exact_head=$actual"

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Provision pinned RV64 Linux-target GCC
        shell: bash
        run: bash tools/ensure_riscv64_linux_gcc_13_3.sh

      - name: Validate unchanged OpenSBI build contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/rv64_opensbi_first_exec.sh
          python3 -m py_compile tools/ci/make_l32_dtb.py
          python3 -m unittest \
            tests_py.test_rv64_opensbi_first_exec_contract \
            tests_py.test_opensbi_dtb_profiles -v

      - name: Build pinned unchanged OpenSBI 1.6 and S-mode payload
        shell: bash
        run: |
          set -euo pipefail
          build="$HOME/.cache/aethercore/v2-f7-opensbi/$TARGET_SHA"
          rm -rf "$build/software"
          mkdir -p "$build/software"
          bash tools/ci/rv64_opensbi_first_exec.sh "$build/software"
          grep -q '^RV64_OPENSBI_FIRST_EXEC_BUILD: status=PASS$' "$build/software/result.txt"

      - name: Elaborate F7 v2 RV64 OpenSBI top
        shell: bash
        run: |
          set -euo pipefail
          build="$HOME/.cache/aethercore/v2-f7-opensbi/$TARGET_SHA"
          rm -rf "$build/rtl" "$build/obj"
          mkdir -p "$build/rtl" "$build/obj"
          ./mill aethercore.runMain aethercore.ElaborateV2OpenSbiRV64 --target-dir "$build/rtl"
          find "$build/rtl" -maxdepth 1 -name '*.sv' -print | sort > "$build/rtl-sources.txt"
          test -s "$build/rtl-sources.txt"

      - name: Compile shared host runtime against v2 top
        shell: bash
        run: |
          set -euo pipefail
          build="$HOME/.cache/aethercore/v2-f7-opensbi/$TARGET_SHA"
          mapfile -t rtl_sources < "$build/rtl-sources.txt"
          verilator --cc --exe --build -Wall -Wno-fatal \
            --top-module AetherCoreV2OpenSbiRV64SimTop \
            -Mdir "$build/obj" -j "$(nproc)" \
            -CFLAGS "-std=c++20 -O2 -I$GITHUB_WORKSPACE/sim/v2_rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim" \
            -LDFLAGS "-ldl" \
            "${rtl_sources[@]}" \
            "$GITHUB_WORKSPACE/sim/opensbi_boot_main.cpp"

      - name: Execute unchanged OpenSBI through F7 v2 core
        shell: bash
        run: |
          set -euo pipefail
          build="$HOME/.cache/aethercore/v2-f7-opensbi/$TARGET_SHA"
          firmware="$build/software/opensbi/platform/generic/firmware/fw_payload.bin"
          simulator="$build/obj/VAetherCoreV2OpenSbiRV64SimTop"
          log="$build/runtime.log"
          test -s "$firmware"
          test -x "$simulator"

          if ! "$simulator" "$firmware" 30000000 \
              'RV64 OpenSBI S-mode payload PASS' 0 0 '' '' 0 1000000 0 \
              2>&1 | tee "$log"; then
            echo '--- F7 v2 OpenSBI failure tail ---' >&2
            tail -n 160 "$log" >&2 || true
            exit 1
          fi

          grep -Fq 'OpenSBI v1.6' "$log"
          grep -Fq 'RV64 OpenSBI S-mode payload PASS' "$log"
          grep -Fq 'L32_RUNTIME_MILESTONE_PASS' "$log"
          grep -Fq 'banner=1' "$log"

      - name: Publish successful exact-head status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "{\"state\":\"success\",\"context\":\"$OPENSBI_STATUS_CONTEXT\",\"description\":\"OpenSBI 1.6 + S-mode SBI payload passed on F7 v2\",\"target_url\":\"$target_url\"}"

      - name: Publish failed exact-head status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"$OPENSBI_STATUS_CONTEXT\",\"description\":\"F7 v2 OpenSBI first-exec milestone failed; inspect run\",\"target_url\":\"$target_url\"}"

      - name: Write F7 OpenSBI frontier summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AetherCore v2 F7 OpenSBI first execution'
            echo
            echo "- exact head: \`${TARGET_SHA}\`"
            echo '- trigger: trusted push request marker or explicit workflow dispatch; never public pull_request -> self-hosted'
            echo '- status: classic commit status is published for exact-head observability without PR comments'
            echo '- firmware: pinned unchanged OpenSBI 1.6 at bd613dd92113f683052acfb23d9dc8ba60029e0a'
            echo '- toolchain: pinned Bootlin RV64 Linux-target GCC 13.3.0 / binutils 2.41'
            echo '- core: F7 TinyPagedCore, RV64IMA + Zicsr + Zifencei, M/S/U, Sv39, PMP16/PA56'
            echo '- board: shared 256 MiB RAM + ACLINT + ns16550 + Supervisor PLIC source 10'
            echo '- atomic transport: AetherMem Atomic/LR/SC/AMO remains intact through the host RAM owner; no read/write lowering'
            echo '- payload: fixed S-mode handoff plus SBI Base GET_SPEC_VERSION round-trip and UART PASS marker'
            echo '- acceptance: OpenSBI v1.6 banner plus RV64 OpenSBI S-mode payload PASS on real F7 v2 Verilator execution'
          } >> "$GITHUB_STEP_SUMMARY"
