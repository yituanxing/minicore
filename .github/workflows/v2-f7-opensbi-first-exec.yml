name: AetherCore V2 F7 OpenSBI First Execution

on:
  workflow_dispatch:
  push:
    branches:
      - feature/aethercore-v2-f7-software-parity
    paths:
      - '.github/v2-f7-opensbi-request'

permissions:
  contents: read
  statuses: write

concurrency:
  group: aethercore-v2-f7-opensbi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  announce:
    name: Publish exact-head OpenSBI status
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      TARGET_SHA: ${{ github.sha }}
      OPENSBI_STATUS_CONTEXT: AetherCore V2 F7 OpenSBI First Execution
    steps:
      - name: Publish pending exact-head status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"$OPENSBI_STATUS_CONTEXT\",\"description\":\"Pinned unchanged OpenSBI 1.6 queued/running on F7 v2\",\"target_url\":\"$target_url\"}"

  first-exec:
    name: Unchanged OpenSBI 1.6 on F7 v2 RV64
    needs: announce
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      RV64_OPENSBI_JOBS: '4'
      TARGET_SHA: ${{ github.sha }}
      OPENSBI_STATUS_CONTEXT: AetherCore V2 F7 OpenSBI First Execution

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Verify exact head and configure build directory
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$TARGET_SHA" ]] || {
            echo "ERROR: exact-head checkout mismatch: expected=$TARGET_SHA actual=$actual" >&2
            exit 1
          }
          chmod +x ./mill tools/ci/rv64_opensbi_first_exec.sh \
            tools/ensure_riscv64_linux_gcc_13_3.sh tools/ensure_verilator_5_024.sh
          root="$RUNNER_TEMP/aethercore-v2-f7-opensbi"
          mkdir -p "$root/mill-out"
          echo "MILL_OUTPUT_DIR=$root/mill-out" >> "$GITHUB_ENV"
          echo "exact_head=$actual"

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore previous v2 Mill output accelerator
        id: mill-output-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/aethercore-v2-f7-opensbi/mill-out
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-v2-opensbi-millout-v1-${{ github.sha }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-v2-opensbi-millout-v1-
            aethercore-${{ runner.os }}-${{ runner.arch }}-v2-f7-millout-v1-
            aethercore-${{ runner.os }}-${{ runner.arch }}-v2-millout-v1-

      - name: Restore exact fixed Verilator cache
        id: verilator-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-

      - name: Install Verilator prerequisites on cache miss
        if: steps.verilator-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev build-essential git xz-utils

      - name: Validate or build exact Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Save exact validated Verilator on cache miss
        if: success() && steps.verilator-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}

      - name: Restore pinned RV64 Linux-target GCC cache
        id: rv64-toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/bootlin-riscv64-lp64d-glibc-stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv64-lp64d--glibc--stable-2024.05-1.tar.xz
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-13.3-v1-${{ hashFiles('tools/ensure_riscv64_linux_gcc_13_3.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-13.3-v1-

      - name: Provision pinned RV64 Linux-target GCC
        shell: bash
        run: bash tools/ensure_riscv64_linux_gcc_13_3.sh

      - name: Save validated RV64 Linux-target GCC on cache miss
        if: success() && steps.rv64-toolchain-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/bootlin-riscv64-lp64d-glibc-stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv64-lp64d--glibc--stable-2024.05-1.tar.xz
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-13.3-v1-${{ hashFiles('tools/ensure_riscv64_linux_gcc_13_3.sh') }}

      - name: Restore pinned OpenSBI source cache
        id: opensbi-source-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/aethercore/rv64-opensbi/opensbi/bd613dd92113f683052acfb23d9dc8ba60029e0a
          key: aethercore-opensbi-1.6-bd613dd92113f683052acfb23d9dc8ba60029e0a-v1

      - name: Validate unchanged OpenSBI build contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ensure_riscv64_linux_gcc_13_3.sh
          bash -n tools/ci/rv64_opensbi_first_exec.sh
          python3 -m py_compile tools/ci/make_l32_dtb.py
          python3 -m unittest \
            tests_py.test_rv64_opensbi_first_exec_contract \
            tests_py.test_opensbi_dtb_profiles -v

      - name: Build pinned unchanged OpenSBI 1.6 and S-mode payload
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/aethercore-v2-f7-opensbi/software"
          rm -rf "$build"
          mkdir -p "$build"
          bash tools/ci/rv64_opensbi_first_exec.sh "$build"
          grep -q '^RV64_OPENSBI_FIRST_EXEC_BUILD: status=PASS$' "$build/result.txt"
          echo "OPENSBI_BUILD=$build" >> "$GITHUB_ENV"

      - name: Save pinned OpenSBI source on cache miss
        if: success() && steps.opensbi-source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/aethercore/rv64-opensbi/opensbi/bd613dd92113f683052acfb23d9dc8ba60029e0a
          key: aethercore-opensbi-1.6-bd613dd92113f683052acfb23d9dc8ba60029e0a-v1

      - name: Elaborate F7 v2 RV64 OpenSBI top
        shell: bash
        run: |
          set -euo pipefail
          rtl="$RUNNER_TEMP/aethercore-v2-f7-opensbi/rtl"
          obj="$RUNNER_TEMP/aethercore-v2-f7-opensbi/obj"
          rm -rf "$rtl" "$obj"
          mkdir -p "$rtl" "$obj"
          ./mill aethercore.runMain aethercore.ElaborateV2OpenSbiRV64 --target-dir "$rtl"
          find "$rtl" -maxdepth 1 -name '*.sv' -print | sort > "$RUNNER_TEMP/aethercore-v2-f7-opensbi/rtl-sources.txt"
          test -s "$RUNNER_TEMP/aethercore-v2-f7-opensbi/rtl-sources.txt"
          echo "V2_OPENSBI_RTL=$rtl" >> "$GITHUB_ENV"
          echo "V2_OPENSBI_OBJ=$obj" >> "$GITHUB_ENV"

      - name: Save validated v2 Mill output accelerator
        if: success() && steps.mill-output-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/aethercore-v2-f7-opensbi/mill-out
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-v2-opensbi-millout-v1-${{ github.sha }}

      - name: Compile shared host runtime against v2 top
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t rtl_sources < "$RUNNER_TEMP/aethercore-v2-f7-opensbi/rtl-sources.txt"
          verilator --cc --exe --build -Wall -Wno-fatal \
            --top-module AetherCoreV2OpenSbiRV64SimTop \
            -Mdir "$V2_OPENSBI_OBJ" -j "$(nproc)" \
            -CFLAGS "-std=c++20 -O2 -I$GITHUB_WORKSPACE/sim/v2_rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim" \
            -LDFLAGS "-ldl" \
            "${rtl_sources[@]}" \
            "$GITHUB_WORKSPACE/sim/opensbi_boot_main.cpp"

      - name: Execute unchanged OpenSBI through F7 v2 core
        shell: bash
        run: |
          set -euo pipefail
          firmware="$OPENSBI_BUILD/opensbi/platform/generic/firmware/fw_payload.bin"
          simulator="$V2_OPENSBI_OBJ/VAetherCoreV2OpenSbiRV64SimTop"
          log="$RUNNER_TEMP/aethercore-v2-f7-opensbi/runtime.log"
          test -s "$firmware"
          test -x "$simulator"

          if ! "$simulator" "$firmware" 30000000 \
              'RV64 OpenSBI S-mode payload PASS' 0 0 '' '' 0 1000000 0 \
              2>&1 | tee "$log"; then
            echo '--- F7 v2 OpenSBI failure tail ---' >&2
            tail -n 160 "$log" >&2 || true
            exit 1
          fi

          grep -Fq 'OpenSBI v1.6' "$log"
          grep -Fq 'RV64 OpenSBI S-mode payload PASS' "$log"
          grep -Fq 'L32_RUNTIME_MILESTONE_PASS' "$log"
          grep -Fq 'banner=1' "$log"

      - name: Publish successful exact-head status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "{\"state\":\"success\",\"context\":\"$OPENSBI_STATUS_CONTEXT\",\"description\":\"OpenSBI 1.6 + S-mode SBI payload passed on F7 v2\",\"target_url\":\"$target_url\"}"

      - name: Publish failed exact-head status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"$OPENSBI_STATUS_CONTEXT\",\"description\":\"F7 v2 OpenSBI first-exec milestone failed; inspect run\",\"target_url\":\"$target_url\"}"

      - name: Write F7 OpenSBI frontier summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AetherCore v2 F7 OpenSBI first execution'
            echo
            echo "- exact head: \`${TARGET_SHA}\`"
            echo '- trigger: explicit request marker or workflow dispatch; never automatic per-PR firmware execution'
            echo '- runner: GitHub-hosted ubuntu-24.04; no personal-runner dependency'
            echo '- caches: fixed Verilator, pinned Bootlin RV64 GCC, pinned OpenSBI source, Scala/Mill accelerators'
            echo '- firmware: pinned unchanged OpenSBI 1.6 at bd613dd92113f683052acfb23d9dc8ba60029e0a'
            echo '- toolchain: pinned Bootlin RV64 Linux-target GCC 13.3.0 / binutils 2.41'
            echo '- core: F7 TinyPagedCore, RV64IMA + Zicsr + Zifencei, M/S/U, Sv39, PMP16/PA56'
            echo '- board: shared 256 MiB RAM + ACLINT + ns16550 + Supervisor PLIC source 10'
            echo '- atomic transport: AetherMem Atomic/LR/SC/AMO remains intact through the host RAM owner; no read/write lowering'
            echo '- payload: fixed S-mode handoff plus SBI Base GET_SPEC_VERSION round-trip and UART PASS marker'
            echo '- acceptance: OpenSBI v1.6 banner plus RV64 OpenSBI S-mode payload PASS on real F7 v2 Verilator execution'
          } >> "$GITHUB_STEP_SUMMARY"
