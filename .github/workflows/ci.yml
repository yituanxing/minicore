name: AetherCore CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Chisel, Verilator and NEMU DiffTest
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 45
    env:
      AETHERCORE_MILL_NO_DAEMON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Verify persistent runner toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test "$(stat -f -c %T .)" != "9p"
          test "$(stat -f -c %T .)" != "drvfs"
          java -version
          javac -version
          git --version
          python3 --version
          g++ --version
          test "$(cat "$HOME/.cache/aethercore/toolchains/verilator-5.024/.aethercore-source-revision")" = \
            "522bead374d6b7b2adb316304126e5361b18bcf1"
          test "$(readlink -f "$(command -v verilator)")" = \
            "$HOME/.cache/aethercore/toolchains/verilator-5.024/bin/verilator"
          bash tools/ensure_verilator_5_024.sh
          verilator --version || true
          riscv64-unknown-elf-gcc --version
          command -v make curl bison flex zstd

      - name: Probe Mill distribution network
        shell: bash
        run: |
          set -euxo pipefail
          mill_url=https://repo1.maven.org/maven2/com/lihaoyi/mill-dist/1.1.2/mill-dist-1.1.2.exe
          curl -fsSIL --connect-timeout 15 --max-time 60 "$mill_url"

      - name: Prepare Mill launcher
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x mill
          timeout 600 ./mill --version

      - name: Python reference and image tests
        run: make python-test

      - name: Chisel tests
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          make test 2>&1 | tee build/logs/chisel-test.log

      - name: Emit SystemVerilog
        shell: bash
        run: |
          set -o pipefail
          make rtl 2>&1 | tee build/logs/elaboration.log

      - name: Verilator smoke test
        shell: bash
        run: |
          set -o pipefail
          make run-smoke 2>&1 | tee build/logs/verilator-smoke.log

      - name: Directed pipeline regressions
        shell: bash
        run: |
          set -o pipefail
          make run-regressions 2>&1 | tee build/logs/pipeline-regressions.log

      - name: Remaining RV64I completion regressions
        shell: bash
        run: |
          set -o pipefail
          make run-completion-regressions 2>&1 | tee build/logs/completion-regressions.log

      - name: Precise fault-boundary regressions
        shell: bash
        run: |
          set -o pipefail
          make run-fault-regressions 2>&1 | tee build/logs/fault-regressions.log

      - name: NEMU commit-level DiffTest
        shell: bash
        run: |
          set -o pipefail
          make run-difftest 2>&1 | tee build/logs/nemu-difftest.log

      - name: NEMU DiffTest mismatch probe
        shell: bash
        run: |
          set -o pipefail
          make run-difftest-mismatch-probe 2>&1 | tee build/logs/nemu-difftest-mismatch-probe.log

      - name: Generated RV64I NEMU DiffTest matrix
        shell: bash
        run: |
          set -o pipefail
          make run-generated-difftest 2>&1 | tee build/logs/generated-nemu-difftest.log

      - name: Directed RV64M NEMU DiffTest
        shell: bash
        run: |
          set -o pipefail
          make run-rv64m-regressions 2>&1 | tee build/logs/rv64m-nemu-difftest.log

      - name: Generated RV64M NEMU DiffTest matrix
        shell: bash
        run: |
          set -o pipefail
          make run-generated-rv64m 2>&1 | tee build/logs/generated-rv64m-nemu-difftest.log

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/logs/
            build/rtl/
            build/software/smoke.bin
            build/regressions/
            build/completion-regressions/
            build/fault-regressions/
            build/generated-difftest/
            build/rv64m-regressions/
            build/generated-rv64m/
            build/aethercore.vcd
