name: AetherCore CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Chisel, Verilator and NEMU DiffTest
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8

      - name: Cache pinned NEMU reference
        uses: actions/cache@v4
        with:
          path: build/nemu
          key: nemu-${{ runner.os }}-ad6bfde6241f2fc1e864b1efb2bed99b3670eb73

      - name: Install Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:21

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            verilator make g++ python3 curl git bison flex \
            libreadline-dev libsdl2-dev zstd libzstd-dev
          java -version
          verilator --version

      - name: Prepare Mill launcher
        run: |
          chmod +x mill
          ./mill --version

      - name: Python reference and image tests
        run: make python-test

      - name: Chisel tests
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          make test 2>&1 | tee build/logs/chisel-test.log

      - name: Emit SystemVerilog
        shell: bash
        run: |
          set -o pipefail
          make rtl 2>&1 | tee build/logs/elaboration.log

      - name: Verilator smoke test
        shell: bash
        run: |
          set -o pipefail
          make run-smoke 2>&1 | tee build/logs/verilator-smoke.log

      - name: Directed pipeline regressions
        shell: bash
        run: |
          set -o pipefail
          make run-regressions 2>&1 | tee build/logs/pipeline-regressions.log

      - name: Remaining RV64I completion regressions
        shell: bash
        run: |
          set -o pipefail
          make run-completion-regressions 2>&1 | tee build/logs/completion-regressions.log

      - name: Precise fault-boundary regressions
        shell: bash
        run: |
          set -o pipefail
          make run-fault-regressions 2>&1 | tee build/logs/fault-regressions.log

      - name: NEMU commit-level DiffTest
        shell: bash
        run: |
          set -o pipefail
          make run-difftest 2>&1 | tee build/logs/nemu-difftest.log

      - name: NEMU DiffTest mismatch probe
        shell: bash
        run: |
          set -o pipefail
          make run-difftest-mismatch-probe 2>&1 | tee build/logs/nemu-difftest-mismatch-probe.log

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/logs/
            build/rtl/
            build/software/smoke.bin
            build/regressions/
            build/completion-regressions/
            build/fault-regressions/
            build/aethercore.vcd
