name: INERT DRAFT V6 14992M to 15012M signed Product RTL technical qualification
# Only one real 20M stage. This is technical evidence, NOT a Debian login PASS.
# Remains fail-closed pending genuine V5 14992M terminal artifact pins,
# reviewed activation source, verified portable signed media artifact, and approval.
# PR-label-only / no workflow_dispatch, workflow_run, push, or write privilege.
'on':
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read
concurrency:
  group: sd1-v6-qual-20m-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  V6_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  V6_REVIEWED_HEAD: '6dfb8eb2ee445c730b1b5ed5dcc2f3919ebcda87'
  # Read-only V5 model-migration qualification is retained, not claimed as V6 qualification.
  V6_QUAL_RUN: '42599136275'
  V6_QUAL_ID: '13664668373'
  V6_QUAL_HEAD: 'a0480c3cfe5ae2b01b92f82e5bc3d90582a9cc4b'
  V6_QUAL_NAME: 'product-sd1-model-migrate-v5-qual-9972-9992-42599136275'
  V6_QUAL_DIGEST: '55d5cf2d8ff46c93eb6c21de1b9c451ff14287da8c03f9cc424d1dd0de41ff89'
  V6_QUAL_MANIFEST_SHA: '63766841ea96bf75b40584e1760b9e78f538d3a7dd16193a3ff71e8d4fb8c700'
  V6_MODEL_SHA: '4f946c321c63528ce789440486c82ef89204fc0905985bb42a97d1ec9fe989be'
  AETHERCORE_SD1_V6_REVIEWED_MODEL_SHA: '4f946c321c63528ce789440486c82ef89204fc0905985bb42a97d1ec9fe989be'
  V6_ORIGIN_RUN: '42600415630'
  V6_ORIGIN_HEAD: '8a40835c470d059448a4871bafead04cc555bee5'
  V6_MEDIA_RUN: 'PENDING_TRUSTED_MEDIA_EXPORT_RUN'
  V6_MEDIA_HEAD: 'PENDING_TRUSTED_MEDIA_EXPORT_SOURCE_HEAD'
  V6_MEDIA_ID: 'PENDING_TRUSTED_MEDIA_ARTIFACT_ID'
  V6_MEDIA_NAME: 'PENDING_TRUSTED_MEDIA_ARTIFACT_NAME'
  V6_MEDIA_ZIP_SHA: 'PENDING_TRUSTED_MEDIA_ZIP_SHA'
  V6_MEDIA_MANIFEST_SHA: 'PENDING_TRUSTED_MEDIA_FILE_MANIFEST_SHA'
  V6_14992_ID: 'PENDING_REAL_14992_ARTIFACT_ID'
  V6_14992_NAME: 'PENDING_REAL_14992_ARTIFACT_NAME'
  V6_14992_DIGEST: 'PENDING_REAL_14992_ZIP_DIGEST'
  V6_14992_HOST_SHA: 'PENDING_REAL_14992_HOST_SHA'
  V6_14992_RTL_SHA: 'PENDING_REAL_14992_RTL_SHA'
  V6_14992_CARD_SHA: 'PENDING_REAL_14992_CARD_SHA'
  AETHERCORE_SD1_V6_20B_APPROVED: PENDING_SEPARATE_14992_TO_15012_QUALIFICATION_REVIEW
  AETHERCORE_SD1_RELAY_CONFIRM: PENDING_SEPARATE_14992_TO_15012_REVIEW
  AETHERCORE_VERILATOR_VERSION: '5.054'
  SIM_SETTLE_MODE: reference
  VERILATOR_THREADS: '1'
  AETHERCORE_DATA_MEM_WAIT_CYCLES: '0'
jobs:
  v6_billion_1:
    name: INERT V6 technical qualification genuine RTL 14992M to 15012M
    if: >-
      false &&
      github.repository == 'yituanxing/minicore' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'sd1-v6-qual-approved' &&
      github.event.pull_request.number == 0 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'design/sd1-v6-qual-20m-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout V6 qualification source without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V6_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed V6 executor blobs and one workflow-only diff
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$V6_SOURCE_SHA" ]] || exit 16
          [[ "$(git rev-parse "$V6_REVIEWED_HEAD^{commit}")" == "$V6_REVIEWED_HEAD" ]] || exit 16
          git merge-base --is-ancestor "$V6_REVIEWED_HEAD" HEAD || exit 16
          while IFS= read -r -d '' changed; do
            [[ "$changed" == .github/workflows/product-sd1-v6-20m-qualification-INERT-DRAFT.yml ]] || {
              echo "V6 technical qualification unexpected source change: $changed" >&2
              exit 16
            }
          done < <(git diff --name-only -z "$V6_REVIEWED_HEAD" HEAD)
          for path in \
            tools/ci/product_sd1_v6_chain.py \
            tools/ci/product_sd1_v6_chain_prepare.sh \
            tools/ci/product_sd1_v6_postcross_20m.sh \
            tools/ci/product_sd1_v6_release_guard.sh \
            .github/actions/product-sd1-v6-20m/action.yml \
            .github/actions/product-sd1-v6-batch/action.yml; do
            [[ "$(git rev-parse "HEAD:$path")" == "$(git rev-parse "$V6_REVIEWED_HEAD:$path")" ]] || exit 16
          done
          bash -n tools/ci/product_sd1_v6_postcross_20m.sh
          bash -n tools/ci/product_sd1_v6_chain_prepare.sh
          python3 -m py_compile tools/ci/product_sd1_v6_chain.py
          bash tools/ci/product_sd1_v6_postcross_20m.sh --plan
      - name: Import only authenticated portable V5 signed Debian media archive
        shell: bash
        env:
          MEDIA_RUN: ${{ env.V6_MEDIA_RUN }}
          MEDIA_HEAD: ${{ env.V6_MEDIA_HEAD }}
          MEDIA_ID: ${{ env.V6_MEDIA_ID }}
          MEDIA_NAME: ${{ env.V6_MEDIA_NAME }}
          MEDIA_ZIP_SHA: ${{ env.V6_MEDIA_ZIP_SHA }}
          MEDIA_MANIFEST_SHA: ${{ env.V6_MEDIA_MANIFEST_SHA }}
        run: |
          set -euo pipefail
          # A different PR cannot restore PR#379-scoped Actions caches. The
          # trusted origin runner must export its already-built media unchanged.
          # No build, no cache fallback, no cold guest cycles.
          [[ "$MEDIA_RUN" =~ ^[0-9]{8,13}$ && "$MEDIA_HEAD" =~ ^[a-f0-9]{40}$ &&
             "$MEDIA_ID" =~ ^[0-9]{8,13}$ && "$MEDIA_NAME" =~ ^[A-Za-z0-9_.-]+$ &&
             "$MEDIA_ZIP_SHA" =~ ^[a-f0-9]{64}$ &&
             "$MEDIA_MANIFEST_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 16
          archive_dir="$RUNNER_TEMP/v6-portable-media"
          mkdir -p "$archive_dir"
          metadata="$archive_dir/source.json"
          archive="$archive_dir/source.zip"
          visible=0
          for delay in 0 2 3 5 8 13 21 30; do
            if (( delay > 0 )); then sleep "$delay"; fi
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$MEDIA_ID" > "$metadata"; then
              visible=1
              break
            fi
          done
          [[ "$visible" == 1 ]] || exit 16
          jq -e --argjson id "$MEDIA_ID" --argjson run "$MEDIA_RUN" \
            --arg name "$MEDIA_NAME" --arg digest "sha256:$MEDIA_ZIP_SHA" \
            --arg head "$MEDIA_HEAD" '
              .id==$id and .name==$name and .digest==$digest and
              .workflow_run.id==$run and .workflow_run.head_sha==$head and
              .expired==false and .size_in_bytes>1024
            ' "$metadata" >/dev/null || exit 16
          fetched=0
          for delay in 0 2 3 5 8 13 21 30; do
            if (( delay > 0 )); then sleep "$delay"; fi
            if curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$MEDIA_ID/zip" -o "$archive"; then
              fetched=1
              break
            fi
          done
          [[ "$fetched" == 1 && "$(sha256sum "$archive" | cut -d' ' -f1)" == "$MEDIA_ZIP_SHA" ]] || exit 16
          # Reject ZIP traversal, symlinks, non-media paths and unsigned files
          # BEFORE extracting into the ephemeral runner workspace.
          python3 - "$archive" "$MEDIA_MANIFEST_SHA" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib,stat,sys,zipfile
          from pathlib import PurePosixPath,Path
          archive, expected, workspace=sys.argv[1:]
          allowed=('build/rv64-debian-rootfs/','build/rv64-debian-linux/',
                   'build/rv64-debian-boot/','build/rv64-debian-sd1-sd/',
                   'build/product-sd1-official-seed/','build/product-sd1-gpio-cs-diagnostic/')
          with zipfile.ZipFile(archive) as z:
            members=z.infolist()
            names=[i.filename for i in members if not i.is_dir()]
            if names.count('portable-media-manifest.txt')!=1 or len(names)!=len(set(names)):
              raise SystemExit('V6 portable media manifest missing or duplicate names')
            manifest=z.read('portable-media-manifest.txt')
            if hashlib.sha256(manifest).hexdigest()!=expected:
              raise SystemExit('V6 portable media manifest SHA mismatch')
            records={}
            for line in manifest.decode('utf-8').splitlines():
              if len(line)<67 or line[64:66]!='  ' or len(line[:64])!=64 or any(c not in '0123456789abcdef' for c in line[:64]):
                raise SystemExit('V6 portable media malformed SHA line')
              filename=line[66:]
              if filename in records: raise SystemExit('duplicate file in SHA manifest')
              records[filename]=line[:64]
            for i in members:
              raw=i.filename
              path=PurePosixPath(raw)
              mode=i.external_attr>>16
              if (path.is_absolute() or '..' in path.parts or
                  any(part in ('', '.') for part in raw.rstrip('/').split('/')) or
                  '\\' in raw or stat.S_ISLNK(mode) or
                  (raw!='portable-media-manifest.txt' and not
                   (any(raw.startswith(p) for p in allowed) or
                    (raw=='build/' and i.is_dir())))):
                raise SystemExit('V6 unsafe or unapproved portable media path')
              if not i.is_dir() and Path(workspace,raw).exists():
                raise SystemExit('V6 portable media output path already exists')
            if set(records)!=set(names)-{'portable-media-manifest.txt'}:
              raise SystemExit('V6 unsigned or missing media archive member')
          PY
          unzip -qq "$archive" -d "$GITHUB_WORKSPACE"
          (cd "$GITHUB_WORKSPACE" && sha256sum --status -c portable-media-manifest.txt) || exit 16
          rm -f "$GITHUB_WORKSPACE/portable-media-manifest.txt"
          [[ -f build/rv64-debian-rootfs/result.txt &&
             -f build/rv64-debian-sd1-sd/sd-rootfs.img &&
             -f build/product-sd1-gpio-cs-diagnostic/linux/obj/arch/riscv/boot/Image ]] || exit 16
          echo 'PRODUCT_SD1_V6_SIGNED_MEDIA_PORTABLE_ARTIFACT_AND_FILE_SHA_VERIFIED'
      - uses: actions/download-artifact@v4
        with:
          run-id: 42338584047
          name: product-sd1-spi-polling-build-42338584047
          github-token: ${{ github.token }}
          path: build/product-sd1-spi-polling-import
      - name: Import and authenticate qualified V6 model and exact source checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V6_BATCH_START_M: '14992'
          V6_BATCH_END_M: '15992'
          V6_SOURCE_MODE: 'cross_run'
          V6_SOURCE_ID: ${{ env.V6_14992_ID }}
          V6_SOURCE_NAME: ${{ env.V6_14992_NAME }}
          V6_SOURCE_DIGEST: ${{ env.V6_14992_DIGEST }}
          V6_SOURCE_HOST_SHA: ${{ env.V6_14992_HOST_SHA }}
          V6_SOURCE_RTL_SHA: ${{ env.V6_14992_RTL_SHA }}
          V6_SOURCE_CARD_SHA: ${{ env.V6_14992_CARD_SHA }}
        run: |
          set -euo pipefail
          export V6_BATCH_START_M V6_BATCH_END_M V6_SOURCE_MODE V6_SOURCE_ID
          export V6_SOURCE_NAME V6_SOURCE_DIGEST V6_SOURCE_HOST_SHA
          export V6_SOURCE_RTL_SHA V6_SOURCE_CARD_SHA
          bash tools/ci/product_sd1_v6_chain_prepare.sh
          {
            echo "V6_BATCH_START_M=$V6_BATCH_START_M"
            echo "V6_BATCH_END_M=$V6_BATCH_END_M"
          } >> "$GITHUB_ENV"
      - name: Qualify genuine RTL 14992M to 15012M (exactly one 20M stage)
        uses: ./.github/actions/product-sd1-v6-20m
        with:
          ordinal: '1'
      - name: Require exact signed 15012M result and save qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "${V6_CURRENT_M:-}" == 15012 && "${V6_STOP:-0}" =~ ^[01]$ ]] || exit 16
          [[ -n "${V6_LAST_ARTIFACT_ID:-}" && -n "${V6_LAST_ARTIFACT_DIGEST:-}" &&
             -n "${V6_LAST_ARTIFACT_NAME:-}" ]] || exit 16
          [[ "$(sed -n 's/^source_cycles=//p' "$V6_SOURCE_DIR/.migration-ready")" == 14992000000 ]] || exit 16
          [[ "$(sed -n 's/^source_host_sha256=//p' "$V6_SOURCE_DIR/.migration-ready")" == "$V6_14992_HOST_SHA" &&
             "$(sed -n 's/^source_rtl_sha256=//p' "$V6_SOURCE_DIR/.migration-ready")" == "$V6_14992_RTL_SHA" ]] || exit 16
          python3 tools/ci/product_sd1_v6_chain.py verify-stage "$V6_SOURCE_DIR" 15012000000 > "$RUNNER_TEMP/v6-qual-stage-verified.json"
          jq -e '.cycles==15012000000 and .source_cycles=="14992000000" and .proof.debian_login_claim==false' \
            "$RUNNER_TEMP/v6-qual-stage-verified.json" >/dev/null || exit 16
          report="$RUNNER_TEMP/v6-qual-report"
          mkdir -p "$report"
          cp "$RUNNER_TEMP/v6-qual-stage-verified.json" "$report/verified-stage.json"
          cp "$V6_SOURCE_DIR/serial-proof.json" "$report/serial-proof.json"
          cp "$V6_SOURCE_DIR/.migration-ready" "$report/migration-ready.txt"
          {
            echo 'schema=SD1_V6_14992_15012_TECHNICAL_QUALIFICATION_V1'
            echo "reviewed_v6_head=$V6_REVIEWED_HEAD"
            echo "qual_source_head=$V6_SOURCE_SHA"
            echo "origin_run=$V6_ORIGIN_RUN"
            echo "origin_head=$V6_ORIGIN_HEAD"
            echo "origin_id=$V6_14992_ID"
            echo "origin_name=$V6_14992_NAME"
            echo "origin_zip_digest=$V6_14992_DIGEST"
            echo "origin_host_sha=$V6_14992_HOST_SHA"
            echo "origin_rtl_sha=$V6_14992_RTL_SHA"
            echo "origin_card_sha=$V6_14992_CARD_SHA"
            echo "stage_artifact_id=$V6_LAST_ARTIFACT_ID"
            echo "stage_artifact_name=$V6_LAST_ARTIFACT_NAME"
            echo "stage_artifact_zip_digest=$V6_LAST_ARTIFACT_DIGEST"
            echo "stage_host_sha=$V6_LAST_HOST_SHA"
            echo "stage_rtl_sha=$V6_LAST_RTL_SHA"
            echo "stage_card_sha=$V6_LAST_CARD_SHA"
            echo "stage_serial_proof_sha=$(sha256sum "$V6_SOURCE_DIR/serial-proof.json" | cut -d' ' -f1)"
            echo "model_sha=$V6_MODEL_SHA"
            echo 'signed_no_cold_boot=1'
            echo 'debian_login_claim=0'
          } > "$report/qualification-manifest.txt"
          echo 'PRODUCT_SD1_V6_20M_TECHNICAL_STAGE_VERIFIED_NOT_DEBIAN_PASS'
      - id: qualification_report
        name: Retain independent technical qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-v6-qual-14992-15012-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/v6-qual-report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Authenticate uploaded V6 qualification report
        shell: bash
        env:
          ART_ID: ${{ steps.qualification_report.outputs.artifact-id }}
          ART_SHA: ${{ steps.qualification_report.outputs.artifact-digest }}
          ART_NAME: product-sd1-v6-qual-14992-15012-${{ github.run_id }}-attempt${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ART_SHA="${ART_SHA#sha256:}"
          [[ "$ART_ID" =~ ^[0-9]+$ && "$ART_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 16
          visible=0
          for delay in 0 2 3 5 8 13 21 30; do
            if (( delay > 0 )); then sleep "$delay"; fi
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID" > "$RUNNER_TEMP/v6-qual-report-artifact.json"; then
              visible=1
              break
            fi
          done
          [[ "$visible" == 1 ]] || exit 16
          jq -e --argjson id "$ART_ID" --argjson run "$GITHUB_RUN_ID" \
            --arg name "$ART_NAME" --arg digest "sha256:$ART_SHA" --arg head "$V6_SOURCE_SHA" '
              .id==$id and .name==$name and .digest==$digest and
              .workflow_run.id==$run and .workflow_run.head_sha==$head and
              .expired==false and .size_in_bytes>1024
            ' "$RUNNER_TEMP/v6-qual-report-artifact.json" >/dev/null || exit 16
          echo 'PRODUCT_SD1_V6_20M_TECH_QUAL_ARTIFACT_PROVENANCE_VERIFIED_NOT_DEBIAN_PASS'
