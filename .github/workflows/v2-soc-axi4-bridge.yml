name: AetherSoC AXI4 Bridge Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/soc/AetherAxi4.scala'
      - 'src/main/scala/aethercore/soc/AetherMemToAxi4Bridge.scala'
      - 'src/main/scala/aethercore/ElaborateV2AetherMemToAxi4.scala'
      - 'tests_py/test_v2_soc_axi4_bridge.py'
      - '.github/workflows/v2-soc-axi4-bridge.yml'

permissions:
  contents: read

concurrency:
  group: aethersoc-axi4-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  elaborate:
    name: Elaborate AetherMem to AXI4 bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Check AXI4 bridge source contract
        run: python3 -m unittest tests_py.test_v2_soc_axi4_bridge -v

      - name: Elaborate AXI4 bridge
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          rm -rf build/soc-axi4-bridge
          ./mill aethercore.runMain aethercore.ElaborateV2AetherMemToAxi4             --target-dir build/soc-axi4-bridge
          find build/soc-axi4-bridge -maxdepth 1 -name '*.sv' -print -quit | grep -q .
