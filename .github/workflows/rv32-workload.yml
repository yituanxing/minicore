name: RV32 GCC Workload

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv32-workload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rv32-workload:
    name: GCC RV32I against RV32 Verilator top
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8

      - name: Install Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:21

      - name: Install Verilator and RISC-V compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            verilator make g++ python3 \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
          java -version
          verilator --version
          riscv64-unknown-elf-gcc --version

      - name: Prepare Mill launcher
        run: |
          chmod +x mill
          ./mill --version

      - name: Build and run GCC RV32I workload
        shell: bash
        run: |
          mkdir -p build/rv32
          set -o pipefail
          make -f Makefile.rv32 run 2>&1 | tee build/rv32/rv32-workload.log

      - name: Upload RV32 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32-workload-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: build/rv32/
