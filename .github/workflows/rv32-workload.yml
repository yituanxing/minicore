name: RV32 GCC Workload

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv32-workload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rv32-workload:
    name: GCC RV32I against RV32 Verilator top
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 45
    env:
      AETHERCORE_MILL_NO_DAEMON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Verify persistent runner toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test "$(stat -f -c %T .)" != "9p"
          test "$(stat -f -c %T .)" != "drvfs"
          java -version
          javac -version
          git --version
          python3 --version
          g++ --version
          test "$(cat "$HOME/.cache/aethercore/toolchains/verilator-5.024/.aethercore-source-revision")" = \
            "522bead374d6b7b2adb316304126e5361b18bcf1"
          test "$(readlink -f "$(command -v verilator)")" = \
            "$HOME/.cache/aethercore/toolchains/verilator-5.024/bin/verilator"
          riscv64-unknown-elf-gcc --version
          riscv64-unknown-elf-objdump --version | head -n 1
          command -v make curl file

      - name: Prepare Mill launcher
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x mill
          timeout 600 ./mill --version

      - name: Build and run GCC RV32I workload
        shell: bash
        run: |
          mkdir -p build/rv32
          set -o pipefail
          make -f Makefile.rv32 run 2>&1 | tee build/rv32/rv32-workload.log

      - name: Upload RV32 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32-workload-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: build/rv32/
