name: AetherCore Translation Unit FPGA Area

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/core/TranslationUnit.scala'
      - 'src/main/scala/aethercore/core/TranslationTlb.scala'
      - 'src/main/scala/aethercore/core/PageTableWalker.scala'
      - 'src/main/scala/aethercore/core/PageTableEntryChecker.scala'
      - 'src/main/scala/aethercore/ElaborateTranslationUnitSynthesisRV64.scala'
      - '.github/workflows/v2-translation-unit-area.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-translation-unit-area-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure standalone Sv39 TLB8 PTW area
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install synthesis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          yosys -V

      - name: Elaborate standalone translation unit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          out="$RUNNER_TEMP/translation-unit-rtl"
          rm -rf "$out"
          ./mill aethercore.runMain aethercore.ElaborateTranslationUnitSynthesisRV64 \
            --target-dir "$out"
          find "$out" -maxdepth 1 -name '*.sv' -print -quit | grep -q .
          echo "RTL_DIR=$out" >> "$GITHUB_ENV"

      - name: Map translation unit with Yosys ECP5 proxy
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/translation-unit-area"
          rm -rf "$out"
          mkdir -p "$out"

          mapfile -t svs < <(find "$RTL_DIR" -maxdepth 1 -name '*.sv' -print | sort)
          read_cmd="read_verilog -sv -DSYNTHESIS"
          for sv in "${svs[@]}"; do
            read_cmd+=" $sv"
          done

          yosys -Q -p "$read_cmd; hierarchy -check -top TranslationUnit; synth_ecp5 -top TranslationUnit -json $out/translation.json; stat -top TranslationUnit" \
            2>&1 | tee "$out/yosys.log"

          export AREA_OUT="$out"
          python3 - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          root = Path(os.environ["AREA_OUT"])
          net = json.loads((root / "translation.json").read_text())
          types = Counter(c["type"] for c in net["modules"]["TranslationUnit"]["cells"].values())
          summary = {
              "top": "TranslationUnit",
              "geometry": "Sv39",
              "tlb_entries": 8,
              "cells": sum(types.values()),
              "lut4": types["LUT4"],
              "ff": types["TRELLIS_FF"],
              "distributed_ram_trellis_dpr16x4": types["TRELLIS_DPR16X4"],
              "bram_dp16kd": types["DP16KD"],
              "mult18x18d": types["MULT18X18D"],
              "ccu2c": types["CCU2C"],
              "pfumx": types["PFUMX"],
              "l6mux21": types["L6MUX21"],
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload translation-unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-translation-unit-area-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/translation-unit-area/summary.json
            ${{ runner.temp }}/translation-unit-area/yosys.log
