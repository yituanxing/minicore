name: RV32 NEMU DiffTest

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv32-nemu-difftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  difftest:
    name: GCC RV32I commit-level NEMU DiffTest
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 60
    env:
      AETHERCORE_MILL_NO_DAEMON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Verify persistent runner toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test "$(stat -f -c %T .)" != "9p"
          test "$(stat -f -c %T .)" != "drvfs"
          java -version
          javac -version
          git --version
          python3 --version
          g++ --version
          test "$(cat "$HOME/.cache/aethercore/toolchains/verilator-5.024/.aethercore-source-revision")" = \
            "522bead374d6b7b2adb316304126e5361b18bcf1"
          test "$(readlink -f "$(command -v verilator)")" = \
            "$HOME/.cache/aethercore/toolchains/verilator-5.024/bin/verilator"
          riscv64-unknown-elf-gcc --version
          riscv64-unknown-elf-objdump --version | head -n 1
          command -v make curl git bison flex zstd file

      - name: Prepare Mill launcher
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x mill
          timeout 600 ./mill --version

      - name: Establish deterministic optimized RV32 NEMU reference
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          bash tools/probe_rv32_nemu_deterministic.sh \
            "$(pwd)/build/rv32-nemu-probe" \
            2>&1 | tee build/rv32-nemu-abi.log
          grep -q '^status=PASS$' build/rv32-nemu-probe/evidence/result.txt
          grep -q '^reproducible=true$' build/rv32-nemu-probe/evidence/result.txt
          grep -q '^single_step=0$' build/rv32-nemu-probe/evidence/result.txt
          grep -q '^perf_opt=true$' build/rv32-nemu-probe/evidence/result.txt
          grep '^reference_sha256=' build/rv32-nemu-probe/evidence/result.txt \
            | tee build/optimized-reference-sha256.txt
          mv build/rv32-nemu-probe build/rv32-nemu-abi

      - name: Build exact frozen RV32 NEMU reference
        shell: bash
        run: |
          set -o pipefail
          NEMU_SINGLE_STEP=1 bash tools/probe_rv32_nemu_deterministic.sh \
            "$(pwd)/build/rv32-nemu-probe" \
            2>&1 | tee build/rv32-nemu-probe.log
          grep -q '^CONFIG_ENABLE_INSTR_CNT=y$' \
            build/rv32-nemu-probe/evidence/generated.config
          grep -q '^# CONFIG_PERF_OPT is not set$' \
            build/rv32-nemu-probe/evidence/generated.config
          grep -q '^reference_sha256=e1e18bec22a1e6a19dbb300b43063ed5d3216a8d9f6ccf6400355d4fb897de9e$' \
            build/rv32-nemu-probe/evidence/result.txt
          grep -q '^single_step=1$' \
            build/rv32-nemu-probe/evidence/result.txt
          grep -q '^perf_opt=false$' \
            build/rv32-nemu-probe/evidence/result.txt
          reference_so="$(find build/rv32-nemu-probe/nemu/build -maxdepth 1 -type f \
            -name 'riscv32-nemu-interpreter-so*' -print -quit)"
          test -n "$reference_so"
          echo "RV32_NEMU_SO=$reference_so" >> "$GITHUB_ENV"

      - name: Run 585-retirement RV32 DiffTest
        shell: bash
        run: |
          mkdir -p build/rv32
          set -o pipefail
          make -f Makefile.rv32 run-difftest RV32_NEMU_SO="$RV32_NEMU_SO" \
            2>&1 | tee build/rv32/rv32-difftest.log
          grep -Fq '585 committed instructions' build/rv32/rv32-difftest.log
          grep -Fq 'difftest=585' build/rv32/rv32-difftest.log

      - name: Prove RV32 mismatch detection
        shell: bash
        run: |
          set +e
          AETHERCORE_RV32_DIFFTEST_INJECT_MISMATCH_AT=0 \
            make -f Makefile.rv32 run-difftest RV32_NEMU_SO="$RV32_NEMU_SO" \
            > build/rv32/rv32-negative-difftest.log 2>&1
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo 'ERROR: deliberate RV32 mismatch unexpectedly passed' >&2
            exit 1
          fi
          grep -Fq 'RV32 DiffTest mismatch after 0 matched events' \
            build/rv32/rv32-negative-difftest.log
          cat build/rv32/rv32-negative-difftest.log

      - name: Upload RV32 DiffTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32-nemu-difftest-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/optimized-reference-sha256.txt
            build/rv32-nemu-abi.log
            build/rv32-nemu-abi/evidence/
            build/rv32-nemu-probe.log
            build/rv32-nemu-probe/evidence/
            build/rv32/
