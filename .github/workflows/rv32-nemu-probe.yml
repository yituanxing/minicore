name: RV32 NEMU DiffTest

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv32-nemu-difftest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  difftest:
    name: GCC RV32I commit-level NEMU DiffTest
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8
        with:
          job: rv32-nemu-difftest

      - name: Install Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 bison flex \
            libreadline-dev libsdl2-dev zstd libzstd-dev \
            file binutils verilator \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
          java -version
          verilator --version
          riscv64-unknown-elf-gcc --version

      - name: Prepare Mill launcher
        run: |
          chmod +x mill
          ./mill --version

      - name: Preserve frozen optimized RV32 NEMU reference
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          # The historical unstripped shared object contains its absolute build
          # path. Reproduce PR #18 at the exact frozen path before moving its
          # complete evidence aside for the precise reference build.
          bash tools/probe_rv32_nemu_historical.sh \
            "$(pwd)/build/rv32-nemu-probe" \
            2>&1 | tee build/rv32-nemu-abi.log
          grep -q '^reference_sha256=b064aec211ae22e872d8ab7a3705a2e354e0d968289dbb7880515710d9dd5eb7$' \
            build/rv32-nemu-probe/evidence/result.txt
          grep -q '^single_step=0$' build/rv32-nemu-probe/evidence/result.txt
          grep -q '^perf_opt=true$' build/rv32-nemu-probe/evidence/result.txt
          mv build/rv32-nemu-probe build/rv32-nemu-abi

      - name: Build exact frozen RV32 NEMU reference
        shell: bash
        run: |
          set -o pipefail
          NEMU_SINGLE_STEP=1 bash tools/probe_rv32_nemu_historical.sh \
            "$(pwd)/build/rv32-nemu-probe" \
            2>&1 | tee build/rv32-nemu-probe.log
          grep -q '^CONFIG_ENABLE_INSTR_CNT=y$' \
            build/rv32-nemu-probe/evidence/generated.config
          grep -q '^# CONFIG_PERF_OPT is not set$' \
            build/rv32-nemu-probe/evidence/generated.config
          grep -q '^single_step=1$' \
            build/rv32-nemu-probe/evidence/result.txt
          grep -q '^perf_opt=false$' \
            build/rv32-nemu-probe/evidence/result.txt
          reference_so="$(find build/rv32-nemu-probe/nemu/build -maxdepth 1 -type f \
            -name 'riscv32-nemu-interpreter-so*' -print -quit)"
          test -n "$reference_so"
          echo "RV32_NEMU_SO=$reference_so" >> "$GITHUB_ENV"

      - name: Run 585-retirement RV32 DiffTest
        shell: bash
        run: |
          mkdir -p build/rv32
          set -o pipefail
          make -f Makefile.rv32 run-difftest RV32_NEMU_SO="$RV32_NEMU_SO" \
            2>&1 | tee build/rv32/rv32-difftest.log
          grep -Fq '585 committed instructions' build/rv32/rv32-difftest.log
          grep -Fq 'difftest=585' build/rv32/rv32-difftest.log

      - name: Prove RV32 mismatch detection
        shell: bash
        run: |
          set +e
          AETHERCORE_RV32_DIFFTEST_INJECT_MISMATCH_AT=0 \
            make -f Makefile.rv32 run-difftest RV32_NEMU_SO="$RV32_NEMU_SO" \
            > build/rv32/rv32-negative-difftest.log 2>&1
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo 'ERROR: deliberate RV32 mismatch unexpectedly passed' >&2
            exit 1
          fi
          grep -Fq 'RV32 DiffTest mismatch after 0 matched commits' \
            build/rv32/rv32-negative-difftest.log
          cat build/rv32/rv32-negative-difftest.log

      - name: Upload RV32 DiffTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32-nemu-difftest-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/rv32-nemu-abi.log
            build/rv32-nemu-abi/evidence/
            build/rv32-nemu-probe.log
            build/rv32-nemu-probe/evidence/
            build/rv32/
