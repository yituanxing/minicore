name: AetherSoC Unified Linux Path Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/soc/AetherCoreV2LinuxSoC.scala'
      - 'src/main/scala/aethercore/soc/AetherSoCPlatformFabric.scala'
      - 'src/main/scala/aethercore/soc/AetherSoCAddressMap.scala'
      - 'src/main/scala/aethercore/soc/AetherSoCBootRom.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2UnifiedMemorySoC.scala'
      - 'src/main/scala/aethercore/soc/peripheral/**'
      - 'src/main/scala/aethercore/soc/AetherCoreV2Complex.scala'
      - 'src/main/scala/aethercore/sim/AetherSoCUnifiedHostMemoryAdapter.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2UnifiedMemoryCompatSimTop.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2OpenSbiRV64SimTop.scala'
      - 'tests_py/test_v2_platform_ownership.py'
      - 'tests_py/test_v2_soc_unified_linux_path.py'
      - 'tests_py/test_v2_soc_bootrom.py'
      - '.github/workflows/v2-soc-unified-linux-path.yml'

permissions:
  contents: read

concurrency:
  group: aethersoc-unified-linux-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  elaborate:
    name: Elaborate historical Linux top through unified SoC
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Check unified Linux path contracts
        run: |
          python3 -m unittest tests_py.test_v2_platform_ownership -v
          python3 -m unittest tests_py.test_v2_soc_unified_linux_path -v
          python3 -m unittest tests_py.test_v2_soc_bootrom -v

      - name: Elaborate historical qualified top
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          rm -rf build/soc-unified-linux-path
          ./mill aethercore.runMain aethercore.ElaborateV2OpenSbiRV64             --target-dir build/soc-unified-linux-path
          find build/soc-unified-linux-path -maxdepth 1 -name '*.sv' -print -quit | grep -q .
