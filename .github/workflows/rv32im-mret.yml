name: RV32IM Machine Return

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv32im-mret-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mret:
    name: Precise Machine return and timer interrupts on RV32IM
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8
        with:
          job: rv32im-mret

      - name: Install Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 bison flex \
            libreadline-dev libsdl2-dev zstd libzstd-dev \
            file binutils verilator \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
          java -version
          verilator --version
          riscv64-unknown-elf-gcc --version

      - name: Prepare Mill launcher
        run: |
          chmod +x mill
          ./mill --version

      - name: Build exact frozen RV32 NEMU reference
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          NEMU_SINGLE_STEP=1 bash tools/probe_rv32_nemu_historical.sh \
            "$(pwd)/build/rv32-nemu-probe" \
            2>&1 | tee build/rv32-nemu-probe.log
          grep -q '^reference_sha256=1dc17e1d2c8d27959fc3fa30163a350a57c688e102c64372e396f350699db577$' \
            build/rv32-nemu-probe/evidence/result.txt
          reference_so="$(find build/rv32-nemu-probe/nemu/build -maxdepth 1 -type f \
            -name 'riscv32-nemu-interpreter-so*' -print -quit)"
          test -n "$reference_so"
          echo "RV32_NEMU_SO=$reference_so" >> "$GITHUB_ENV"

      - name: Build frozen RV32IM MRET workloads
        shell: bash
        run: |
          make -f Makefile.rv32im-mret workloads
          manifest=build/rv32im-mret/software/manifest.txt
          diff -u <(cat <<'EOF'
          ecall-next 352 88 6ddc9d73287798e8dd173221eaaa8866d668acedf004da0ce4b25538b2727702
          ebreak-rewrite 368 92 6847a2fc4601317b4fd6348124d1b8c3462207b239d1bcf8bd361672b7b72e3b
          load-fault 360 90 03bfdc5ce7f38a6029213c0b986d641fcc5266fd326a3a1c04524b47b0f8a567
          double-ecall 392 98 307119e8576defdfc0804d3ff2176e0728b8b1887dad0f643b488b0bc3044042
          EOF
          ) "$manifest"
          for name in ecall-next ebreak-rewrite load-fault double-ecall; do
            grep -q '<trap_handler>:' "build/rv32im-mret/software/$name.dis"
            grep -q '30200073.*mret' "build/rv32im-mret/software/$name.dis"
            grep -q 'csrr.*mstatus' "build/rv32im-mret/software/$name.dis"
            grep -q 'csrw.*mepc' "build/rv32im-mret/software/$name.dis"
          done

      - name: Run frozen Machine return DiffTest batch
        shell: bash
        run: |
          set -o pipefail
          make -f Makefile.rv32im-mret run RV32_NEMU_SO="$RV32_NEMU_SO" \
            2>&1 | tee build/rv32im-mret/mret-ci.log
          grep -q '^PASS: self-check exit=0 after 81 cycles, 57 committed instructions, stall-period=5, difftest=57, zicsr-shadow=13, trap-shadow=1, mret-shadow=1$' build/rv32im-mret/logs/ecall-next.log
          grep -q '^PASS: self-check exit=0 after 82 cycles, 58 committed instructions, stall-period=5, difftest=58, zicsr-shadow=13, trap-shadow=1, mret-shadow=1$' build/rv32im-mret/logs/ebreak-rewrite.log
          grep -q '^PASS: self-check exit=0 after 84 cycles, 59 committed instructions, stall-period=5, difftest=59, zicsr-shadow=13, trap-shadow=1, mret-shadow=1$' build/rv32im-mret/logs/load-fault.log
          grep -q '^PASS: self-check exit=0 after 121 cycles, 85 committed instructions, stall-period=5, difftest=85, zicsr-shadow=20, trap-shadow=2, mret-shadow=2$' build/rv32im-mret/logs/double-ecall.log

      - name: Reject a mismatch on the first MRET event
        shell: bash
        run: |
          set +e
          AETHERCORE_RV32_DIFFTEST_INJECT_MISMATCH_AT=39 \
            build/rv32im-mret/obj/VAetherCoreRV32IMTrapSimTop \
            build/rv32im-mret/software/ecall-next.bin \
            --max-cycles 4000 --self-check-exit --stall-period 5 \
            --difftest "$RV32_NEMU_SO" \
            > build/rv32im-mret/mret-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'RV32 DiffTest mismatch after 39 matched events' \
            build/rv32im-mret/mret-negative.log
          grep -q 'x31' build/rv32im-mret/mret-negative.log

      - name: Build RV32IM timer workloads
        shell: bash
        run: |
          make -f Makefile.rv32im-timer workloads
          manifest=build/rv32im-timer/software/manifest.txt
          test "$(wc -l < "$manifest")" -eq 4
          for name in single masked-enable repeat memory-loop; do
            grep -q "^$name " "$manifest"
            grep -q '<timer_handler>:' "build/rv32im-timer/software/$name.dis"
            grep -q '30200073.*mret' "build/rv32im-timer/software/$name.dis"
            grep -q '304.*csrw.*mie' "build/rv32im-timer/software/$name.dis"
            grep -q 'lui.*0x2004' "build/rv32im-timer/software/$name.dis"
          done

      - name: Run Machine timer DiffTest batch
        shell: bash
        run: |
          set -o pipefail
          make -f Makefile.rv32im-timer run RV32_NEMU_SO="$RV32_NEMU_SO" \
            2>&1 | tee build/rv32im-timer/timer-ci.log
          for name in single masked-enable repeat memory-loop; do
            grep -q '^PASS: self-check exit=0 ' "build/rv32im-timer/logs/$name.log"
            grep -q 'timer-interrupt-shadow=' "build/rv32im-timer/logs/$name.log"
          done

      - name: Upload privilege evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32im-machine-privilege-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/rv32-nemu-probe.log
            build/rv32-nemu-probe/evidence/
            build/rv32im-mret/
            build/rv32im-timer/
