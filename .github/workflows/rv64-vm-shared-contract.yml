name: RV64 VM Shared Contract

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/common/Interfaces.scala'
      - 'src/main/scala/aethercore/config/CoreConfig.scala'
      - 'src/main/scala/aethercore/config/PageTableGeometry.scala'
      - 'src/main/scala/aethercore/core/AetherCore.scala'
      - 'src/main/scala/aethercore/core/MachineCsrFile.scala'
      - 'src/main/scala/aethercore/core/SystemInstruction.scala'
      - 'src/main/scala/aethercore/core/PageTableWalker.scala'
      - 'src/main/scala/aethercore/core/TranslationTlb.scala'
      - 'src/main/scala/aethercore/core/TranslationUnit.scala'
      - 'src/main/scala/aethercore/core/InstructionFetchAdapter.scala'
      - 'src/main/scala/aethercore/core/DataPathAdapter.scala'
      - 'src/main/scala/aethercore/core/PtwArbiter.scala'
      - 'src/main/scala/aethercore/core/Sv32PageTableWalker.scala'
      - 'src/main/scala/aethercore/core/Sv32Tlb.scala'
      - 'src/main/scala/aethercore/core/Sv32TranslationUnit.scala'
      - 'src/main/scala/aethercore/core/Sv32InstructionFetchAdapter.scala'
      - 'src/main/scala/aethercore/core/Sv32DataPathAdapter.scala'
      - 'src/main/scala/aethercore/core/Sv32PtwArbiter.scala'
      - 'src/test/scala/aethercore/RV64SharedVirtualMemorySpec.scala'
      - 'src/test/scala/aethercore/RV64Sv39CoreSpec.scala'
      - 'src/test/scala/aethercore/TranslationUnitSpec.scala'
      - 'src/test/scala/aethercore/RV64VirtualMemoryAdapterSpec.scala'
      - 'src/test/scala/aethercore/Sv32PageTableWalkerSpec.scala'
      - 'src/test/scala/aethercore/Sv32TlbSpec.scala'
      - 'src/test/scala/aethercore/Sv32TranslationUnitTlbSpec.scala'
      - 'src/test/scala/aethercore/Sv32InstructionTranslationSpec.scala'
      - 'src/test/scala/aethercore/Sv32InstructionFetchCoreSpec.scala'
      - 'src/test/scala/aethercore/Sv32DataPathCoreSpec.scala'
      - '.github/workflows/rv64-vm-shared-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv64-vm-shared-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Sv32 oracle + RV64 Sv39 production core
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 20
    env:
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          if [[ -d .git ]]; then
            git clean -fd -- src/main/scala src/test/scala .github/workflows || true
          else
            git init .
          fi

          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags --prune --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$TARGET_SHA" ]] || {
            echo "ERROR: exact-head checkout mismatch: expected=$TARGET_SHA actual=$actual" >&2
            exit 1
          }
          chmod +x ./mill
          echo "exact_head=$actual"

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Run frozen Sv32 oracle and RV64 shared plus production Sv39 contracts
        shell: bash
        run: |
          set -euo pipefail
          ./mill aethercore.test.testOnly \
            aethercore.Sv32PageTableWalkerSpec \
            aethercore.Sv32TlbSpec \
            aethercore.Sv32TranslationUnitTlbSpec \
            aethercore.Sv32InstructionTranslationSpec \
            aethercore.Sv32InstructionFetchCoreSpec \
            aethercore.Sv32DataPathCoreSpec \
            aethercore.RV64SharedVirtualMemorySpec \
            aethercore.TranslationUnitSpec \
            aethercore.RV64VirtualMemoryAdapterSpec \
            aethercore.RV64Sv39CoreSpec

      - name: Write qualification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## RV64 shared virtual-memory and production Sv39 core contract'
            echo
            echo "- exact head: \`${TARGET_SHA}\`"
            echo '- production profile: RV64IM + Zicsr + M/S/U + Sv39 + PMP16 over PA56'
            echo '- Sv32 oracle: historical walker, TLB, translation unit, adapters and core-facing VM specs still execute through the shared machinery'
            echo '- Sv39 shared machinery: three-level walk, 64-bit PTE stride, shared TLB/translation unit, instruction adapter, data adapter and PTW arbitration'
            echo '- Sv39 production core: M-mode programs PMP16 and satp, MRET enters an S-mode VA above 4 GiB, then 64-bit LD/SD execute through a second translated VA above 4 GiB'
            echo '- production physical proof: leaf PTE payloads exceed 32 bits and final code/data requests land above 4 GiB inside the PA56 domain'
            echo '- Sv48 remains shared-contract-only and is still not advertised as a production CoreConfig capability'
            echo '- bare RV64 PA56 boundary: high architectural bits fault instead of aliasing low physical bits'
            echo '- PTE correctness: non-leaf U/A/D are reserved and ancestor G is inherited by descendants'
          } >> "$GITHUB_STEP_SUMMARY"
