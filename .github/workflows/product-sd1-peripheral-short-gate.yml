name: AetherCore Product SD1 SPI GPIO Short RTL Gate

# Operator-only peripheral checks. A source push or ordinary PR update must
# never queue an expensive Product Linux or Debian simulation from this gate.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: aethercore-product-sd1-short-${{ github.event.pull_request.number || github.ref }}
  # Other labeled events enter this workflow even when its job is skipped.
  # Never let an unrelated label cancel a genuine manually requested SD1 run.
  cancel-in-progress: false

jobs:
  product-sd1-peripheral-short:
    name: Product SD1 SPI GPIO pin-level directed RTL
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'product-sd1-short')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
    steps:
      - name: Checkout exact Product commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala and Mill dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore pinned Verilator 5.024
        id: verilator-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-

      - name: Install Verilator prerequisites on cache miss
        if: steps.verilator-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf cmake ninja-build libfl-dev zlib1g-dev build-essential git

      - name: Prepare isolated Mill output
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          root="$RUNNER_TEMP/aethercore-product-sd1-short"
          mkdir -p "$root/mill-out"
          echo "MILL_OUTPUT_DIR=$root/mill-out" >> "$GITHUB_ENV"

      - name: Validate exact Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Save pinned Verilator on cache miss
        if: success() && steps.verilator-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}

      - name: Test SD1 pins and Product fabric GPIO/SPI/PLIC11 MMIO routing
        shell: bash
        run: |
          set -euo pipefail
          ./mill aethercore.test.testOnly aethercore.ProductSd1SpiGpioSpec
          ./mill aethercore.test.testOnly aethercore.ProductSd1FabricSpec
          echo 'PRODUCT_SD1_PERIPHERAL_SHORT_PASS: standalone SPI/GPIO and Product fabric PLIC11 directed RTL only; no Linux PID1, MMC mount, or Debian qualification'
