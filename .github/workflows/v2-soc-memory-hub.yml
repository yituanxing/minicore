name: AetherSoC MemoryHub Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/soc/AetherSoCMemoryHub.scala'
      - 'src/main/scala/aethercore/ElaborateV2SoCMemoryHub.scala'
      - 'tests_py/test_v2_soc_memory_hub.py'
      - '.github/workflows/v2-soc-memory-hub.yml'

permissions:
  contents: read

concurrency:
  group: aethersoc-memory-hub-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  elaborate:
    name: Elaborate tagged AetherMem hub
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Check MemoryHub source contract
        run: python3 -m unittest tests_py.test_v2_soc_memory_hub -v

      - name: Elaborate MemoryHub
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          rm -rf build/soc-memory-hub
          ./mill aethercore.runMain aethercore.ElaborateV2SoCMemoryHub             --target-dir build/soc-memory-hub
          find build/soc-memory-hub -maxdepth 1 -name '*.sv' -print -quit | grep -q .
