name: RV64 Deeper Self-Hosted Trigger

on:
  pull_request:
    paths:
      - .github/workflows/rv64-deeper-selfhosted-trigger.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: rv64-deeper-selfhosted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rv64-deeper-frontier:
    if: github.head_ref == 'trigger/rv64-linux-deeper-hosted-v1'
    name: RV64 deeper frontier only
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 50
    env:
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout exact RV64 exploration head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init .; fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags --prune --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_head=$TARGET_SHA"

      - name: Run focused RV64 interrupt and userspace contracts first
        shell: bash
        run: |
          set -euo pipefail
          ./mill aethercore.test.testOnly aethercore.SupervisorExternalInterruptSpec
          ./mill aethercore.test.testOnly aethercore.RV64SupervisorWfiExternalInterruptSpec
          ./mill aethercore.test.testOnly aethercore.RV64UserEcallSupervisorSpec

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Provision pinned RV64 Linux GCC
        shell: bash
        run: bash tools/ensure_riscv64_linux_gcc_13_3.sh

      - name: Reuse or build unchanged Linux 6.6.143 plus OpenSBI 1.6
        shell: bash
        env:
          RV64_LINUX_JOBS: '6'
        run: |
          set -euo pipefail
          bash tools/ci/rv64_linux_early_build.sh
          grep -q '^RV64_LINUX_EARLY_BUILD_RESULT: status=PASS$' build/rv64-linux-early/result.txt

      - name: Discover post-timer retirement frontier
        shell: bash
        run: |
          set -euo pipefail
          build="$HOME/.cache/aethercore/rv64-linux-deeper/$TARGET_SHA"
          make -f Makefile.l32-linux-boot \
            BUILD_DIR="$build" \
            TOP=AetherCoreOpenSbiRV64SimTop \
            ELABORATE_MAIN=aethercore.ElaborateOpenSbiRV64 \
            FW_BIN="$GITHUB_WORKSPACE/build/rv64-linux-early/opensbi/platform/generic/firmware/fw_payload.bin" \
            MAX_CYCLES=120000000 \
            MILESTONE='Linux version 6.6.143' \
            MIN_INTERRUPTS=1 \
            MIN_STIP=1 \
            MIN_POST_MILESTONE_COMMITS=30000000 \
            PROGRESS_INTERVAL_CYCLES=10000000 \
            VERILATOR='verilator -LDFLAGS -ldl' \
            SIM_CXXFLAGS="-std=c++20 -O3 -march=native -I$GITHUB_WORKSPACE/sim/rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim" \
            JOBS="$(nproc)" \
            run-local
          log="$build/logs/boot-probe.log"
          grep -Fq 'OpenSBI v1.6' "$log"
          grep -Fq '[    0.000000] Linux version 6.6.143' "$log"
          grep -Fq 'L32_FIRST_SUPERVISOR_TIMER_INTERRUPT' "$log"
          grep -Eq 'L32_RUNTIME_MILESTONE_PASS .*min-post-milestone-commits=30000000 .*post-milestone-commits=30000000' "$log"
          echo '--- deepest Linux UART lines ---'
          grep -E '^\[[[:space:]]*[0-9]+\.[0-9]+\]' "$log" | tail -n 100 || true
          echo '--- runtime markers ---'
          grep -E 'L32_' "$log" | tail -n 60 || true

      - name: Publish result status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state='failure'
          description='RV64 deeper frontier failed'
          if [[ "${{ job.status }}" == 'success' ]]; then
            state='success'
            description='RV64 deeper frontier passed'
          fi
          payload="$(printf '{\"state\":\"%s\",\"context\":\"rv64-linux-deeper-frontier/qualification\",\"description\":\"%s\",\"target_url\":\"%s/%s/actions/runs/%s\"}' "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "$payload" || true
