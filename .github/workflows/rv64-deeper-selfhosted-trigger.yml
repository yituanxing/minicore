name: RV64 Deeper Self-Hosted Trigger

on:
  pull_request:
    paths:
      - .github/workflows/rv64-deeper-selfhosted-trigger.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: rv64-deeper-selfhosted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rv64-deeper-frontier:
    if: github.head_ref == 'trigger/rv64-linux-deeper-hosted-v1'
    name: RV64 Linux initcall frontier diagnostic
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 35
    env:
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      TARGET_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout exact RV64 exploration head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ ! -d .git ]]; then git init .; fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags --prune --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "exact_head=$TARGET_SHA"

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Provision pinned RV64 Linux GCC
        shell: bash
        run: bash tools/ensure_riscv64_linux_gcc_13_3.sh

      - name: Reuse exact unchanged Linux 6.6.143 Image
        shell: bash
        env:
          RV64_LINUX_JOBS: '6'
        run: |
          set -euo pipefail
          bash tools/ci/rv64_linux_early_build.sh
          grep -q '^RV64_LINUX_EARLY_BUILD_RESULT: status=PASS$' build/rv64-linux-early/result.txt
          grep -q '^kernel_image_sha256=e79adb001a3537e35372f77c6705239414253acce937cfcf4eb23df3da2e0b26$' build/rv64-linux-early/result.txt

      - name: Build diagnostic DTB and OpenSBI payload with initcall_debug only
        shell: bash
        run: |
          set -euo pipefail
          source software/rv64/opensbi_first_exec.env
          source software/rv64/linux_early.env
          cross="$AETHERCORE_RV64_LINUX_CROSS_COMPILE"
          image="$(grep '^kernel_image=' build/rv64-linux-early/result.txt | tail -n 1 | cut -d= -f2-)"
          test -s "$image"
          image_sha="$(sha256sum "$image" | awk '{print $1}')"
          test "$image_sha" = 'e79adb001a3537e35372f77c6705239414253acce937cfcf4eb23df3da2e0b26'

          diag=build/rv64-linux-initcall-diag
          rm -rf "$diag"
          mkdir -p "$diag"
          dtb="$diag/aethercore-rv64-initcall.dtb"
          bootargs="$RV64_LINUX_BOOTARGS initcall_debug loglevel=8"
          python3 tools/ci/make_l32_dtb.py \
            --output "$dtb" \
            --summary "$diag/dtb-summary.txt" \
            --isa "$RV64_OPENSBI_ISA" \
            --mmu "$RV64_OPENSBI_MMU" \
            --bootargs "$bootargs"

          opensbi_source="$HOME/.cache/aethercore/l32/opensbi/$RV64_OPENSBI_COMMIT"
          test -d "$opensbi_source/.git"
          test "$(git -C "$opensbi_source" rev-parse HEAD)" = "$RV64_OPENSBI_COMMIT"
          opensbi_build="$diag/opensbi"
          make -C "$opensbi_source" \
            O="$GITHUB_WORKSPACE/$opensbi_build" \
            PLATFORM="$RV64_OPENSBI_PLATFORM" \
            PLATFORM_RISCV_XLEN="$RV64_OPENSBI_XLEN" \
            PLATFORM_RISCV_ISA="$RV64_OPENSBI_ISA" \
            PLATFORM_RISCV_ABI="$RV64_OPENSBI_ABI" \
            FW_TEXT_START="$RV64_OPENSBI_FW_TEXT_START" \
            FW_FDT_PATH="$GITHUB_WORKSPACE/$dtb" \
            FW_PAYLOAD_PATH="$image" \
            FW_PAYLOAD_OFFSET="$RV64_OPENSBI_PAYLOAD_OFFSET" \
            FW_PAYLOAD_FDT_ADDR="$RV64_OPENSBI_FDT_ADDR" \
            CROSS_COMPILE="$cross" \
            -j6 > "$diag/opensbi-build.log" 2>&1

          fw="$opensbi_build/platform/$RV64_OPENSBI_PLATFORM/firmware/fw_payload.bin"
          test -s "$fw"
          printf 'diagnostic_kernel_image_sha256=%s\n' "$image_sha"
          printf 'diagnostic_bootargs=%s\n' "$bootargs"
          printf 'diagnostic_firmware=%s\n' "$fw"

      - name: Run initcall-debug frontier and report last completed initcalls
        shell: bash
        run: |
          set -euo pipefail
          build="$HOME/.cache/aethercore/rv64-linux-initcall-frontier/$TARGET_SHA"
          fw="$GITHUB_WORKSPACE/build/rv64-linux-initcall-diag/opensbi/platform/generic/firmware/fw_payload.bin"
          test -s "$fw"
          set +e
          make -f Makefile.l32-linux-boot \
            BUILD_DIR="$build" \
            TOP=AetherCoreOpenSbiRV64SimTop \
            ELABORATE_MAIN=aethercore.ElaborateOpenSbiRV64 \
            FW_BIN="$fw" \
            MAX_CYCLES=220000000 \
            MILESTONE='__AETHERCORE_INITCALL_DIAGNOSTIC_NEVER_MATCH__' \
            MIN_INTERRUPTS=0 \
            MIN_STIP=0 \
            MIN_POST_MILESTONE_COMMITS=0 \
            PROGRESS_INTERVAL_CYCLES=20000000 \
            VERILATOR='verilator -LDFLAGS -ldl' \
            SIM_CXXFLAGS="-std=c++20 -O3 -march=native -I$GITHUB_WORKSPACE/sim/rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim" \
            JOBS="$(nproc)" \
            run-local
          probe_rc=$?
          set -e

          log="$build/logs/boot-probe.log"
          echo "diagnostic_make_rc=$probe_rc"
          test -s "$log"
          grep -Fq 'L32_OPENSBI_TIMEOUT' "$log"
          grep -Fq 'initcall_debug loglevel=8' "$log"

          echo '--- deepest ordinary Linux UART lines ---'
          grep -E '^\[[[:space:]]*[0-9]+\.[0-9]+\]' "$log" | grep -vE 'calling  |initcall .* returned' | tail -n 70 || true
          echo '--- latest initcall trace ---'
          grep -E 'calling  .* @|initcall .* returned' "$log" | tail -n 120 || true
          echo '--- timeout evidence ---'
          grep 'L32_OPENSBI_TIMEOUT' "$log" | tail -n 1

          python3 - "$log" <<'PY'
          import re
          import sys

          log_path = sys.argv[1]
          calls = []
          returns = []
          with open(log_path, errors='replace') as handle:
              for raw in handle:
                  line = raw.strip()
                  m = re.search(r'calling\s+([^+\s]+)\+', line)
                  if m:
                      calls.append(m.group(1))
                  m = re.search(r'initcall\s+([^+\s]+)\+.* returned\s+(-?\d+)', line)
                  if m:
                      returns.append((m.group(1), int(m.group(2))))

          print(f'L32_INITCALL_TRACE calls={len(calls)} returns={len(returns)}')
          if calls:
              print(f'L32_INITCALL_LAST_CALLED={calls[-1]}')
          if returns:
              print(f'L32_INITCALL_LAST_RETURNED={returns[-1][0]} rc={returns[-1][1]}')
          returned_names = {name for name, _ in returns}
          pending = [name for name in calls if name not in returned_names]
          print('L32_INITCALL_RECENT_CALLS=' + ','.join(calls[-16:]))
          print('L32_INITCALL_RECENT_RETURNS=' + ','.join(name for name, _ in returns[-16:]))
          if pending:
              print('L32_INITCALL_UNMATCHED=' + ','.join(pending[-16:]))
          PY

      - name: Publish diagnostic status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state='failure'
          description='RV64 initcall frontier diagnostic failed'
          if [[ "${{ job.status }}" == 'success' ]]; then
            state='success'
            description='RV64 initcall frontier diagnostic captured'
          fi
          payload="$(printf '{\"state\":\"%s\",\"context\":\"rv64-linux-deeper-frontier/initcall\",\"description\":\"%s\",\"target_url\":\"%s/%s/actions/runs/%s\"}' "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "$payload" || true
