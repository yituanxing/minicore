name: RV32IM Embench Batch 2

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv32im-embench-batch2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  batch:
    name: Pinned Embench batch 2 on RV32IM
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8
        with:
          job: rv32im-embench-batch2

      - name: Install Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:21

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git python3 bison flex \
            libreadline-dev libsdl2-dev zstd libzstd-dev \
            file binutils verilator \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
          java -version
          verilator --version
          riscv64-unknown-elf-gcc --version

      - name: Prepare Mill launcher
        run: |
          chmod +x mill
          ./mill --version

      - name: Build exact frozen RV32 NEMU reference
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          NEMU_SINGLE_STEP=1 bash tools/probe_rv32_nemu_historical.sh \
            "$(pwd)/build/rv32-nemu-probe" \
            2>&1 | tee build/rv32-nemu-probe.log
          grep -q '^reference_sha256=1dc17e1d2c8d27959fc3fa30163a350a57c688e102c64372e396f350699db577$' \
            build/rv32-nemu-probe/evidence/result.txt
          reference_so="$(find build/rv32-nemu-probe/nemu/build -maxdepth 1 -type f \
            -name 'riscv32-nemu-interpreter-so*' -print -quit)"
          test -n "$reference_so"
          echo "RV32_NEMU_SO=$reference_so" >> "$GITHUB_ENV"

      - name: Build pinned Embench batch 2
        shell: bash
        run: |
          make -f Makefile.rv32im-embench-batch2 workload
          metadata=build/rv32im-embench-batch2/software/batch.txt
          manifest=build/rv32im-embench-batch2/software/manifest.tsv
          grep -q '^source=embench-iot@09c2ed8c3b7008c95d08b038de4a3f6dc103ed70$' "$metadata"
          grep -q '^benchmarks=aha-mont64 huffbench slre wikisort$' "$metadata"
          grep -q '^march=rv32im$' "$metadata"
          grep -q '^mabi=ilp32$' "$metadata"
          grep -q '^optimization=O2$' "$metadata"
          grep -q '^warmup_heat=0$' "$metadata"
          grep -q '^global_scale_factor=1$' "$metadata"
          grep -q '^local_scale_factor=1$' "$metadata"
          test "$(grep -h '^#define LOCAL_SCALE_FACTOR 1$' \
            build/rv32im-embench-batch2/software/scaled-src/*/*.c | wc -l)" -eq 4
          grep -Fx $'aha-mont64\t2392\t598\t4e3013930725f8b6338b644ba7f08bac70bc4502a7129a22212e58162c8e617f\t1' "$manifest"
          grep -Fx $'huffbench\t3512\t878\ta5bed4cce883ffc0ebc4f2496e3fa10d36386122ffee1f269ce72a30a4bdd8f0\t1' "$manifest"
          grep -Fx $'slre\t4770\t1193\tfe902482d8596165198fbce4bbe6f63f61507df607015700b1ecffe4ed61b929\t1' "$manifest"
          grep -Fx $'wikisort\t12592\t3148\t02f68287d47eaa7e1a00ba7ced3ceda0ef74096e5014d6d842992f5e51aa668a\t1' "$manifest"
          grep -q '<sqrt>:' build/rv32im-embench-batch2/software/wikisort.dis

      - name: Run Embench batch 2 DiffTest
        shell: bash
        run: |
          set -o pipefail
          make -f Makefile.rv32im-embench-batch2 run RV32_NEMU_SO="$RV32_NEMU_SO" \
            2>&1 | tee build/rv32im-embench-batch2/embench-batch2.log
          results=build/rv32im-embench-batch2/results.tsv
          test "$(grep -c 'PASS: self-check exit=0' "$results")" -eq 4
          grep -Fx $'aha-mont64\tPASS: self-check exit=0 after 12667 cycles, 10885 committed instructions, stall-period=5, difftest=10885' "$results"
          grep -Fx $'huffbench\tPASS: self-check exit=0 after 357646 cycles, 257617 committed instructions, stall-period=5, difftest=257617' "$results"
          grep -Fx $'slre\tPASS: self-check exit=0 after 31361 cycles, 23049 committed instructions, stall-period=5, difftest=23049' "$results"
          grep -Fx $'wikisort\tPASS: self-check exit=0 after 1213171 cycles, 853344 committed instructions, stall-period=5, difftest=853344' "$results"

      - name: Upload Embench batch 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32im-embench-batch2-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/rv32-nemu-probe.log
            build/rv32-nemu-probe/evidence/
            build/rv32im-embench-batch2/
            build/upstream-src/embench-iot-*/COPYING
