name: Reviewed SD1 Host-v3 E real RTL 8172M to 8272M follow-on

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: product-sd1-host-v3-E-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  E_real_product_rtl_five_stages:
    if: >-
      github.repository == 'yituanxing/minicore' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'product-sd1-v3-reviewed-8172-to-8272-five-stages' &&
      github.event.pull_request.number == 379 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'design/rv64gc-product-architecture-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
      E_SOURCE_SHA: UNREVIEWED_FAIL_CLOSED
      D_RUN: '42499056943'
      D_HEAD: 0ac282e73448fa6730a364a356a690090da3c63f
      D_8172_ID: '13624713515'
      D_8172_ZIP: 6bfe4e6b2e5d659ede22115c8f320a896fbd215f852c5f46fbba2d69bc2867ee
      D_HOST: 4d3c10e6c0a9b382634145e1ea9a79e0257bd87526f4e51ffc566112e86d53f1
      D_RTL: 6be6e95fdc67f7da054aa4ae898fc6b68e73107e4bb094e4fbe854024873e862
      D_CARD: 0a455d63334465ca900bb0ec27105a7ac8ab9a2d3db7a7455f5c6485fc599a34
      V3_RUN: '42498142872'
      V3_HEAD: ca71830647b424aedb4064ca85a6c07d9ec6ff1f
      V3_ID: '13623808277'
      V3_ZIP: fc94571aa000e1c959782bae8f78680e74dca8ebba33189ec79f150f35b98e3d
      AETHERCORE_SD1_V3_REVIEWED_MODEL_SHA: 04e671f2dfae8aa6d7c5b17a93c688cb7b30005de9a2a329f983b909f4fa1be6
      AETHERCORE_SD1_V3_E_8172_HOST_SHA: 4d3c10e6c0a9b382634145e1ea9a79e0257bd87526f4e51ffc566112e86d53f1
      AETHERCORE_SD1_V3_E_8172_RTL_SHA: 6be6e95fdc67f7da054aa4ae898fc6b68e73107e4bb094e4fbe854024873e862
      AETHERCORE_SD1_V3_E_8172_CARD_SHA: 0a455d63334465ca900bb0ec27105a7ac8ab9a2d3db7a7455f5c6485fc599a34
      AETHERCORE_SD1_V3_E_RELAY_EXECUTE: REVIEWED_D_8172M_AND_V3_QUALIFIED_20M_PASS
      AETHERCORE_SD1_RELAY_CONFIRM: SD1_FULL_DEBIAN_SIGNED_RELAY_V4_MIGRATED_8P5B
      AETHERCORE_VERILATOR_VERSION: '5.054'
      SIM_SETTLE_MODE: reference
      VERILATOR_THREADS: '1'
      AETHERCORE_DATA_MEM_WAIT_CYCLES: '0'
      OUT: build/product-sd1-migrated-v3-8p5b-e-followon

    steps:
      - name: Reject unreviewed D terminal and E source without any guest clock
        shell: bash
        run: |
          set -euo pipefail
          [[ "$E_SOURCE_SHA" =~ ^[a-f0-9]{40}$ &&
             "$D_RUN" =~ ^[0-9]{10,13}$ &&
             "$D_HEAD" =~ ^[a-f0-9]{40}$ &&
             "$D_8172_ID" =~ ^[0-9]{8,13}$ ]] || exit 16
          for digest in "$D_8172_ZIP" "$D_HOST" "$D_RTL" "$D_CARD" \
            "$AETHERCORE_SD1_V3_E_8172_HOST_SHA" \
            "$AETHERCORE_SD1_V3_E_8172_RTL_SHA" \
            "$AETHERCORE_SD1_V3_E_8172_CARD_SHA"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 16
          done
          [[ "$D_HOST" == "$AETHERCORE_SD1_V3_E_8172_HOST_SHA" &&
             "$D_RTL" == "$AETHERCORE_SD1_V3_E_8172_RTL_SHA" &&
             "$D_CARD" == "$AETHERCORE_SD1_V3_E_8172_CARD_SHA" ]] || exit 16
      - name: Authenticate successful four real RTL D stages and v3 qualification
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$D_RUN" > "$RUNNER_TEMP/d.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V3_RUN" > "$RUNNER_TEMP/v3.json"
          jq -e --argjson id "$D_RUN" --arg h "$D_HEAD" '
            .id==$id and .run_attempt==1 and .status=="completed" and .conclusion=="success" and
            .head_sha==$h and .event=="pull_request" and
            .head_branch=="design/rv64gc-product-architecture-20261103" and
            .path==".github/workflows/product-sd1-v3-d-8092-to-8172.yml"' "$RUNNER_TEMP/d.json"
          jq -e --argjson id "$V3_RUN" --arg h "$V3_HEAD" '
            .id==$id and .run_attempt==1 and .status=="completed" and .conclusion=="success" and
            .head_sha==$h and .event=="pull_request" and
            .head_branch=="design/rv64gc-product-architecture-20261103" and
            .path==".github/workflows/product-sd1-host-v3-8p5b-qualification.yml"' "$RUNNER_TEMP/v3.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$D_RUN/jobs?per_page=100" > "$RUNNER_TEMP/d-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$V3_RUN/jobs?per_page=100" > "$RUNNER_TEMP/v3-jobs.json"
          jq -e '[.jobs[] | select(.name=="D_real_product_rtl_four_stages" and
            .status=="completed" and .conclusion=="success" and
            ([.steps[]|select((.name|startswith("Advance genuine RTL Host-v3 ")) and .conclusion=="success")]|length==4) and
            ([.steps[]|select((.name|startswith("Upload complete ")) and .conclusion=="success")]|length==4))]|length==1' "$RUNNER_TEMP/d-jobs.json"
          jq -e '[.jobs[] | select(.name=="qualify_v3_host_only_8072_to_8092" and .status=="completed" and .conclusion=="success" and
            ([.steps[]|select(.name=="Zero-cycle migrate C 8072M and run one real RTL 20M exact differential" and .conclusion=="success")]|length==1))]|length==1' "$RUNNER_TEMP/v3-jobs.json"
          for v in d v3; do
            if [[ "$v" == d ]]; then id="$D_8172_ID"; run="$D_RUN"; digest="$D_8172_ZIP"; name="product-sd1-migrated-v3-8172m-$D_RUN"
            else id="$V3_ID"; run="$V3_RUN"; digest="$V3_ZIP"; name="product-sd1-model-migrate-v3-qual-8072-8092-$V3_RUN"; fi
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$RUNNER_TEMP/$v-art.json"
            jq -e --argjson id "$id" --argjson run "$run" --arg name "$name" --arg sha "sha256:$digest" '
              .id==$id and .workflow_run.id==$run and .name==$name and
              .digest==$sha and .expired==false and .size_in_bytes>1000000' "$RUNNER_TEMP/$v-art.json"
          done
      - name: Checkout exact reviewed E experiment source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.E_SOURCE_SHA }}
          persist-credentials: false
      - name: Validate E source and no-clock plan
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$E_SOURCE_SHA" ]] || exit 16
          bash -n tools/ci/product_sd1_migrated_v3_e_followon_20m.sh
          bash tools/ci/product_sd1_migrated_v3_e_followon_20m.sh --plan
      - name: Restore signed Debian seed
        id: seed
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rv64-debian-rootfs/result.txt
            build/rv64-debian-linux/result.txt
            build/rv64-debian-linux/obj/.config
            build/rv64-debian-linux/obj/arch/riscv/boot/Image
            build/rv64-debian-boot
            build/rv64-debian-sd1-sd
            build/product-sd1-official-seed
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v2-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'build.mill', 'tools/ci/rv64_debian_sd1_official_full_rootfs_prepare.sh', 'tools/ci/rv64_debian_sd1_sd_image_build.sh', 'tools/ci/rv64_debian_payload_build.sh', 'tools/ci/rv64_debian_linux_build.sh', 'tools/ci/rv64_debian_rootfs_build.sh', 'tools/ci/rv64_debian_sd1_tree_digest.py', 'tools/ci/rv64_linux_early_build.sh', 'tools/ci/rv64_minimal_init_payload_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0
      - name: Restore GPIO-CS kernel Image
        id: diag
        uses: actions/cache/restore@v4
        with:
          path: |
            build/product-sd1-gpio-cs-diagnostic/linux/result.txt
            build/product-sd1-gpio-cs-diagnostic/linux/obj/.config
            build/product-sd1-gpio-cs-diagnostic/linux/obj/arch/riscv/boot/Image
            build/product-sd1-gpio-cs-diagnostic/linux/evidence
            build/product-sd1-gpio-cs-diagnostic/boot
            build/product-sd1-gpio-cs-diagnostic/diagnostic-manifest.txt
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-sd1-gpio-cs-diagnostic-image-v1-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'tools/ci/product_sd1_gpio_cs_diag_build.sh', 'tools/ci/patches/linux-6.6.143-mmc-spi-gpio-cs-off.patch', 'tools/ci/rv64_minimal_init_payload_build.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
      - name: Verify frozen signed media caches
        run: |
          set -euo pipefail
          [[ '${{ steps.diag.outputs.cache-hit }}' == true &&
            ( '${{ steps.seed.outputs.cache-hit }}' == true || '${{ steps.seed.outputs.cache-matched-key }}' == 'aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0' ) ]] || exit 16
          python3 tools/ci/product_sd1_official_seed.py verify
      - name: Restore frozen polling firmware and DTB
        uses: actions/download-artifact@v4
        with:
          run-id: 42338584047
          name: product-sd1-spi-polling-build-42338584047
          github-token: ${{ github.token }}
          path: build/product-sd1-spi-polling-import
      - name: Import SHA-authenticated v3 Host and official D8172
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/product-sd1-model-migration-v3-8p5b-draft \
                   build/product-sd1-v3-e-source/8172m \
                   build/product-sd1-v3-e-source/auth
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$V3_ID/zip" -o build/product-sd1-v3-e-source/auth/v3.zip
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$D_8172_ID/zip" -o build/product-sd1-v3-e-source/auth/d.zip
          [[ "$(sha256sum build/product-sd1-v3-e-source/auth/v3.zip | cut -d' ' -f1)" == "$V3_ZIP" &&
             "$(sha256sum build/product-sd1-v3-e-source/auth/d.zip | cut -d' ' -f1)" == "$D_8172_ZIP" ]] || exit 16
          unzip -qq build/product-sd1-v3-e-source/auth/v3.zip -d build/product-sd1-model-migration-v3-8p5b-draft
          unzip -qq build/product-sd1-v3-e-source/auth/d.zip -d build/product-sd1-v3-e-source/8172m
          d=build/product-sd1-v3-e-source/8172m
          q=build/product-sd1-model-migration-v3-8p5b-draft/qualification-manifest.txt
          model=build/product-sd1-model-migration-v3-8p5b-draft/candidate-savable-model/obj/VAetherCoreProductDebianSdRV64SimTop
          [[ -f "$model" && "$(sha256sum "$model" | cut -d' ' -f1)" == "$AETHERCORE_SD1_V3_REVIEWED_MODEL_SHA" ]] || exit 16
          chmod 755 "$model"
          grep -Fxq 'full_rtl_identical=1' "$q"
          grep -Fxq 'full_host_except_model_sha_identical=1' "$q"
          grep -Fxq 'replay_cycles=20000000' "$q"
          grep -Fxq 'candidate_model_sha256=04e671f2dfae8aa6d7c5b17a93c688cb7b30005de9a2a329f983b909f4fa1be6' "$q"
          [[ "$(sha256sum "$d/persistent.pre.host" | cut -d' ' -f1)" == "$D_HOST" &&
             "$(sha256sum "$d/persistent.pre.rtl" | cut -d' ' -f1)" == "$D_RTL" &&
             "$(sha256sum "$d/card-progress.json" | cut -d' ' -f1)" == "$D_CARD" ]] || exit 16
          grep -Fxq 'qualification=PRODUCT_SD1_MIGRATED_WARM_RTL_NOT_DEBIAN_PASS' "$d/.migration-ready"
          grep -Fxq 'model_sha256=04e671f2dfae8aa6d7c5b17a93c688cb7b30005de9a2a329f983b909f4fa1be6' "$d/.migration-ready"
          grep -Fxq 'boot_cycles=8172000000' "$d/.migration-ready"
          grep -Fxq 'source_cycles=8152000000' "$d/.migration-ready"
          grep -Fxq 'debian_login_claim=0' "$d/.migration-ready"
          echo 'E_HOST_V3_AUTHENTIC_D_8172_SOURCE_NO_GUEST_CLOCK'
      - name: Advance genuine RTL Host-v3 8172M to 8192M
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v3_e_followon_20m.sh --execute-reviewed-20m "$GITHUB_WORKSPACE/build/product-sd1-v3-e-source/8172m" 8192
      - name: Upload complete 8192M before next guest RTL cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v3-e-8192m-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-e-followon/8192m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Advance genuine RTL Host-v3 8192M to 8212M
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v3_e_followon_20m.sh --execute-reviewed-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v3-8p5b-e-followon/8192m" 8212
      - name: Upload complete 8212M before next guest RTL cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v3-e-8212m-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-e-followon/8212m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Advance genuine RTL Host-v3 8212M to 8232M
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v3_e_followon_20m.sh --execute-reviewed-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v3-8p5b-e-followon/8212m" 8232
      - name: Upload complete 8232M before next guest RTL cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v3-e-8232m-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-e-followon/8232m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Advance genuine RTL Host-v3 8232M to 8252M
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v3_e_followon_20m.sh --execute-reviewed-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v3-8p5b-e-followon/8232m" 8252
      - name: Upload complete 8252M before next guest RTL cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v3-e-8252m-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-e-followon/8252m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Advance genuine RTL Host-v3 8252M to 8272M
        timeout-minutes: 25
        run: bash tools/ci/product_sd1_migrated_v3_e_followon_20m.sh --execute-reviewed-20m "$GITHUB_WORKSPACE/build/product-sd1-migrated-v3-8p5b-e-followon/8252m" 8272
      - name: Upload complete 8272M before next guest RTL cycle
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-migrated-v3-e-8272m-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-e-followon/8272m
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Verify five complete E checkpoints and no false Debian PASS
        run: |
          set -euo pipefail
          for m in 8192 8212 8232 8252 8272; do
            d="$OUT/$m"m
            [[ -s "$d/.migration-ready" && -s "$d/persistent.pre.host" && -s "$d/persistent.pre.rtl" && -s "$d/card-progress.json" ]] || exit 16
            grep -Fxq 'debian_login_claim=0' "$d/.migration-ready"
          done
          echo 'PRODUCT_SD1_V3_E_REAL_RTL_8272M_COMPLETE_NOT_DEBIAN_PASS'
      - name: Preserve E diagnostics even if a later stage fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-v3-E-diagnostics-${{ github.run_id }}
          path: build/product-sd1-migrated-v3-8p5b-e-followon/logs/**
          retention-days: 90
          if-no-files-found: warn
