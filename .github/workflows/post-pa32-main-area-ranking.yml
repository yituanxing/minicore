name: Post-PA32 Main FPGA Area Ranking

on:
  pull_request:
    paths:
      - '.github/workflows/post-pa32-main-area-ranking.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          yosys -V

      - name: Elaborate current product CPU and SoC
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          out="$RUNNER_TEMP/post-pa32-main-area-ranking"
          rm -rf "$out"
          mkdir -p "$out/core" "$out/soc" "$out/mapped"
          ./mill aethercore.runMain aethercore.ElaborateV2CoreSynthesisRV64 --target-dir "$out/core"
          ./mill aethercore.runMain aethercore.ElaborateV2FpgaSoCRV64 --target-dir "$out/soc"
          echo "AREA_OUT=$out" >> "$GITHUB_ENV"

      - name: Map current integrated hierarchy candidates
        shell: bash
        run: |
          set -euo pipefail

          map_top() {
            local source_dir="$1"
            local top="$2"
            local tag="$3"
            if ! grep -Rqs "^module $top[ (]" "$source_dir"; then
              echo "SKIP $top: exact emitted module not present" | tee "$AREA_OUT/mapped/$tag.skip"
              return 0
            fi
            mapfile -t svs < <(find "$source_dir" -maxdepth 1 -name '*.sv' -print | sort)
            local read_cmd="read_verilog -sv -DSYNTHESIS"
            for sv in "${svs[@]}"; do read_cmd+=" $sv"; done
            yosys -Q -p "$read_cmd; hierarchy -check -top $top; synth_ecp5 -top $top -json $AREA_OUT/mapped/$tag.json; stat -top $top" \
              2>&1 | tee "$AREA_OUT/mapped/$tag.log"
            printf '%s\n' "$top" > "$AREA_OUT/mapped/$tag.top"
          }

          # Whole CPU and its current major cones.
          map_top "$AREA_OUT/core" TinyPagedCore cpu
          map_top "$AREA_OUT/core" TinyDependencyBackend dependency_backend
          map_top "$AREA_OUT/core" TinyLoadQueueMemoryBackend memory_backend
          map_top "$AREA_OUT/core" TinyDualReplaySafeLoadUnit loadq2_unit
          map_top "$AREA_OUT/core" TinyBlockingLsu parent_lsu
          map_top "$AREA_OUT/core" DataPathAdapter data_path_adapter
          map_top "$AREA_OUT/core" TranslationUnit translation_unit
          map_top "$AREA_OUT/core" TranslationTlb translation_tlb
          map_top "$AREA_OUT/core" TinySelectiveExecutionCluster execution_cluster
          map_top "$AREA_OUT/core" TinyRob rob
          map_top "$AREA_OUT/core" MachineCsrFile csr
          map_top "$AREA_OUT/core" V2IntegerUnit integer_unit
          map_top "$AREA_OUT/core" AetherDirectMappedReadCache read_cache
          map_top "$AREA_OUT/core" PmpChecker pmp_checker
          map_top "$AREA_OUT/core" PmpRangeDecoder pmp_range_decoder
          map_top "$AREA_OUT/core" PmpAccessChecker pmp_access_checker

          # Whole SoC and non-CPU platform cones.
          map_top "$AREA_OUT/soc" AetherCoreV2FpgaSoC soc
          map_top "$AREA_OUT/soc" AetherSoCPlatformFabric platform_fabric
          map_top "$AREA_OUT/soc" AetherPlic plic
          map_top "$AREA_OUT/soc" AetherUart16550 uart
          map_top "$AREA_OUT/soc" AetherAclintMtimer mtimer

      - name: Summarize fresh ranking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path

          root=Path(os.environ["AREA_OUT"])/"mapped"
          rows=[]
          for path in sorted(root.glob("*.json")):
              net=json.loads(path.read_text())
              top_path=path.with_suffix(".top")
              if not top_path.exists():
                  raise RuntimeError(f"missing top-name sidecar for {path.name}")
              top=top_path.read_text().strip()
              if top not in net["modules"]:
                  raise RuntimeError(
                      f"mapped top {top!r} missing from {path.name}; "
                      f"available={list(net['modules'])[:8]}"
                  )
              types=Counter(c["type"] for c in net["modules"][top]["cells"].values())
              rows.append({
                  "tag":path.stem,
                  "top":top,
                  "cells":sum(types.values()),
                  "lut4":types["LUT4"],
                  "ff":types["TRELLIS_FF"],
                  "dpr16x4":types["TRELLIS_DPR16X4"],
                  "bram":types["DP16KD"],
                  "mult":types["MULT18X18D"],
                  "pfumx":types["PFUMX"],
                  "l6mux21":types["L6MUX21"],
              })

          rows.sort(key=lambda r:r["lut4"], reverse=True)
          out={"product_main":os.environ.get("GITHUB_SHA"),"ranking":rows}
          (root/"ranking.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))

          print("\nLUT4 ranking:")
          for r in rows:
              print(f"{r['lut4']:>7}  {r['tag']:<20} {r['top']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-pa32-main-area-ranking-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.AREA_OUT }}/mapped/ranking.json
            ${{ env.AREA_OUT }}/mapped/*.log
            ${{ env.AREA_OUT }}/mapped/*.top
            ${{ env.AREA_OUT }}/mapped/*.skip
