# Separate, bounded 256-retirement experiment. Not a Linux/Debian handoff.
# A QEMU architectural oracle is NEVER enough: only the true RTL marker passes.
name: Product G5 same QEMU RAM 256 integer retire plus commit DDR subset

on:
  push:
    branches:
      - experiment/c1-arch-handoff-20261108
    paths:
      - '.github/workflows/product-c1-g5-qemu-paired256-commit-shadow.yml'
      - 'tools/ci/product_c1_arch_relay/qemu_paired256_source.py'
      - 'sim/product_c1_g5_qemu_paired256_diff_main.cpp'
      - 'tests_py/test_product_c1_g5_qemu_paired256_static.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-c1-g5-paired256-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired256_qemu_capture_then_true_g5_rtl:
    if: github.ref == 'refs/heads/experiment/c1-arch-handoff-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_VERSION: '5.054'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      VERILATOR_THREADS: '1'
      JOBS: '4'
      OUT: build/product-c1-g5-qemu-paired256
      AETHERCORE_ALLOW_C1_QEMU_FAST_EXPORT: '1'
      AETHERCORE_C1_FAST_QEMU_WALL_SECONDS: '360'
      AETHERCORE_C1_FAST_QEMU_ORACLE_RETIRE_COUNT: '256'
      AETHERCORE_C1_FAST_QEMU_ORACLE_WALL_SECONDS: '180'
      AETHERCORE_C1_FAST_QEMU_CPU: 'rv64,sv48=off,sv57=off,h=off'
      AETHERCORE_C1_FAST_QEMU_OUT: ${{ github.workspace }}/build/product-c1-g5-qemu-paired256/qemu-source
      SOURCE_RUN: '42484457962'
      SOURCE_SHA: f8490d3e0e1b0d7668335b50d8a8b435c76397ab
      SOURCE_ARTIFACT_ID: '13618662668'
      SOURCE_NAME: product-g5-qemu-icount-inputs-42484457962-1
      SOURCE_ZIP_DIGEST: sha256:2af27ebad2a47c88bb10f3d1fe63064a3283c749c330a10fd11c3abc9e482ba9

    steps:
      - name: Checkout isolated exact experimental source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify immutable Product D2 QEMU source before running guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/logs"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/logs/d2-run.json"
          jq -e --arg sha "$SOURCE_SHA" --argjson run "$SOURCE_RUN" '
            .id == $run and .run_attempt == 1 and .head_sha == $sha and
            .status == "completed" and .conclusion == "failure" and
            .path == ".github/workflows/product-g5-qemu-d2-oracle.yml"
          ' "$OUT/logs/d2-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            > "$OUT/logs/d2-jobs.json"
          jq -e '
            [.jobs[] | select(.name == "debian-d2-qemu-system-oracle" and
              .status == "completed" and .conclusion == "failure" and
              ([.steps[] | select(.name ==
                "Stage exact D2 QEMU inputs and immutable SHA256 for count-only reuse" and
                .conclusion == "success")] | length == 1) and
              ([.steps[] | select(.name ==
                "Upload exact Product D2 binaries for later count-only QEMU run" and
                .conclusion == "success")] | length == 1))] | length == 1
          ' "$OUT/logs/d2-jobs.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            > "$OUT/logs/d2-artifact.json"
          jq -e --argjson id "$SOURCE_ARTIFACT_ID" --argjson run "$SOURCE_RUN" \
            --arg digest "$SOURCE_ZIP_DIGEST" --arg name "$SOURCE_NAME" '
            .id == $id and .name == $name and .digest == $digest and
            .expired == false and .workflow_run.id == $run
          ' "$OUT/logs/d2-artifact.json" >/dev/null

      - name: Download pinned authentic D2 firmware and Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: product-g5-qemu-icount-inputs-42484457962-1
          repository: yituanxing/minicore
          run-id: 42484457962
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/c1-qemu-256-inputs

      - name: Install QEMU and hardware compiler prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc python3 openjdk-17-jdk-headless \
            bison flex libfl-dev libgmp-dev git curl make zlib1g-dev autoconf \
            cmake ninja-build libssl-dev libelf-dev libreadline-dev \
            pkg-config build-essential unzip
          qemu-system-riscv64 --version | head -1

      - name: Validate bounded offline 256-source contract before QEMU
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/product_g5_qemu_export/fast_replay_from_stage.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -q \
            tests_py.test_product_c1_g5_qemu_paired256_static

      - name: Capture exactly 256 QEMU retires from ONE live Sv39 RAM export
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/product_g5_qemu_export/fast_replay_from_stage.sh run \
            "$RUNNER_TEMP/c1-qemu-256-inputs"
          test "$(stat -c%s "$AETHERCORE_C1_FAST_QEMU_OUT/export/ram-0x80000000-0x10000000.bin")" \
            -eq 268435456
          grep -Fq 'PRODUCT_C1_QEMU_SINGLESTEP_ORACLE_CAPTURED_NOT_RTL_DIFFTEST steps=256' \
            "$AETHERCORE_C1_FAST_QEMU_OUT/qemu-single-step-oracle.log"

      - name: Seal exact QEMU 256-step RAM and generate current C++ oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/product_c1_arch_relay/qemu_paired256_source.py \
            --source "$AETHERCORE_C1_FAST_QEMU_OUT" \
            --header "$OUT/logs/paired_qemu_trace.h" \
            --gpr-header "$OUT/logs/qemu_captured_gprs.h" \
            --report "$OUT/logs/paired256-source-proof.json" \
            2>&1 | tee "$OUT/logs/paired256-source-validation.log"
          grep -Fq 'PRODUCT_G5_QEMU_PAIRED256_SOURCE_VERIFIED_NOT_RTL_PASS count=256' \
            "$OUT/logs/paired256-source-validation.log"
          PYTHONDONTWRITEBYTECODE=1 AETHERCORE_QEMU_PAIRED256_SOURCE="$AETHERCORE_C1_FAST_QEMU_OUT" \
            python3 -B -m unittest -q tests_py.test_product_c1_g5_qemu_paired256_static

      - name: Preserve immutable same-capture QEMU 256-step source before RTL
        uses: actions/upload-artifact@v4
        with:
          name: product-c1-qemu-paired256-source-${{ github.run_id }}
          path: |
            build/product-c1-g5-qemu-paired256/qemu-source/export/ram-0x80000000-0x10000000.bin
            build/product-c1-g5-qemu-paired256/qemu-source/export/manifest.json
            build/product-c1-g5-qemu-paired256/qemu-source/source-insn.json
            build/product-c1-g5-qemu-paired256/qemu-source/qemu-single-step-oracle.json
            build/product-c1-g5-qemu-paired256/logs/paired256-source-proof.json
          compression-level: 1
          retention-days: 14
          if-no-files-found: error

      - name: Restore Mill Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore pinned Verilator compiler cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.054
            ~/.cache/aethercore/toolchains/src/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
            ~/.cache/aethercore/toolchains/build/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-product-gsim-g3-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh', 'tools/ensure_verilator_5_054.sh') }}

      - name: Ensure exactly Verilator 5.054
        run: bash tools/ensure_verilator_5_054.sh

      - name: Elaborate real Product G5 independently warm-seeded RTL
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-boot \
            BUILD_DIR="$OUT/rtl-seed" \
            TOP=AetherCoreProductDebianWarmSeedRV64SimTop \
            ELABORATE_MAIN=aethercore.sim.ElaborateProductDebianWarmSeedRV64SimTop \
            JOBS=4 rtl
          test -n "$(find "$OUT/rtl-seed/rtl" -maxdepth 1 -name '*.sv' -print -quit)"

      - name: Build real Product G5 256 integer retirement and commit shadow host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/obj"
          verilator --cc --exe --build -O3 -Wall -Wno-fatal \
            --top-module AetherCoreProductDebianWarmSeedRV64SimTop \
            -Mdir "$OUT/obj" \
            -CFLAGS "-std=c++20 -O3 -I$GITHUB_WORKSPACE/sim -I$GITHUB_WORKSPACE/$OUT/logs" \
            -LDFLAGS '-ldl' \
            "$OUT"/rtl-seed/rtl/*.sv \
            "$GITHUB_WORKSPACE/sim/product_c1_g5_qemu_paired256_diff_main.cpp" \
            -j 4 2>&1 | tee "$OUT/logs/verilator-build.log"

      - name: Compare exactly 256 true RTL retires and ROB committed DDR vs QEMU
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s \
            "$OUT/obj/VAetherCoreProductDebianWarmSeedRV64SimTop" \
            "$AETHERCORE_C1_FAST_QEMU_OUT/export/ram-0x80000000-0x10000000.bin" 100000 \
            2>&1 | tee "$OUT/logs/g5-paired256-real-rtl.log"
          grep -Fq 'PRODUCT_G5_SAME_QEMU_RAM_256_INTEGER_RETIRE_AND_COMMITTED_DDR_MATCH_PARTIAL_DIFFTEST' \
            "$OUT/logs/g5-paired256-real-rtl.log"
          echo 'REAL RTL 256 PC/raw/all-XPR and committed-shadow DDR only; not full DiffTest, Linux boot or Debian' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve QEMU/RTL evidence or first unsupported boundary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-c1-g5-qemu-paired256-diagnostics-${{ github.run_id }}
          path: |
            build/product-c1-g5-qemu-paired256/logs/**
            build/product-c1-g5-qemu-paired256/qemu-source/*.log
            build/product-c1-g5-qemu-paired256/qemu-source/*.json
            build/product-c1-g5-qemu-paired256/rtl-seed/logs/**
          if-no-files-found: warn
          retention-days: 14
