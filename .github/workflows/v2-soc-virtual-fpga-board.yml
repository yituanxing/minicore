name: AetherSoC Virtual FPGA Board Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/soc/phy/AetherFractionalTickGenerator.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2VirtualFpgaBoardSimTop.scala'
      - 'src/main/scala/aethercore/ElaborateV2VirtualFpgaBoard.scala'
      - 'src/test/scala/aethercore/AetherFractionalTickGeneratorSpec.scala'
      - 'tests_py/test_v2_virtual_fpga_board.py'
      - '.github/workflows/v2-soc-virtual-fpga-board.yml'

permissions:
  contents: read

concurrency:
  group: aethersoc-virtual-fpga-board-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Prove pin-level virtual FPGA board
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Check virtual-board source contract
        run: python3 -m unittest tests_py.test_v2_virtual_fpga_board -v

      - name: Prove fractional board clock enables
        run: |
          chmod +x mill
          ./mill aethercore.test.testOnly aethercore.AetherFractionalTickGeneratorSpec

      - name: Elaborate pin-level virtual FPGA board
        run: |
          rm -rf build/virtual-fpga-board
          ./mill aethercore.runMain aethercore.ElaborateV2VirtualFpgaBoardRV64 \
            --target-dir build/virtual-fpga-board
          find build/virtual-fpga-board -maxdepth 1 -name '*.sv' -print -quit | grep -q .
