        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/932m 952000000
          grep -Fxq 'boot_cycles=952000000' build/product-sd1-spi-polling-relay/952m/.polling-ready
      - name: Upload authenticated 952M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-952m-${{ github.run_id }}
          retention-days: 90
