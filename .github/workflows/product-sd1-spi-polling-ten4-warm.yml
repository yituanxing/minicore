          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/812m/
      - name: Execute authentic polling Product RTL 812M to 832M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/812m 832000000
          grep -Fxq 'boot_cycles=832000000' build/product-sd1-spi-polling-relay/832m/.polling-ready
      - name: Upload authenticated 832M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
