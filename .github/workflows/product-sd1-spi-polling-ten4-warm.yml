          path: build/product-sd1-spi-polling-relay/872m/
      - name: Execute authentic polling Product RTL 872M to 892M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/872m 892000000
          grep -Fxq 'boot_cycles=892000000' build/product-sd1-spi-polling-relay/892m/.polling-ready
      - name: Upload authenticated 892M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-892m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/892m/
      - name: Execute authentic polling Product RTL 892M to 912M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/892m 912000000
          grep -Fxq 'boot_cycles=912000000' build/product-sd1-spi-polling-relay/912m/.polling-ready
      - name: Upload authenticated 912M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
