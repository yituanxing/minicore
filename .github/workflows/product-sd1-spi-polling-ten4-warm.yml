          path: build/product-sd1-spi-polling-relay/952m/
      - name: Preserve every completed polling stage log and SD counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-752m-to-952m-evidence-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/product-sd1-spi-polling-relay/772m/.polling-ready
            build/product-sd1-spi-polling-relay/772m/card-progress.json
            build/product-sd1-spi-polling-relay/772m/save.log
            build/product-sd1-spi-polling-relay/792m/.polling-ready
            build/product-sd1-spi-polling-relay/792m/card-progress.json
            build/product-sd1-spi-polling-relay/792m/save.log
            build/product-sd1-spi-polling-relay/812m/.polling-ready
            build/product-sd1-spi-polling-relay/812m/card-progress.json
            build/product-sd1-spi-polling-relay/812m/save.log
            build/product-sd1-spi-polling-relay/832m/.polling-ready
            build/product-sd1-spi-polling-relay/832m/card-progress.json
