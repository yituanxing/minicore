          path: build/product-sd1-spi-polling-relay/912m/
      - name: Execute authentic polling Product RTL 912M to 932M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/912m 932000000
          grep -Fxq 'boot_cycles=932000000' build/product-sd1-spi-polling-relay/932m/.polling-ready
      - name: Upload authenticated 932M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
