          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/832m/
      - name: Execute authentic polling Product RTL 832M to 852M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/832m 852000000
          grep -Fxq 'boot_cycles=852000000' build/product-sd1-spi-polling-relay/852m/.polling-ready
      - name: Upload authenticated 852M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-852m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/852m/
      - name: Execute authentic polling Product RTL 852M to 872M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/852m 872000000
          grep -Fxq 'boot_cycles=872000000' build/product-sd1-spi-polling-relay/872m/.polling-ready
      - name: Upload authenticated 872M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-872m-${{ github.run_id }}
          retention-days: 90
