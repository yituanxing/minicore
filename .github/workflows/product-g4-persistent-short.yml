name: AetherCore Product G4 Linux persistent checkpoint short

# Operator-only Linux 6.6.143 banner / RTL disk-checkpoint proof, capped at
# 100M Product guest cycles plus two new-process 500k-cycle continuations.
# This is not Linux PID1, Debian, SD1 or G4 same-cycle Verilator/GSIM A/B.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: product-g4-persistent-short-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  persistent-g4-short:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'product-g4-persistent-short')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_ALLOW_PRODUCT_PERSISTENT_CHECKPOINT: '1'
      AETHERCORE_ALLOW_PRODUCT_G4_PERSISTENT_CHECKPOINT: '1'
      AETHERCORE_VERILATOR_VERSION: '5.054'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      RV64_OPENSBI_JOBS: '4'
      RV64_LINUX_JOBS: '4'
      SIM_SETTLE_MODE: reference
      VERILATOR_THREADS: '1'
      AETHERCORE_DATA_MEM_WAIT_CYCLES: '0'
      JOBS: '4'

    steps:
      - name: Checkout exact Product source and reject distribution media
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true
          persist-credentials: false

      - name: Prove bounded scope and run negative checkpoint contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          [[ -z "${AETHERCORE_PRODUCT_SD_IMAGE:-}" &&
             -z "${AETHERCORE_PRODUCT_DTB_IMAGE:-}" ]] || exit 3
          bash -n tools/ci/product_checkpoint_g3_short.sh tools/ci/product_checkpoint_g4_short.sh tools/ci/product_checkpoint_g4_selftest.sh
          bash tools/ci/product_checkpoint_g4_selftest.sh
          echo 'PRODUCT_G4_PERSISTENT_SCOPE: RAM-only real Linux banner; 100M max; no PID1/SD1/Debian'

      - name: Reuse Mill Scala dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore pinned Verilator 5.054 with savable runtime
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.054
            ~/.cache/aethercore/toolchains/src/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
            ~/.cache/aethercore/toolchains/build/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-product-gsim-g3-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh', 'tools/ensure_verilator_5_054.sh') }}

      - name: Restore pinned RV64 GCC and OpenSBI source
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/bootlin-riscv64-lp64d-glibc-stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv64-lp64d--glibc--stable-2024.05-1.tar.xz
            ~/.cache/aethercore/rv64-opensbi/opensbi/bd613dd92113f683052acfb23d9dc8ba60029e0a
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-gsim-g3-fw-v1

      - name: Restore FULL frozen Linux baseline and Kbuild objects
        id: linux-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/rv64/linux
            ~/.cache/aethercore/rv64/linux-build
            ~/.cache/aethercore/l32/opensbi
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v2-${{ hashFiles('software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env', 'tools/ci/rv64_linux_early_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh') }}

      - name: Restore exact G4 sparse Image vmlinux config and PID1 bytes
        id: initramfs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rv64-linux-initramfs/obj/arch/riscv/boot/Image
            build/rv64-linux-initramfs/obj/vmlinux
            build/rv64-linux-initramfs/obj/.config
            build/rv64-linux-initramfs/minimal-init/init
            build/rv64-linux-initramfs/minimal-init/initramfs.list
            build/rv64-linux-initramfs/evidence
            build/rv64-linux-initramfs/result.txt
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-g4-minimal-initramfs-v1-${{ hashFiles('software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env', 'software/rv64_userspace/minimal_init.S', 'tools/ci/rv64_linux_early_build.sh', 'tools/ci/rv64_minimal_initramfs_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh') }}

      - name: Reject missing warm Linux caches before source build
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.linux-cache.outputs.cache-hit }}' == true &&
             '${{ steps.initramfs-cache.outputs.cache-hit }}' == true ]] || {
            echo 'PRODUCT_G4_PERSISTENT_WARM_CACHE_REQUIRED: qualify normal frozen G4 first' >&2
            exit 16
          }

      - name: Install host prerequisites for exact RTL checkpoint runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless python3 bison flex libfl-dev \
            libgmp-dev git curl make zlib1g-dev autoconf cmake ninja-build \
            libssl-dev libelf-dev libreadline-dev pkg-config build-essential \
            bc device-tree-compiler dwarves xz-utils

      - name: Fingerprint native ABI for exact G3 savable model reuse
        id: native-abi
        shell: bash
        run: |
          set -euo pipefail
          cpu="$(awk -F: '/^model name[[:space:]]*:|^flags[[:space:]]*:/{print $0; n++; if(n==2)exit}' /proc/cpuinfo | sha256sum | cut -c1-20)"
          compiler="$(c++ --version | head -1 | sha256sum | cut -c1-20)"
          echo "signature=$cpu-$compiler" >> "$GITHUB_OUTPUT"

      - name: Restore exact G3 --savable Product RTL archive
        id: savable-model-cache
        uses: actions/cache/restore@v4
        with:
          path: build/product-g3-persistent-checkpoint/savable-model
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-g3-savable-v2-${{ steps.native-abi.outputs.signature }}-${{ hashFiles('build.mill', 'src/main/scala/**/*.scala', 'sim/product_rv64_checkpoint_main.cpp', 'sim/l32_opensbi_runtime.h', 'sim/product_rv64_opensbi_shim/*.h', 'tools/ci/product_checkpoint_g3_short.sh', 'tools/ci/product_sim_cache.sh', 'tools/ensure_verilator_5_024.sh') }}

      - name: Reject missing or ABI-mismatched savable Product model
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.savable-model-cache.outputs.cache-hit }}' == true ]] || {
            echo 'PRODUCT_G4_PERSISTENT_SAVABLE_REQUIRED: run the qualified persistent G3 short gate first' >&2
            exit 16
          }

      - name: Provision pinned RV64 Linux GCC 13.3
        shell: bash
        run: bash tools/ensure_riscv64_linux_gcc_13_3.sh

      - name: Revalidate warm full Linux and stage real unchanged G4 firmware
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/rv64_board_lean_linux_warm_guard.sh
          bash tools/ci/rv64_linux_early_build.sh
          initramfs_dir=build/rv64-linux-initramfs
          baseline_image="$(sed -n 's/^kernel_image=//p' build/rv64-linux-early/result.txt | head -1)"
          grep -Fxq 'RV64_MINIMAL_INITRAMFS_BUILD_RESULT: status=PASS' "$initramfs_dir/result.txt"
          grep -Fxq 'linux_version=6.6.143' "$initramfs_dir/result.txt"
          grep -Fxq "baseline_image=$baseline_image" "$initramfs_dir/result.txt"
          sha256sum --check --status "$initramfs_dir/evidence/sha256.txt"
          grep -Fxq "image_sha256=$(sha256sum "$initramfs_dir/obj/arch/riscv/boot/Image" | awk '{print $1}')" "$initramfs_dir/result.txt"
          "${AETHERCORE_RV64_LINUX_CROSS_COMPILE}readelf" -h "$initramfs_dir/obj/vmlinux" |
            grep -q 'Machine:[[:space:]]*RISC-V'
          timeout --signal=TERM --kill-after=5s 180s \
            bash tools/ci/rv64_minimal_init_payload_build.sh
          grep -Fxq 'RV64_MINIMAL_INIT_PAYLOAD_BUILD_RESULT: status=PASS' \
            build/rv64-minimal-init-boot/result.txt
          grep -Fxq 'spi_sd=0' build/rv64-minimal-init-boot/result.txt

      - name: Relink G4 host against same G3 --savable RTL archive
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/product_checkpoint_g4_short.sh build
          echo 'PRODUCT_G4_PERSISTENT_MODEL_READY: exact savable Product RTL, independent G4 host, unchanged Linux firmware' >> "$GITHUB_STEP_SUMMARY"

      - name: Run real 100M Linux-banner checkpoint and two 500k restores
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/product-g4-persistent-checkpoint
          timeout --signal=TERM --kill-after=10s 1050s \
            bash tools/ci/product_checkpoint_g4_short.sh run |
            tee build/product-g4-persistent-checkpoint/run-summary.log
          grep -Fq 'PRODUCT_G4_PERSISTENT_CROSS_PROCESS_PASS ' \
            build/product-g4-persistent-checkpoint/run-summary.log
          proof_dir="$(sed -n 's/^PRODUCT_G4_PERSISTENT_PROOF_DIR=//p' build/product-g4-persistent-checkpoint/run-summary.log | tail -1)"
          [[ -n "$proof_dir" && -d "$proof_dir" ]]
          bash tools/ci/product_checkpoint_g4_short.sh verify-proof "$proof_dir"
          echo 'PRODUCT_G4_PERSISTENT_PASS: real Linux-banner RTL state stored and resumed across distinct processes, no PID1/SD1/Debian claim' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof hashes and text logs only never RAM snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-g4-persistent-short-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/rv64-linux-early/result.txt
            build/rv64-linux-initramfs/result.txt
            build/rv64-minimal-init-boot/result.txt
            build/product-g4-persistent-checkpoint/run-summary.log
            build/product-g4-persistent-checkpoint/logs/*.log
            build/product-g4-persistent-checkpoint/persist-G4.*/qualification.txt
            build/product-g4-persistent-checkpoint/persist-G4.*/sha256.txt
            build/product-g4-persistent-checkpoint/persist-G4.*/.complete
            build/product-g4-persistent-checkpoint/persist-G4.*/save.log
            build/product-g4-persistent-checkpoint/persist-G4.*/restore.log
