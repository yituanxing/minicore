      - name: Upload authenticated 612M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-612m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/612m/
      - name: Execute authentic polling Product RTL 612M to 632M
        shell: bash
        run: |
          set -euo pipefail
