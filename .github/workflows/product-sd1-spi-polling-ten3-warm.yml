          path: build/product-sd1-spi-polling-relay/692m/
      - name: Execute authentic polling Product RTL 692M to 712M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/692m 712000000
          grep -Fxq 'boot_cycles=712000000' build/product-sd1-spi-polling-relay/712m/.polling-ready
      - name: Upload authenticated 712M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
