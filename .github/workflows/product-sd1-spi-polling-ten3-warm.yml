          path: build/product-sd1-spi-polling-relay/752m/
      - name: Preserve every completed polling stage log and SD counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-552m-to-752m-evidence-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/product-sd1-spi-polling-relay/572m/.polling-ready
            build/product-sd1-spi-polling-relay/572m/card-progress.json
            build/product-sd1-spi-polling-relay/572m/save.log
            build/product-sd1-spi-polling-relay/592m/.polling-ready
            build/product-sd1-spi-polling-relay/592m/card-progress.json
