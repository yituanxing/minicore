          path: build/product-sd1-spi-polling-relay/712m/
      - name: Execute authentic polling Product RTL 712M to 732M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/712m 732000000
          grep -Fxq 'boot_cycles=732000000' build/product-sd1-spi-polling-relay/732m/.polling-ready
      - name: Upload authenticated 732M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-732m-${{ github.run_id }}
          retention-days: 90
