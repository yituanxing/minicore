          grep -Fxq 'boot_cycles=752000000' build/product-sd1-spi-polling-relay/752m/.polling-ready
      - name: Upload authenticated 752M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
