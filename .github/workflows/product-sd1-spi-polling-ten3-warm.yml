      - name: Upload authenticated 652M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-652m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/652m/
      - name: Execute authentic polling Product RTL 652M to 672M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/652m 672000000
          grep -Fxq 'boot_cycles=672000000' build/product-sd1-spi-polling-relay/672m/.polling-ready
      - name: Upload authenticated 672M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
