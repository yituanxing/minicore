name: Zephyr Self-Hosted Stage Slot

on:
  pull_request:
    branches:
      - agent/zephyr-host-ci-base
    paths:
      - .github/zephyr-stage-request

permissions:
  contents: read

# Temporary cleanup snapshot: a reopened PR #50 enters the exact concurrency
# group used by its stale queued run, cancels that run, and skips all jobs.
concurrency:
  group: zephyr-stage-slot-50
  cancel-in-progress: true

jobs:
  z1-build:
    if: ${{ false }}
    name: Cancel stale queued Zephyr slot
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 1
    steps:
      - run: echo "stale slot cancelled"
