name: INERT DRAFT signed SD1 V6 20B continuation from certified V5 14992M
# INERT. Job1/final are if:false; downstream jobs skip on unmet needs.
# Before enabling require independent signed V5 14992M artifact audit and V6 identity review.
# Also require a genuine 14992M -> 15012M V6 technical qualification and
# one reviewed release commit. V5's 9992M model qualification is not V6 approval.
# Single PR-labeled event, no workflow_run/dispatch/push and no write privileges.
'on':
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read
concurrency:
  group: product-sd1-v6-20b-needs-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  V6_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  V6_REVIEWED_PRIOR_HEAD: 'PENDING_INDEPENDENT_V6_DRAFT_REVIEW'
  # Read-only V5 model-migration qualification is retained, not claimed as V6 qualification.
  V6_QUAL_RUN: '42599136275'
  V6_QUAL_ID: '13664668373'
  V6_QUAL_HEAD: 'a0480c3cfe5ae2b01b92f82e5bc3d90582a9cc4b'
  V6_QUAL_NAME: 'product-sd1-model-migrate-v5-qual-9972-9992-42599136275'
  V6_QUAL_DIGEST: '55d5cf2d8ff46c93eb6c21de1b9c451ff14287da8c03f9cc424d1dd0de41ff89'
  V6_QUAL_MANIFEST_SHA: '63766841ea96bf75b40584e1760b9e78f538d3a7dd16193a3ff71e8d4fb8c700'
  V6_MODEL_SHA: '4f946c321c63528ce789440486c82ef89204fc0905985bb42a97d1ec9fe989be'
  AETHERCORE_SD1_V6_REVIEWED_MODEL_SHA: '4f946c321c63528ce789440486c82ef89204fc0905985bb42a97d1ec9fe989be'
  V6_ORIGIN_RUN: '42600415630'
  V6_ORIGIN_HEAD: '8a40835c470d059448a4871bafead04cc555bee5'
  V6_14992_ID: '13738787578'
  V6_14992_NAME: 'product-sd1-v5-15b-42600415630-attempt7-v5_billion_5-14992m'
  V6_14992_DIGEST: 'b235fb53f493b274aae9217ae09fafe3a1a16813bde4e38adf50ac048cedd31b'
  V6_14992_HOST_SHA: 'ba7e2161c5917f522a6854eb5457e9cff703492bb0ef1c5485cb13f6500a01cb'
  V6_14992_RTL_SHA: '948ab3d2a7554566ca9cb0070c51eafbecf111eee465ec11a7ecbcb354c57ed9'
  V6_14992_CARD_SHA: '3ef8a3c6281ca52fd2c734f7244634de55908d276208b2ef26736b355ff1c4a3'
  # The V6 14992->15012M technical qualification must first be run, its 90d
  # report independently reviewed, and all these exact archive pins filled.
  V6_TECH_QUAL_RUN: 'PENDING_REAL_V6_TECH_QUAL_RUN'
  V6_TECH_QUAL_ID: 'PENDING_REAL_V6_TECH_QUAL_ARTIFACT_ID'
  V6_TECH_QUAL_ATTEMPT: 'PENDING_REAL_V6_TECH_QUAL_ATTEMPT'
  V6_TECH_QUAL_NAME: 'PENDING_REAL_V6_TECH_QUAL_NAME'
  V6_TECH_QUAL_DIGEST: 'PENDING_REAL_V6_TECH_QUAL_ARCHIVE_DIGEST'
  V6_TECH_QUAL_PR379_HEAD: 'PENDING_REVIEWED_PR379_QUALIFICATION_EVENT_HEAD'
  V6_TECH_QUAL_REVIEWED_HEAD: 'PENDING_EXACT_REVIEWED_V6_EXECUTOR_HEAD'
  AETHERCORE_SD1_V6_20B_APPROVED: PENDING_INDEPENDENT_V6_20B_QUALIFICATION
  AETHERCORE_SD1_RELAY_CONFIRM: PENDING_V6_SIGNED_CROSS_RUN_REVIEW
  AETHERCORE_VERILATOR_VERSION: '5.054'
  SIM_SETTLE_MODE: reference
  VERILATOR_THREADS: '1'
  AETHERCORE_DATA_MEM_WAIT_CYCLES: '0'
jobs:
  v6_billion_1:
    name: Genuine V6 signed Product RTL 14992M to 15992M, fifty 20M saves
    if: >-
      false &&
      github.repository == 'yituanxing/minicore' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'sd1-v6-approved' &&
      github.event.pull_request.number == 0 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'design/sd1-v6-checkpoint-relay-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 335
    outputs:
      terminal_artifact_id: ${{ steps.batch.outputs.terminal_artifact_id }}
      terminal_artifact_name: ${{ steps.batch.outputs.terminal_artifact_name }}
      terminal_artifact_digest: ${{ steps.batch.outputs.terminal_artifact_digest }}
      terminal_host_sha: ${{ steps.batch.outputs.terminal_host_sha }}
      terminal_rtl_sha: ${{ steps.batch.outputs.terminal_rtl_sha }}
      terminal_card_sha: ${{ steps.batch.outputs.terminal_card_sha }}
      terminal_m: ${{ steps.batch.outputs.terminal_m }}
      serial_login_verified: ${{ steps.batch.outputs.serial_login_verified }}
    steps:
      - name: Source-pinned checkout with zero persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V6_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed V6 20B repo source and scripts before any guest cycle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$V6_SOURCE_SHA" ]] || exit 16
          bash tools/ci/product_sd1_v6_release_guard.sh
          bash -n tools/ci/product_sd1_v6_postcross_20m.sh
          bash -n tools/ci/product_sd1_v6_chain_prepare.sh
          python3 -m py_compile tools/ci/product_sd1_v6_chain.py
          bash tools/ci/product_sd1_v6_postcross_20m.sh --plan
      - id: batch
        uses: ./.github/actions/product-sd1-v6-batch
        with:
          start_m: '14992'
          end_m: '15992'
          source_mode: cross_run
          source_id: ${{ env.V6_14992_ID }}
          source_name: ${{ env.V6_14992_NAME }}
          source_digest: ${{ env.V6_14992_DIGEST }}
          source_host_sha: ${{ env.V6_14992_HOST_SHA }}
          source_rtl_sha: ${{ env.V6_14992_RTL_SHA }}
          source_card_sha: ${{ env.V6_14992_CARD_SHA }}

  v6_billion_2:
    name: Genuine V6 signed Product RTL 15992M to 16992M, fifty 20M saves
    needs: v6_billion_1
    if: >-
      needs.v6_billion_1.outputs.serial_login_verified != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 335
    outputs:
      terminal_artifact_id: ${{ steps.batch.outputs.terminal_artifact_id }}
      terminal_artifact_name: ${{ steps.batch.outputs.terminal_artifact_name }}
      terminal_artifact_digest: ${{ steps.batch.outputs.terminal_artifact_digest }}
      terminal_host_sha: ${{ steps.batch.outputs.terminal_host_sha }}
      terminal_rtl_sha: ${{ steps.batch.outputs.terminal_rtl_sha }}
      terminal_card_sha: ${{ steps.batch.outputs.terminal_card_sha }}
      terminal_m: ${{ steps.batch.outputs.terminal_m }}
      serial_login_verified: ${{ steps.batch.outputs.serial_login_verified }}
    steps:
      - name: Source-pinned checkout with zero persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V6_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed V6 20B repo source and scripts before any guest cycle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$V6_SOURCE_SHA" ]] || exit 16
          bash tools/ci/product_sd1_v6_release_guard.sh
          bash -n tools/ci/product_sd1_v6_postcross_20m.sh
          bash -n tools/ci/product_sd1_v6_chain_prepare.sh
          python3 -m py_compile tools/ci/product_sd1_v6_chain.py
          bash tools/ci/product_sd1_v6_postcross_20m.sh --plan
      - id: batch
        uses: ./.github/actions/product-sd1-v6-batch
        with:
          start_m: '15992'
          end_m: '16992'
          source_mode: intra_run
          source_id: ${{ needs.v6_billion_1.outputs.terminal_artifact_id }}
          source_name: ${{ needs.v6_billion_1.outputs.terminal_artifact_name }}
          source_digest: ${{ needs.v6_billion_1.outputs.terminal_artifact_digest }}
          source_host_sha: ${{ needs.v6_billion_1.outputs.terminal_host_sha }}
          source_rtl_sha: ${{ needs.v6_billion_1.outputs.terminal_rtl_sha }}
          source_card_sha: ${{ needs.v6_billion_1.outputs.terminal_card_sha }}

  v6_billion_3:
    name: Genuine V6 signed Product RTL 16992M to 17992M, fifty 20M saves
    needs: v6_billion_2
    if: >-
      needs.v6_billion_2.outputs.serial_login_verified != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 335
    outputs:
      terminal_artifact_id: ${{ steps.batch.outputs.terminal_artifact_id }}
      terminal_artifact_name: ${{ steps.batch.outputs.terminal_artifact_name }}
      terminal_artifact_digest: ${{ steps.batch.outputs.terminal_artifact_digest }}
      terminal_host_sha: ${{ steps.batch.outputs.terminal_host_sha }}
      terminal_rtl_sha: ${{ steps.batch.outputs.terminal_rtl_sha }}
      terminal_card_sha: ${{ steps.batch.outputs.terminal_card_sha }}
      terminal_m: ${{ steps.batch.outputs.terminal_m }}
      serial_login_verified: ${{ steps.batch.outputs.serial_login_verified }}
    steps:
      - name: Source-pinned checkout with zero persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V6_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed V6 20B repo source and scripts before any guest cycle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$V6_SOURCE_SHA" ]] || exit 16
          bash tools/ci/product_sd1_v6_release_guard.sh
          bash -n tools/ci/product_sd1_v6_postcross_20m.sh
          bash -n tools/ci/product_sd1_v6_chain_prepare.sh
          python3 -m py_compile tools/ci/product_sd1_v6_chain.py
          bash tools/ci/product_sd1_v6_postcross_20m.sh --plan
      - id: batch
        uses: ./.github/actions/product-sd1-v6-batch
        with:
          start_m: '16992'
          end_m: '17992'
          source_mode: intra_run
          source_id: ${{ needs.v6_billion_2.outputs.terminal_artifact_id }}
          source_name: ${{ needs.v6_billion_2.outputs.terminal_artifact_name }}
          source_digest: ${{ needs.v6_billion_2.outputs.terminal_artifact_digest }}
          source_host_sha: ${{ needs.v6_billion_2.outputs.terminal_host_sha }}
          source_rtl_sha: ${{ needs.v6_billion_2.outputs.terminal_rtl_sha }}
          source_card_sha: ${{ needs.v6_billion_2.outputs.terminal_card_sha }}

  v6_billion_4:
    name: Genuine V6 signed Product RTL 17992M to 18992M, fifty 20M saves
    needs: v6_billion_3
    if: >-
      needs.v6_billion_3.outputs.serial_login_verified != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 335
    outputs:
      terminal_artifact_id: ${{ steps.batch.outputs.terminal_artifact_id }}
      terminal_artifact_name: ${{ steps.batch.outputs.terminal_artifact_name }}
      terminal_artifact_digest: ${{ steps.batch.outputs.terminal_artifact_digest }}
      terminal_host_sha: ${{ steps.batch.outputs.terminal_host_sha }}
      terminal_rtl_sha: ${{ steps.batch.outputs.terminal_rtl_sha }}
      terminal_card_sha: ${{ steps.batch.outputs.terminal_card_sha }}
      terminal_m: ${{ steps.batch.outputs.terminal_m }}
      serial_login_verified: ${{ steps.batch.outputs.serial_login_verified }}
    steps:
      - name: Source-pinned checkout with zero persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V6_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed V6 20B repo source and scripts before any guest cycle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$V6_SOURCE_SHA" ]] || exit 16
          bash tools/ci/product_sd1_v6_release_guard.sh
          bash -n tools/ci/product_sd1_v6_postcross_20m.sh
          bash -n tools/ci/product_sd1_v6_chain_prepare.sh
          python3 -m py_compile tools/ci/product_sd1_v6_chain.py
          bash tools/ci/product_sd1_v6_postcross_20m.sh --plan
      - id: batch
        uses: ./.github/actions/product-sd1-v6-batch
        with:
          start_m: '17992'
          end_m: '18992'
          source_mode: intra_run
          source_id: ${{ needs.v6_billion_3.outputs.terminal_artifact_id }}
          source_name: ${{ needs.v6_billion_3.outputs.terminal_artifact_name }}
          source_digest: ${{ needs.v6_billion_3.outputs.terminal_artifact_digest }}
          source_host_sha: ${{ needs.v6_billion_3.outputs.terminal_host_sha }}
          source_rtl_sha: ${{ needs.v6_billion_3.outputs.terminal_rtl_sha }}
          source_card_sha: ${{ needs.v6_billion_3.outputs.terminal_card_sha }}

  v6_billion_5:
    name: Genuine V6 signed Product RTL 18992M to 19992M, fifty 20M saves
    needs: v6_billion_4
    if: >-
      needs.v6_billion_4.outputs.serial_login_verified != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 335
    outputs:
      terminal_artifact_id: ${{ steps.batch.outputs.terminal_artifact_id }}
      terminal_artifact_name: ${{ steps.batch.outputs.terminal_artifact_name }}
      terminal_artifact_digest: ${{ steps.batch.outputs.terminal_artifact_digest }}
      terminal_host_sha: ${{ steps.batch.outputs.terminal_host_sha }}
      terminal_rtl_sha: ${{ steps.batch.outputs.terminal_rtl_sha }}
      terminal_card_sha: ${{ steps.batch.outputs.terminal_card_sha }}
      terminal_m: ${{ steps.batch.outputs.terminal_m }}
      serial_login_verified: ${{ steps.batch.outputs.serial_login_verified }}
    steps:
      - name: Source-pinned checkout with zero persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V6_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed V6 20B repo source and scripts before any guest cycle
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$V6_SOURCE_SHA" ]] || exit 16
          bash tools/ci/product_sd1_v6_release_guard.sh
          bash -n tools/ci/product_sd1_v6_postcross_20m.sh
          bash -n tools/ci/product_sd1_v6_chain_prepare.sh
          python3 -m py_compile tools/ci/product_sd1_v6_chain.py
          bash tools/ci/product_sd1_v6_postcross_20m.sh --plan
      - id: batch
        uses: ./.github/actions/product-sd1-v6-batch
        with:
          start_m: '18992'
          end_m: '19992'
          source_mode: intra_run
          source_id: ${{ needs.v6_billion_4.outputs.terminal_artifact_id }}
          source_name: ${{ needs.v6_billion_4.outputs.terminal_artifact_name }}
          source_digest: ${{ needs.v6_billion_4.outputs.terminal_artifact_digest }}
          source_host_sha: ${{ needs.v6_billion_4.outputs.terminal_host_sha }}
          source_rtl_sha: ${{ needs.v6_billion_4.outputs.terminal_rtl_sha }}
          source_card_sha: ${{ needs.v6_billion_4.outputs.terminal_card_sha }}
  final_genuine_rtl_proof:
    needs: [v6_billion_1, v6_billion_2, v6_billion_3, v6_billion_4, v6_billion_5]
    if: false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Fail closed unless all 5B committed or early real UART service-login proved
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e '
            ([.[] | select(.result=="failure" or .result=="cancelled")] | length)==0 and
            (
              .v6_billion_5.result=="success" and
              .v6_billion_5.outputs.terminal_m=="19992"
              or
              ([.[] | select(.result=="success" and .outputs.serial_login_verified=="1")] | length)>=1
            )
          ' <<< "$NEEDS_JSON" >/dev/null || exit 16
          echo 'PRODUCT_SD1_V6_RELAY_FINISHED_OR_UART_LOGIN_OBSERVED_REQUIRES_INDEPENDENT_ARTIFACT_AUDIT'

