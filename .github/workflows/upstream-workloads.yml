name: Upstream Software Workloads

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-workloads-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upstream-workloads:
    name: Pinned CoreMark against Verilator and NEMU
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 60
    env:
      AETHERCORE_MILL_NO_DAEMON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Verify persistent runner toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test "$(stat -f -c %T .)" != "9p"
          test "$(stat -f -c %T .)" != "drvfs"
          java -version
          javac -version
          git --version
          python3 --version
          g++ --version
          test "$(cat "$HOME/.cache/aethercore/toolchains/verilator-5.024/.aethercore-source-revision")" = \
            "522bead374d6b7b2adb316304126e5361b18bcf1"
          test "$(readlink -f "$(command -v verilator)")" = \
            "$HOME/.cache/aethercore/toolchains/verilator-5.024/bin/verilator"
          riscv64-unknown-elf-gcc --version
          command -v make curl git bison flex zstd

      - name: Prepare Mill launcher
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x mill
          timeout 600 ./mill --version

      - name: Source and generator tests
        run: make python-test

      - name: Build Verilator simulator and pinned NEMU
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          make sim nemu 2>&1 | tee build/logs/upstream-workloads-build.log

      - name: Fetch and compile pinned upstream workloads
        shell: bash
        run: |
          set -o pipefail
          bash tools/build_upstream_workloads.sh build/upstream-workloads \
            2>&1 | tee build/logs/upstream-workloads-compile.log

      - name: Run upstream workloads with commit-level DiffTest
        shell: bash
        env:
          MAX_CYCLES: "20000000"
        run: |
          set -o pipefail
          bash tools/run_compiled_workloads.sh \
            build/obj/VAetherCoreSimTop \
            "$(pwd)/build/nemu/build/riscv64-nemu-interpreter-so" \
            build/upstream-workloads \
            2>&1 | tee build/logs/upstream-workloads-difftest.log

      - name: Upload upstream workload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-workloads-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/logs/
            build/upstream-workloads/
            build/rtl/
