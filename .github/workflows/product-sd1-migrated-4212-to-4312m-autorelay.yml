name: Product signed SD1 migrated RTL 4212M to 4312M five-stage automatic relay

# Exact successful upstream #42387200766 is pinned by run, source commit,
# Artifact ID+ZIP digest and the full Host/RTL checkpoint checksums.
# Includes 4292M -> 4312M crossing 2^32 real RTL cycles, NOT merely 4B.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: product-sd1-migrated-4212-4312m-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  authenticated_five_stages:
    if: >-
      github.event.label.name == 'product-sd1-migrated-4212m-to-4312m-auto' &&
      github.event.pull_request.number == 379 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'design/rv64gc-product-architecture-20261103'
    uses: ./.github/workflows/product-sd1-migrated-autorelay-five-reusable.yml
    with:
      start_m: '4212'
      stage1: '4232'
      stage2: '4252'
      stage3: '4272'
      stage4: '4292'
      stage5: '4312'
      require_2pow32_crossing: true
      source_run: '42387200766'
      source_head_sha: 'dee95e8015edb6a016529e910ba32ee9ab062a90'
      source_workflow_path: '.github/workflows/product-sd1-migrated-4112-to-4212m-autorelay.yml'
      source_job: 'authenticated_five_stages / relay_five'
      source_completed_step: 'Upload complete stage five before completion'
      source_artifact_id: '13580435941'
      source_artifact_name: 'product-sd1-migrated-4212m-42387200766'
      source_artifact_digest: '6bfe98438e163ced930591378e29da8e14f990703dd65ecce1f771fdfa60ef0e'
      source_host_sha: '4dd5faa873c65fd403b97bf7178a69716905523d230e1c12e2fe8cc206aff04b'
      source_rtl_sha: '297dc38fbc7f505aa5f66e4c966e675fb7448a24fa30879fb038bd0f8d3e6162'
