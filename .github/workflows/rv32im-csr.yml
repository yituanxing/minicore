name: RV32IM Machine CSR

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv32im-csr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  csr:
    name: Zicsr and machine CSRs on RV32IM
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 45
    env:
      AETHERCORE_MILL_NO_DAEMON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Verify persistent runner toolchain
        shell: bash
        run: |
          set -euxo pipefail
          test "$(stat -f -c %T .)" != "9p"
          test "$(stat -f -c %T .)" != "drvfs"
          java -version
          javac -version
          git --version
          python3 --version
          g++ --version
          test "$(cat "$HOME/.cache/aethercore/toolchains/verilator-5.024/.aethercore-source-revision")" = \
            "522bead374d6b7b2adb316304126e5361b18bcf1"
          test "$(readlink -f "$(command -v verilator)")" = \
            "$HOME/.cache/aethercore/toolchains/verilator-5.024/bin/verilator"
          riscv64-unknown-elf-gcc --version
          riscv64-unknown-elf-objdump --version | head -n 1
          command -v make curl bison flex zstd file

      - name: Prepare Mill launcher
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x mill
          timeout 600 ./mill --version

      - name: Build exact frozen RV32 NEMU reference
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          NEMU_SINGLE_STEP=1 bash tools/probe_rv32_nemu_historical.sh \
            "$(pwd)/build/rv32-nemu-probe" \
            2>&1 | tee build/rv32-nemu-probe.log
          grep -q '^reference_sha256=e1e18bec22a1e6a19dbb300b43063ed5d3216a8d9f6ccf6400355d4fb897de9e$' \
            build/rv32-nemu-probe/evidence/result.txt
          reference_so="$(find build/rv32-nemu-probe/nemu/build -maxdepth 1 -type f \
            -name 'riscv32-nemu-interpreter-so*' -print -quit)"
          test -n "$reference_so"
          echo "RV32_NEMU_SO=$reference_so" >> "$GITHUB_ENV"

      - name: Build frozen RV32IM CSR workload
        shell: bash
        run: |
          make -f Makefile.rv32im-csr workload
          manifest=build/rv32im-csr/software/manifest.txt
          grep -q '^march=rv32im_zicsr$' "$manifest"
          grep -q '^mabi=ilp32$' "$manifest"
          grep -q '^binary_bytes=388$' "$manifest"
          grep -q '^binary_words=97$' "$manifest"
          grep -q '^binary_sha256=84b5279e4e077fe5e6a8cf06bff9a177a2a774822b7f533c5df663e79468346f$' "$manifest"
          grep -q '<main>:' build/rv32im-csr/software/rv32im-csr.dis
          grep -q 'csrrw' build/rv32im-csr/software/rv32im-csr.dis
          grep -q 'csrrs' build/rv32im-csr/software/rv32im-csr.dis
          grep -q 'csrrc' build/rv32im-csr/software/rv32im-csr.dis
          grep -q 'csrrwi' build/rv32im-csr/software/rv32im-csr.dis
          grep -q 'csrrsi' build/rv32im-csr/software/rv32im-csr.dis
          grep -q 'csrrci' build/rv32im-csr/software/rv32im-csr.dis

      - name: Run exact CSR DiffTest
        shell: bash
        run: |
          set -o pipefail
          make -f Makefile.rv32im-csr run RV32_NEMU_SO="$RV32_NEMU_SO" \
            2>&1 | tee build/rv32im-csr/csr-ci.log
          grep -q '^PASS: self-check exit=0 after 80 cycles, 65 committed instructions, stall-period=5, difftest=65, zicsr-shadow=19$' \
            build/rv32im-csr/csr-ci.log

      - name: Reject a mismatch on the first CSR retirement
        shell: bash
        run: |
          set +e
          AETHERCORE_RV32_DIFFTEST_INJECT_MISMATCH_AT=9 \
            build/rv32im-csr/obj/VAetherCoreRV32IMSimTop \
            build/rv32im-csr/software/rv32im-csr.bin \
            --max-cycles 20000 --self-check-exit --stall-period 5 \
            --difftest "$RV32_NEMU_SO" \
            > build/rv32im-csr/csr-negative.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q 'RV32 DiffTest mismatch after 9 matched events' \
            build/rv32im-csr/csr-negative.log
          grep -q 'x31' build/rv32im-csr/csr-negative.log

      - name: Upload CSR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rv32im-machine-csr-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/rv32-nemu-probe.log
            build/rv32-nemu-probe/evidence/
            build/rv32im-csr/
