name: RV64 PMP V1 Qualification

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/**'
      - 'src/test/scala/aethercore/RV64PmpCsrSpec.scala'
      - 'src/test/scala/aethercore/PhysicalAddressNarrowingSpec.scala'
      - 'src/test/scala/aethercore/PmpCsrFileSpec.scala'
      - 'src/test/scala/aethercore/PmpCheckerSpec.scala'
      - 'software/rv32/pmp_v1_workload.S'
      - 'software/rv32/pmp_v1_linker.ld'
      - 'tools/build_pmp_v1.sh'
      - 'Makefile.rv64im-pmp-v1'
      - '.github/workflows/rv64-pmp-v1-exploration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv64-pmp-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Shared RV32-RV64 PMP16 V1
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 35
    env:
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          if [[ -d .git ]]; then
            git clean -fd -- src/main/scala src/test/scala software tools .github/workflows || true
            git clean -f -- Makefile.rv64im-pmp-v1 || true
          else
            git init .
          fi

          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags --prune --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$TARGET_SHA" ]] || {
            echo "ERROR: exact-head checkout mismatch: expected=$TARGET_SHA actual=$actual" >&2
            exit 1
          }
          chmod +x ./mill tools/build_pmp_v1.sh
          echo "exact_head=$actual"

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Provision pinned RISC-V newlib toolchain
        shell: bash
        run: bash tools/ensure_riscv_none_elf_gcc_15_2.sh

      - name: Run focused PMP and inherited RV64 privilege contracts
        shell: bash
        run: |
          set -euo pipefail
          ./mill aethercore.test.testOnly aethercore.PhysicalAddressNarrowingSpec
          ./mill aethercore.test.testOnly aethercore.PmpCheckerSpec
          ./mill aethercore.test.testOnly aethercore.PmpCsrFileSpec
          ./mill aethercore.test.testOnly aethercore.RV64PmpCsrSpec
          ./mill aethercore.test.testOnly aethercore.RV64SupervisorModeSpec

      - name: Validate shared builder shell contract
        shell: bash
        run: bash -n tools/build_pmp_v1.sh

      - name: Run shared PMP V1 executable on RV32 and RV64
        shell: bash
        run: |
          jobs="$(nproc)"
          build="$HOME/.cache/aethercore/rv64-pmp-v1/$TARGET_SHA"
          make -j"$jobs" -f Makefile.rv64im-pmp-v1 \
            BUILD_DIR="$build" JOBS="$jobs" run-local

      - name: Run historical RV32 PMP isolation regression
        shell: bash
        run: |
          jobs="$(nproc)"
          build="$HOME/.cache/aethercore/rv32-pmp-historical/$TARGET_SHA"
          make -j"$jobs" -f Makefile.rv32imu-pmp \
            BUILD_DIR="$build" local-reference

      - name: Write qualification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## RV64 PMP V1 qualification'
            echo
            echo "- exact head: \`${TARGET_SHA}\`"
            echo '- production scope: RV64IM + Zicsr, M/S/U, bare translation + PMP16 only'
            echo '- width ownership: XLEN=64, protected PA=56, data bus=64; architectural-to-physical narrowing faults instead of aliasing discarded high bits'
            echo '- CSR geometry: RV32 pmpcfg0..3 remain 4-byte banks; RV64 pmpcfg0/pmpcfg2 are 8-byte banks'
            echo '- address geometry: RV64 pmpaddr implements architectural PA55:2, bounded by platform PA width'
            echo '- executable contract: one source compiled for RV32 and RV64, TOR machine-deny/user-RX/user-RW isolation'
            echo '- negative checks: kernel load/store, user-text store and kernel execute faults; RV64 additionally proves high-bit PA56 load/fetch aliases fault before the physical bus'
            echo '- inherited regressions: historical RV32 PMP isolation and RV64 Supervisor V1 CSR state'
          } >> "$GITHUB_STEP_SUMMARY"
