name: AetherCore Full Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-gate:
    name: Shared build and complete verification
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 90
    env:
      AETHERCORE_MILL_NO_DAEMON: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Persistent toolchain and Mill
        shell: bash
        run: bash tools/ci/full_gate.sh toolchain

      - name: Fast source and image tests
        shell: bash
        run: bash tools/ci/full_gate.sh python

      - name: Chisel unit tests
        shell: bash
        run: bash tools/ci/full_gate.sh chisel

      - name: RV64 RTL, smoke and precise pipeline regressions
        shell: bash
        run: bash tools/ci/full_gate.sh rv64-smoke

      - name: RV64 NEMU differential matrices
        shell: bash
        run: bash tools/ci/full_gate.sh rv64-difftest

      - name: Build both frozen RV32 NEMU references once
        shell: bash
        run: bash tools/ci/build_rv32_references.sh

      - name: RV32 GCC workload and 585-retirement DiffTest
        shell: bash
        run: bash tools/ci/full_gate.sh rv32-gcc

      - name: RV32 Zicsr and Machine CSR boundary
        shell: bash
        run: bash tools/ci/full_gate.sh rv32-csr

      - name: RV32 precise synchronous traps
        shell: bash
        run: bash tools/ci/full_gate.sh rv32-traps

      - name: RV32 precise MRET loops
        shell: bash
        run: bash tools/ci/full_gate.sh rv32-mret

      - name: RV32 precise Machine timer interrupts
        shell: bash
        run: bash tools/ci/full_gate.sh rv32-timer

      - name: RV32 timer-preemptive two-task scheduler
        shell: bash
        run: bash tools/ci/full_gate_scheduler.sh

      - name: RV32IMU write, get_ticks and exit syscalls
        shell: bash
        run: bash tools/ci/full_gate_user.sh

      - name: RV32IMU PMP user isolation
        shell: bash
        run: bash tools/ci/full_gate_pmp.sh

      - name: RV32IMU isolated preemptive scheduler
        shell: bash
        run: bash tools/ci/full_gate_isolated_scheduler.sh

      - name: FreeRTOS V11.3.0 preemptive queue workload
        shell: bash
        run: bash tools/ci/full_gate_freertos.sh

      - name: RV64 compiler-produced corpus
        shell: bash
        run: bash tools/ci/full_gate.sh rv64-compiled

      - name: RV64 pinned upstream workloads
        shell: bash
        run: bash tools/ci/full_gate.sh rv64-upstream

      - name: RV32IM CoreMark
        shell: bash
        run: bash tools/ci/full_gate.sh rv32-coremark

      - name: RV32IM Embench batch 1
        shell: bash
        run: bash tools/ci/full_gate.sh rv32-embench1

      - name: RV32IM Embench batch 2
        shell: bash
        run: bash tools/ci/full_gate.sh rv32-embench2

      - name: RV32IM littlefs
        shell: bash
        run: bash tools/ci/full_gate.sh rv32-littlefs

      - name: Write pipeline summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AetherCore consolidated gate'
            echo
            echo "- head: \`${GITHUB_SHA}\`"
            echo '- one checkout and one persistent toolchain setup'
            echo '- one optimized plus one single-step deterministic RV32 NEMU build'
            echo '- fast architectural gates run before long software workloads'
            echo '- Machine timer interrupts drive a frozen two-task preemptive scheduler'
            echo '- U-mode reaches M-mode through write/get_ticks/exit ECALL syscalls'
            echo '- PMP partitions kernel, user text and user data before any MMIO side effect'
            echo '- timer, syscalls, context switching and dynamic PMP isolate two U-mode tasks'
            echo '- pinned FreeRTOS V11.3.0 drives timer ticks, preemption, queues and semaphores'
            echo '- frozen hashes, exact retirement counts and negative probes remain enforced'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-full-gate-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ci/logs/
            build/rv32-nemu-abi/evidence/
            build/rv32-nemu-probe/evidence/
            build/logs/
            build/rtl/
            build/software/
            build/regressions/
            build/completion-regressions/
            build/fault-regressions/
            build/generated-difftest/
            build/rv64m-regressions/
            build/generated-rv64m/
            build/compiled-workloads/
            build/upstream-workloads/
            build/rv32/
            build/rv32im-*/
            build/rv32imu-*/
            build/freertos-qualification/evidence/
            build/freertos-qualification/aethercore-freertos.elf
            build/freertos-qualification/aethercore-freertos.bin
            build/freertos-qualification/aethercore-freertos.map
            build/freertos-qualification/aethercore-freertos.dis
            build/freertos-qualification/aethercore-freertos.attributes
            !build/**/obj/**
            !build/**/rtl/**
            !build/**/nemu/**
            !build/upstream-src/**
