name: AetherSoC V2 I-cache PPA Matrix

on:
  pull_request:
    paths:
      - '.github/workflows/v2-icache-ppa-matrix.yml'
      - 'src/main/scala/aethercore/soc/AetherCoreV2UnifiedMemorySoC.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2FpgaSoC.scala'
      - 'src/main/scala/aethercore/memory/AetherDirectMappedReadCache.scala'
      - 'src/main/scala/aethercore/ElaborateV2FpgaSoC.scala'
      - 'build.mill'
      - 'mill'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethersoc-v2-icache-ppa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synth:
    name: I-cache ${{ matrix.icache_entries }} entries ECP5 PPA
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        icache_entries: [64, 128, 256, 512]
    timeout-minutes: 60
    env:
      ICACHE_ENTRIES: ${{ matrix.icache_entries }}
      PRODUCT_IMPLEMENTED_PADDR_BITS: '32'

    steps:
      - name: Checkout exact measurement head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Select I-cache capacity candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          entries = int(os.environ["ICACHE_ENTRIES"])
          path = Path("src/main/scala/aethercore/soc/AetherCoreV2UnifiedMemorySoC.scala")
          text = path.read_text()
          needle = "    txnIdBits = clientTxnIdBits,\n    entries = 64"
          if text.count(needle) != 1:
              raise SystemExit("expected exactly one production I-cache entries=64 selection")
          if entries != 64:
              path.write_text(text.replace(
                  needle,
                  f"    txnIdBits = clientTxnIdBits,\n    entries = {entries}"
              ))
          print(f"I-cache PPA A/B entries={entries} capacity_bytes={entries * 8}")
          PY

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Install synthesis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y yosys jq
          yosys -V
          yosys -Q -p 'help ltp' | grep -q -- '-noff'

      - name: Elaborate production FPGA SoC
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          rm -rf build/fpga-synth-proxy
          ./mill aethercore.runMain aethercore.ElaborateV2FpgaSoCRV64 \
            --target-dir build/fpga-synth-proxy
          find build/fpga-synth-proxy -maxdepth 1 -name '*.sv' -print -quit | grep -q .

      - name: Map Full SoC with Yosys ECP5 proxy
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/aethersoc-icache-${ICACHE_ENTRIES}"
          rm -rf "$out"
          mkdir -p "$out"

          mapfile -t svs < <(find build/fpga-synth-proxy -maxdepth 1 -name '*.sv' -print | sort)
          test "${#svs[@]}" -gt 0
          read_cmd="read_verilog -sv -DSYNTHESIS"
          for sv in "${svs[@]}"; do
            read_cmd+=" $sv"
          done

          yosys -Q -p "$read_cmd; hierarchy -check -top AetherCoreV2FpgaSoC; synth_ecp5 -top AetherCoreV2FpgaSoC -json $out/fpga.json; stat -top AetherCoreV2FpgaSoC; flatten; ltp -noff AetherCoreV2FpgaSoC" \
            2>&1 | tee "$out/yosys.log"

          depth=$(sed -n 's/.*Longest topological path in AetherCoreV2FpgaSoC (length=\([0-9][0-9]*\)).*/\1/p' "$out/yosys.log" | tail -1)
          test -n "$depth"

          jq '[.modules["AetherCoreV2FpgaSoC"].cells[]] | length' "$out/fpga.json" > "$out/cells"
          jq '[.modules["AetherCoreV2FpgaSoC"].cells[] | select(.type == "LUT4")] | length' "$out/fpga.json" > "$out/lut4"
          jq '[.modules["AetherCoreV2FpgaSoC"].cells[] | select(.type == "TRELLIS_FF")] | length' "$out/fpga.json" > "$out/ff"
          jq '[.modules["AetherCoreV2FpgaSoC"].cells[] | select(.type == "DP16KD")] | length' "$out/fpga.json" > "$out/bram"
          jq '[.modules["AetherCoreV2FpgaSoC"].cells[] | select(.type == "TRELLIS_DPR16X4")] | length' "$out/fpga.json" > "$out/dpr"
          jq '[.modules["AetherCoreV2FpgaSoC"].cells[] | select(.type == "MULT18X18D")] | length' "$out/fpga.json" > "$out/mult"
          printf '%s\n' "$depth" > "$out/depth"
          echo "SYNTH_OUT=$out" >> "$GITHUB_ENV"

      - name: Summarize I-cache PPA point
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["SYNTH_OUT"])
          def n(name): return int((root / name).read_text().strip())
          entries = int(os.environ["ICACHE_ENTRIES"])
          summary = {
              "icache_entries": entries,
              "icache_capacity_bytes": entries * 8,
              "implemented_paddr_bits": int(os.environ["PRODUCT_IMPLEMENTED_PADDR_BITS"]),
              "cells": n("cells"),
              "lut4": n("lut4"),
              "ff": n("ff"),
              "bram_dp16kd": n("bram"),
              "distributed_ram_dpr16x4": n("dpr"),
              "mult18x18d": n("mult"),
              "logic_depth": n("depth"),
              "proxy": "Yosys synth_ecp5 mapped Full SoC"
          }
          (root / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## I-cache PPA point\n\n")
              for k, v in summary.items():
                  f.write(f"- {k}: {v}\n")
          PY

      - name: Upload PPA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethersoc-v2-icache-ppa-${{ matrix.icache_entries }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/aethersoc-icache-${{ matrix.icache_entries }}/summary.json
            ${{ runner.temp }}/aethersoc-icache-${{ matrix.icache_entries }}/yosys.log
