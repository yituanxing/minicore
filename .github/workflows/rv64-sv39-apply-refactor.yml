name: RV64 Sv39 Apply Core Refactor

on:
  push:
    branches:
      - explore/rv64-sv39-core-v1
    paths:
      - 'tools/refactor_aethercore_vm_generic.py'
      - '.github/workflows/rv64-sv39-apply-refactor.yml'
  pull_request:
    branches:
      - explore/rv64-satp-csr-v1
    paths:
      - 'tools/refactor_aethercore_vm_generic.py'
      - '.github/workflows/rv64-sv39-apply-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 5
    steps:
      - name: Checkout mutable head branch without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags --depth=2 origin refs/heads/explore/rv64-sv39-core-v1
          git checkout -B explore/rv64-sv39-core-v1 FETCH_HEAD

      - name: Apply deterministic generic VM refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/refactor_aethercore_vm_generic.py
          git diff --check
          git diff -- src/main/scala/aethercore/core/AetherCore.scala

      - name: Commit and push generated core change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/main/scala/aethercore/core/AetherCore.scala; then
            echo 'aethercore_vm_refactor=no_change'
            exit 0
          fi
          git config user.name 'LiYang Dong'
          git config user.email '119646676+yituanxing@users.noreply.github.com'
          git add src/main/scala/aethercore/core/AetherCore.scala
          git commit -m 'feat(rv64): integrate shared Sv39 datapath / 功能：接入共享 Sv39 数据通路'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/explore/rv64-sv39-core-v1
