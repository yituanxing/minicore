name: AetherSoC Physical Seams Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/soc/peripheral/AetherAclintMtimer.scala'
      - 'src/main/scala/aethercore/soc/peripheral/AetherUart16550.scala'
      - 'src/main/scala/aethercore/soc/AetherSoCPlatformFabric.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2LinuxSoC.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2UnifiedMemorySoC.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2Axi4SoC.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreV2Axi4CompatSimTop.scala'
      - 'src/test/scala/aethercore/AetherAclintMtimerSpec.scala'
      - 'src/test/scala/aethercore/AetherUart16550Spec.scala'
      - 'src/test/scala/aethercore/AetherSoCPlatformFabricSpec.scala'
      - 'tests_py/test_v2_soc_physical_seams.py'
      - '.github/workflows/v2-soc-physical-seams.yml'

permissions:
  contents: read

concurrency:
  group: aethersoc-physical-seams-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Prove physical timing and UART seams
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Check physical-seam source contract
        run: python3 -m unittest tests_py.test_v2_soc_physical_seams -v

      - name: Prove MTIMER, UART and fabric behavior
        run: |
          chmod +x mill
          ./mill aethercore.test.testOnly aethercore.AetherAclintMtimerSpec
          ./mill aethercore.test.testOnly aethercore.AetherUart16550Spec
          ./mill aethercore.test.testOnly aethercore.AetherSoCPlatformFabricSpec

      - name: Elaborate legacy and FPGA-facing SoC boundaries
        run: |
          rm -rf build/physical-seams-unified build/physical-seams-axi
          ./mill aethercore.runMain aethercore.ElaborateV2UnifiedMemorySoCRV64 \
            --target-dir build/physical-seams-unified
          ./mill aethercore.runMain aethercore.ElaborateV2Axi4SoCRV64 \
            --target-dir build/physical-seams-axi
          find build/physical-seams-unified -maxdepth 1 -name '*.sv' -print -quit | grep -q .
          find build/physical-seams-axi -maxdepth 1 -name '*.sv' -print -quit | grep -q .
