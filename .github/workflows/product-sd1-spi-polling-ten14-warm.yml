          path: build/product-sd1-spi-polling-relay/2952m/
      - name: Preserve every completed polling stage log and SD counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-2752m-to-2952m-evidence-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/product-sd1-spi-polling-relay/2772m/.polling-ready
            build/product-sd1-spi-polling-relay/2772m/card-progress.json
            build/product-sd1-spi-polling-relay/2772m/save.log
            build/product-sd1-spi-polling-relay/2792m/.polling-ready
            build/product-sd1-spi-polling-relay/2792m/card-progress.json
            build/product-sd1-spi-polling-relay/2792m/save.log
            build/product-sd1-spi-polling-relay/2812m/.polling-ready
