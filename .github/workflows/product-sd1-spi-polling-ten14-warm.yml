          grep -Fxq 'boot_cycles=2932000000' build/product-sd1-spi-polling-relay/2932m/.polling-ready
      - name: Upload authenticated 2932M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-2932m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/2932m/
      - name: Execute authentic polling Product RTL 2932M to 2952M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/2932m 2952000000
          grep -Fxq 'boot_cycles=2952000000' build/product-sd1-spi-polling-relay/2952m/.polling-ready
      - name: Upload authenticated 2952M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
