name: AetherCore Product G5 Real Debian RV64GC Dynamic PID1

# A real Debian userspace can require billions of slow RTL cycles. Full Product
# Debian qualification is manual-only; source edits must never queue it.
on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: First qualify a short same-cycle Debian Top A/B; full PID1 is explicitly opt-in
        required: true
        type: choice
        options: [short-ab, full]
        default: short-ab
      verilator_version:
        description: Full runs select 5.024 or 5.054 (the latter self-qualifies by bounded Debian Top A/B)
        required: true
        type: choice
        options: ['5.024', '5.054']
        default: '5.024'
      settle_mode:
        description: Fixed reference or Product-qualified adaptive memory settle
        required: true
        type: choice
        options: [reference, adaptive]
        default: reference
      debian_stage:
        description: D1 glibc PID1, D2 native processes/filesystems, or D3 full native Debian login prompt
        required: true
        type: choice
        options: [d1, d2, d3]
        default: d2
      full_rootfs_archive_url:
        description: D3 only; explicit HTTPS URL of a complete native Debian riscv64 tar archive
        required: false
        type: string
      full_rootfs_sha256:
        description: D3 only; exact 64-digit SHA256 of that archive
        required: false
        type: string
  # This workflow exists only on the Product PR branch until merged. GitHub
  # cannot workflow_dispatch a workflow absent from the default branch; a
  # specifically named human-added label is the PR-safe manual entry point.
  # product-g5-short-ab: D2 + independent 5.024/5.054 30M-cycle A/B only.
  # product-g5-longrun: explicit ONE D2 late-boot forensic run with savable
  # 5.054, one cold prefix and a restartable full-RTL continuation. This path
  # never executes either performance A/B or the throwaway non-savable model.
  # product-g5-resume-artifact: restore the SHA-checked 900M Product RTL/DDR
  # checkpoint from run 42028338206 and execute ONLY 50M additional cycles.
  # This exact-source job refuses changed RTL/host/firmware; no cold run.
  # D3 requires URL and SHA inputs and therefore remains unavailable until
  # this workflow reaches main (or a separately qualified artifact bridge).
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: aethercore-product-g5-debian-${{ github.event.pull_request.number || github.ref }}
  # A human chooses whether to stop an already running milestone.
  cancel-in-progress: false

jobs:
  product-debian-rv64gc:
    name: Product SmallOoO RV64GC bounded A/B or manual Debian D1/D2/D3
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       (github.event.label.name == 'product-g5-short-ab' ||
        github.event.label.name == 'product-g5-longrun' ||
        github.event.label.name == 'product-g5-resume-artifact'))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      # A persisted Verilator checkpoint is tied to byte-identical source.
      TARGET_SHA: ${{ github.event.label.name == 'product-g5-resume-artifact' && '99a5c86e99f52ed12f95b304635d77613c9505c4' || github.event.pull_request.head.sha || github.sha }}
      AETHERCORE_G5_RESUME_ONLY: ${{ github.event.label.name == 'product-g5-resume-artifact' && '1' || '0' }}
      AETHERCORE_G5_FORENSIC: ${{ github.event_name == 'pull_request' && (github.event.label.name == 'product-g5-longrun' || github.event.label.name == 'product-g5-resume-artifact') && '1' || '0' }}
      AETHERCORE_G5_RUN_MODE: ${{ github.event.label.name == 'product-g5-short-ab' && 'short-ab' || inputs.run_mode || 'full' }}
      AETHERCORE_VERILATOR_VERSION: ${{ (github.event.label.name == 'product-g5-short-ab' || github.event.label.name == 'product-g5-longrun' || github.event.label.name == 'product-g5-resume-artifact' || inputs.run_mode == 'short-ab') && '5.054' || inputs.verilator_version || '5.024' }}
      SIM_SETTLE_MODE: ${{ inputs.settle_mode || 'reference' }}
      RV64_DEBIAN_STAGE: ${{ inputs.debian_stage || 'd2' }}
      # Keep short same-cycle A/B concise; a consciously selected full boot
      # records initcall entry/return so a late-boot stall is not anonymous.
      RV64_DEBIAN_INITCALL_TRACE: ${{ (github.event.label.name == 'product-g5-longrun' || github.event.label.name == 'product-g5-resume-artifact' || inputs.run_mode == 'full') && '1' || '0' }}
      RV64_DEBIAN_FULL_ROOTFS_URL: ${{ inputs.full_rootfs_archive_url }}
      RV64_DEBIAN_FULL_ROOTFS_SHA256: ${{ inputs.full_rootfs_sha256 }}
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      RV64_LINUX_JOBS: '4'

    steps:
      - name: Checkout exact Product commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true

      - name: Reject unsupported or unqualified simulation modes before heavy setup
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AETHERCORE_G5_RUN_MODE" == short-ab || "$AETHERCORE_G5_RUN_MODE" == full ]] || {
            echo 'unknown G5 run mode' >&2; exit 20;
          }
          [[ "$SIM_SETTLE_MODE" == reference &&
             ( "$AETHERCORE_VERILATOR_VERSION" == 5.024 || "$AETHERCORE_VERILATOR_VERSION" == 5.054 ) ]] || {
            echo 'G5 only allows 5.024/5.054 reference; adaptive requires an independent Debian Top proof' >&2
            exit 20
          }
          if [[ "$AETHERCORE_G5_RUN_MODE" == short-ab ]]; then
            [[ "$AETHERCORE_VERILATOR_VERSION" == 5.054 ]] || exit 20
            echo 'PRODUCT_G5_SHORT_AB_ONLY: no full PID1 or distribution longrun in this job'
          fi

      - name: Reject unsupported or underspecified Debian stage before heavy work
        shell: bash
        run: |
          set -euo pipefail
          case "$RV64_DEBIAN_STAGE" in d1|d2) ;; d3)
            [[ "$RV64_DEBIAN_FULL_ROOTFS_URL" == https://* ]] || {
              echo 'D3 requires a full native Debian riscv64 HTTPS rootfs archive URL' >&2
              exit 17
            }
            [[ "$RV64_DEBIAN_FULL_ROOTFS_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || {
              echo 'D3 requires an exact 64-digit rootfs SHA256' >&2
              exit 18
            }
            ;; *) echo "unknown Debian stage: $RV64_DEBIAN_STAGE" >&2; exit 19 ;;
          esac

      - name: Install fixed RTL and upstream Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev bison flex bc \
            libssl-dev libelf-dev build-essential libreadline-dev pkg-config \
            curl xz-utils git python3 openjdk-17-jdk-headless \
            device-tree-compiler dwarves qemu-user
          docker version

      - name: Restore selected pinned Verilator cache
        id: verilator-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/verilator-5.054
            ~/.cache/aethercore/toolchains/src/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
            ~/.cache/aethercore/toolchains/build/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-${{ env.AETHERCORE_VERILATOR_VERSION }}-v2-${{ hashFiles('tools/ensure_verilator_5_024.sh', 'tools/ensure_verilator_5_054.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-${{ env.AETHERCORE_VERILATOR_VERSION }}-v2-

      - name: Restore fixed RV64 GCC cache from G4
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/bootlin-riscv64-lp64d-glibc-stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv64-lp64d--glibc--stable-2024.05-1.tar.xz
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-13.3-v1-${{ hashFiles('tools/ensure_riscv64_linux_gcc_13_3.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-13.3-v1-

      - name: Restore fixed Scala dependencies from G4
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore qualified upstream Linux and OpenSBI from G4
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/rv64/linux
            ~/.cache/aethercore/rv64/linux-build
            ~/.cache/aethercore/l32/opensbi
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v2-${{ hashFiles('software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env', 'tools/ci/rv64_linux_early_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v2-

      - name: Provision selected pinned Verilator and frozen GCC
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          chmod +x ./mill tools/ensure_verilator_5_024.sh tools/ensure_verilator_5_054.sh \
            tools/ensure_riscv64_linux_gcc_13_3.sh
          # The generic 5.024 installer honors AETHERCORE_VERILATOR_VERSION.
          # In short A/B this job is 5.054; pin the reference explicitly or
          # the next line just installs 5.054 twice and preflight fails.
          if [[ "$AETHERCORE_G5_FORENSIC" != 1 ]]; then
            AETHERCORE_VERILATOR_VERSION=5.024 bash tools/ensure_verilator_5_024.sh
          fi
          if [[ "$AETHERCORE_VERILATOR_VERSION" == 5.054 ]]; then
            bash tools/ensure_verilator_5_054.sh
          fi
          bash tools/ensure_riscv64_linux_gcc_13_3.sh
          toolchain_root="${AETHERCORE_TOOLCHAIN_CACHE:-$HOME/.cache/aethercore/toolchains}"
          verilator_bin="$toolchain_root/verilator-$AETHERCORE_VERILATOR_VERSION/bin/verilator"
          [[ -x "$verilator_bin" ]] || { echo 'Pinned selected Product G5 Verilator missing' >&2; exit 21; }
          case "$AETHERCORE_VERILATOR_VERSION" in
            5.024) expected_revision=522bead374d6b7b2adb316304126e5361b18bcf1 ;;
            5.054) expected_revision=bbb60a403932a9f695cb6ff001ceb73de6ad9234 ;;
            *) exit 22 ;;
          esac
          [[ "$(< "$toolchain_root/verilator-$AETHERCORE_VERILATOR_VERSION/.aethercore-source-revision")" == "$expected_revision" ]] || {
            echo 'Pinned Product G5 Verilator source revision mismatch' >&2
            exit 22
          }
          echo "PRODUCT_VERILATOR_BIN=$verilator_bin" >> "$GITHUB_ENV"

      - name: Save selected Verilator toolchain for future Product runs
        if: steps.verilator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/verilator-5.054
            ~/.cache/aethercore/toolchains/src/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
            ~/.cache/aethercore/toolchains/build/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
          key: ${{ steps.verilator-cache.outputs.cache-primary-key }}

      - name: Build qualified unchanged upstream Linux baseline
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/rv64_linux_early_build.sh
          grep -qx 'RV64_LINUX_EARLY_BUILD_RESULT: status=PASS' \
            build/rv64-linux-early/result.txt

      - name: Require independently sourced full Debian rootfs for D3
        if: env.RV64_DEBIAN_STAGE == 'd3'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RV64_DEBIAN_FULL_ROOTFS_URL" == https://* ]] || {
            echo 'D3 explicitly requires an HTTPS full Debian riscv64 rootfs archive; no slim-rootfs fallback' >&2
            exit 17
          }
          [[ "$RV64_DEBIAN_FULL_ROOTFS_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || {
            echo 'D3 requires the exact full rootfs archive SHA256' >&2
            exit 18
          }
          archive="$RUNNER_TEMP/aethercore-debian-d3-full-rootfs.tar"
          curl --fail --location --show-error --silent --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "$RV64_DEBIAN_FULL_ROOTFS_URL" -o "$archive"
          printf '%s  %s\n' "$RV64_DEBIAN_FULL_ROOTFS_SHA256" "$archive" | sha256sum -c -
          echo "RV64_DEBIAN_FULL_ROOTFS_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Provision selected native Debian riscv64 rootfs and verify LP64D dynamic ELF
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/rv64_debian_rootfs_build.sh
          grep -qx 'RV64_DEBIAN_ROOTFS_BUILD_RESULT: status=PASS' \
            build/rv64-debian-rootfs/result.txt

      - name: Cheap Debian and D2 native-oracle preflight before Product RTL
        shell: bash
        run: |
          set -euo pipefail
          rootfs="$(sed -n 's/^rootfs=//p' build/rv64-debian-rootfs/result.txt | head -n 1)"
          qemu-riscv64 -L "$rootfs" "$rootfs/bin/dash" -c \
            'printf "DEBIAN_QEMU_DYNAMIC_SHELL_OK\n"'
          arch="$(qemu-riscv64 -L "$rootfs" "$rootfs/usr/bin/dpkg" --print-architecture)"
          test "$arch" = riscv64
          echo 'DEBIAN_QEMU_LP64D_ORACLE_PASS: unmodified Debian ELF and loader ran under QEMU'
          if [[ "$RV64_DEBIAN_STAGE" == d2 ]]; then
            # Product D2 cannot spend ~1.8 billion RTL cycles merely to learn
            # that a cross-glibc binary, F/D, pthread/futex or mmap probe is
            # broken. QEMU-user is a host/kernel compatibility oracle ONLY;
            # it does not qualify the Product RTL implementation.
            probe="$rootfs/usr/local/libexec/aethercore-d2-native-probe"
            test -x "$probe"
            probe_log="$RUNNER_TEMP/aethercore-product-d2-qemu-native.log"
            qemu-riscv64 -L "$rootfs" "$probe" > "$probe_log" 2>&1 || {
              cat "$probe_log" >&2
              echo 'D2 native probe fails in QEMU-user: refusing expensive RTL' >&2
              exit 31
            }
            grep -Fxq 'AETHERCORE_D2_NATIVE_FP_THREADS_FUTEX_VM_OK' "$probe_log" || {
              cat "$probe_log" >&2
              echo 'D2 native probe marker missing under QEMU-user' >&2
              exit 32
            }
            echo 'DEBIAN_D2_NATIVE_QEMU_ORACLE_PASS: native LP64D F/D, threads, futex, VM and signals'
          fi
          if [[ "$RV64_DEBIAN_STAGE" == d3 ]]; then
            # Do NOT qemu-user launch a real PID1: boot/service management
            # belongs to the actual kernel. Just reject invalid native ELF
            # or missing guest interpreter before the huge RTL run.
            for path in sbin/init usr/sbin/agetty usr/bin/login; do
              binary="$rootfs/$path"
              if [[ ! -x "$binary" ]]; then
                case "$path" in
                  usr/sbin/agetty) binary="$rootfs/sbin/agetty" ;;
                  usr/bin/login) binary="$rootfs/bin/login" ;;
                esac
              fi
              test -x "$binary"
              metadata="$(readelf -h -l -A "$binary")"
              grep -q 'Class:[[:space:]]*ELF64' <<< "$metadata"
              grep -q 'Machine:[[:space:]]*RISC-V' <<< "$metadata"
              grep -q 'double-float ABI' <<< "$metadata"
              interpreter="$(sed -n 's/^.*Requesting program interpreter: \([^]]*\)].*$/\1/p' <<< "$metadata")"
              if [[ -n "$interpreter" ]]; then
                [[ "$interpreter" == /* && -f "$rootfs$interpreter" ]] || {
                  echo "D3 native ELF $binary references missing guest interpreter $interpreter" >&2
                  exit 33
                }
              fi
            done
            echo 'DEBIAN_D3_NATIVE_ELF_INTERPRETER_PREFLIGHT_PASS: init/getty/login identity only; no init launched'
          fi

      - name: Build real RV64GC FPU/C Linux, DTB and OpenSBI payload
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/rv64_debian_linux_build.sh
          bash tools/ci/rv64_debian_payload_build.sh
          grep -qx 'RV64_DEBIAN_PAYLOAD_BUILD_RESULT: status=PASS' \
            build/rv64-debian-boot/result.txt
          if [[ "$RV64_DEBIAN_INITCALL_TRACE" == 1 ]]; then
            grep -Fq 'initcall_debug loglevel=8' build/rv64-debian-boot/result.txt || {
              echo 'Full G5 diagnosis lost initcall trace bootargs' >&2
              exit 35
            }
          fi
          payload=build/rv64-debian-boot/opensbi/platform/generic/firmware/fw_payload.bin
          test -s "$payload"
          bytes="$(stat -c%s "$payload")"
          if (( bytes > 268435456 )); then
            echo "Product D${RV64_DEBIAN_STAGE#d} payload is ${bytes} bytes; simulator RAM is limited to 256MiB (268435456 bytes)" >&2
            echo 'Refuse oversized native initramfs now, before Product RTL model build or long-run' >&2
            exit 34
          fi

      - name: Download exact prior 900M G5 RTL/DDR state (no cold execution)
        if: env.AETHERCORE_G5_RESUME_ONLY == '1'
        uses: actions/download-artifact@v4
        with:
          run-id: 42028338206
          name: aethercore-product-g5-debian-42028338206
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/g5-900m-source-artifact

      - name: Verify and stage original 900M same-image Product checkpoint
        if: env.AETHERCORE_G5_RESUME_ONLY == '1'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == 99a5c86e99f52ed12f95b304635d77613c9505c4 ]] || {
            echo 'G5 resume must use the exact historic code, never current mutable PR head' >&2; exit 41;
          }
          staged="$RUNNER_TEMP/g5-900m-source-artifact/minicore/minicore/build/product-g5-long-forensic"
          target="$GITHUB_WORKSPACE/build/product-g5-long-forensic"
          [[ -d "$staged" && ! -L "$staged" && ! -e "$target" ]] || {
            echo 'Original 900M artifact layout differs, or destination already exists' >&2; exit 42;
          }
          [[ -z "$(find "$staged" -type l -print -quit)" ]] || {
            echo 'Refuse symlinks in imported 900M checkpoint evidence' >&2; exit 42;
          }
          for required in identity.txt pre.sha256 persistent.pre.rtl persistent.pre.host save.log restore.log; do
            [[ -s "$staged/$required" ]] || { echo "Missing original checkpoint $required" >&2; exit 43; }
          done
          for expected in \
              'model_sha256=aa35c80024238420bea3976db677db2e0ef028aad9800482926b926e50155b71' \
              'firmware_sha256=d525de6a58422de93da6de5312d38867611153da94c580bca31f90ebf13eff2c' \
              'linux_image_sha256=02f054667dd67028545c20929b1e332d1a0ff358280ab431ce479f87f72345af' \
              'rootfs_result_sha256=7b664594a266914585d2621e6ec1e918b60721ee6c5ba7e810cebc9e70f9edb5' \
              'vmlinux_sha256=6f5afbdc6fabd14819219d4928289c163d73f3aee9b38c72c4c866b1c50c5c69' \
              'checkpoint_cycles=900000000' \
              'top=AetherCoreProductDebianRV64SimTop'; do
            grep -Fxq "$expected" "$staged/identity.txt" || {
              echo "Original G5 checkpoint identity mismatch: $expected" >&2; exit 44;
            }
          done
          [[ "$(stat -c%s "$staged/persistent.pre.host")" -gt 268435456 &&
             "$(head -c8 "$staged/persistent.pre.host")" == AETG5CP1 ]] || {
            echo 'Imported 900M host RAM state damaged' >&2; exit 45;
          }
          (cd "$staged" && sha256sum --check --status pre.sha256) || {
            echo 'Imported 900M RTL+DDR digest mismatch' >&2; exit 46;
          }
          [[ "$(sha256sum build/rv64-debian-boot/opensbi/platform/generic/firmware/fw_payload.bin | awk '{print $1}')" == d525de6a58422de93da6de5312d38867611153da94c580bca31f90ebf13eff2c &&
             "$(sha256sum build/rv64-debian-linux/obj/vmlinux | awk '{print $1}')" == 6f5afbdc6fabd14819219d4928289c163d73f3aee9b38c72c4c866b1c50c5c69 ]] || {
            echo 'Current Product firmware/vmlinux differs from archived 900M binary' >&2; exit 47;
          }
          mkdir -p "$(dirname "$target")"
          mv "$staged" "$target"
          echo 'PRODUCT_G5_RESTORED_900M_ARTIFACT_PASS code_sha=99a5c86 checkpoint_sha256=PASS rerun_cold=0'

      - name: Fingerprint exact Product Debian RTL and simulator inputs
        if: env.AETHERCORE_G5_FORENSIC != '1'
        id: model-key
        shell: bash
        run: |
          set -euo pipefail
          flags="-std=c++20 -O3 -march=native -DAETHERCORE_PRODUCT_DEBIAN -I$GITHUB_WORKSPACE/sim/product_rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim"
          key="$(bash tools/ci/product_sim_cache.sh fingerprint "$RUNNER_TEMP/aethercore-product-g5-debian/model" AetherCoreProductDebianRV64SimTop aethercore.sim.ElaborateProductDebianRV64SimTop "$flags")"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore identical compiled Product Debian RTL model
        if: env.AETHERCORE_G5_FORENSIC != '1'
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/aethercore-product-g5-debian/model
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-g5-${{ steps.model-key.outputs.key }}

      - name: Prepare or verify exact Product Debian RTL simulator
        if: env.AETHERCORE_G5_FORENSIC != '1'
        shell: bash
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/aethercore-product-g5-debian/model"
          mkdir -p "$build"
          flags="-std=c++20 -O3 -march=native -DAETHERCORE_PRODUCT_DEBIAN -I$GITHUB_WORKSPACE/sim/product_rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim"
          cache_args=("$build" AetherCoreProductDebianRV64SimTop aethercore.sim.ElaborateProductDebianRV64SimTop "$flags")
          if [[ '${{ steps.model-cache.outputs.cache-hit }}' == 'true' ]]; then
            bash tools/ci/product_sim_cache.sh verify "${cache_args[@]}"
          else
            make -f Makefile.l32-linux-boot BUILD_DIR="$build" \
              TOP=AetherCoreProductDebianRV64SimTop \
              ELABORATE_MAIN=aethercore.sim.ElaborateProductDebianRV64SimTop \
              VERILATOR="$PRODUCT_VERILATOR_BIN -LDFLAGS -ldl" JOBS=4 \
              SIM_SETTLE_MODE=reference SIM_CXXFLAGS="$flags" sim
            bash tools/ci/product_sim_cache.sh record "${cache_args[@]}"
          fi

      - name: Save qualified compiled Product Debian model before slow execution
        if: env.AETHERCORE_G5_FORENSIC != '1' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/aethercore-product-g5-debian/model
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

      - name: Fingerprint independent 5.024 Debian Top baseline model
        if: env.AETHERCORE_VERILATOR_VERSION == '5.054' && env.AETHERCORE_G5_FORENSIC != '1'
        id: baseline-key
        shell: bash
        run: |
          set -euo pipefail
          flags="-std=c++20 -O3 -march=native -DAETHERCORE_PRODUCT_DEBIAN -I$GITHUB_WORKSPACE/sim/product_rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim"
          baseline="$RUNNER_TEMP/aethercore-product-g5-debian/baseline-5.024"
          key="$(AETHERCORE_VERILATOR_VERSION=5.024 bash tools/ci/product_sim_cache.sh fingerprint \
            "$baseline" AetherCoreProductDebianRV64SimTop aethercore.sim.ElaborateProductDebianRV64SimTop "$flags")"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore exact independent 5.024 Debian Top reference model
        if: env.AETHERCORE_VERILATOR_VERSION == '5.054' && env.AETHERCORE_G5_FORENSIC != '1'
        id: baseline-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/aethercore-product-g5-debian/baseline-5.024
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-g5-baseline-${{ steps.baseline-key.outputs.key }}

      - name: Qualify 5.054 on the identical native Debian RTL for bounded 30M cycles
        if: env.AETHERCORE_VERILATOR_VERSION == '5.054' && env.AETHERCORE_G5_FORENSIC != '1'
        shell: bash
        env:
          AETHERCORE_ALLOW_PRODUCT_G5_SHORT_AB: '1'
          AETHERCORE_G5_AB_BASELINE_MODEL: ${{ runner.temp }}/aethercore-product-g5-debian/baseline-5.024
          AETHERCORE_G5_AB_CANDIDATE_MODEL: ${{ runner.temp }}/aethercore-product-g5-debian/model
          AETHERCORE_G5_AB_CYCLES: '30000000'
          AETHERCORE_G5_AB_WALL_SECONDS: '600'
        run: |
          set -euo pipefail
          bash tools/ci/product_g5_short_ab_selftest.sh
          bash tools/ci/product_g5_short_ab.sh preflight
          bash tools/ci/product_g5_short_ab.sh run
          grep -Fxq 'qualification=PRODUCT_G5_DEBIAN_TOP_5054_REFERENCE_SAME_CYCLE_NOT_PID1_PASS' \
            build/product-g5-short-ab/qualification.txt
          cat build/product-g5-short-ab/qualification.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Cache verified 5.024 Debian Top baseline before any full run
        if: env.AETHERCORE_VERILATOR_VERSION == '5.054' && env.AETHERCORE_G5_FORENSIC != '1' && steps.baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/aethercore-product-g5-debian/baseline-5.024
          key: ${{ steps.baseline-cache.outputs.cache-primary-key }}

      - name: Run selected real Debian D1/D2/D3 userspace milestone on Product RV64GC
        if: env.AETHERCORE_G5_RUN_MODE == 'full' && env.AETHERCORE_G5_FORENSIC != '1'
        shell: bash
        env:
          # Full runs are expensive: after the known late-initcall banner,
          # capture the interrupted (pre-IRQ) PC and stop after 100M silent
          # cycles rather than burning another ~700M with no new evidence.
          AETHERCORE_G5_STALL_WATCHDOG_CYCLES: '100000000'
        run: |
          set -euo pipefail
          build="$RUNNER_TEMP/aethercore-product-g5-debian/model"
          flags="-std=c++20 -O3 -march=native -DAETHERCORE_PRODUCT_DEBIAN -I$GITHUB_WORKSPACE/sim/product_rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim"
          bash tools/ci/product_sim_cache.sh verify "$build" AetherCoreProductDebianRV64SimTop aethercore.sim.ElaborateProductDebianRV64SimTop "$flags"
          case "$RV64_DEBIAN_STAGE" in
            d1) milestone='DEBIAN_RISCV64_GLIBC_PID1_OK' ;;
            d2) milestone='DEBIAN_RISCV64_D2_PROCESSES_FS_SIGNALS_OK' ;;
            d3) milestone='login:' ;;
            *) echo "unknown Debian stage $RV64_DEBIAN_STAGE" >&2; exit 19 ;;
          esac

          make -f Makefile.l32-linux-boot \
            BUILD_DIR="$build" TOP=AetherCoreProductDebianRV64SimTop \
            ELABORATE_MAIN=aethercore.sim.ElaborateProductDebianRV64SimTop \
            FW_BIN=build/rv64-debian-boot/opensbi/platform/generic/firmware/fw_payload.bin \
            JOBS=4 MAX_CYCLES=1800000000 \
            MILESTONE="$milestone" \
            MIN_INTERRUPTS=0 MIN_STIP=0 MIN_SEIP=0 \
            REQUIRE_LAYERED_COMPRESSED=1 PROGRESS_INTERVAL_CYCLES=10000000 \
            VERILATOR="$PRODUCT_VERILATOR_BIN -LDFLAGS -ldl" SIM_SETTLE_MODE=reference SIM_CXXFLAGS="$flags" \
            run-existing
          log="$build/logs/boot-probe.log"
          grep -Fq 'Linux version 6.6.143' "$log"
          grep -q '^L32_LAYERED_COMPRESSED_PASS ' "$log"
          grep -q '^L32_RUNTIME_MILESTONE_PASS ' "$log"
          case "$RV64_DEBIAN_STAGE" in
            d1)
              grep -Fq 'AETHERCORE_DEBIAN_DYNAMIC_INIT_START' "$log"
              grep -Fq 'DEBIAN_RISCV64_GLIBC_PID1_OK' "$log"
              echo 'PRODUCT_G5_DEBIAN_D1_DYNAMIC_PID1_PASS'
              ;;
            d2)
              grep -Fq 'AETHERCORE_DEBIAN_D2_START' "$log"
              grep -Fq 'AETHERCORE_D2_NATIVE_FP_THREADS_FUTEX_VM_OK' "$log"
              grep -Fq 'DEBIAN_RISCV64_D2_PROCESSES_FS_SIGNALS_OK' "$log"
              echo 'PRODUCT_G5_DEBIAN_D2_NATIVE_PROCESSES_FS_SIGNALS_PASS'
              ;;
            d3)
              grep -Fq 'AETHERCORE_DEBIAN_D3_NATIVE_INIT_HANDOFF' "$log"
              grep -Eq '(^|[[:space:]])login:' "$log"
              echo 'PRODUCT_G5_DEBIAN_D3_NATIVE_LOGIN_PROMPT_PASS: native /sbin/init and serial-getty reached prompt; login authentication remains separate'
              ;;
          esac

      - name: Run one restartable G5 D2 late-boot forensic session without performance A/B
        if: env.AETHERCORE_G5_FORENSIC == '1'
        shell: bash
        env:
          AETHERCORE_ALLOW_PRODUCT_G5_PERSISTENT_CHECKPOINT: '1'
          AETHERCORE_ALLOW_PRODUCT_G5_LONG_DIAGNOSE: '1'
          AETHERCORE_G5_LONG_CHECKPOINT_CYCLES: '900000000'
          AETHERCORE_G5_LONG_TOTAL_CYCLES: '1800000000'
          # The archived snapshot already contains 188.6M cycles of UART
          # silence. The original host binary has no rearm knob; changing it
          # would invalidate model_sha and strand the checkpoint. Permit 50M
          # NEW cycles, bounded below the historic + 300M silence threshold.
          AETHERCORE_G5_LONG_REPLAY_CYCLES: ${{ env.AETHERCORE_G5_RESUME_ONLY == '1' && '50000000' || '900000000' }}
          AETHERCORE_G5_STALL_WATCHDOG_CYCLES: ${{ env.AETHERCORE_G5_RESUME_ONLY == '1' && '300000000' || '100000000' }}
          AETHERCORE_G5_DIAGNOSTIC_OUTPUT_SUFFIX: ${{ env.AETHERCORE_G5_RESUME_ONLY == '1' && 'resume2' || 'diagnostic' }}
          PRODUCT_G5_LONG_PROOF_DIR: ${{ github.workspace }}/build/product-g5-long-forensic
        run: |
          set -euo pipefail
          [[ "$RV64_DEBIAN_STAGE" == d2 && "$AETHERCORE_VERILATOR_VERSION" == 5.054 &&
             "$SIM_SETTLE_MODE" == reference && "$RV64_DEBIAN_INITCALL_TRACE" == 1 ]] || {
            echo 'Forensic path only supports trace-enabled D2/5.054/reference' >&2
            exit 20
          }
          mkdir -p "$PRODUCT_G5_LONG_PROOF_DIR"
          rc=0
          bash tools/ci/product_checkpoint_g5_short.sh diagnose || rc=$?
          log="$PRODUCT_G5_LONG_PROOF_DIR/${AETHERCORE_G5_DIAGNOSTIC_OUTPUT_SUFFIX}.log"
          if [[ -s "$log" ]]; then
            grep -E '^PRODUCT_G5_RESUME_DIAGNOSTIC_RESULT ' \
              "$log" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          if [[ "$AETHERCORE_G5_RESUME_ONLY" == 1 ]]; then
            [[ "$rc" == 0 || "$rc" == 2 ]] || {
              echo "PRODUCT_G5_RESTORED_900M_PROBE_FAILED status=$rc" >&2; exit "$rc";
            }
            grep -Eq '^PRODUCT_G5_RESUME_DIAGNOSTIC_RESULT status=(0|2) ' "$log"
            test -s "$PRODUCT_G5_LONG_PROOF_DIR/resume2.sha256"
            echo "PRODUCT_G5_900M_TO_950M_RESTORED_RTL_PROBE_PASS cold_replayed=0 cycles_added=50000000 pid1_qualified=$([[ $rc == 0 ]] && echo 1 || echo 0)"
            exit 0
          fi
          if [[ "$rc" != 0 ]]; then
            echo "PRODUCT_G5_FORENSIC_NOT_PID1 result_rc=$rc; preserving cold/continued RTL+DDR checkpoints for exact PC analysis" >&2
            exit "$rc"
          fi
          grep -Eq '^PRODUCT_G5_RESUME_DIAGNOSTIC_RESULT status=0 ' \
            "$PRODUCT_G5_LONG_PROOF_DIR/diagnostic.log"
          echo 'PRODUCT_G5_DEBIAN_D2_NATIVE_PID1_FORENSIC_PASS: exact RTL+DDR replay reached Debian D2 milestone'

      - name: Symbolize captured exception, interrupted and retired PCs using this run's exact vmlinux
        if: always() && env.AETHERCORE_G5_FORENSIC == '1'
        shell: bash
        env:
          AETHERCORE_G5_DIAGNOSTIC_OUTPUT_SUFFIX: ${{ env.AETHERCORE_G5_RESUME_ONLY == '1' && 'resume2' || 'diagnostic' }}
        run: |
          set -euo pipefail
          proof="$GITHUB_WORKSPACE/build/product-g5-long-forensic"
          logfile="$proof/${AETHERCORE_G5_DIAGNOSTIC_OUTPUT_SUFFIX:-diagnostic}.log"
          if [[ -s "$logfile" &&
                -s build/rv64-debian-linux/obj/vmlinux &&
                -s build/rv64-debian-linux/obj/System.map ]]; then
            python3 tools/ci/product_g5_forensic_symbols.py \
              --trace "$logfile" \
              --system-map build/rv64-debian-linux/obj/System.map \
              --vmlinux build/rv64-debian-linux/obj/vmlinux \
              > "$proof/${AETHERCORE_G5_DIAGNOSTIC_OUTPUT_SUFFIX:-diagnostic}-pc-symbols.txt" || {
                echo 'G5 exact-kernel symbolization unavailable; raw trace and vmlinux are retained' >&2
                exit 0
              }
            sed -n '1,36p' "$proof/${AETHERCORE_G5_DIAGNOSTIC_OUTPUT_SUFFIX:-diagnostic}-pc-symbols.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'G5 forensic trace or matching kernel symbols absent; no PC attribution attempted'
          fi

      - name: Preserve artifact identity, resolved kernel config and boot trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-product-g5-debian-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/rv64-debian-rootfs/result.txt
            build/rv64-debian-rootfs/evidence/*
            build/rv64-debian-linux/result.txt
            build/rv64-debian-linux/evidence/*
            build/rv64-debian-linux/obj/vmlinux
            build/rv64-debian-linux/obj/System.map
            build/rv64-debian-boot/result.txt
            build/rv64-debian-boot/evidence/*
            build/product-g5-short-ab/qualification.txt
            build/product-g5-short-ab/*.state
            build/product-g5-short-ab/*.run.log
            build/product-g5-long-forensic/**
            build/product-g5-persistent-checkpoint/logs/*.log
            ${{ runner.temp }}/aethercore-product-g5-debian/model/logs/*.log
