name: INERT PR379 V6 20B Host model qualification then single 20M technical trial
# This draft FIRST builds a new V6 20B Host model and proves that its
# 14952M->14972M true RTL replay matches signed V5 state byte-for-byte, THEN
# migrates the original 14992M checkpoint at zero guest cycles, THEN may run
# one real 14992M->15012M trial. No full 5B permission or Debian PASS.
# Formal long-run remains independently gated and disabled.
# Must be separately reviewed and installed in PR#379 only AFTER official V5 finishes.
# Reuses PR#379-scoped original seed/diag cache; never uploads password-bearing SD.
# PR-label-only / no workflow_dispatch, workflow_run, push, or write privilege.
'on':
  pull_request:
    types: [labeled]
permissions:
  contents: read
  actions: read
concurrency:
  group: sd1-v6-qual-20m-${{ github.event.pull_request.number }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  # V6_SOURCE_SHA must track event HEAD because chain artifact provenance checks
  # workflow_run.head_sha. Executed V6 CI code is separately pinned below.
  V6_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  V6_EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  V6_EVENT_REVIEWED_PARENT_HEAD: '367ce462c9fcc1a7da80db9ae8f67b642893717c'
  V6_SIGNED_ORIGIN_HEAD: '8a40835c470d059448a4871bafead04cc555bee5'
  V6_REVIEWED_HEAD: '99dbb5a90849c54b8c61c00ac58765e5414e0f04'
  # Runtime-only pins are emitted AFTER the genuine independent V6 Host-only
  # 20M differential and uploaded 90-day qualification archive are verified.
  V6_QUAL_RUN: 'PENDING_RUNTIME_V6_20B_QUAL_RUN'
  V6_QUAL_ID: 'PENDING_RUNTIME_V6_20B_QUAL_ID'
  V6_QUAL_HEAD: 'PENDING_RUNTIME_V6_20B_QUAL_HEAD'
  V6_QUAL_NAME: 'PENDING_RUNTIME_V6_20B_QUAL_NAME'
  V6_QUAL_DIGEST: 'PENDING_RUNTIME_V6_20B_QUAL_DIGEST'
  V6_QUAL_MANIFEST_SHA: 'PENDING_RUNTIME_V6_20B_QUAL_MANIFEST_SHA'
  V6_MODEL_SHA: 'PENDING_RUNTIME_NEW_V6_20B_MODEL_SHA'
  AETHERCORE_SD1_V6_REVIEWED_MODEL_SHA: 'PENDING_RUNTIME_NEW_V6_20B_MODEL_SHA'
  V6_V5_QUAL_RUN: '42599136275'
  V6_V5_QUAL_ID: '13664668373'
  V6_V5_QUAL_HEAD: 'a0480c3cfe5ae2b01b92f82e5bc3d90582a9cc4b'
  V6_V5_QUAL_NAME: 'product-sd1-model-migrate-v5-qual-9972-9992-42599136275'
  V6_V5_QUAL_DIGEST: '55d5cf2d8ff46c93eb6c21de1b9c451ff14287da8c03f9cc424d1dd0de41ff89'
  V6_14952_ID: '13739286257'
  V6_14952_NAME: 'product-sd1-v5-15b-42600415630-attempt7-v5_billion_5-14952m'
  V6_14952_DIGEST: '538ac97d0e75a3777f4b506baf2fdfeb1feaccf475a0f56ec1e28c491dbe1b08'
  V6_14972_ID: '13739321621'
  V6_14972_NAME: 'product-sd1-v5-15b-42600415630-attempt7-v5_billion_5-14972m'
  V6_14972_DIGEST: '36491017b3a8e69f28b33827b86c96d390ebcd8e95f642e0c53694864c8a7800'
  V6_ORIGIN_RUN: '42600415630'
  V6_ORIGIN_HEAD: '8a40835c470d059448a4871bafead04cc555bee5'
  V6_14992_ID: '13738787578'
  V6_14992_NAME: 'product-sd1-v5-15b-42600415630-attempt7-v5_billion_5-14992m'
  V6_14992_DIGEST: 'b235fb53f493b274aae9217ae09fafe3a1a16813bde4e38adf50ac048cedd31b'
  V6_14992_HOST_SHA: 'ba7e2161c5917f522a6854eb5457e9cff703492bb0ef1c5485cb13f6500a01cb'
  V6_14992_RTL_SHA: '948ab3d2a7554566ca9cb0070c51eafbecf111eee465ec11a7ecbcb354c57ed9'
  V6_14992_CARD_SHA: '3ef8a3c6281ca52fd2c734f7244634de55908d276208b2ef26736b355ff1c4a3'
  # One 20M trial is never the formal 5B qualification.
  V6_20M_TECH_TRIAL_AUTHORIZED: SIGNED_V6_ONLY_14992_TO_15012_20M_TECH_TRIAL
  AETHERCORE_SD1_V6_20B_APPROVED: PENDING_FORMAL_5B_AFTER_TECH_REPORT_REVIEW
  # Only the exact V6 20M technical trial is armed; formal V6 5B remains locked.
  AETHERCORE_SD1_RELAY_CONFIRM: SD1_SIGNED_V6_14992_TO_15012_TECH_TRIAL_ONLY
  AETHERCORE_VERILATOR_VERSION: '5.054'
  SIM_SETTLE_MODE: reference
  VERILATOR_THREADS: '1'
  AETHERCORE_DATA_MEM_WAIT_CYCLES: '0'
jobs:
  v6_billion_1:
    name: PR379 in-scope cache V6 technical qualification 14992M to 15012M
    if: >-
      false &&
      github.repository == 'yituanxing/minicore' &&
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'sd1-v6-qual-approved' &&
      github.event.pull_request.number == 379 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'design/rv64gc-product-architecture-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout the reviewed PR379 event HEAD for artifact provenance
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V6_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable reviewed V6 executor into isolated directory
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V6_REVIEWED_HEAD }}
          path: v6-reviewed-tools
          fetch-depth: 1
          persist-credentials: false
      - name: Check single PR379 workflow release and import exact reviewed V6 CI blobs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$V6_SOURCE_SHA" =~ ^[a-f0-9]{40}$ &&
             "$V6_EVENT_HEAD_SHA" == "$V6_SOURCE_SHA" &&
             "$(git rev-parse HEAD)" == "$V6_SOURCE_SHA" ]] || exit 16
          [[ "$(git rev-parse HEAD^)" == "$V6_EVENT_REVIEWED_PARENT_HEAD" ]] || {
            echo 'PR379 event HEAD is not one reviewed post-V5 bridge commit' >&2
            exit 16
          }
          while IFS= read -r -d '' changed; do
            [[ "$changed" == .github/workflows/product-sd1-v6-20m-qualification-PR379-CACHE-BRIDGE-INERT-DRAFT.yml ]] || {
              echo "PR379 changed signed source unexpectedly: $changed" >&2
              exit 16
            }
          done < <(git diff --name-only -z "$V6_EVENT_REVIEWED_PARENT_HEAD" HEAD)
           while IFS= read -r -d '' changed; do
             [[ "$changed" == .github/workflows/product-sd1-v6-20m-qualification-PR379-CACHE-BRIDGE-INERT-DRAFT.yml ]] || exit 16
           done < <(git diff --name-only -z "$V6_SIGNED_ORIGIN_HEAD" HEAD)
          reviewed="$GITHUB_WORKSPACE/v6-reviewed-tools"
          [[ "$(git -C "$reviewed" rev-parse HEAD)" == "$V6_REVIEWED_HEAD" ]] || exit 16
          for path in \
            tools/ci/product_sd1_v6_chain.py \
            tools/ci/product_sd1_v6_chain_prepare.sh \
            tools/ci/product_sd1_v6_postcross_20m.sh \
            tools/ci/product_sd1_v6_release_guard.sh \
             tools/ci/product_sd1_model_migration_v6_20b_qualify.sh \
            .github/actions/product-sd1-v6-20m/action.yml \
            .github/actions/product-sd1-v6-batch/action.yml; do
            [[ ! -e "$GITHUB_WORKSPACE/$path" ]] || exit 16
            [[ "$(git -C "$reviewed" rev-parse "HEAD:$path")" == "$(git -C "$reviewed" hash-object "$path")" ]] || exit 16
            mkdir -p "$(dirname "$GITHUB_WORKSPACE/$path")"
            cp -- "$reviewed/$path" "$GITHUB_WORKSPACE/$path"
            [[ "$(sha256sum "$reviewed/$path" | cut -d' ' -f1)" == "$(sha256sum "$GITHUB_WORKSPACE/$path" | cut -d' ' -f1)" ]] || exit 16
          done
           host=sim/product_rv64_checkpoint_sd1_main.cpp
           [[ -f "$host" && "$(git rev-parse "HEAD:$host")" == "$(git hash-object "$host")" &&
              "$(git -C "$reviewed" rev-parse "HEAD:$host")" == "$(git -C "$reviewed" hash-object "$host")" ]] || exit 16
           cp -- "$reviewed/$host" "$host"
           [[ "$(git hash-object "$host")" == "$(git -C "$reviewed" rev-parse "HEAD:$host")" ]] || exit 16
          [[ "$(git rev-parse HEAD)" == "$V6_SOURCE_SHA" ]] || exit 16
           bash -n tools/ci/product_sd1_model_migration_v6_20b_qualify.sh
           bash tools/ci/product_sd1_model_migration_v6_20b_qualify.sh --plan
          bash -n tools/ci/product_sd1_v6_postcross_20m.sh
          bash -n tools/ci/product_sd1_v6_chain_prepare.sh
          python3 -m py_compile tools/ci/product_sd1_v6_chain.py
          bash tools/ci/product_sd1_v6_postcross_20m.sh --plan
      - id: seed
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rv64-debian-rootfs/result.txt
            build/rv64-debian-linux/result.txt
            build/rv64-debian-linux/obj/.config
            build/rv64-debian-linux/obj/arch/riscv/boot/Image
            build/rv64-debian-boot
            build/rv64-debian-sd1-sd
            build/product-sd1-official-seed
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v2-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'build.mill', 'tools/ci/rv64_debian_sd1_official_full_rootfs_prepare.sh', 'tools/ci/rv64_debian_sd1_sd_image_build.sh', 'tools/ci/rv64_debian_payload_build.sh', 'tools/ci/rv64_debian_linux_build.sh', 'tools/ci/rv64_debian_rootfs_build.sh', 'tools/ci/rv64_debian_sd1_tree_digest.py', 'tools/ci/rv64_linux_early_build.sh', 'tools/ci/rv64_minimal_init_payload_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0
      - id: diag
        uses: actions/cache/restore@v4
        with:
          path: |
            build/product-sd1-gpio-cs-diagnostic/linux/result.txt
            build/product-sd1-gpio-cs-diagnostic/linux/obj/.config
            build/product-sd1-gpio-cs-diagnostic/linux/obj/arch/riscv/boot/Image
            build/product-sd1-gpio-cs-diagnostic/linux/evidence
            build/product-sd1-gpio-cs-diagnostic/boot
            build/product-sd1-gpio-cs-diagnostic/diagnostic-manifest.txt
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-sd1-gpio-cs-diagnostic-image-v1-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'tools/ci/product_sd1_gpio_cs_diag_build.sh', 'tools/ci/patches/linux-6.6.143-mmc-spi-gpio-cs-off.patch', 'tools/ci/rv64_minimal_init_payload_build.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
      - name: Require the historical signed Debian caches used by successful PR-labeled N and O
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.diag.outputs.cache-hit }}' == true &&
             ( '${{ steps.seed.outputs.cache-hit }}' == true ||
               '${{ steps.seed.outputs.cache-matched-key }}' == 'aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0' ) ]] || {
            echo 'V6 source caches unavailable for this PR event; refuse cold reproduction' >&2
            exit 16
          }
      - name: Restore exact Verilator 5.054 Host compiler ABI cache
        id: verilator
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.054
            ~/.cache/aethercore/toolchains/src/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
            ~/.cache/aethercore/toolchains/build/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
          key: aethercore-Linux-X64-verilator-product-gsim-g3-v1-0d5cab64c9f95f1a19e38d7220450b5555d6a853d6ac53283fab6b1ca779c1d8
      - name: Require exact cached Verilator before rebuilding any Host model
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.verilator.outputs.cache-hit }}' == true &&
             -x "$HOME/.cache/aethercore/toolchains/verilator-5.054/bin/verilator" ]] || exit 16
      - uses: actions/download-artifact@v4
        with:
          run-id: 42338584047
          name: product-sd1-spi-polling-build-42338584047
          github-token: ${{ github.token }}
          path: build/product-sd1-spi-polling-import
      - name: Fetch and verify official V5 14952/14972/14992 and original V5-qualified model
        shell: bash
        run: |
          set -euo pipefail
          # The source archive digests are pinned in this reviewed workflow.
          # The separately imported qualification script also checks complete
          # signed Host+RTL+card bytes and all migration-ready lineages.
          get_qualified_artifact() {
            local id="$1" name="$2" digest="$3" run="$4" head="$5" dest="$6"
            local meta="$RUNNER_TEMP/qual-${id}.json" zip="$RUNNER_TEMP/qual-${id}.zip"
            [[ ! -e "$dest" ]] || exit 16
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "$meta"
            jq -e --argjson id "$id" --argjson run "$run" \
              --arg name "$name" --arg digest "sha256:$digest" --arg head "$head" '
              .id==$id and .name==$name and .workflow_run.id==$run and
              .workflow_run.head_sha==$head and .digest==$digest and
              .expired==false and .size_in_bytes>1024' "$meta" >/dev/null || exit 16
            curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$zip"
            python3 tools/ci/product_sd1_v6_chain.py verify-zip "$zip" "$digest" >/dev/null
            python3 - "$zip" <<'PY'
          import stat,sys,zipfile
          from pathlib import PurePosixPath
          with zipfile.ZipFile(sys.argv[1]) as archive:
              for entry in archive.infolist():
                  path=PurePosixPath(entry.filename)
                  mode=entry.external_attr >> 16
                  if (path.is_absolute() or '..' in path.parts or
                      not path.parts or any(x in ('', '.') for x in path.parts) or
                      stat.S_ISLNK(mode)):
                      raise SystemExit('untrusted ZIP path/symlink rejected')
          PY
            mkdir -p "$dest"
            unzip -qq "$zip" -d "$dest"
          }
          oldqual=build/product-sd1-model-migration-v5-15b-qualified
          get_qualified_artifact "$V6_V5_QUAL_ID" "$V6_V5_QUAL_NAME" "$V6_V5_QUAL_DIGEST" \
            "$V6_V5_QUAL_RUN" "$V6_V5_QUAL_HEAD" "$oldqual"
          for m in 14952 14972 14992; do
            id_var="V6_${m}_ID"
            name_var="V6_${m}_NAME"
            digest_var="V6_${m}_DIGEST"
            get_qualified_artifact "${!id_var}" "${!name_var}" "${!digest_var}" \
              "$V6_ORIGIN_RUN" "$V6_ORIGIN_HEAD" "build/product-sd1-v6-v5-reference/${m}m"
          done
          echo 'PRODUCT_SD1_V6_V5_HISTORICAL_ARTIFACTS_PROVENANCE_VERIFIED_NO_GUEST_CLOCKS'
      - name: Qualify independently rebuilt V6 Host model with real 14952M to 14972M differential
        shell: bash
        env:
          AETHERCORE_SD1_V6_MODEL_QUALIFICATION_EXECUTE: HOST_ONLY_14952_TO_14972_REAL_RTL_REVIEWED
          AETHERCORE_SD1_MODEL_MIGRATE_CONFIRM: FROZEN_SIGNED_SD1_MODEL_MIGRATE_V6_20B_DIFF_14952M
          AETHERCORE_SD1_V6_SOURCE_14952_DIR: ${{ github.workspace }}/build/product-sd1-v6-v5-reference/14952m
          AETHERCORE_SD1_V6_SOURCE_14972_DIR: ${{ github.workspace }}/build/product-sd1-v6-v5-reference/14972m
          AETHERCORE_SD1_V6_SOURCE_14992_DIR: ${{ github.workspace }}/build/product-sd1-v6-v5-reference/14992m
        run: |
          set -euo pipefail
          bash tools/ci/product_sd1_model_migration_v6_20b_qualify.sh --execute-qualified-diff
          src=build/product-sd1-model-migration-v6-20b-draft
          dst=build/product-sd1-model-migration-v6-20b-qualified
          [[ -f "$src/qualification-manifest.txt" && ! -e "$dst" ]] || exit 16
          mv -T -- "$src" "$dst"
          [[ "$(sed -n 's/^replay_cycles=//p' "$dst/qualification-manifest.txt")" == 20000000 &&
             "$(sed -n 's/^cross_15b_executed=//p' "$dst/qualification-manifest.txt")" == 0 ]] || exit 16
          echo 'PRODUCT_SD1_V6_NEW_20B_MODEL_14952_14972_20M_RTL_DIFFERENTIAL_PASS_NOT_DEBIAN_PASS'
      - id: model_qualification
        name: Retain newly qualified V6 20B model, 14992M zero-step state and differential proof
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-v6-20b-host-qual-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: build/product-sd1-model-migration-v6-20b-qualified
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Authenticate uploaded V6 Host qualification and publish exact dynamic pins
        shell: bash
        env:
          ART_ID: ${{ steps.model_qualification.outputs.artifact-id }}
          ART_SHA: ${{ steps.model_qualification.outputs.artifact-digest }}
          ART_NAME: product-sd1-v6-20b-host-qual-${{ github.run_id }}-attempt${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ART_SHA="${ART_SHA#sha256:}"
          [[ "$ART_ID" =~ ^[0-9]+$ && "$ART_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 16
          meta="$RUNNER_TEMP/v6-host-qual-artifact.json"
          visible=0
          for delay in 0 2 3 5 8 13 21 30; do
            (( delay == 0 )) || sleep "$delay"
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID" > "$meta"; then
              visible=1
              break
            fi
          done
          [[ "$visible" == 1 ]] || exit 16
          jq -e --argjson id "$ART_ID" --argjson run "$GITHUB_RUN_ID" \
            --arg name "$ART_NAME" --arg digest "sha256:$ART_SHA" \
            --arg head "$V6_EVENT_HEAD_SHA" '
            .id==$id and .workflow_run.id==$run and .workflow_run.head_sha==$head and
            .name==$name and .digest==$digest and .expired==false and
            .size_in_bytes>1024' "$meta" >/dev/null || exit 16
          manifest=build/product-sd1-model-migration-v6-20b-qualified/qualification-manifest.txt
          model=build/product-sd1-model-migration-v6-20b-qualified/candidate-savable-model/obj/VAetherCoreProductDebianSdRV64SimTop
          new_sha="$(sha256sum "$model" | cut -d' ' -f1)"
          manifest_sha="$(sha256sum "$manifest" | cut -d' ' -f1)"
          [[ "$new_sha" =~ ^[a-f0-9]{64}$ && "$manifest_sha" =~ ^[a-f0-9]{64}$ &&
             "$new_sha" != 4f946c321c63528ce789440486c82ef89204fc0905985bb42a97d1ec9fe989be &&
             "$(sed -n 's/^candidate_model_sha256=//p' "$manifest")" == "$new_sha" ]] || exit 16
          {
            echo "V6_QUAL_RUN=$GITHUB_RUN_ID"
            echo "V6_QUAL_ID=$ART_ID"
            echo "V6_QUAL_HEAD=$V6_EVENT_HEAD_SHA"
            echo "V6_QUAL_NAME=$ART_NAME"
            echo "V6_QUAL_DIGEST=$ART_SHA"
            echo "V6_QUAL_MANIFEST_SHA=$manifest_sha"
            echo "V6_MODEL_SHA=$new_sha"
            echo "AETHERCORE_SD1_V6_REVIEWED_MODEL_SHA=$new_sha"
          } >> "$GITHUB_ENV"
          # Chain-prepare will re-download the authenticated ZIP by ID+digest.
          mv -T -- build/product-sd1-model-migration-v6-20b-qualified \
            build/product-sd1-v6-model-qualification-uploaded
          echo 'PRODUCT_SD1_V6_20B_MODEL_ARCHIVE_PROVENANCE_VERIFIED_NEVER_CROSS_15B'
      - name: Import and authenticate qualified V6 model and exact source checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          V6_BATCH_START_M: '14992'
          V6_BATCH_END_M: '15992'
          V6_SOURCE_MODE: 'cross_run'
          V6_SOURCE_ID: ${{ env.V6_14992_ID }}
          V6_SOURCE_NAME: ${{ env.V6_14992_NAME }}
          V6_SOURCE_DIGEST: ${{ env.V6_14992_DIGEST }}
          V6_SOURCE_HOST_SHA: ${{ env.V6_14992_HOST_SHA }}
          V6_SOURCE_RTL_SHA: ${{ env.V6_14992_RTL_SHA }}
          V6_SOURCE_CARD_SHA: ${{ env.V6_14992_CARD_SHA }}
        run: |
          set -euo pipefail
          export V6_BATCH_START_M V6_BATCH_END_M V6_SOURCE_MODE V6_SOURCE_ID
          export V6_SOURCE_NAME V6_SOURCE_DIGEST V6_SOURCE_HOST_SHA
          export V6_SOURCE_RTL_SHA V6_SOURCE_CARD_SHA
          bash tools/ci/product_sd1_v6_chain_prepare.sh
          {
            echo "V6_BATCH_START_M=$V6_BATCH_START_M"
            echo "V6_BATCH_END_M=$V6_BATCH_END_M"
            echo "V6_SOURCE_MODE=$V6_SOURCE_MODE"
          } >> "$GITHUB_ENV"
      - name: Qualify genuine RTL 14992M to 15012M (exactly one 20M stage)
        uses: ./.github/actions/product-sd1-v6-20m
        with:
          ordinal: '1'
      - name: Require exact signed 15012M result and save qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          [[ "${V6_CURRENT_M:-}" == 15012 && "${V6_STOP:-0}" =~ ^[01]$ ]] || exit 16
          [[ -n "${V6_LAST_ARTIFACT_ID:-}" && -n "${V6_LAST_ARTIFACT_DIGEST:-}" &&
             -n "${V6_LAST_ARTIFACT_NAME:-}" ]] || exit 16
          [[ "$(sed -n 's/^source_cycles=//p' "$V6_SOURCE_DIR/.migration-ready")" == 14992000000 ]] || exit 16
           model_qual=build/product-sd1-model-migration-v6-20b-qualified/qualification-manifest.txt
           [[ "$(sed -n 's/^candidate_model_sha256=//p' "$model_qual")" == "$V6_MODEL_SHA" &&
              "$(sed -n 's/^previous_model_sha256=//p' "$model_qual")" == 4f946c321c63528ce789440486c82ef89204fc0905985bb42a97d1ec9fe989be &&
              "$(sed -n 's/^old_14992_host_sha256=//p' "$model_qual")" == "$V6_14992_HOST_SHA" &&
              "$(sed -n 's/^source_host_sha256=//p' "$V6_SOURCE_DIR/.migration-ready")" == "$(sed -n 's/^candidate_14992_host_sha256=//p' "$model_qual")" &&
              "$(sed -n 's/^source_rtl_sha256=//p' "$V6_SOURCE_DIR/.migration-ready")" == "$V6_14992_RTL_SHA" ]] || exit 16
          python3 tools/ci/product_sd1_v6_chain.py verify-stage "$V6_SOURCE_DIR" 15012000000 > "$RUNNER_TEMP/v6-qual-stage-verified.json"
          jq -e '.cycles==15012000000 and .source_cycles=="14992000000" and .proof.debian_login_claim==false' \
            "$RUNNER_TEMP/v6-qual-stage-verified.json" >/dev/null || exit 16
          report="$RUNNER_TEMP/v6-qual-report"
          mkdir -p "$report"
          cp "$RUNNER_TEMP/v6-qual-stage-verified.json" "$report/verified-stage.json"
          cp "$V6_SOURCE_DIR/serial-proof.json" "$report/serial-proof.json"
          cp "$V6_SOURCE_DIR/.migration-ready" "$report/migration-ready.txt"
          {
            echo 'schema=SD1_V6_14992_15012_TECHNICAL_QUALIFICATION_V1'
            echo "reviewed_v6_head=$V6_REVIEWED_HEAD"
            echo "pr379_reviewed_parent_head=$V6_EVENT_REVIEWED_PARENT_HEAD"
            echo "qual_source_head=$V6_SOURCE_SHA"
            echo "event_pr379_head=$V6_EVENT_HEAD_SHA"
            echo "origin_run=$V6_ORIGIN_RUN"
            echo "origin_head=$V6_ORIGIN_HEAD"
            echo "origin_id=$V6_14992_ID"
            echo "origin_name=$V6_14992_NAME"
            echo "origin_zip_digest=$V6_14992_DIGEST"
            echo "origin_host_sha=$V6_14992_HOST_SHA"
            echo "origin_rtl_sha=$V6_14992_RTL_SHA"
            echo "origin_card_sha=$V6_14992_CARD_SHA"
             echo "host_model_qual_run=$V6_QUAL_RUN"
             echo "host_model_qual_id=$V6_QUAL_ID"
             echo "host_model_qual_head=$V6_QUAL_HEAD"
             echo "host_model_qual_name=$V6_QUAL_NAME"
             echo "host_model_qual_digest=$V6_QUAL_DIGEST"
             echo "host_model_qual_manifest_sha=$V6_QUAL_MANIFEST_SHA"
             echo "migrated_14992_host_sha=$(sed -n 's/^candidate_14992_host_sha256=//p' "$model_qual")"
             echo "migrated_14992_rtl_sha=$(sed -n 's/^candidate_14992_rtl_sha256=//p' "$model_qual")"
             echo "migrated_14992_card_sha=$(sed -n 's/^candidate_14992_card_sha256=//p' "$model_qual")"
             echo 'host_model_diff_14952_to_14972_20m_verified=1'
             echo 'host_model_terminal_14992_zero_guest_cycles=1'
            echo "stage_artifact_id=$V6_LAST_ARTIFACT_ID"
            echo "stage_artifact_name=$V6_LAST_ARTIFACT_NAME"
            echo "stage_artifact_zip_digest=$V6_LAST_ARTIFACT_DIGEST"
            echo "stage_host_sha=$V6_LAST_HOST_SHA"
            echo "stage_rtl_sha=$V6_LAST_RTL_SHA"
            echo "stage_card_sha=$V6_LAST_CARD_SHA"
            echo "stage_serial_proof_sha=$(sha256sum "$V6_SOURCE_DIR/serial-proof.json" | cut -d' ' -f1)"
            echo "model_sha=$V6_MODEL_SHA"
            echo 'signed_no_cold_boot=1'
            echo 'debian_login_claim=0'
          } > "$report/qualification-manifest.txt"
          echo 'PRODUCT_SD1_V6_20M_TECHNICAL_STAGE_VERIFIED_NOT_DEBIAN_PASS'
      - id: qualification_terminal
        name: Preserve the complete authenticated 15012M Host RTL card checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-v6-qual-15012-checkpoint-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ env.V6_SOURCE_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
      - name: Authenticate 90-day checkpoint archive and bind it to report
        shell: bash
        env:
          ART_ID: ${{ steps.qualification_terminal.outputs.artifact-id }}
          ART_SHA: ${{ steps.qualification_terminal.outputs.artifact-digest }}
          ART_NAME: product-sd1-v6-qual-15012-checkpoint-${{ github.run_id }}-attempt${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ART_SHA="${ART_SHA#sha256:}"
          [[ "$ART_ID" =~ ^[0-9]+$ && "$ART_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 16
          visible=0
          for delay in 0 2 3 5 8 13 21 30; do
            if (( delay > 0 )); then sleep "$delay"; fi
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID" > "$RUNNER_TEMP/v6-qual-terminal-artifact.json"; then
              visible=1
              break
            fi
          done
          [[ "$visible" == 1 ]] || exit 16
          jq -e --argjson id "$ART_ID" --argjson run "$GITHUB_RUN_ID" \
            --arg name "$ART_NAME" --arg digest "sha256:$ART_SHA" --arg head "$V6_EVENT_HEAD_SHA" '
              .id==$id and .name==$name and .digest==$digest and
              .workflow_run.id==$run and .workflow_run.head_sha==$head and
              .expired==false and .size_in_bytes>1024
            ' "$RUNNER_TEMP/v6-qual-terminal-artifact.json" >/dev/null || exit 16
          {
            echo "terminal_90d_artifact_id=$ART_ID"
            echo "terminal_90d_artifact_name=$ART_NAME"
            echo "terminal_90d_artifact_zip_digest=$ART_SHA"
          } >> "$RUNNER_TEMP/v6-qual-report/qualification-manifest.txt"
      - id: qualification_report
        name: Retain independent technical qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-v6-qual-14992-15012-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/v6-qual-report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Authenticate uploaded V6 qualification report
        shell: bash
        env:
          ART_ID: ${{ steps.qualification_report.outputs.artifact-id }}
          ART_SHA: ${{ steps.qualification_report.outputs.artifact-digest }}
          ART_NAME: product-sd1-v6-qual-14992-15012-${{ github.run_id }}-attempt${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ART_SHA="${ART_SHA#sha256:}"
          [[ "$ART_ID" =~ ^[0-9]+$ && "$ART_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 16
          visible=0
          for delay in 0 2 3 5 8 13 21 30; do
            if (( delay > 0 )); then sleep "$delay"; fi
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID" > "$RUNNER_TEMP/v6-qual-report-artifact.json"; then
              visible=1
              break
            fi
          done
          [[ "$visible" == 1 ]] || exit 16
          jq -e --argjson id "$ART_ID" --argjson run "$GITHUB_RUN_ID" \
            --arg name "$ART_NAME" --arg digest "sha256:$ART_SHA" --arg head "$V6_EVENT_HEAD_SHA" '
              .id==$id and .name==$name and .digest==$digest and
              .workflow_run.id==$run and .workflow_run.head_sha==$head and
              .expired==false and .size_in_bytes>1024
            ' "$RUNNER_TEMP/v6-qual-report-artifact.json" >/dev/null || exit 16
          echo 'PRODUCT_SD1_V6_20M_TECH_QUAL_ARTIFACT_PROVENANCE_VERIFIED_NOT_DEBIAN_PASS'
