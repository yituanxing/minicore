            build/product-sd1-spi-polling-relay/1852m/.polling-ready
            build/product-sd1-spi-polling-relay/1852m/card-progress.json
            build/product-sd1-spi-polling-relay/1852m/save.log
            build/product-sd1-spi-polling-relay/1872m/.polling-ready
