          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1872m/
      - name: Execute authentic polling Product RTL 1872M to 1892M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1872m 1892000000
          grep -Fxq 'boot_cycles=1892000000' build/product-sd1-spi-polling-relay/1892m/.polling-ready
      - name: Upload authenticated 1892M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1892m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1892m/
      - name: Execute authentic polling Product RTL 1892M to 1912M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1892m 1912000000
          grep -Fxq 'boot_cycles=1912000000' build/product-sd1-spi-polling-relay/1912m/.polling-ready
      - name: Upload authenticated 1912M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1912m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1912m/
      - name: Execute authentic polling Product RTL 1912M to 1932M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1912m 1932000000
          grep -Fxq 'boot_cycles=1932000000' build/product-sd1-spi-polling-relay/1932m/.polling-ready
      - name: Upload authenticated 1932M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1932m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1932m/
      - name: Execute authentic polling Product RTL 1932M to 1952M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1932m 1952000000
          grep -Fxq 'boot_cycles=1952000000' build/product-sd1-spi-polling-relay/1952m/.polling-ready
      - name: Upload authenticated 1952M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1952m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1952m/
      - name: Preserve every completed polling stage log and SD counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1752m-to-1952m-evidence-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/product-sd1-spi-polling-relay/1772m/.polling-ready
            build/product-sd1-spi-polling-relay/1772m/card-progress.json
            build/product-sd1-spi-polling-relay/1772m/save.log
            build/product-sd1-spi-polling-relay/1792m/.polling-ready
            build/product-sd1-spi-polling-relay/1792m/card-progress.json
            build/product-sd1-spi-polling-relay/1792m/save.log
            build/product-sd1-spi-polling-relay/1812m/.polling-ready
            build/product-sd1-spi-polling-relay/1812m/card-progress.json
            build/product-sd1-spi-polling-relay/1812m/save.log
            build/product-sd1-spi-polling-relay/1832m/.polling-ready
            build/product-sd1-spi-polling-relay/1832m/card-progress.json
