name: Product SD1 polling 1552M-to-1752M ten-stage warm relay

# Isolated new firmware cold start, same qualified Verilator 5.054 RTL binary.
# NEVER restores the previous IRQ-based 572M Product DDR checkpoint.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: product-sd1-spi-polling-ten8-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  polling-12m:
    if: >-
      github.event.label.name == 'product-sd1-spi-polling-advance-1752m' &&
      github.event.pull_request.number == 379 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.ref == 'design/rv64gc-product-architecture-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
      AETHERCORE_ALLOW_PRODUCT_SD1_PERSISTENT_CHECKPOINT: '1'
      AETHERCORE_SD1_SPI_POLLING_SHORT: '1'
      AETHERCORE_SD1_RELAY_CONFIRM: SD1_FULL_DEBIAN_SIGNED_RELAY
      AETHERCORE_VERILATOR_VERSION: '5.054'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      SIM_SETTLE_MODE: reference
      VERILATOR_THREADS: '1'
      AETHERCORE_DATA_MEM_WAIT_CYCLES: '0'
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Cheap short-mode syntax checks, no guest cycles
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          bash -n tools/ci/product_sd1_spi_polling_relay.sh
          python3 -m unittest tests_py.test_product_sd1_spi_polling_dts tests_py.test_product_sd1_card_snapshot -v
      - name: Restore full unchanged official signed Debian SD image
        id: seed
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rv64-debian-rootfs/result.txt
            build/rv64-debian-linux/result.txt
            build/rv64-debian-linux/obj/.config
            build/rv64-debian-linux/obj/arch/riscv/boot/Image
            build/rv64-debian-boot
            build/rv64-debian-sd1-sd
            build/product-sd1-official-seed
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v2-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'build.mill', 'tools/ci/rv64_debian_sd1_official_full_rootfs_prepare.sh', 'tools/ci/rv64_debian_sd1_sd_image_build.sh', 'tools/ci/rv64_debian_payload_build.sh', 'tools/ci/rv64_debian_linux_build.sh', 'tools/ci/rv64_debian_rootfs_build.sh', 'tools/ci/rv64_debian_sd1_tree_digest.py', 'tools/ci/rv64_linux_early_build.sh', 'tools/ci/rv64_minimal_init_payload_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0
      - name: Reject missing or altered official media
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.seed.outputs.cache-hit }}' == true ||
             '${{ steps.seed.outputs.cache-matched-key }}' == \
               'aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-official-seed-v1-327da1449dc81566d524cd0d159dba0c5c6ad83d001b00e00717e1b9ede26cf0' ]] || exit 16
          python3 tools/ci/product_sd1_official_seed.py verify
      - name: Restore original GPIO-CS fixed Linux Image, not rebuilding kernel
        id: diag
        uses: actions/cache/restore@v4
        with:
          path: |
            build/product-sd1-gpio-cs-diagnostic/linux/result.txt
            build/product-sd1-gpio-cs-diagnostic/linux/obj/.config
            build/product-sd1-gpio-cs-diagnostic/linux/obj/arch/riscv/boot/Image
            build/product-sd1-gpio-cs-diagnostic/linux/evidence
            build/product-sd1-gpio-cs-diagnostic/boot
            build/product-sd1-gpio-cs-diagnostic/diagnostic-manifest.txt
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-sd1-gpio-cs-diagnostic-image-v1-${{ hashFiles('software/rv64/product_sd1_official_seed.lock', 'tools/ci/product_sd1_gpio_cs_diag_build.sh', 'tools/ci/patches/linux-6.6.143-mmc-spi-gpio-cs-off.patch', 'tools/ci/rv64_minimal_init_payload_build.sh', 'software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env') }}
      - name: Reject missing fixed Linux candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.diag.outputs.cache-hit }}' == true ]] || exit 16
          grep -Fxq 'PRODUCT_SD1_GPIO_CS_DIAG_ARTIFACTS: status=READY_FOR_SHORT_RTL_ONLY' \
            build/product-sd1-gpio-cs-diagnostic/diagnostic-manifest.txt
      - name: Import exact distinct polling firmware build evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 42338584047
          name: product-sd1-spi-polling-build-42338584047
          github-token: ${{ github.token }}
          path: build/product-sd1-spi-polling-import
      - name: Import exact 12M polling full state from replay-qualified run
        uses: actions/download-artifact@v4
        with:
          run-id: 42349802701
          name: product-sd1-spi-polling-1552m-42349802701
          github-token: ${{ github.token }}
          path: build/product-sd1-spi-polling-1552m-import
      - name: Restore pinned 5.054 native Verilator cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.054
            ~/.cache/aethercore/toolchains/src/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
            ~/.cache/aethercore/toolchains/build/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-product-gsim-g3-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh', 'tools/ensure_verilator_5_054.sh') }}
      - name: Fingerprint portable host compiler ABI
        id: portable-abi
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(c++ --version | head -1 | sha256sum | cut -c1-20)"
          echo "signature=$(uname -m)-$compiler" >> "$GITHUB_OUTPUT"
      - name: Restore original portable savable Product RTL model
        id: model
        uses: actions/cache/restore@v4
        with:
          path: build/product-sd1-persistent-checkpoint/savable-model
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-product-sd1-savable-portable-v1-${{ steps.portable-abi.outputs.signature }}-${{ hashFiles('build.mill', 'src/main/scala/**/*.scala', 'sim/l32_opensbi_runtime.h', 'sim/l32_sd_spi_card.h', 'sim/l32_sd_spi_snapshot_codec.h', 'sim/product_rv64_checkpoint_sd1_main.cpp', 'tools/ci/product_checkpoint_sd1_short.sh', 'tools/ci/product_sim_cache.sh', 'tools/ensure_verilator_5_024.sh') }}
      - name: Reject simulator rebuild/mismatch before guest cycles
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ steps.model.outputs.cache-hit }}' == true ]] || {
            echo 'PRODUCT_SD1_POLLING_SHORT_REJECTED: portable model cache miss; do not rebuild' >&2
            exit 16
          }
          [[ -x build/product-sd1-persistent-checkpoint/savable-model/obj/VAetherCoreProductDebianSdRV64SimTop ]] || exit 16
      - name: Verify exactly one 1552M full polling source, no prior IRQ state
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' ready < <(find build/product-sd1-spi-polling-1552m-import -type f -name .polling-ready -print0)
          [[ "${#ready[@]}" == 1 ]] || exit 16
          source="$(dirname "${ready[0]}")"
          grep -Fxq 'boot_cycles=1552000000' "$source/.polling-ready"
          grep -Fxq 'qualification=PRODUCT_SD1_SPI_POLLING_WARM_NOT_DEBIAN_PASS' "$source/.polling-ready"
          echo "POLLING_SOURCE=$source" >> "$GITHUB_ENV"
      - name: Execute authentic polling Product RTL 1552M to 1572M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh "$POLLING_SOURCE" 1572000000
          grep -Fxq 'boot_cycles=1572000000' build/product-sd1-spi-polling-relay/1572m/.polling-ready
      - name: Upload authenticated 1572M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1572m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1572m/
      - name: Execute authentic polling Product RTL 1572M to 1592M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1572m 1592000000
          grep -Fxq 'boot_cycles=1592000000' build/product-sd1-spi-polling-relay/1592m/.polling-ready
      - name: Upload authenticated 1592M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1592m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1592m/
      - name: Execute authentic polling Product RTL 1592M to 1612M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1592m 1612000000
          grep -Fxq 'boot_cycles=1612000000' build/product-sd1-spi-polling-relay/1612m/.polling-ready
      - name: Upload authenticated 1612M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1612m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1612m/
      - name: Execute authentic polling Product RTL 1612M to 1632M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1612m 1632000000
          grep -Fxq 'boot_cycles=1632000000' build/product-sd1-spi-polling-relay/1632m/.polling-ready
      - name: Upload authenticated 1632M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1632m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1632m/
      - name: Execute authentic polling Product RTL 1632M to 1652M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1632m 1652000000
          grep -Fxq 'boot_cycles=1652000000' build/product-sd1-spi-polling-relay/1652m/.polling-ready
      - name: Upload authenticated 1652M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1652m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1652m/
      - name: Execute authentic polling Product RTL 1652M to 1672M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1652m 1672000000
          grep -Fxq 'boot_cycles=1672000000' build/product-sd1-spi-polling-relay/1672m/.polling-ready
      - name: Upload authenticated 1672M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1672m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1672m/
      - name: Execute authentic polling Product RTL 1672M to 1692M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1672m 1692000000
          grep -Fxq 'boot_cycles=1692000000' build/product-sd1-spi-polling-relay/1692m/.polling-ready
      - name: Upload authenticated 1692M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1692m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1692m/
      - name: Execute authentic polling Product RTL 1692M to 1712M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1692m 1712000000
          grep -Fxq 'boot_cycles=1712000000' build/product-sd1-spi-polling-relay/1712m/.polling-ready
      - name: Upload authenticated 1712M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1712m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1712m/
      - name: Execute authentic polling Product RTL 1712M to 1732M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1712m 1732000000
          grep -Fxq 'boot_cycles=1732000000' build/product-sd1-spi-polling-relay/1732m/.polling-ready
      - name: Upload authenticated 1732M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1732m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1732m/
      - name: Execute authentic polling Product RTL 1732M to 1752M
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 9m bash tools/ci/product_sd1_spi_polling_relay.sh build/product-sd1-spi-polling-relay/1732m 1752000000
          grep -Fxq 'boot_cycles=1752000000' build/product-sd1-spi-polling-relay/1752m/.polling-ready
      - name: Upload authenticated 1752M full RTL-DDR-SD checkpoint BEFORE next interval
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1752m-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
          path: build/product-sd1-spi-polling-relay/1752m/
      - name: Preserve every completed polling stage log and SD counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-sd1-spi-polling-1552m-to-1752m-evidence-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/product-sd1-spi-polling-relay/1572m/.polling-ready
            build/product-sd1-spi-polling-relay/1572m/card-progress.json
            build/product-sd1-spi-polling-relay/1572m/save.log
            build/product-sd1-spi-polling-relay/1592m/.polling-ready
            build/product-sd1-spi-polling-relay/1592m/card-progress.json
            build/product-sd1-spi-polling-relay/1592m/save.log
            build/product-sd1-spi-polling-relay/1612m/.polling-ready
            build/product-sd1-spi-polling-relay/1612m/card-progress.json
            build/product-sd1-spi-polling-relay/1612m/save.log
            build/product-sd1-spi-polling-relay/1632m/.polling-ready
            build/product-sd1-spi-polling-relay/1632m/card-progress.json
            build/product-sd1-spi-polling-relay/1632m/save.log
            build/product-sd1-spi-polling-relay/1652m/.polling-ready
            build/product-sd1-spi-polling-relay/1652m/card-progress.json
            build/product-sd1-spi-polling-relay/1652m/save.log
            build/product-sd1-spi-polling-relay/1672m/.polling-ready
            build/product-sd1-spi-polling-relay/1672m/card-progress.json
            build/product-sd1-spi-polling-relay/1672m/save.log
            build/product-sd1-spi-polling-relay/1692m/.polling-ready
            build/product-sd1-spi-polling-relay/1692m/card-progress.json
            build/product-sd1-spi-polling-relay/1692m/save.log
            build/product-sd1-spi-polling-relay/1712m/.polling-ready
            build/product-sd1-spi-polling-relay/1712m/card-progress.json
            build/product-sd1-spi-polling-relay/1712m/save.log
            build/product-sd1-spi-polling-relay/1732m/.polling-ready
            build/product-sd1-spi-polling-relay/1732m/card-progress.json
            build/product-sd1-spi-polling-relay/1732m/save.log
