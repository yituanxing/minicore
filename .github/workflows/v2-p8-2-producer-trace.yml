name: AetherCore V2 P8.2 Dependency Write Diagnostic

on:
  push:
    branches:
      - 'arch/aethercore-v2-p8-2-generalized-recovery'
    paths:
      - '.github/workflows/v2-p8-2-producer-trace.yml'

permissions:
  contents: read
  statuses: write

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish diagnostic run identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
            'state': 'pending',
            'context': 'aethercore/v2-p8.2-producer-trace',
            'description': 'leaf dependency allocation A/B',
            'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -L -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data-binary @/tmp/status.json

  verilator-tool:
    uses: ./.github/workflows/hosted-verilator-cache.yml

  test:
    name: Test leaf dependency allocation writes
    needs: [announce, verilator-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_SHA: ${{ github.sha }}
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true

      - name: Apply checkout-only leaf-write variant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main/scala/aethercore/core/v2/TinyDependency.scala')
          s = p.read_text()
          old = '    dependencies(slot).rs1 := allocateRs1\n    dependencies(slot).rs2 := allocateRs2\n'
          new_lines = [
            '    dependencies(slot).rs1.ready := allocateRs1.ready',
            '    dependencies(slot).rs1.value := allocateRs1.value',
            '    dependencies(slot).rs1.producerTag.id := allocateRs1.producerTag.id',
            '    dependencies(slot).rs1.producerTag.generation := allocateRs1.producerTag.generation',
            '    dependencies(slot).rs2.ready := allocateRs2.ready',
            '    dependencies(slot).rs2.value := allocateRs2.value',
            '    dependencies(slot).rs2.producerTag.id := allocateRs2.producerTag.id',
            '    dependencies(slot).rs2.producerTag.generation := allocateRs2.producerTag.generation',
          ]
          new = '\n'.join(new_lines) + '\n'
          if s.count(old) != 1:
            raise SystemExit('unexpected allocation write anchor')
          p.write_text(s.replace(old, new))
          PY

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}

      - name: Run exact red case with leaf writes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          root="$RUNNER_TEMP/aethercore-v2-p82-leaf-write"
          mkdir -p "$root/mill-out"
          export MILL_OUTPUT_DIR="$root/mill-out"
          bash tools/ensure_verilator_5_024.sh
          ./mill aethercore.test.testOnly aethercore.core.v2.V2P82RecoveryRebuildSpec
