name: AetherCore V2 P8.2 Producer Trace Diagnostic

# Dedicated checkout-only diagnostic. Production RTL is not modified by this workflow.
on:
  push:
    branches:
      - 'arch/aethercore-v2-p8-2-generalized-recovery'
    paths:
      - '.github/workflows/v2-p8-2-producer-trace.yml'

permissions:
  contents: read
  statuses: write

jobs:
  announce:
    name: Publish producer-trace run identity
    runs-on: ubuntu-24.04
    steps:
      - name: Publish pending trace status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/p82-trace-status.json
          import json, os
          print(json.dumps({
              'state': 'pending',
              'context': 'aethercore/v2-p8.2-producer-trace',
              'description': 'checkout-only release source trace',
              'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -L -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data-binary @/tmp/p82-trace-status.json

  verilator-tool:
    name: Produce or verify hosted Verilator
    uses: ./.github/workflows/hosted-verilator-cache.yml

  trace:
    name: Trace release source resolution
    needs: [announce, verilator-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_SHA: ${{ github.sha }}
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'

    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true

      - name: Inject source-resolution trace into checkout only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/scala/aethercore/core/v2/TinyDependency.scala')
          text = path.read_text()
          needle = '  for (index <- 0 until Entries) {\n    io.slotView(index) := 0.U.asTypeOf(\n'
          trace = '''  when(io.allocate.valid || io.retire.valid || io.recovery.valid || rebuildBusy) {
            printf(p"P82_SRC_TRACE rename5_valid=${rename(5).valid} rename5_id=${rename(5).producerTag.id} rename5_gen=${rename(5).producerTag.generation} p1_valid=${producers(1).valid} p1_ready=${producers(1).ready} p1_value=${producers(1).value} comp_valid=${io.completion.valid} comp_has=${io.completion.bits.hasValue} comp_id=${io.completion.bits.producerTag.id} comp_gen=${io.completion.bits.producerTag.generation} comp_value=${io.completion.bits.value} alloc_valid=${io.allocate.valid} alloc_rs1=${io.allocate.bits.decoded.rs1} alloc_ready=${allocateRs1.ready} alloc_value=${allocateRs1.value} committed=${io.committedRs1} retire=${io.retire.valid} recovery=${io.recovery.valid} rebuild=${rebuildBusy}\\n")
          }

'''
          if text.count(needle) != 1:
              raise SystemExit('unexpected slotView anchor count')
          path.write_text(text.replace(needle, trace + needle))
          PY

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore exact fixed Verilator cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}

      - name: Configure diagnostic build directory
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          root="$RUNNER_TEMP/aethercore-v2-p82-trace"
          mkdir -p "$root/mill-out"
          echo "MILL_OUTPUT_DIR=$root/mill-out" >> "$GITHUB_ENV"

      - name: Revalidate fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Compile diagnostic test surface
        shell: bash
        run: |
          set -euo pipefail
          ./mill aethercore.test.compile

      - name: Run backend release trace
        shell: bash
        run: |
          set -euo pipefail
          ./mill aethercore.test.testOnly \
            aethercore.core.v2.V2P82RecoveryRebuildSpec
