name: AetherCore V2 P8.2 Stable Observation Diagnostic

on:
  push:
    branches:
      - 'arch/aethercore-v2-p8-2-generalized-recovery'
    paths:
      - '.github/workflows/v2-p8-2-producer-trace.yml'

permissions:
  contents: read
  statuses: write

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish diagnostic run identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/status.json
          import json, os
          print(json.dumps({
            'state': 'pending',
            'context': 'aethercore/v2-p8.2-producer-trace',
            'description': 'stable-cycle backend observation A/B',
            'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl -fsS -L -X POST -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data-binary @/tmp/status.json

  verilator-tool:
    uses: ./.github/workflows/hosted-verilator-cache.yml

  test:
    name: Test stable-cycle backend observation
    needs: [announce, verilator-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TARGET_SHA: ${{ github.sha }}
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          clean: true

      - name: Apply checkout-only stable observation variant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/test/scala/aethercore/V2P82RecoveryRebuildSpec.scala')
          s = p.read_text()
          old = '''        dut.io.schedulingWindow(0).uop.robToken.index.expect(branch.index.U)
        dut.io.schedulingWindow(1).uop.robToken.index.expect(consumer.index.U)
        dut.io.schedulingWindow(1).dependenciesValid.expect(true.B)
        // Diagnose mapping ownership before value storage. If these fail, RAT
        // rebuild did not restore the surviving Branch; if they pass but value
        // fails, the mapping is correct and producer value retention is wrong.
        dut.io.schedulingWindow(1).rs1.producerTag.id.expect(branch.producerId.U)
        dut.io.schedulingWindow(1).rs1.producerTag.generation.expect(branch.producerGeneration.U)
        dut.io.schedulingWindow(1).rs1.ready.expect(true.B)
        dut.io.schedulingWindow(1).rs1.value.expect(link.U)

        // The killed WAW's late completion cannot wake or complete the reused
        // physical slot after generation advance.
        pokeCompletion(dut, killedWaw, hasValue = true, value = 99)
        dut.io.acceptedRecovery.valid.expect(false.B)
        dut.clock.step()
        dut.io.completion.valid.poke(false.B)
        dut.io.schedulingWindow(1).complete.expect(false.B)
        dut.io.schedulingWindow(1).rs1.value.expect(link.U)
'''
          new = '''        // The direct dependency-state proof covers the retire+allocate edge.
        // Observe the backend scheduling projection on the next stable cycle,
        // after the completed surviving Branch retires and the consumer becomes head.
        dut.clock.step()
        dut.io.schedulingWindow(0).uop.robToken.index.expect(consumer.index.U)
        dut.io.schedulingWindow(0).dependenciesValid.expect(true.B)
        dut.io.schedulingWindow(0).rs1.producerTag.id.expect(branch.producerId.U)
        dut.io.schedulingWindow(0).rs1.producerTag.generation.expect(branch.producerGeneration.U)
        dut.io.schedulingWindow(0).rs1.ready.expect(true.B)
        dut.io.schedulingWindow(0).rs1.value.expect(link.U)

        // The killed WAW's late completion cannot wake or complete the reused
        // physical slot after generation advance.
        pokeCompletion(dut, killedWaw, hasValue = true, value = 99)
        dut.io.acceptedRecovery.valid.expect(false.B)
        dut.clock.step()
        dut.io.completion.valid.poke(false.B)
        dut.io.schedulingWindow(0).complete.expect(false.B)
        dut.io.schedulingWindow(0).rs1.value.expect(link.U)
'''
          if s.count(old) != 1:
            raise SystemExit('unexpected backend observation anchor')
          p.write_text(s.replace(old, new))
          PY

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}

      - name: Run exact recovery case with stable observation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          root="$RUNNER_TEMP/aethercore-v2-p82-stable-observation"
          mkdir -p "$root/mill-out"
          export MILL_OUTPUT_DIR="$root/mill-out"
          bash tools/ensure_verilator_5_024.sh
          ./mill aethercore.test.testOnly aethercore.core.v2.V2P82RecoveryRebuildSpec
