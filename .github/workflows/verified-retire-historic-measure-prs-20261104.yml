name: Verified retire eight archived historic measurement PRs (2026-11-04)
on:
  push:
    branches:
      - maintenance/verified-branch-prune-20261104
    paths:
      - .github/workflows/verified-retire-historic-measure-prs-20261104.yml
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: verified-measure-retire-20261104
  cancel-in-progress: false
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout only maintenance ref for exact SHA lease deletion
        uses: actions/checkout@v4
        with:
          ref: maintenance/verified-branch-prune-20261104
          fetch-depth: 1
          persist-credentials: true
      - name: Preflight all eight, close unmerged, then lease-delete only archived tips
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            if(owner!=='yituanxing'||repo!=='minicore'||context.ref!=='refs/heads/maintenance/verified-branch-prune-20261104')
              throw new Error('Unexpected context');
            const main="7ff35c6acdc3068754292bba814e4ec52ba4ec50",product="087a3ed9588c8fe4ff99b682957f3adbe70230aa";
            const prefix='branch-archive/2026-11-04/historic-measure-prs-259-292/';
            const targets=[[259,"measure/aethersoc-post-pmp-full-area","b748c2901bddd5929078c0c25d30d20581fe8fb1"],[260,"measure/aethersoc-post-pmp-hier-area","dd1a6d275ea1dde3090d8c26a1e66761c8b0c037"],[261,"measure/aethersoc-v0-post-pmp-full-area","2d61b8f6e24799a4739d73144a6cec8ae067fa22"],[287,"measure/aethersoc-current-hier-area","dd37d580b007adc53ec312c35c89d6b9c31024ea"],[288,"measure/current-area-heatmap","62ab02d9983c4d272a6c209811088265cdd9d885"],[290,"measure/current-main-area-census","307f4d4f29526af333600cb37c62211008ca6df4"],[291,"measure/current-main-hierarchy-area","ed9191e8c6ceaef6cab9ad0415d2c1b5d19120c2"],[292,"measure/current-main-hierarchy-census","c1b26b82ce6103014548e53cdcb1284efd9011d6"]];
            const cp=require('child_process');
            const retry=async(label,fn)=>{
              for(let n=0;n<5;n++){
                try{return await fn();}
                catch(e){
                  const transient=e.status===429||e.status>=500||/fetch failed|ECONNRESET|ETIMEDOUT|socket hang up/i.test(String(e.message||''));
                  if(!transient||n===4)throw e;
                  console.log('TRANSIENT_READ_RETRY',label,n+1);
                  await new Promise(resolve=>setTimeout(resolve,500*(2**n)));
                }
              }
            };
            const ref=async s=>(await retry('getRef '+s,()=>github.rest.git.getRef({owner,repo,ref:s}))).data;
            const getPR=async n=>(await retry('getPR '+n,()=>github.rest.pulls.get({owner,repo,pull_number:n}))).data;
            const openPRs=async()=>retry('openPRs',()=>github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100}));
            const pin=async()=>{
              const m=(await ref('heads/main')).object.sha,p=(await ref('heads/design/rv64gc-product-architecture-20261103')).object.sha;
              if(m!==main||p!==product)throw new Error('main/Product moved '+m+'/'+p);
            };
            const external=async(name,n)=>(await openPRs()).some(p=>p.number!==n&&(p.head.ref===name||p.base.ref===name));
            const active=async(name,n)=>{
              for(const status of ['queued','in_progress','waiting','pending','requested']){
                const runs=await retry('runs '+status,()=>github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,status,per_page:100}));
                if(runs.some(r=>r.head_branch===name||(r.pull_requests||[]).some(p=>p.number===n)))
                  throw new Error('Real active CI #'+n+' status='+status);
              }
            };
            const archiveSHA=async name=>(await ref('tags/'+prefix+name)).object.sha;
            const checkOne=async(n,name,sha,allowDeleted)=>{
              const p=await getPR(n);
              if(!['open','closed'].includes(p.state)||p.merged_at||p.base.ref!=='main'||p.head.ref!==name||
                 p.head.sha!==sha||p.head.repo?.full_name!==owner+'/'+repo)
                throw new Error('Changed PR metadata #'+n);
              if(await external(name,n))throw new Error('Another open PR depends on #'+n);
              if(await archiveSHA(name)!==sha)throw new Error('Archive missing or wrong #'+n);
              const cmp=(await retry('compare '+name,()=>github.rest.repos.compareCommits({owner,repo,base:main,head:sha}))).data;
              if(cmp.ahead_by!==1||!['diverged','ahead'].includes(cmp.status))
                throw new Error('Unexpected unique history #'+n);
              const files=await retry('PR files '+n,()=>github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:n,per_page:100}));
              if(files.length!==1||!files[0].filename.startsWith('.github/workflows/'))
                throw new Error('Changed file scope #'+n);
              await active(name,n);
              let exists=true;
              try{
                const b=(await retry('branch '+name,()=>github.rest.repos.getBranch({owner,repo,branch:name}))).data;
                if(b.protected||b.commit.sha!==sha)throw new Error('Branch protected/moved #'+n);
              }catch(e){if(e.status!==404||!allowDeleted||p.state!=='closed')throw e;exists=false;}
              return{p,exists};
            };
            await pin();
            let previousClosed=0,previousDeleted=0;
            for(const [n,name,sha] of targets){
              const check=await checkOne(n,name,sha,true);
              if(check.p.state==='closed')previousClosed++;
              if(!check.exists)previousDeleted++;
              console.log('SAFE_PREFLIGHT',n,name,sha,check.p.state,check.exists?'branch_live':'branch_gone');
            }
            console.log('MEASURE_RETIRE_PREFLIGHT_ALL_PASS',targets.length,'prev_closed',previousClosed,'prev_deleted',previousDeleted);
            await pin();
            let closed=0;
            for(const [n,name,sha] of targets){
              const check=await checkOne(n,name,sha,true);
              if(check.p.state==='closed'){console.log('ALREADY_CLOSED',n);continue;}
              if(!check.exists)throw new Error('Unexpected missing open branch #'+n);
              await pin();
              await github.rest.pulls.update({owner,repo,pull_number:n,state:'closed'});
              const p=await getPR(n);
              if(p.state!=='closed'||p.merged_at)throw new Error('Closure failed #'+n);
              closed++;console.log('CLOSED_UNMERGED',n,name,sha);
            }
            console.log('MEASURE_CLOSE_ALL_PASS','new='+closed,'previous='+previousClosed);
            await pin();
            let deleted=0,alreadyDeleted=0;
            for(const [n,name,sha] of targets){
              const check=await checkOne(n,name,sha,true);
              if(check.p.state!=='closed')throw new Error('PR reopened #'+n);
              await pin();
              if(!check.exists){alreadyDeleted++;console.log('ALREADY_DELETED',n);continue;}
              if((await ref('heads/'+name)).object.sha!==sha)throw new Error('Head moved '+name);
              const args=['push','--force-with-lease=refs/heads/'+name+':'+sha,'origin',':refs/heads/'+name];
              try{cp.execFileSync('git',args,{cwd:process.env.GITHUB_WORKSPACE,encoding:'utf8',timeout:60000});}
              catch(e){throw new Error('CAS deletion refused '+name+' '+String(e.stderr||e.message).slice(0,500));}
              let gone=false;
              for(let k=0;k<8;k++){
                try{await ref('heads/'+name);}
                catch(e){if(e.status!==404)throw e;gone=true;break;}
                if(k<7)await new Promise(resolve=>setTimeout(resolve,1500));
              }
              if(!gone)throw new Error('Ref not absent '+name);
              if(await archiveSHA(name)!==sha)throw new Error('Archive moved after deletion '+name);
              deleted++;console.log('CAS_DELETED',n,name,sha);
            }
            await pin();
            if(closed+previousClosed!==targets.length||deleted+alreadyDeleted!==targets.length)
              throw new Error('Final count mismatch');
            console.log('MEASURE_RETIRE_DONE','closed='+closed,'deleted='+deleted,'previous_closed='+previousClosed,'previous_deleted='+alreadyDeleted,'archives_verified='+targets.length);
