name: Dual Load LSU FPGA Area

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/core/v2/TinyBlockingLsu.scala'
      - 'src/main/scala/aethercore/core/v2/TinyDualReplaySafeLoadUnit.scala'
      - 'src/main/scala/aethercore/ElaborateDualLoadArea.scala'
      - '.github/workflows/v2-dual-load-lsu-area.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-
      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
      - name: Elaborate both LSU shapes
        run: |
          set -euo pipefail
          chmod +x mill
          out="$RUNNER_TEMP/dual-load-area"
          rm -rf "$out"
          mkdir -p "$out/single" "$out/dual"
          ./mill aethercore.runMain aethercore.ElaborateTinyBlockingLsuSynthesisRV64 --target-dir "$out/single"
          ./mill aethercore.runMain aethercore.ElaborateTinyDualReplaySafeLoadUnitSynthesisRV64 --target-dir "$out/dual"
          echo "AREA_OUT=$out" >> "$GITHUB_ENV"
      - name: Map both shapes
        shell: bash
        run: |
          set -euo pipefail
          map_one() {
            dir="$1"
            top="$2"
            out="$3"
            mapfile -t svs < <(find "$dir" -maxdepth 1 -name '*.sv' -print | sort)
            read_cmd="read_verilog -sv -DSYNTHESIS"
            for sv in "${svs[@]}"; do read_cmd+=" $sv"; done
            yosys -Q -p "$read_cmd; hierarchy -check -top $top; synth_ecp5 -top $top -json $out.json; stat -top $top" 2>&1 | tee "$out.log"
          }
          map_one "$AREA_OUT/single" TinyBlockingLsu "$AREA_OUT/single-map"
          map_one "$AREA_OUT/dual" TinyDualReplaySafeLoadUnit "$AREA_OUT/dual-map"
          python3 - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          root=Path(os.environ["AREA_OUT"])
          def summary(path, top):
              net=json.loads(path.read_text())
              t=Counter(c["type"] for c in net["modules"][top]["cells"].values())
              return {
                  "cells": sum(t.values()),
                  "lut4": t["LUT4"],
                  "ff": t["TRELLIS_FF"],
                  "dpr16x4": t["TRELLIS_DPR16X4"],
                  "bram": t["DP16KD"],
                  "mult": t["MULT18X18D"],
                  "pfumx": t["PFUMX"],
                  "l6mux21": t["L6MUX21"],
              }
          data={
              "single": summary(root/"single-map.json","TinyBlockingLsu"),
              "dual": summary(root/"dual-map.json","TinyDualReplaySafeLoadUnit"),
          }
          data["dual_minus_2x_single"]={k:data["dual"][k]-2*data["single"][k] for k in data["single"]}
          (root/"summary.json").write_text(json.dumps(data, indent=2)+"\n")
          print(json.dumps(data, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-load-lsu-area-${{ github.run_id }}
          retention-days: 14
          path: |
            ${{ env.AREA_OUT }}/summary.json
            ${{ env.AREA_OUT }}/*.log
