name: Verified close 23 archived dormant PRs while retaining branch refs (2026-11-04)
on:
  push:
    branches:
      - maintenance/verified-branch-prune-20261104
    paths:
      - .github/workflows/verified-close-remaining23-20261104.yml
permissions:
  contents: read
  pull-requests: write
  actions: read
concurrency:
  group: verified-close-remaining23-20261104
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact SHA archival manifest
        uses: actions/checkout@v4
        with:
          ref: maintenance/verified-branch-prune-20261104
          fetch-depth: 1
          persist-credentials: false
      - name: Reverify 23 immutable tags and close only dormant PRs leaf-to-root
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            if(owner!=='yituanxing'||repo!=='minicore'||context.ref!=='refs/heads/maintenance/verified-branch-prune-20261104')
              throw new Error('Wrong repository/ref');
            const fs=require('fs');
            const manifest=JSON.parse(fs.readFileSync('maintenance/remaining23-historic-pr-manifest-20261104.json','utf8'));
            const evidence=JSON.parse(fs.readFileSync('maintenance/remaining23-ci-evidence-20261104.json','utf8'));
            const main='7ff35c6acdc3068754292bba814e4ec52ba4ec50';
            const product='087a3ed9588c8fe4ff99b682957f3adbe70230aa';
            const prefix='branch-archive/2026-11-04/remaining23/';
            const keep=new Set([379,378,73,72,71,70,69,49,45,44,43,42,41,40]);
            if(manifest.repository!==owner+'/'+repo||manifest.total!==23||
               manifest.targets?.length!==23||manifest.main_pin!==main||
               manifest.product_pin!==product||evidence.total_heads!==23||
               evidence.entries?.length!==23||evidence.aggregate_runs!==652||
               manifest.preserve_open_prs?.length!==14||
               manifest.preserve_open_prs.some(n=>!keep.has(n)))
              throw new Error('Manifest/CI evidence mismatch');
            const targets=manifest.targets,byPR=new Map(targets.map(t=>[t.pr,t]));
            const byHead=new Map(targets.map(t=>[t.head,t]));
            if(byPR.size!==23||byHead.size!==23||targets.some(t=>!/^[a-f0-9]{40}$/.test(t.sha)))
              throw new Error('Duplicated/invalid cohort');
            const retry=async(label,fn)=>{
              for(let i=0;i<5;i++){
                try{return await fn();}
                catch(e){
                  const transient=e.status===429||e.status>=500||/fetch failed|ECONNRESET|ETIMEDOUT|socket hang up/i.test(String(e.message||''));
                  if(!transient||i===4)throw e;
                  console.log('RETRY',label,i+1);
                  await new Promise(ok=>setTimeout(ok,500*(2**i)));
                }
              }
            };
            const ref=async n=>(await retry('ref '+n,()=>github.rest.git.getRef({owner,repo,ref:n}))).data;
            const getPR=async n=>(await retry('PR '+n,()=>github.rest.pulls.get({owner,repo,pull_number:n}))).data;
            const pins=async()=>{
              if((await ref('heads/main')).object.sha!==main||
                 (await ref('heads/design/rv64gc-product-architecture-20261103')).object.sha!==product)
                throw new Error('main/Product moved');
            };
            const archive=async t=>{
              if((await ref('tags/'+prefix+t.head)).object.sha!==t.sha)
                throw new Error('Archive SHA changed #'+t.pr);
            };
            const open=await retry('open PRs',()=>github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100}));
            if(open.filter(p=>keep.has(p.number)).length!==14||
               open.some(p=>!keep.has(p.number)&&!byPR.has(p.number)))
              throw new Error('Protected active PR cohort changed');
            if(open.some(p=>!byPR.has(p.number)&&(byHead.has(p.head.ref)||byHead.has(p.base.ref))))
              throw new Error('External PR dependency');
            await pins();
            let initialOpen=0;
            for(const t of targets){
              const p=await getPR(t.pr);
              if(!['open','closed'].includes(p.state)||p.merged_at||
                 p.head.repo?.full_name!==owner+'/'+repo||
                 p.head.ref!==t.head||p.head.sha!==t.sha||p.base.ref!==t.base)
                throw new Error('Historic PR moved/merged #'+t.pr);
              if(p.state==='open'){
                initialOpen++;
                if(Date.parse(p.updated_at)>Date.parse('2026-09-10T00:00:00Z'))
                  throw new Error('New activity on PR #'+t.pr);
              }
              if((await ref('heads/'+t.head)).object.sha!==t.sha||
                 (await ref('heads/'+t.base)).object.sha!==t.base_current_sha)
                throw new Error('Branch/base moved #'+t.pr);
              await archive(t);
            }
            for(const status of ['queued','in_progress','waiting','pending','requested']){
              const runs=await retry('active '+status,()=>github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,{owner,repo,status,per_page:100}));
              if(runs.some(r=>byHead.has(r.head_branch)||(r.pull_requests||[]).some(p=>byPR.has(p.number))))
                throw new Error('Active CI on historic 23 '+status);
            }
            const depths=new Map();
            const depth=(t,visiting=new Set())=>{
              if(depths.has(t.pr))return depths.get(t.pr);
              if(visiting.has(t.pr))throw new Error('PR dependency cycle');
              visiting.add(t.pr);
              const d=byHead.has(t.base)?1+depth(byHead.get(t.base),visiting):1;
              visiting.delete(t.pr);
              depths.set(t.pr,d);
              return d;
            };
            const sorted=targets.slice().sort((a,b)=>depth(b)-depth(a)||b.pr-a.pr);
            console.log('REMAINING23_CLOSE_PREFLIGHT_ALL_PASS','to_close='+initialOpen,
                        'already_closed='+(23-initialOpen),'active_protected=14','archives=23');
            let closed=0,already=0;
            for(let i=0;i<sorted.length;i++){
              const t=sorted[i];
              if(i%5===0)await pins();
              const p=await getPR(t.pr);
              if(!['open','closed'].includes(p.state)||p.merged_at||
                 p.head.ref!==t.head||p.head.sha!==t.sha||p.base.ref!==t.base)
                throw new Error('PR changed during close '+t.pr);
              await archive(t);
              if((await ref('heads/'+t.head)).object.sha!==t.sha)
                throw new Error('Original source branch changed '+t.pr);
              if(p.state==='closed'){already++;continue;}
              if(Date.parse(p.updated_at)>Date.parse('2026-09-10T00:00:00Z'))
                throw new Error('PR became active '+t.pr);
              await retry('close '+t.pr,()=>github.rest.pulls.update({owner,repo,pull_number:t.pr,state:'closed'}));
              const after=await getPR(t.pr);
              if(after.state!=='closed'||after.merged_at||after.head.sha!==t.sha)
                throw new Error('Closing PR failed '+t.pr);
              closed++;
              console.log('REMAINING23_CLOSED_UNMERGED',i+1,t.pr,t.head,t.sha);
            }
            await pins();
            for(const t of targets){
              const p=await getPR(t.pr);
              if(p.state!=='closed'||p.merged_at||p.head.sha!==t.sha||
                 (await ref('heads/'+t.head)).object.sha!==t.sha)
                throw new Error('Historic branch/PR corrupted '+t.pr);
              await archive(t);
            }
            const still=await retry('final open PRs',()=>github.paginate(
              github.rest.pulls.list,{owner,repo,state:'open',per_page:100}));
            if(still.length!==14||still.some(p=>!keep.has(p.number)||byHead.has(p.head.ref)||byHead.has(p.base.ref))||
               still.filter(p=>keep.has(p.number)).length!==14)
              throw new Error('Remaining active PR set not exactly 14');
            if(closed+already!==23)throw new Error('Closure count mismatch');
            console.log('REMAINING23_CLOSE_DONE','closed='+closed,'already='+already,
                        'open_prs=14','archive_tags_verified=23','branches_deleted=0');
