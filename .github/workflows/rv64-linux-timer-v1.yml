name: RV64 Linux Timer V1

on:
  push:
    branches:
      - explore/rv64-linux-timer-v1
  pull_request:
    paths:
      - 'src/main/scala/aethercore/config/CoreConfig.scala'
      - 'src/main/scala/aethercore/core/AetherCore.scala'
      - 'src/main/scala/aethercore/core/MachineCsrFile.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreOpenSbiSimTop.scala'
      - 'src/test/scala/aethercore/LegacySupervisorTimerSpec.scala'
      - '.github/workflows/rv64-linux-timer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rv64-linux-timer-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-timer:
    name: Legacy STIP and inherited supervisor timer contracts
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 30
    env:
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head without deleting persistent caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ -d .git ]]; then
            git clean -fd -- src/main/scala src/test/scala .github/workflows || true
          else
            git init .
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags --prune --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$TARGET_SHA" ]] || {
            echo "ERROR: exact-head checkout mismatch: expected=$TARGET_SHA actual=$actual" >&2
            exit 1
          }
          chmod +x ./mill
          echo "exact_head=$actual"

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Run focused legacy supervisor timer regression
        shell: bash
        run: ./mill aethercore.test.testOnly aethercore.LegacySupervisorTimerSpec

      - name: Preserve frozen Supervisor V1 boundary
        shell: bash
        run: ./mill aethercore.test.testOnly aethercore.SupervisorModeSpec

      - name: Preserve existing RV32 Sstc timer path
        shell: bash
        run: ./mill aethercore.test.testOnly aethercore.Rv32SstcCsrSpec

      - name: Write focused qualification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## RV64 legacy supervisor timer focused gate'
            echo
            echo "- exact head: \`${TARGET_SHA}\`"
            echo '- new path: M-mode software mip.STIP -> delegated supervisor timer interrupt'
            echo '- preserved path: RV32 Sstc stimecmp-driven STIP'
            echo '- preserved boundary: minimal Supervisor V1 profile remains without supervisor interrupts'
          } >> "$GITHUB_STEP_SUMMARY"
