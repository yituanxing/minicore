name: RV64 Linux Timer V1

on:
  push:
    branches:
      - explore/rv64-linux-timer-v1
  pull_request:
    paths:
      - 'Makefile.l32-linux-boot'
      - 'sim/opensbi_boot_main.cpp'
      - 'src/main/scala/aethercore/config/CoreConfig.scala'
      - 'src/main/scala/aethercore/core/AetherCore.scala'
      - 'src/main/scala/aethercore/core/MachineCsrFile.scala'
      - 'src/main/scala/aethercore/sim/AetherCoreOpenSbiSimTop.scala'
      - 'src/test/scala/aethercore/LegacySupervisorTimerSpec.scala'
      - '.github/workflows/rv64-linux-timer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rv64-linux-timer-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-timer:
    name: Legacy STIP and real Linux supervisor timer
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 30
    env:
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head without deleting persistent caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if [[ -d .git ]]; then
            git clean -fd -- src/main/scala src/test/scala sim tools/ci .github/workflows || true
          else
            git init .
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            fetch --no-tags --prune --depth=1 origin "$TARGET_SHA"
          git checkout --detach --force FETCH_HEAD
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == "$TARGET_SHA" ]] || {
            echo "ERROR: exact-head checkout mismatch: expected=$TARGET_SHA actual=$actual" >&2
            exit 1
          }
          chmod +x ./mill
          echo "exact_head=$actual"

      - name: Provision fixed Verilator
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Run focused legacy supervisor timer regression
        shell: bash
        run: ./mill aethercore.test.testOnly aethercore.LegacySupervisorTimerSpec

      - name: Preserve frozen Supervisor V1 boundary
        shell: bash
        run: ./mill aethercore.test.testOnly aethercore.SupervisorModeSpec

      - name: Preserve existing RV32 Sstc timer path
        shell: bash
        run: ./mill aethercore.test.testOnly aethercore.Rv32SstcCsrSpec

      - name: Provision pinned RV64 Linux-target GCC
        shell: bash
        run: bash tools/ensure_riscv64_linux_gcc_13_3.sh

      - name: Build unchanged Linux 6.6.143 and unchanged OpenSBI 1.6
        shell: bash
        env:
          RV64_LINUX_JOBS: '6'
        run: |
          set -euo pipefail
          bash tools/ci/rv64_linux_early_build.sh
          grep -q '^RV64_LINUX_EARLY_BUILD_RESULT: status=PASS$' build/rv64-linux-early/result.txt

      - name: Execute real RV64 Linux supervisor timer probe
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-boot \
            BUILD_DIR=build/rv64-linux-timer \
            TOP=AetherCoreOpenSbiRV64SimTop \
            ELABORATE_MAIN=aethercore.ElaborateOpenSbiRV64 \
            FW_BIN=build/rv64-linux-early/opensbi/platform/generic/firmware/fw_payload.bin \
            MAX_CYCLES=50000000 \
            MILESTONE='Linux version 6.6.143' \
            MIN_INTERRUPTS=1 \
            MIN_STIP=1 \
            PROGRESS_INTERVAL_CYCLES=5000000 \
            VERILATOR='verilator -LDFLAGS -ldl' \
            SIM_CXXFLAGS="-std=c++20 -O3 -march=native -I$GITHUB_WORKSPACE/sim/rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim" \
            run-local

          log=build/rv64-linux-timer/logs/boot-probe.log
          grep -Fq 'OpenSBI v1.6' "$log"
          grep -Fq '[    0.000000] Linux version 6.6.143' "$log"
          grep -Fq 'Boot HART MIDELEG           : 0x0000000000000220' "$log"
          grep -Fq 'L32_FIRST_SUPERVISOR_TIMER_INTERRUPT' "$log"
          grep -Eq 'L32_FIRST_SUPERVISOR_TIMER_INTERRUPT .*cause=0x8000000000000005' "$log"
          grep -Eq 'L32_RUNTIME_MILESTONE_PASS .*stip=[1-9][0-9]* .*min-stip=1' "$log"

      - name: Write qualification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## RV64 Linux Timer V1'
            echo
            echo "- exact head: \`${TARGET_SHA}\`"
            echo '- focused path: M-mode software mip.STIP -> delegated supervisor timer interrupt cause 5'
            echo '- preserved path: RV32 Sstc stimecmp-driven STIP'
            echo '- preserved boundary: minimal Supervisor V1 profile remains without supervisor interrupts'
            echo '- real software: unchanged OpenSBI 1.6 + unchanged Linux 6.6.143'
            echo '- acceptance: Linux banner plus retired RV64 supervisor timer interrupt'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish qualification commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='RV64 Linux supervisor timer qualification failed'
          if [[ "$JOB_STATUS" == success ]]; then
            state=success
            description='RV64 Linux supervisor timer qualification passed'
          fi
          payload="$(printf '{\"state\":\"%s\",\"context\":\"rv64-linux-timer-v1/qualification\",\"description\":\"%s\",\"target_url\":\"%s/%s/actions/runs/%s\"}' \
            "$state" "$description" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "$payload"
