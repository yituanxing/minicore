name: AetherCore V2 F7 Linux Interrupt Observer Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/aethercore-v2-f7-software-parity
    paths:
      - '.github/workflows/v2-f7-linux-observer-probe.yml'
      - '.github/v2-f7-linux-observer-request'

permissions:
  contents: read
  statuses: write

concurrency:
  group: aethercore-v2-f7-linux-observer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Unchanged Linux clocksource/STIP with boundary-event observer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.sha }}
      STATUS_CONTEXT: AetherCore V2 F7 Interrupt Observer Probe
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      RV64_LINUX_JOBS: '4'

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true

      - name: Publish pending exact-head status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"$STATUS_CONTEXT\",\"description\":\"Linux clocksource/STIP observer contract probe running\",\"target_url\":\"$target_url\"}"

      - name: Verify exact head and install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          chmod +x ./mill tools/ensure_verilator_5_024.sh \
            tools/ensure_riscv64_linux_gcc_13_3.sh tools/ci/rv64_linux_early_build.sh
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev bison flex bc \
            libssl-dev libelf-dev build-essential pkg-config curl xz-utils git \
            python3 openjdk-17-jdk-headless device-tree-compiler dwarves
          root="$RUNNER_TEMP/aethercore-v2-f7-linux-observer"
          mkdir -p "$root/mill-out"
          echo "MILL_OUTPUT_DIR=$root/mill-out" >> "$GITHUB_ENV"

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore v2 Mill output accelerator
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/aethercore-v2-f7-linux-observer/mill-out
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-v2-linux-observer-millout-v1-${{ github.sha }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-v2-opensbi-millout-v1-
            aethercore-${{ runner.os }}-${{ runner.arch }}-v2-f7-millout-v1-

      - name: Restore fixed Verilator cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b7b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-

      - name: Restore pinned RV64 Linux GCC cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/bootlin-riscv64-lp64d-glibc-stable-2024.05-1
            ~/.cache/aethercore/toolchains/downloads/riscv64-lp64d--glibc--stable-2024.05-1.tar.xz
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-v1-${{ hashFiles('tools/ensure_riscv64_linux_gcc_13_3.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-gcc-v1-

      - name: Restore qualified RV64 Linux/OpenSBI cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/rv64/linux
            ~/.cache/aethercore/rv64/linux-build
            ~/.cache/aethercore/l32/opensbi
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v2-${{ hashFiles('software/rv64/linux_early.env', 'software/rv64/opensbi_first_exec.env', 'tools/ci/rv64_linux_early_build.sh', 'tools/ensure_riscv64_linux_gcc_13_3.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v2-
            aethercore-${{ runner.os }}-${{ runner.arch }}-rv64-linux-v1-

      - name: Validate tools and reuse unchanged Linux/OpenSBI
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ensure_verilator_5_024.sh
          bash tools/ensure_riscv64_linux_gcc_13_3.sh
          bash tools/ci/rv64_linux_early_build.sh
          grep -q '^RV64_LINUX_EARLY_BUILD_RESULT: status=PASS$' build/rv64-linux-early/result.txt
          grep -q '^linux_version=6.6.143$' build/rv64-linux-early/result.txt

      - name: Patch only the host observer contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sim/opensbi_boot_main.cpp')
          s = p.read_text()
          head = '        if (top.io_commit_interrupt) {\n'
          tail = '        }\n      }\n\n      const bool inputSatisfied = uartInput.empty() ||'
          assert s.count(head) == 1, s.count(head)
          assert s.count(tail) == 1, s.count(tail)
          s = s.replace(head, '      }\n\n      if (top.io_commit_interrupt) {\n', 1)
          s = s.replace(tail, '        }\n\n      const bool inputSatisfied = uartInput.empty() ||', 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- sim/opensbi_boot_main.cpp

      - name: Execute unchanged Linux clocksource and STIP through F7 v2
        shell: bash
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-boot \
            BUILD_DIR="$RUNNER_TEMP/aethercore-v2-f7-linux-observer/sim" \
            TOP=AetherCoreV2OpenSbiRV64SimTop \
            ELABORATE_MAIN=aethercore.ElaborateV2OpenSbiRV64 \
            FW_BIN=build/rv64-linux-early/opensbi/platform/generic/firmware/fw_payload.bin \
            JOBS="$(nproc)" \
            MAX_CYCLES=120000000 \
            MILESTONE='clocksource: riscv_clocksource' \
            MIN_INTERRUPTS=1 MIN_STIP=1 MIN_SEIP=0 \
            PROGRESS_INTERVAL_CYCLES=5000000 \
            VERILATOR='verilator -LDFLAGS -ldl' \
            SIM_CXXFLAGS="-std=c++20 -O3 -march=native -I$GITHUB_WORKSPACE/sim/v2_rv64_opensbi_shim -I$GITHUB_WORKSPACE/sim" \
            run-local

      - name: Publish successful exact-head status
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "{\"state\":\"success\",\"context\":\"$STATUS_CONTEXT\",\"description\":\"Boundary observer sees unchanged Linux clocksource/STIP\",\"target_url\":\"$target_url\"}"

      - name: Publish failed exact-head status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"$STATUS_CONTEXT\",\"description\":\"Boundary observer probe failed; inspect exact frontier\",\"target_url\":\"$target_url\"}"

      - name: Upload exact probe evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-v2-f7-linux-observer-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/rv64-linux-early/result.txt
            ${{ runner.temp }}/aethercore-v2-f7-linux-observer/sim/logs/boot-probe.log
            ${{ runner.temp }}/aethercore-v2-f7-linux-observer/sim/logs/verilator-build.log
