# Experimental same-artifact QEMU <-> Product G5 subset parity only.
# This is NOT a full CPU DiffTest, full QEMU handoff, Linux boot, or SD1 PASS.
name: Product G5 same QEMU RAM 64 integer retires partial DiffTest

on:
  push:
    branches:
      - experiment/c1-arch-handoff-20261108
    paths:
      - '.github/workflows/product-c1-g5-qemu-paired64-integer-diff.yml'
      - 'sim/product_c1_g5_qemu_paired64_diff_main.cpp'
      - 'sim/product_c1_g5_qemu_ram_first_retire_main.cpp'
      - 'tools/ci/product_c1_arch_relay/qemu_paired64_source.py'
      - 'tests_py/test_product_c1_g5_qemu_paired64_source.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: product-c1-g5-qemu-paired64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  true-g5-qemu-exact-ram-integer64-subset:
    if: github.ref == 'refs/heads/experiment/c1-arch-handoff-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      AETHERCORE_MILL_NO_DAEMON: '1'
      AETHERCORE_VERILATOR_VERSION: '5.054'
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
      VERILATOR_THREADS: '1'
      JOBS: '4'
      OUT: build/product-c1-g5-qemu-paired64
      SOURCE_RUN: '42494943014'
      SOURCE_SHA: a50321281da59cb181f5af5a04db96e0440dea1f
      SOURCE_JOB: capture-paired-qemu-only-retire-sequence
      SOURCE_ARTIFACT_ID: '13622748390'
      SOURCE_ARTIFACT_NAME: product-c1-qemu-sv39-paired-64-step-oracle-42494943014
      SOURCE_ZIP_SHA256: bfcea3240b72e846bff85baf98301f424e233ce1f9737868b2df29020e106cfb
      SOURCE_RAM_SHA256: c7912452a249352d16fdda53a30450f3a457773e9805182011bd51b255b20983

    steps:
      - name: Checkout isolated experiment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Authenticate exact successful QEMU source run and artifact
        run: |
          set -euo pipefail
          mkdir -p "$OUT/logs" "$OUT/source"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > "$OUT/logs/source-run.json"
          jq -e --arg sha "$SOURCE_SHA" --argjson id "$SOURCE_RUN" '
            .id == $id and .run_attempt == 1 and .head_sha == $sha and
            .head_branch == "experiment/c1-arch-handoff-20261108" and
            .event == "push" and .status == "completed" and
            .conclusion == "success" and
            .path == ".github/workflows/product-c1-qemu-multiretire-oracle.yml"
          ' "$OUT/logs/source-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?per_page=100" \
            > "$OUT/logs/source-jobs.json"
          jq -e --arg job "$SOURCE_JOB" '
            [.jobs[] | select(.name == $job and .conclusion == "success" and
              .status == "completed")] | length == 1
          ' "$OUT/logs/source-jobs.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            > "$OUT/logs/source-artifact.json"
          jq -e --arg name "$SOURCE_ARTIFACT_NAME" \
            --arg sha "sha256:$SOURCE_ZIP_SHA256" --argjson id "$SOURCE_ARTIFACT_ID" \
            --argjson run "$SOURCE_RUN" '
            .id == $id and .name == $name and .digest == $sha and
            .expired == false and .workflow_run.id == $run
          ' "$OUT/logs/source-artifact.json" >/dev/null

      - name: Download exact QEMU 64 trace and DDR from ONE artifact
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            -o "$OUT/source.zip"
          test "$(sha256sum "$OUT/source.zip" | cut -d' ' -f1)" == "$SOURCE_ZIP_SHA256"
          unzip -qq "$OUT/source.zip" -d "$OUT/source"
          test "$(stat -c%s "$OUT/source/export/ram-0x80000000-0x10000000.bin")" -eq 268435456
          test "$(sha256sum "$OUT/source/export/ram-0x80000000-0x10000000.bin" | cut -d' ' -f1)" == "$SOURCE_RAM_SHA256"
          python3 tools/ci/product_c1_arch_relay/qemu_paired64_source.py \
            --source "$OUT/source" \
            --header "$OUT/logs/paired_qemu_trace.h" \
            --gpr-header "$OUT/logs/qemu_captured_gprs.h" \
            --report "$OUT/logs/source-review.json" \
            2>&1 | tee "$OUT/logs/source-validation.log"

      - name: Exercise offline source validator tests
        env:
          AETHERCORE_QEMU_PAIRED64_SOURCE: build/product-c1-g5-qemu-paired64/source
        run: |
          python3 -m unittest discover -s tests_py -p 'test_product_c1_g5_qemu_paired64_source.py' -v

      - name: Restore Mill Scala dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore pinned Verilator build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.054
            ~/.cache/aethercore/toolchains/src/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
            ~/.cache/aethercore/toolchains/build/verilator-bbb60a403932a9f695cb6ff001ceb73de6ad9234
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-product-gsim-g3-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh', 'tools/ensure_verilator_5_054.sh') }}

      - name: Install hardware compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless python3 bison flex libfl-dev \
            libgmp-dev git curl make zlib1g-dev autoconf cmake ninja-build \
            libssl-dev libelf-dev libreadline-dev pkg-config build-essential unzip

      - name: Ensure pinned Verilator 5.054
        run: bash tools/ensure_verilator_5_054.sh

      - name: Elaborate genuine independent Product G5 warm-seed RTL
        run: |
          set -euo pipefail
          make -f Makefile.l32-linux-boot \
            BUILD_DIR="$OUT/rtl-seed" \
            TOP=AetherCoreProductDebianWarmSeedRV64SimTop \
            ELABORATE_MAIN=aethercore.sim.ElaborateProductDebianWarmSeedRV64SimTop \
            JOBS=4 rtl
          test -n "$(find "$OUT/rtl-seed/rtl" -maxdepth 1 -name '*.sv' -print -quit)"

      - name: Build true Product G5 paired 64-step RTL host
        run: |
          set -euo pipefail
          mkdir -p "$OUT/obj"
          verilator --cc --exe --build -O3 -Wall -Wno-fatal \
            --top-module AetherCoreProductDebianWarmSeedRV64SimTop \
            -Mdir "$OUT/obj" \
            -CFLAGS "-std=c++20 -O3 -I$GITHUB_WORKSPACE/sim -I$GITHUB_WORKSPACE/$OUT/logs" \
            -LDFLAGS '-ldl' \
            "$OUT"/rtl-seed/rtl/*.sv \
            "$GITHUB_WORKSPACE/sim/product_c1_g5_qemu_paired64_diff_main.cpp" \
            -j 4 2>&1 | tee "$OUT/logs/verilator-build.log"

      - name: Compare 64 genuine Product G5 retirements against same-RAM QEMU
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s \
            "$OUT/obj/VAetherCoreProductDebianWarmSeedRV64SimTop" \
            "$OUT/source/export/ram-0x80000000-0x10000000.bin" 100000 \
            2>&1 | tee "$OUT/logs/g5-paired64-real-rtl.log"
          grep -Fq 'PRODUCT_G5_SAME_QEMU_RAM_64_INTEGER_RETIRE_AND_FINAL_DDR_MATCH_PARTIAL_DIFFTEST' \
            "$OUT/logs/g5-paired64-real-rtl.log"
          printf '%s\n' \
            'SAME_QEMU_RAM_REAL_G5_PC_RAW_XPR_64_AND_FINAL_DDR_ONLY_NOT_FULL_DIFFTEST_OR_SD1' \
            > "$OUT/logs/proof-scope.txt"

      - name: Archive authenticated subset proof without guest DDR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-c1-g5-qemu-paired64-${{ github.run_id }}
          path: |
            build/product-c1-g5-qemu-paired64/logs/**
            build/product-c1-g5-qemu-paired64/rtl-seed/logs/**
          if-no-files-found: warn
          retention-days: 14
