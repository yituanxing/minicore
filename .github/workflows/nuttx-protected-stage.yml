name: NuttX Protected Userspace

on:
  push:
    branches:
      - agent/umode-**
      - agent/nuttx-protected-p3-fault-isolation
    paths:
      - software/nuttx/**
      - tests_py/test_nuttx_p1_protected_contract.py
      - tests_py/test_nuttx_p2_runtime_contract.py
      - tests_py/test_nuttx_p3_kernel_stack_contract.py
      - tests_py/test_nuttx_p3_fault_contract.py
      - tests_py/test_aethercore_nuttx_overlay.py
      - tests_py/test_range_archive_fetcher.py
      - tools/ci/nuttx_prepare_host_tools.sh
      - tools/ci/nuttx_p1_protected_build.sh
      - tools/ci/nuttx_p2_protected_boot.sh
      - tools/ci/nuttx_p3_kernel_stack_build.sh
      - tools/ci/nuttx_p3_fault_isolation.sh
      - tools/ci/ensure_genromfs.sh
      - tools/ci/kconfig-tweak
      - tools/make_aethercore_nuttx_*_overlay.py
      - tools/nuttx_p3_fault_probe.py
      - tools/make_nuttx_protected_runner.py
      - tools/fetch_range_archive.py
      - src/main/scala/aethercore/**
      - src/test/scala/aethercore/CoreConfigSpec.scala
      - sim/sim_main.cpp
      - sim/nemu_difftest.cpp
      - sim/nemu_difftest.h
      - build.mill
      - mill
      - .github/workflows/nuttx-protected-stage.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: nuttx-protected-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected:
    name: P1 build and P2 U-mode hello; conditional P3 kernel stack and fault isolation
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 60

    steps:
      - name: Publish pending protected-userspace status
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(printf '%s' '{"state":"pending","context":"umode/nuttx-protected","description":"NuttX protected qualification is running","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}')
          curl --fail --show-error --silent --http1.1 \
            --connect-timeout 15 --max-time 60 \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}" >/dev/null

      - name: Publish pending P3 status
        if: github.ref_name == 'agent/nuttx-protected-p3-fault-isolation'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload=$(printf '%s' '{"state":"pending","context":"umode/nuttx-p3","description":"NuttX P3 kernel-stack and fault-isolation qualification is running","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}')
          curl --fail --show-error --silent --http1.1 \
            --connect-timeout 15 --max-time 60 \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}" >/dev/null

      - name: Checkout AetherCore
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Validate protected-userspace contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/ci/nuttx_prepare_host_tools.sh
          bash -n tools/ci/nuttx_p1_protected_build.sh
          bash -n tools/ci/nuttx_p2_protected_boot.sh
          python3 -m py_compile \
            tools/make_aethercore_nuttx_protected_overlay.py \
            tools/make_nuttx_protected_runner.py
          python3 -m unittest \
            tests_py.test_nuttx_p1_protected_contract \
            tests_py.test_nuttx_p2_runtime_contract \
            tests_py.test_aethercore_nuttx_overlay \
            tests_py.test_range_archive_fetcher -v
          if [[ -f tools/ci/nuttx_p3_kernel_stack_build.sh ]]; then
            bash -n tools/ci/nuttx_p3_kernel_stack_build.sh
            python3 -m py_compile tools/make_aethercore_nuttx_p3_kernel_stack_overlay.py
            python3 -m unittest tests_py.test_nuttx_p3_kernel_stack_contract -v
          fi
          if [[ -f tools/ci/nuttx_p3_fault_isolation.sh ]]; then
            bash -n tools/ci/nuttx_p3_fault_isolation.sh
            python3 -m py_compile tools/nuttx_p3_fault_probe.py
            python3 -m unittest tests_py.test_nuttx_p3_fault_contract -v
          fi

      - name: Fetch verified pinned NuttX release sources
        shell: bash
        run: |
          set -euo pipefail
          source software/nuttx/manifest.env
          cache_root="${AETHERCORE_CACHE_ROOT:-${HOME}/.cache/aethercore}/nuttx"
          archive_dir="${cache_root}/archives"
          mkdir -p "${archive_dir}" build

          fetch_release() {
            local release_name="$1"
            local output_name="$2"
            python3 tools/fetch_range_archive.py \
              --url "https://archive.apache.org/dist/nuttx/${NUTTX_VERSION}/${release_name}" \
              --url "https://downloads.apache.org/nuttx/${NUTTX_VERSION}/${release_name}" \
              --sha512-url "https://downloads.apache.org/nuttx/${NUTTX_VERSION}/${release_name}.sha512" \
              --output "${archive_dir}/${output_name}" \
              --chunk-size 1048576 \
              --jobs 6 \
              --retries 5 \
              --max-time 180
            tar -tzf "${archive_dir}/${output_name}" >/dev/null
          }

          {
            fetch_release \
              "apache-nuttx-${NUTTX_VERSION}.tar.gz" \
              "nuttx-${NUTTX_COMMIT}.tar.gz"
            fetch_release \
              "apache-nuttx-apps-${NUTTX_VERSION}.tar.gz" \
              "nuttx-apps-${NUTTX_APPS_COMMIT}.tar.gz"
          } 2>&1 | tee build/nuttx-protected-source-fetch.log

      - name: Prepare pinned NuttX host tools
        shell: bash
        run: |
          chmod +x tools/ci/nuttx_prepare_host_tools.sh
          bash tools/ci/nuttx_prepare_host_tools.sh

      - name: Build P1 protected kernel and U-mode applications
        shell: bash
        env:
          NUTTX_JOBS: "6"
        run: |
          chmod +x tools/ci/nuttx_p1_protected_build.sh
          bash tools/ci/nuttx_p1_protected_build.sh
          cp build/nuttx-protected-source-fetch.log \
            build/nuttx-p1/evidence/source-fetch-range.log

      - name: Upload P1 protected evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-nuttx-p1-protected-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/nuttx-protected-source-fetch.log
            build/nuttx-p1/nuttx.elf
            build/nuttx-p1/nuttx_user.elf
            build/nuttx-p1/nuttx.bin
            build/nuttx-p1/nuttx_user.bin
            build/nuttx-p1/aethercore-protected.bin
            build/nuttx-p1/nuttx.map
            build/nuttx-p1/nuttx_user.map
            build/nuttx-p1/nuttx.config
            build/nuttx-p1/build.log
            build/nuttx-p1/evidence/

      - name: Boot P2 protected NSH and hello in U-mode
        shell: bash
        env:
          AETHERCORE_NUTTX_P2_MAX_CYCLES: "30000000"
          AETHERCORE_NUTTX_P2_RX_GAP_CYCLES: "1000"
        run: |
          chmod +x tools/ci/nuttx_p2_protected_boot.sh
          bash tools/ci/nuttx_p2_protected_boot.sh

      - name: Upload P2 U-mode runtime evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-nuttx-p2-umode-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/nuttx-p2/evidence/

      - name: Build P3-A independent kernel-stack images
        if: github.ref_name == 'agent/nuttx-protected-p3-fault-isolation'
        shell: bash
        env:
          NUTTX_JOBS: "6"
          AETHERCORE_NUTTX_P3_KSTACK_SIZE: "1568"
        run: |
          chmod +x tools/ci/nuttx_p3_kernel_stack_build.sh
          bash tools/ci/nuttx_p3_kernel_stack_build.sh

      - name: Upload P3-A kernel-stack evidence
        if: always() && github.ref_name == 'agent/nuttx-protected-p3-fault-isolation'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-nuttx-p3a-kstack-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/nuttx-p3a/nuttx.elf
            build/nuttx-p3a/nuttx_user.elf
            build/nuttx-p3a/nuttx.bin
            build/nuttx-p3a/nuttx_user.bin
            build/nuttx-p3a/aethercore-protected.bin
            build/nuttx-p3a/nuttx.map
            build/nuttx-p3a/nuttx_user.map
            build/nuttx-p3a/resolved.config
            build/nuttx-p3a/build.log
            build/nuttx-p3a/evidence/

      - name: Run P3-B PMP fault isolation and NSH recovery
        if: github.ref_name == 'agent/nuttx-protected-p3-fault-isolation'
        shell: bash
        env:
          NUTTX_JOBS: "6"
          AETHERCORE_NUTTX_P3_MAX_CYCLES: "30000000"
          AETHERCORE_NUTTX_P3_RX_GAP_CYCLES: "1000"
        run: |
          chmod +x tools/ci/nuttx_p3_fault_isolation.sh
          bash tools/ci/nuttx_p3_fault_isolation.sh

      - name: Upload P3-B fault-isolation evidence
        if: always() && github.ref_name == 'agent/nuttx-protected-p3-fault-isolation'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-nuttx-p3b-fault-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build/nuttx-p3b/nuttx.elf
            build/nuttx-p3b/nuttx_user.elf
            build/nuttx-p3b/nuttx.bin
            build/nuttx-p3b/nuttx_user.bin
            build/nuttx-p3b/aethercore-protected.bin
            build/nuttx-p3b/nuttx.map
            build/nuttx-p3b/nuttx_user.map
            build/nuttx-p3b/resolved.config
            build/nuttx-p3b/build.log
            build/nuttx-p3b/evidence/

      - name: Publish final P3 status
        if: always() && github.ref_name == 'agent/nuttx-protected-p3-fault-isolation'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success)
              state=success
              description='NuttX P3 kernel-stack and PMP fault isolation passed'
              ;;
            cancelled)
              state=error
              description='NuttX P3 fault-isolation qualification cancelled'
              ;;
            *)
              state=failure
              description="NuttX P3 fault-isolation qualification ${JOB_STATUS}"
              ;;
          esac
          payload=$(printf '{"state":"%s","context":"umode/nuttx-p3","description":"%s","target_url":"%s"}' \
            "${state}" "${description}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl --fail --show-error --silent --http1.1 \
            --connect-timeout 15 --max-time 60 \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}" >/dev/null

      - name: Publish final protected-userspace status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "${JOB_STATUS}" in
            success)
              state=success
              description='NuttX protected qualification passed'
              ;;
            cancelled)
              state=error
              description='NuttX protected-userspace qualification cancelled'
              ;;
            *)
              state=failure
              description="NuttX protected-userspace qualification ${JOB_STATUS}"
              ;;
          esac
          payload=$(printf '{"state":"%s","context":"umode/nuttx-protected","description":"%s","target_url":"%s"}' \
            "${state}" "${description}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl --fail --show-error --silent --http1.1 \
            --connect-timeout 15 --max-time 60 \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}" >/dev/null
