name: AetherSoC CPU Complex Probe

on:
  push:
    branches:
      - 'soc/aethersoc-v0-cpu-complex'
    paths:
      - 'src/main/scala/aethercore/soc/AetherCoreV2Complex.scala'
      - 'src/main/scala/aethercore/soc/AetherCoreV2LinuxSoC.scala'
      - '.github/workflows/v2-soc-cpu-complex-probe.yml'

permissions:
  contents: read

jobs:
  elaborate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Elaborate Linux SoC through CPU-complex boundary
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          rm -rf build/soc-cpu-complex
          ./mill aethercore.runMain aethercore.ElaborateV2SoCRV64 --target-dir build/soc-cpu-complex
          find build/soc-cpu-complex -maxdepth 1 -name '*.sv' -print -quit | grep -q .
