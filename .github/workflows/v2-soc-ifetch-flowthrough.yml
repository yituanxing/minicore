name: AetherSoC I-fetch Flow-Through Gate

on:
  pull_request:
    paths:
      - 'src/main/scala/aethercore/soc/AetherSoCMemoryAdapters.scala'
      - 'src/main/scala/aethercore/sim/AetherSoCUnifiedHostMemoryAdapter.scala'
      - 'src/test/scala/aethercore/AetherSoCInstructionFlowThroughSpec.scala'
      - '.github/workflows/v2-soc-ifetch-flowthrough.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethersoc-ifetch-flowthrough-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: Prove zero-wait I-fetch flow-through
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      AETHERCORE_VERILATOR_FAST_VERIFY: '1'
      AETHERCORE_TOOLCHAIN_JOBS: '4'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Restore Scala dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore exact fixed Verilator cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/aethercore/toolchains/verilator-5.024
            ~/.cache/aethercore/toolchains/src/verilator-522bead374d6b2adb316304126e5361b18bcf1
            ~/.cache/aethercore/toolchains/build/verilator-522bead374d6b2adb316304126e5361b18bcf1
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-verilator-5.024-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh') }}

      - name: Revalidate fixed Verilator from producer cache
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Run focused Chisel flow-through proof
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          ./mill aethercore.test.testOnly aethercore.AetherSoCInstructionFlowThroughSpec

      - name: Elaborate unified Linux compatibility top
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/soc-ifetch-flowthrough
          ./mill aethercore.runMain aethercore.ElaborateV2OpenSbiRV64             --target-dir build/soc-ifetch-flowthrough
          find build/soc-ifetch-flowthrough -maxdepth 1 -name '*.sv' -print -quit | grep -q .
