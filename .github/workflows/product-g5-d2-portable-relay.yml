      - name: Portable RTL continuation stage 5/9 through 2.300B cycles
        id: stage5
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          bash control/tools/ci/product_g5_d2_portable_relay.sh run \
