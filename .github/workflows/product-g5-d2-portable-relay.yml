      - name: Verify final horizon and summarize portable replay
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$ARTIFACT_OUT/checkpoints/c2700000000"
          test -s "$latest/COMPLETE"
          (cd "$latest" && sha256sum --check --status COMPLETE)
          grep -Fq 'qualification=HISTORICAL_1795_1800_FULL_HOST_RTL_BYTE_IDENTICAL' \
            "$ARTIFACT_OUT/model/identity.txt"
          cat "$latest/manifest.txt" >> "$GITHUB_STEP_SUMMARY"
