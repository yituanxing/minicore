name: AetherCore Fast Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Incremental source, privilege, interrupt and FreeRTOS checks
    runs-on: [self-hosted, Linux, X64, minicore]
    timeout-minutes: 20
    env:
      AETHERCORE_MILL_NO_DAEMON: "1"
      AETHERCORE_VERILATOR_FAST_VERIFY: "1"

    steps:
      - name: Checkout without deleting incremental outputs
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            classified_base="${PR_BASE_SHA}"
            changed="$(git diff --name-only "${classified_base}" "${GITHUB_SHA}")"
          else
            classified_base="HEAD^1"
            changed="$(git diff --name-only HEAD^1 HEAD || git show --pretty='' --name-only HEAD)"
          fi
          printf '%s\n' "$changed"

          run_chisel=false
          run_smode_v1=false
          run_freertos=false

          if grep -Eq '^(src/main/scala/|src/test/scala/|build\.mill$|mill$)' <<<"$changed"; then
            run_chisel=true
            run_smode_v1=true
            run_freertos=true
          fi

          if grep -Eq '^(software/rv32/supervisor_v1_workload\.S|Makefile\.rv32im-supervisor-v1$|tools/build_rv32im_supervisor_v1\.sh$)' <<<"$changed"; then
            run_smode_v1=true
          fi

          if grep -Eq '^(software/freertos/|Makefile\.freertos($|-)|sim/|tools/(make_freertos|ci/full_gate_freertos)|tools/ensure_(riscv_none_elf|rv32_nemu))' <<<"$changed"; then
            run_freertos=true
          fi

          echo "CLASSIFIED_BASE_SHA=${classified_base}" >> "$GITHUB_ENV"
          echo "run_chisel=$run_chisel" >> "$GITHUB_OUTPUT"
          echo "run_smode_v1=$run_smode_v1" >> "$GITHUB_OUTPUT"
          echo "run_freertos=$run_freertos" >> "$GITHUB_OUTPUT"

      - name: Configure persistent fast cache
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          key="pr-${{ github.event.pull_request.number || github.ref_name }}"
          root="$HOME/.cache/aethercore/fast-gate/$key"
          mkdir -p "$root/mill-out" "$root/smode-v1" "$root/freertos" "$root/freertos-irq"
          echo "MILL_OUTPUT_DIR=$root/mill-out" >> "$GITHUB_ENV"
          echo "FAST_SMODE_V1_BUILD=$root/smode-v1" >> "$GITHUB_ENV"
          echo "FAST_FREERTOS_BUILD=$root/freertos" >> "$GITHUB_ENV"
          echo "FAST_FREERTOS_IRQ_BUILD=$root/freertos-irq" >> "$GITHUB_ENV"
          echo "AETHERCORE_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "fast_cache=$root"
          echo "parallel_jobs=$(nproc)"

      - name: Provision fixed Verilator
        if: steps.changes.outputs.run_chisel == 'true' || steps.changes.outputs.run_smode_v1 == 'true' || steps.changes.outputs.run_freertos == 'true'
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Provision pinned RISC-V newlib sysroot
        if: steps.changes.outputs.run_smode_v1 == 'true' || steps.changes.outputs.run_freertos == 'true'
        shell: bash
        run: bash tools/ensure_riscv_none_elf_gcc_15_2.sh

      - name: Fast source contract tests
        shell: bash
        run: python3 -m unittest discover -s tests_py -v

      - name: Focused configuration, privilege, RV32A, interrupt and WFI Chisel tests
        if: steps.changes.outputs.run_chisel == 'true'
        shell: bash
        run: |
          ./mill aethercore.test.testOnly aethercore.CoreConfigSpec
          ./mill aethercore.test.testOnly aethercore.DecoderSpec
          ./mill aethercore.test.testOnly aethercore.MachineCsrFileSpec
          ./mill aethercore.test.testOnly aethercore.PrivilegeModeSpec
          ./mill aethercore.test.testOnly aethercore.MachineMretCoreSpec
          ./mill aethercore.test.testOnly aethercore.UserModeCoreSpec
          ./mill aethercore.test.testOnly aethercore.SupervisorModeSpec
          ./mill aethercore.test.testOnly aethercore.SupervisorPrivilegeBoundarySpec
          ./mill aethercore.test.testOnly aethercore.RV32AtomicCoreSpec
          ./mill aethercore.test.testOnly aethercore.MachinePlicSpec
          ./mill aethercore.test.testOnly aethercore.MachinePlicMmioSpec
          ./mill aethercore.test.testOnly aethercore.MachineUartRxSpec
          ./mill aethercore.test.testOnly aethercore.MachineInterruptPlatformSpec
          ./mill aethercore.test.testOnly aethercore.MachineInterruptArbiterSpec
          ./mill aethercore.test.testOnly aethercore.MachineExternalCsrSpec
          ./mill aethercore.test.testOnly aethercore.MachineExternalInterruptCoreSpec
          ./mill aethercore.test.testOnly aethercore.AetherCoreInterruptPlatformSpec
          ./mill aethercore.test.testOnly aethercore.WaitForInterruptCoreSpec

      - name: Executable Supervisor V1 M-S-U workload
        if: steps.changes.outputs.run_smode_v1 == 'true'
        shell: bash
        run: |
          make -j"$AETHERCORE_JOBS" -f Makefile.rv32im-supervisor-v1 \
            BUILD_DIR="$FAST_SMODE_V1_BUILD" \
            JOBS="$AETHERCORE_JOBS" run-local

      - name: Incremental FreeRTOS WFI workload
        if: steps.changes.outputs.run_freertos == 'true'
        shell: bash
        run: |
          make -j"$AETHERCORE_JOBS" -f Makefile.freertos \
            BUILD_DIR="$FAST_FREERTOS_BUILD" \
            JOBS="$AETHERCORE_JOBS" TRACE=0 run-local

      - name: FreeRTOS UART ISR and Tickless early-wake workload
        if: steps.changes.outputs.run_freertos == 'true'
        shell: bash
        run: |
          make -j"$AETHERCORE_JOBS" -f Makefile.freertos-irq \
            BUILD_DIR="$FAST_FREERTOS_IRQ_BUILD" \
            JOBS="$AETHERCORE_JOBS" TRACE=0 run-irq-local

      - name: Incremental FreeRTOS WFI exact DiffTest
        if: steps.changes.outputs.run_freertos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rv32_nemu_so="$(bash tools/ensure_rv32_nemu_single_step.sh)"
          test -f "$rv32_nemu_so"
          for stall in 0 5; do
            make -j"$AETHERCORE_JOBS" -f Makefile.freertos-difftest \
              BUILD_DIR="$FAST_FREERTOS_BUILD" \
              JOBS="$AETHERCORE_JOBS" TRACE=0 \
              RV32_NEMU_SO="$rv32_nemu_so" STALL_PERIOD="$stall" run-difftest
          done
          make -j"$AETHERCORE_JOBS" -f Makefile.freertos-difftest \
            BUILD_DIR="$FAST_FREERTOS_BUILD" \
            JOBS="$AETHERCORE_JOBS" TRACE=0 \
            RV32_NEMU_SO="$rv32_nemu_so" STALL_PERIOD=5 run-difftest-negative
          sha256sum \
            "$rv32_nemu_so" \
            "$FAST_FREERTOS_BUILD/nemu_difftest_rv32_freertos_wfi.cpp" \
            "$FAST_FREERTOS_BUILD/sim_main_rv32im_freertos_difftest.cpp" \
            "$FAST_FREERTOS_BUILD/aethercore-freertos.elf" \
            "$FAST_FREERTOS_BUILD/aethercore-freertos.bin" \
            "$FAST_FREERTOS_IRQ_BUILD/aethercore-freertos.elf" \
            "$FAST_FREERTOS_IRQ_BUILD/aethercore-freertos.bin"

      - name: Write fast-gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AetherCore fast gate'
            echo
            echo "- head: \`${GITHUB_SHA}\`"
            echo "- classified range: \`${CLASSIFIED_BASE_SHA:-HEAD^1}..${GITHUB_SHA}\`"
            echo "- chisel selected: \`${{ steps.changes.outputs.run_chisel }}\`"
            echo "- Supervisor V1 executable selected: \`${{ steps.changes.outputs.run_smode_v1 }}\`"
            echo "- FreeRTOS selected: \`${{ steps.changes.outputs.run_freertos }}\`"
            echo "- parallel jobs: \`${AETHERCORE_JOBS:-not-configured}\`"
            echo '- CoreConfigSpec covers the frozen OS profiles plus the bounded V1 M/S/U supervisor profile'
            echo '- privilege tests cover Machine CSR behavior, MRET/U-mode regressions, the delegated Supervisor trap/SRET loop, and fail-closed privilege boundaries'
            echo '- the executable V1 workload builds a real RV32IM/Zicsr ELF and proves M->S, S/U ECALL delegation, SRET and WARL-zero mideleg at stall=0 and stall=3'
            echo '- DecoderSpec and RV32AtomicCoreSpec fail closed on the RV32A word decode, LR/SC reservation, AMO results and memory backpressure path'
            echo '- focused PLIC arbitration/MMIO, UART RX, integrated UART-to-PLIC, machine external CSR/core entry, core platform mapping and WFI suites run for interrupt/core changes'
            echo '- FreeRTOS UART RX is injected during masked Tickless WFI and qualified through PLIC claim/complete, FromISR queue wakeup and portYIELD_FROM_ISR'
            echo '- cached Verilator identity is checked without a disposable build probe'
            echo '- exact single-step RV32 NEMU is verified and reused from persistent cache'
            echo '- the historical FreeRTOS exact WFI DiffTest runs at stall=0 and stall=5 with negative injection'
            echo '- exact reference, adapter, runner, standard ELF/binary and IRQ ELF/binary hashes are emitted'
            echo '- incremental outputs are isolated per pull request under ~/.cache/aethercore/fast-gate'
            echo '- path selection covers the complete pull-request base-to-head range, not only the newest commit'
            echo '- the consolidated Full Gate, including the real Supervisor V1 executable stage, remains mandatory through .github/full-gate-request'
          } >> "$GITHUB_STEP_SUMMARY"
