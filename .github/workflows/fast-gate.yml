name: AetherCore Fast Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify fast-gate paths
    runs-on: ubuntu-24.04
    outputs:
      run_chisel: ${{ steps.changes.outputs.run_chisel }}
      run_smode_v1: ${{ steps.changes.outputs.run_smode_v1 }}
      run_freertos: ${{ steps.changes.outputs.run_freertos }}
      run_hardware: ${{ steps.changes.outputs.run_hardware }}
      classified_base: ${{ steps.changes.outputs.classified_base }}
    steps:
      - name: Checkout exact head for path classification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            classified_base="${PR_BASE_SHA}"
            changed="$(git diff --name-only "${classified_base}" HEAD)"
          else
            classified_base="HEAD^1"
            changed="$(git diff --name-only HEAD^1 HEAD || git show --pretty='' --name-only HEAD)"
          fi
          printf '%s\n' "$changed"

          run_chisel=false
          run_smode_v1=false
          run_freertos=false

          if grep -Eq '^(src/main/scala/|src/test/scala/|build\.mill$|mill$)' <<<"$changed"; then
            run_chisel=true
            run_smode_v1=true
            run_freertos=true
          fi

          # Changes to the fast-gate definition must exercise the Chisel path
          # they are modifying, but should not pull unrelated software gates in.
          if grep -Eq '^\.github/workflows/fast-gate\.yml$' <<<"$changed"; then
            run_chisel=true
          fi

          if grep -Eq '^(software/rv32/supervisor_v1_workload\.S|Makefile\.rv32im-supervisor-v1$|tools/build_rv32im_supervisor_v1\.sh$)' <<<"$changed"; then
            run_smode_v1=true
          fi

          if grep -Eq '^(software/freertos/|Makefile\.freertos($|-)|sim/|tools/(make_freertos|ci/full_gate_freertos)|tools/ensure_(riscv_none_elf|rv32_nemu))' <<<"$changed"; then
            run_freertos=true
          fi

          run_hardware=false
          if [[ "$run_chisel" == true || "$run_smode_v1" == true || "$run_freertos" == true ]]; then
            run_hardware=true
          fi

          echo "classified_base=${classified_base}" >> "$GITHUB_OUTPUT"
          echo "run_chisel=$run_chisel" >> "$GITHUB_OUTPUT"
          echo "run_smode_v1=$run_smode_v1" >> "$GITHUB_OUTPUT"
          echo "run_freertos=$run_freertos" >> "$GITHUB_OUTPUT"
          echo "run_hardware=$run_hardware" >> "$GITHUB_OUTPUT"

  source-contract:
    name: Fast source contract tests
    needs: classify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true

      - name: Run tracked source contracts only
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tracked_tests < <(git ls-files 'tests_py/test_*.py')
          [[ "${#tracked_tests[@]}" -gt 0 ]] || {
            echo 'ERROR: no tracked Python source contracts were found' >&2
            exit 2
          }
          modules=()
          for path in "${tracked_tests[@]}"; do
            module="${path%.py}"
            module="${module//\//.}"
            modules+=("${module}")
          done
          echo "tracked_source_contracts=${#modules[@]}"
          python3 -m unittest "${modules[@]}" -v

      - name: Write contract summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AetherCore fast source contracts'
            echo
            echo "- head: \`${{ github.event.pull_request.head.sha || github.sha }}\`"
            echo "- classified base: \`${{ needs.classify.outputs.classified_base }}\`"
            echo "- hardware gate selected: \`${{ needs.classify.outputs.run_hardware }}\`"
            echo '- source contracts run on a fresh GitHub-hosted workspace, so persistent-runner residue cannot become qualification input'
          } >> "$GITHUB_STEP_SUMMARY"

  fast-gate:
    name: Incremental cross-XLEN, VM, privilege, interrupt and FreeRTOS checks
    needs: [classify, source-contract]
    if: needs.classify.outputs.run_hardware == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AETHERCORE_MILL_NO_DAEMON: "1"
      AETHERCORE_VERILATOR_FAST_VERIFY: "1"
      AETHERCORE_TOOLCHAIN_JOBS: "4"

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 0

      - name: Install hosted-runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf cmake ninja-build libfl-dev zlib1g-dev \
            bison flex bc libssl-dev libelf-dev build-essential \
            libreadline-dev pkg-config curl xz-utils git python3 \
            openjdk-17-jdk-headless device-tree-compiler dwarves

      - name: Restore Scala dependency cache
        id: scala-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-${{ hashFiles('build.mill', 'mill') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-scala-v1-

      - name: Restore pinned toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/aethercore/toolchains
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-toolchains-v1-${{ hashFiles('tools/ensure_verilator_5_024.sh', 'tools/ensure_riscv_none_elf_gcc_15_2.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-toolchains-v1-

      - name: Restore verified reference cache
        id: reference-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/aethercore/references
            ~/.cache/aethercore/sources
          key: aethercore-${{ runner.os }}-${{ runner.arch }}-references-v1-${{ hashFiles('tools/ensure_rv32_nemu_single_step.sh', 'tools/probe_rv32_nemu_deterministic.sh', 'tools/probe_rv32_nemu_historical.sh', 'tools/ensure_berkeley_softfloat.sh') }}
          restore-keys: |
            aethercore-${{ runner.os }}-${{ runner.arch }}-references-v1-

      - name: Configure ephemeral hosted build directories
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mill
          root="$RUNNER_TEMP/aethercore-fast"
          mkdir -p "$root/mill-out" "$root/smode-v1" "$root/freertos" "$root/freertos-irq"
          echo "MILL_OUTPUT_DIR=$root/mill-out" >> "$GITHUB_ENV"
          echo "FAST_SMODE_V1_BUILD=$root/smode-v1" >> "$GITHUB_ENV"
          echo "FAST_FREERTOS_BUILD=$root/freertos" >> "$GITHUB_ENV"
          echo "FAST_FREERTOS_IRQ_BUILD=$root/freertos-irq" >> "$GITHUB_ENV"
          echo "AETHERCORE_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "hosted_build_root=$root"
          echo "parallel_jobs=$(nproc)"

      - name: Provision fixed Verilator
        if: needs.classify.outputs.run_chisel == 'true' || needs.classify.outputs.run_smode_v1 == 'true' || needs.classify.outputs.run_freertos == 'true'
        shell: bash
        run: bash tools/ensure_verilator_5_024.sh

      - name: Cross-XLEN shared integer-core Chisel guard
        if: needs.classify.outputs.run_chisel == 'true'
        shell: bash
        run: |
          ./mill aethercore.test.testOnly \
            aethercore.DatapathWidthSpec \
            aethercore.RV32CoreSpec \
            aethercore.CoreSmokeSpec \
            aethercore.RV64MDecoderSpec \
            aethercore.RV64MALUSpec

      - name: Provision pinned RISC-V newlib sysroot
        if: needs.classify.outputs.run_smode_v1 == 'true' || needs.classify.outputs.run_freertos == 'true'
        shell: bash
        run: bash tools/ensure_riscv_none_elf_gcc_15_2.sh

      - name: Focused VM, configuration, privilege, RV32A, interrupt and WFI Chisel tests
        if: needs.classify.outputs.run_chisel == 'true'
        shell: bash
        run: |
          ./mill aethercore.test.testOnly \
            aethercore.CoreConfigSpec \
            aethercore.PmpCsrFileSpec \
            aethercore.PmpCheckerSpec \
            aethercore.PmpCoreSpec \
            aethercore.PmpPhysicalAddressGeometrySpec \
            aethercore.PhysicalInstructionRequestSpec \
            aethercore.Sv32PmpCompositionSpec \
            aethercore.DecoderSpec \
            aethercore.Rv32CDecompressorSpec \
            aethercore.Rv32CParcelControllerSpec \
            aethercore.Rv32CCoreConfigSpec \
            aethercore.Rv32CCoreSpec \
            aethercore.Rv32CSv32ParcelSpec \
            aethercore.Sv32PageTableWalkerSpec \
            aethercore.Sv32SatpRegisterSpec \
            aethercore.Sv32SupervisorCsrSpec \
            aethercore.Sv32DataPathCoreSpec \
            aethercore.Sv32InstructionTranslationSpec \
            aethercore.Sv32InstructionFetchCoreSpec \
            aethercore.Sv32TlbSpec \
            aethercore.Sv32TranslationUnitTlbSpec \
            aethercore.Sv32SfenceCoreSpec \
            aethercore.Sv32PageFaultDelegationSpec \
            aethercore.MachineCsrFileSpec \
            aethercore.MstatushSpec \
            aethercore.ScounterenSpec \
            aethercore.MachineIdentitySpec \
            aethercore.Rv32SstcTimerSpec \
            aethercore.Rv32SstcCsrSpec \
            aethercore.Rv32SstcCoreSpec \
            aethercore.PrivilegeModeSpec \
            aethercore.MachineMretCoreSpec \
            aethercore.UserModeCoreSpec \
            aethercore.SupervisorModeSpec \
            aethercore.SupervisorPrivilegeBoundarySpec \
            aethercore.MprvCoreSpec \
            aethercore.RV32AtomicCoreSpec \
            aethercore.Sv32AtomicCoreSpec \
            aethercore.MachinePlicSpec \
            aethercore.MachinePlicMmioSpec \
            aethercore.MachineUartRxSpec \
            aethercore.MachineInterruptPlatformSpec \
            aethercore.MachineInterruptArbiterSpec \
            aethercore.MachineExternalCsrSpec \
            aethercore.MachineExternalInterruptCoreSpec \
            aethercore.SupervisorExternalInterruptSpec \
            aethercore.AetherCoreInterruptPlatformSpec \
            aethercore.WaitForInterruptCoreSpec

      - name: Executable Supervisor V1 M-S-U workload
        if: needs.classify.outputs.run_smode_v1 == 'true'
        shell: bash
        run: |
          make -j"$AETHERCORE_JOBS" -f Makefile.rv32im-supervisor-v1 \
            BUILD_DIR="$FAST_SMODE_V1_BUILD" \
            JOBS="$AETHERCORE_JOBS" run-local

      - name: Incremental FreeRTOS WFI workload
        if: needs.classify.outputs.run_freertos == 'true'
        shell: bash
        run: |
          make -j"$AETHERCORE_JOBS" -f Makefile.freertos \
            BUILD_DIR="$FAST_FREERTOS_BUILD" \
            JOBS="$AETHERCORE_JOBS" TRACE=0 run-local

      - name: FreeRTOS UART ISR and Tickless early-wake workload
        if: needs.classify.outputs.run_freertos == 'true'
        shell: bash
        run: |
          make -j"$AETHERCORE_JOBS" -f Makefile.freertos-irq \
            BUILD_DIR="$FAST_FREERTOS_IRQ_BUILD" \
            JOBS="$AETHERCORE_JOBS" TRACE=0 run-irq-local

      - name: Incremental FreeRTOS WFI exact DiffTest
        if: needs.classify.outputs.run_freertos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rv32_nemu_so="$(bash tools/ensure_rv32_nemu_single_step.sh)"
          test -f "$rv32_nemu_so"
          for stall in 0 5; do
            make -j"$AETHERCORE_JOBS" -f Makefile.freertos-difftest \
              BUILD_DIR="$FAST_FREERTOS_BUILD" \
              JOBS="$AETHERCORE_JOBS" TRACE=0 \
              RV32_NEMU_SO="$rv32_nemu_so" STALL_PERIOD="$stall" run-difftest
          done
          make -j"$AETHERCORE_JOBS" -f Makefile.freertos-difftest \
            BUILD_DIR="$FAST_FREERTOS_BUILD" \
            JOBS="$AETHERCORE_JOBS" TRACE=0 \
            RV32_NEMU_SO="$rv32_nemu_so" STALL_PERIOD=5 run-difftest-negative
          sha256sum \
            "$rv32_nemu_so" \
            "$FAST_FREERTOS_BUILD/nemu_difftest_rv32_freertos_wfi.cpp" \
            "$FAST_FREERTOS_BUILD/sim_main_rv32im_freertos_difftest.cpp" \
            "$FAST_FREERTOS_BUILD/aethercore-freertos.elf" \
            "$FAST_FREERTOS_BUILD/aethercore-freertos.bin" \
            "$FAST_FREERTOS_IRQ_BUILD/aethercore-freertos.elf" \
            "$FAST_FREERTOS_IRQ_BUILD/aethercore-freertos.bin"

      - name: Write fast-gate summary
        if: always()
        shell: bash
        run: |
          {
            echo '## AetherCore hardware fast gate'
            echo
            echo "- head: \`${{ github.event.pull_request.head.sha || github.sha }}\`"
            echo "- classified range: \`${{ needs.classify.outputs.classified_base }}..${{ github.event.pull_request.head.sha || github.sha }}\`"
            echo "- chisel selected: \`${{ needs.classify.outputs.run_chisel }}\`"
            echo "- Supervisor V1 executable selected: \`${{ needs.classify.outputs.run_smode_v1 }}\`"
            echo "- FreeRTOS selected: \`${{ needs.classify.outputs.run_freertos }}\`"
            echo "- Scala dependency cache hit: \`${{ steps.scala-cache.outputs.cache-hit }}\`"
            echo "- pinned toolchain cache hit: \`${{ steps.toolchain-cache.outputs.cache-hit }}\`"
            echo "- verified reference cache hit: \`${{ steps.reference-cache.outputs.cache-hit }}\`"
            echo "- parallel jobs: \`${AETHERCORE_JOBS:-not-configured}\`"
            echo '- hosted runners use fresh workspaces; only immutable/versioned dependencies and independently verified reference inputs are persisted through Actions cache'
            echo '- Verilator, RISC-V toolchains, NEMU and SoftFloat are revalidated by repository-owned revision/SHA contracts after every restore'
            echo '- mutable RTL/workload build outputs remain ephemeral in this first hosted-runner revision to avoid stale-build qualification risk'
            echo '- the consolidated Full Gate remains a separate freeze/milestone surface until its hosted migration is qualified'
          } >> "$GITHUB_STEP_SUMMARY"
