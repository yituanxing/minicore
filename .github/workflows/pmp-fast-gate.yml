name: AetherCore PMP Fast Gate

on:
  pull_request:
    paths:
      - ".github/workflows/pmp-fast-gate.yml"
      - "Makefile.rv32imu-pmp"
      - "sim/nemu_difftest_rv32.cpp"
      - "sim/sim_main.cpp"
      - "tools/check_rv32imu_pmp_contract.py"
      - "tools/ensure_berkeley_softfloat.sh"
      - "tools/make_rv32imu_difftest.py"
      - "tools/make_rv32imu_pmp.py"
      - "tools/make_rv32imu_pmp_difftest.py"
      - "tools/make_rv32imu_pmp_runner.py"
      - "tools/probe_rv32_nemu_historical.sh"
      - "tools/widen_rv32imu_pmp_csr_decode.py"
      - "tests_py/test_rv32imu_pmp.py"
      - "tests_py/test_softfloat_bootstrap.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aethercore-pmp-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pmp-fast:
    name: PMP image and adapter generation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PMP source tests
        shell: bash
        run: |
          python3 -m unittest -v \
            tests_py.test_rv32imu_pmp \
            tests_py.test_softfloat_bootstrap

      - name: Generate and validate the PMP image
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/pmp-fast
          mkdir -p build/pmp-fast
          python3 tools/make_rv32imu_pmp.py build/pmp-fast/software
          python3 tools/check_rv32imu_pmp_contract.py \
            build/pmp-fast/software/pmp-isolation.bin \
            build/pmp-fast/software/labels.txt \
            build/pmp-fast/software/contract.txt
          sha256sum \
            build/pmp-fast/software/pmp-isolation.bin \
            build/pmp-fast/software/labels.txt \
            build/pmp-fast/software/manifest.txt \
            build/pmp-fast/software/contract.txt \
            > build/pmp-fast/software/sha256.txt
          cat build/pmp-fast/software/labels.txt
          cat build/pmp-fast/software/contract.txt
          cat build/pmp-fast/software/sha256.txt

      - name: Generate the complete PMP simulation adapters
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/make_rv32imu_difftest.py \
            sim/nemu_difftest_rv32.cpp \
            build/pmp-fast/nemu_difftest_rv32imu.cpp
          python3 tools/widen_rv32imu_pmp_csr_decode.py \
            build/pmp-fast/nemu_difftest_rv32imu.cpp
          python3 tools/make_rv32imu_pmp_difftest.py \
            build/pmp-fast/nemu_difftest_rv32imu.cpp \
            build/pmp-fast/nemu_difftest_rv32imu_pmp.cpp
          python3 tools/make_rv32imu_pmp_runner.py \
            sim/sim_main.cpp \
            build/pmp-fast/sim_main_rv32imu_pmp.cpp

          grep -Fq 'pmpcfg0' build/pmp-fast/nemu_difftest_rv32imu_pmp.cpp
          grep -Fq 'validatePmpNormal' build/pmp-fast/nemu_difftest_rv32imu_pmp.cpp
          grep -Fq 'PMP_EXCEPTION' build/pmp-fast/sim_main_rv32imu_pmp.cpp

      - name: Upload fast-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethercore-pmp-fast-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: build/pmp-fast/
