name: Compiled Workloads

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiled-workloads-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compiled-workloads:
    name: GCC RV64IM workloads against Verilator and NEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Scala dependencies
        uses: coursier/cache-action@v8

      - name: Cache pinned NEMU reference
        uses: actions/cache@v4
        with:
          path: build/nemu
          key: nemu-${{ runner.os }}-ad6bfde6241f2fc1e864b1efb2bed99b3670eb73

      - name: Install Java
        uses: coursier/setup-action@v3
        with:
          jvm: temurin:21

      - name: Install simulation and RISC-V compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            verilator make g++ python3 curl git bison flex \
            libreadline-dev libsdl2-dev zstd libzstd-dev \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
          java -version
          verilator --version
          riscv64-unknown-elf-gcc --version

      - name: Prepare Mill launcher
        run: |
          chmod +x mill
          ./mill --version

      - name: Source and generator tests
        run: make python-test

      - name: Build Verilator simulator and pinned NEMU
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          make sim nemu 2>&1 | tee build/logs/compiled-workloads-build.log

      - name: Compile freestanding GCC RV64IM workloads
        shell: bash
        run: |
          set -o pipefail
          bash tools/build_compiled_workloads.sh build/compiled-workloads \
            2>&1 | tee build/logs/compiled-workloads-compile.log

      - name: Run compiled workloads with commit-level DiffTest
        shell: bash
        run: |
          set -o pipefail
          bash tools/run_compiled_workloads.sh \
            build/obj/VAetherCoreSimTop \
            "$(pwd)/build/nemu/build/riscv64-nemu-interpreter-so" \
            build/compiled-workloads \
            2>&1 | tee build/logs/compiled-workloads-difftest.log

      - name: Upload compiled workload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-workloads-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/logs/
            build/compiled-workloads/
            build/rtl/
