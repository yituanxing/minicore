CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_AETHERCORE=y
CONFIG_AETHERCORE_SIM_EXIT=y
CONFIG_MULTITHREADING=y
CONFIG_TIMESLICING=n
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# Keep the Z2 smoke heap bounded instead of consuming every remaining byte of
# the 64 MiB simulated RAM aperture. The generic simulator currently services
# RAM through 64-bit beats, so a heap footer placed at RAM_END - 4 is rejected
# as an eight-byte access even though Zephyr issues a valid aligned word store.
# This fixed pool is ample for the deterministic thread/semaphore workload and
# keeps the board memory map truthful while the generic bus model is hardened.
CONFIG_HEAP_MEM_POOL_SIZE=16384
